<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Product - LosOja</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f5;color:#17201b}
.topbar{background:#087a3e;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.topbar a{color:#fff;text-decoration:none;font-weight:800;font-size:20px}
.card{max-width:540px;margin:26px auto;background:#fff;border:1px solid #e5ebe7;border-radius:20px;padding:24px;box-shadow:0 8px 32px rgba(0,0,0,.06)}
label{font-weight:700;font-size:13px;margin-top:14px;display:block;color:#123d25}
input,textarea{width:100%;padding:12px 13px;border:1px solid #d7e1da;border-radius:11px;margin-top:6px;font-size:14px;outline:none}
textarea{min-height:90px;resize:vertical}
.preview{height:200px;border:2px dashed #c9ddd0;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:8px;background:#f7faf8;font-size:13px;color:#777}
.preview img{width:100%;height:100%;object-fit:cover}
.upload-btn{display:block;text-align:center;background:#eef8f2;border:1px solid #cce8d7;padding:12px;border-radius:11px;margin-top:10px;cursor:pointer;font-weight:700;color:#087a3e}
.btn{width:100%;margin-top:18px;background:#087a3e;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.6}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#17201b;color:#fff;padding:12px 17px;border-radius:10px;opacity:0;transition:.2s;z-index:1000}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar"><a href="index.html">LosOja</a><button onclick="history.back()" style="border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;padding:8px 12px;border-radius:9px;cursor:pointer">← Back</button></div>
<div class="card">
<h2 style="margin:0 0 6px">✏️ Edit Product</h2><p style="margin:0 0 18px;color:#637168;font-size:13px">Update your product details</p>
<div id="loading">Loading product...</div>
<form id="form" style="display:none">
<label>Product Name *</label><input id="name" required>
<label>Price (₦) *</label><input id="price" type="number" step="0.01" required>
<label>Product Image</label>
<div class="preview" id="prev">No image</div>
<label for="fileInput" class="upload-btn">📸 Change Image</label>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<input id="imageUrl" placeholder="https://... image url">
<label>Description</label><textarea id="desc" placeholder="Describe product"></textarea>
<button class="btn" type="submit" id="saveBtn">💾 Save Changes</button>
<button type="button" class="btn" style="background:#fff;color:#b91c1c;border:1px solid #fecaca;margin-top:10px" id="delBtn">🗑️ Delete Product</button>
</form>
</div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL="https://ycxshwgeebskdozmornh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljeHNod2dlZWJza2Rvem1vcm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDY0NjUsImV4cCI6MjEwMzg4MjQ2NX0.tMl7wILdVDhu0RWFaG_84ngJEryLt2c5cB8MEKW3kfU";
const toast=document.getElementById("toast");
function showToast(m){toast.textContent=m;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),3000)}
const productId=new URLSearchParams(location.search).get("id");
const nameEl=document.getElementById("name"),priceEl=document.getElementById("price"),imageEl=document.getElementById("imageUrl"),descEl=document.getElementById("desc"),prev=document.getElementById("prev"),fileInput=document.getElementById("fileInput"),form=document.getElementById("form"),loading=document.getElementById("loading"),saveBtn=document.getElementById("saveBtn");
function updatePreview(u){if(u){prev.innerHTML=`<img src="${u}" onerror="this.parentElement.textContent='Invalid image'">`}else{prev.innerHTML='No image'}}
imageEl.addEventListener("input",()=>updatePreview(imageEl.value.trim()));
fileInput.addEventListener("change",async()=>{
 const f=fileInput.files[0];if(!f)return;
 saveBtn.disabled=true;saveBtn.textContent="Uploading...";
 try{
  let token=null;try{token=JSON.parse(localStorage.getItem("losoja_supabase_session"))?.access_token}catch{}
  const safe=`product-${Date.now()}-${f.name}`.replace(/[^a-zA-Z0-9.-]/g,"-");
  const res=await fetch(`${SUPABASE_URL}/storage/v1/object/product-images/${safe}`,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${token||SUPABASE_KEY}`,"x-upsert":"true","Content-Type":f.type||"image/jpeg"},body:f});
  if(!res.ok){const t=await res.text();throw new Error(t)}
  const publicUrl=`${SUPABASE_URL}/storage/v1/object/public/product-images/${safe}`;
  imageEl.value=publicUrl;updatePreview(publicUrl);showToast("Image uploaded!");
 }catch(e){showToast("Upload failed: "+e.message)}finally{saveBtn.disabled=false;saveBtn.textContent="💾 Save Changes"}
});
let loadedProduct=null;
(async()=>{
 try{
  const res=await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${productId}&select=*`,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
  const data=await res.json();if(!data.length)throw new Error("Product not found");
  loadedProduct=data[0];
  loading.style.display="none";form.style.display="block";
  nameEl.value=loadedProduct.name||"";priceEl.value=loadedProduct.price||"";imageEl.value=loadedProduct.image_url||"";descEl.value=loadedProduct.description||"";updatePreview(loadedProduct.image_url);
 }catch(e){loading.textContent="Error: "+e.message}
})();
form.addEventListener("submit",async(e)=>{
 e.preventDefault();saveBtn.disabled=true;saveBtn.textContent="Saving...";
 try{
  let token=null;try{token=JSON.parse(localStorage.getItem("losoja_supabase_session"))?.access_token}catch{}
  const res=await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${productId}`,{method:"PATCH",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${token||SUPABASE_KEY}`,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({name:nameEl.value.trim(),price:parseFloat(priceEl.value),image_url:imageEl.value.trim()||null,description:descEl.value.trim()||null})});
  if(!res.ok){const t=await res.text();throw new Error(t)}
  showToast("Saved!");setTimeout(()=>{location.href=`shop.html?id=${loadedProduct.business_id}`},900);
 }catch(err){showToast(err.message);saveBtn.disabled=false;saveBtn.textContent="💾 Save Changes"}
});
document.getElementById("delBtn").onclick=async()=>{
 if(!confirm("Delete this product permanently?"))return;
 try{
  let token=null;try{token=JSON.parse(localStorage.getItem("losoja_supabase_session"))?.access_token}catch{}
  await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${productId}`,{method:"DELETE",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${token||SUPABASE_KEY}`}});
  showToast("Deleted");setTimeout(()=>{location.href=`shop.html?id=${loadedProduct.business_id}`},800);
 }catch(e){showToast("Delete failed")}
};
</script>
</body>
</html>
