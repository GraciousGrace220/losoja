<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LosOja Properties</title>

<meta
    name="description"
    content="Find houses, apartments, land and commercial properties on LosOja."
>

<style>

:root{
    --green:#087a3e;
    --green-dark:#055c2e;
    --green-light:#eef8f2;
    --accent:#ffb703;
    --white:#ffffff;
    --text:#172019;
    --muted:#68736c;
    --border:#dce5df;
    --danger:#c62828;
    --shadow:0 10px 30px rgba(0,0,0,.10);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f8f7;
    color:var(--text);
}

body.modal-open{
    overflow:hidden;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

img{
    max-width:100%;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:var(--white);
    border-bottom:1px solid var(--border);
}

.header-inner{
    width:min(1200px,94%);
    margin:auto;
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--green);
    text-decoration:none;
    font-size:24px;
    font-weight:800;
}

.logo-mark{
    width:42px;
    height:42px;
    border-radius:12px;
    background:var(--green);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.back-link{
    color:var(--green);
    text-decoration:none;
    font-weight:700;
}

.top-publish-btn{
    border:0;
    background:var(--green);
    color:white;
    padding:11px 16px;
    border-radius:10px;
    font-weight:700;
}

.top-publish-btn:hover{
    background:var(--green-dark);
}

.page{
    width:min(1200px,94%);
    margin:0 auto;
    padding:25px 0 80px;
}

.page-title{
    margin:0;
    font-size:32px;
}

.page-subtitle{
    margin:8px 0 22px;
    color:var(--muted);
}

.toolbar{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    padding:15px;
    box-shadow:var(--shadow);
    margin-bottom:22px;
}

.search-box{
    width:100%;
    padding:13px 15px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
}

.search-box:focus{
    border-color:var(--green);
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.filter-btn{
    border:1px solid var(--border);
    background:white;
    color:var(--text);
    padding:9px 13px;
    border-radius:999px;
    font-weight:600;
}

.filter-btn.active{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

.properties-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:20px;
}

.property-card{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 7px 22px rgba(0,0,0,.07);
}

.card-gallery{
    position:relative;
    height:230px;
    background:#e9eeeb;
    overflow:hidden;
}

.card-main-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    cursor:pointer;
}

.gallery-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:22px;
    z-index:3;
}

.gallery-arrow:hover{
    background:rgba(0,0,0,.75);
}

.gallery-prev{
    left:10px;
}

.gallery-next{
    right:10px;
}

.gallery-counter{
    position:absolute;
    right:10px;
    bottom:10px;
    background:rgba(0,0,0,.65);
    color:white;
    padding:5px 9px;
    border-radius:999px;
    font-size:12px;
}

.card-thumbnails{
    display:flex;
    gap:5px;
    padding:7px;
    overflow-x:auto;
}

.card-thumb{
    width:52px;
    height:42px;
    flex:0 0 auto;
    object-fit:cover;
    border-radius:6px;
    border:2px solid transparent;
    cursor:pointer;
}

.card-thumb.active{
    border-color:var(--green);
}

.property-card-body{
    padding:16px;
}

.property-card-title{
    margin:0 0 7px;
    font-size:19px;
}

.property-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:9px;
}

.badge{
    display:inline-block;
    padding:5px 8px;
    border-radius:999px;
    background:var(--green-light);
    color:var(--green-dark);
    font-size:12px;
    font-weight:700;
}

.property-price{
    font-size:20px;
    font-weight:800;
    color:var(--green);
    margin:8px 0;
}

.property-location{
    color:var(--muted);
    margin-bottom:12px;
}

.view-property-btn{
    width:100%;
    border:0;
    background:var(--green);
    color:white;
    padding:11px;
    border-radius:9px;
    font-weight:700;
}

.view-property-btn:hover{
    background:var(--green-dark);
}

.empty-state{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    padding:45px 20px;
    text-align:center;
    color:var(--muted);
}

.loading{
    text-align:center;
    padding:40px;
    color:var(--muted);
}


/* =========================================================
   MODALS
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(850px,100%);
    max-height:92vh;
    overflow:auto;
    background:white;
    border-radius:18px;
    box-shadow:0 25px 70px rgba(0,0,0,.30);
    position:relative;
}

.modal-content{
    padding:25px;
}

.modal-close{
    position:absolute;
    right:14px;
    top:12px;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f0f2f1;
    color:#222;
    font-size:25px;
    z-index:10;
}

.modal-close:hover{
    background:#e3e7e5;
}

.modal-title{
    margin:0 45px 5px 0;
    font-size:25px;
}

.modal-subtitle{
    color:var(--muted);
    margin:0 0 20px;
}


/* =========================================================
   POST PROPERTY
========================================================= */

.post-card{
    background:white;
}

.post-card h2{
    margin-top:0;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:700;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    outline:none;
    background:white;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--green);
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.photo-help{
    color:var(--muted);
    font-size:13px;
    margin-top:6px;
}

.photo-selection-info{
    margin-top:10px;
    padding:10px 12px;
    border-radius:9px;
    background:var(--green-light);
    color:var(--green-dark);
    font-weight:700;
}

.property-photo-preview{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:12px;
}

.property-preview-item{
    position:relative;
    height:110px;
    border-radius:10px;
    overflow:hidden;
    background:#eef1ef;
}

.property-preview-item img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.property-preview-number{
    position:absolute;
    left:6px;
    top:6px;
    width:25px;
    height:25px;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
}

.form-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.primary-btn,
.secondary-btn{
    padding:12px 17px;
    border-radius:10px;
    font-weight:700;
    border:0;
}

.primary-btn{
    background:var(--green);
    color:white;
}

.primary-btn:hover{
    background:var(--green-dark);
}

.secondary-btn{
    background:#edf1ef;
    color:#26302a;
}


/* =========================================================
   DETAIL MODAL
========================================================= */

.detail-gallery{
    background:#eef1ef;
    border-radius:12px;
    overflow:hidden;
    position:relative;
}

.detail-main-wrap{
    position:relative;
    height:430px;
}

.detail-main-image{
    width:100%;
    height:100%;
    object-fit:cover;
    cursor:pointer;
}

.detail-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:24px;
    z-index:3;
}

.detail-arrow.prev{
    left:12px;
}

.detail-arrow.next{
    right:12px;
}

.detail-counter{
    position:absolute;
    right:12px;
    bottom:12px;
    background:rgba(0,0,0,.65);
    color:white;
    padding:6px 10px;
    border-radius:999px;
    font-size:13px;
}

.detail-thumbnails{
    display:flex;
    gap:7px;
    padding:10px;
    overflow-x:auto;
}

.detail-thumb{
    width:72px;
    height:55px;
    object-fit:cover;
    border-radius:7px;
    border:2px solid transparent;
    cursor:pointer;
}

.detail-thumb.active{
    border-color:var(--green);
}

.detail-info{
    padding-top:20px;
}

.detail-info h2{
    margin:0 0 8px;
}

.detail-price{
    color:var(--green);
    font-size:24px;
    font-weight:800;
    margin-bottom:10px;
}

.detail-description{
    line-height:1.6;
    white-space:pre-wrap;
    color:#4f5a53;
}

.detail-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.detail-actions button{
    flex:1;
}


/* =========================================================
   FULLSCREEN VIEWER
========================================================= */

.viewer{
    position:fixed;
    inset:0;
    z-index:900;
    background:rgba(0,0,0,.95);
    display:none;
    align-items:center;
    justify-content:center;
}

.viewer.show{
    display:flex;
}

.viewer-image{
    max-width:92vw;
    max-height:88vh;
    object-fit:contain;
}

.viewer-close{
    position:absolute;
    right:20px;
    top:15px;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:28px;
}

.viewer-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:27px;
}

.viewer-prev{
    left:20px;
}

.viewer-next{
    right:20px;
}

.viewer-counter{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,.6);
    padding:7px 12px;
    border-radius:999px;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    background:#172019;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:2000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    .properties-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

}

@media(max-width:600px){

    .header-inner{
        min-height:62px;
    }

    .logo{
        font-size:20px;
    }

    .logo-mark{
        width:36px;
        height:36px;
    }

    .back-link{
        display:none;
    }

    .top-publish-btn{
        padding:9px 11px;
        font-size:13px;
    }

    .page{
        width:94%;
        padding-top:20px;
    }

    .page-title{
        font-size:27px;
    }

    .properties-grid{
        grid-template-columns:1fr;
    }

    .property-photo-preview{
        grid-template-columns:repeat(3,1fr);
    }

    .property-preview-item{
        height:90px;
    }

    .detail-main-wrap{
        height:300px;
    }

    .modal{
        padding:8px;
    }

    .modal-box{
        max-height:95vh;
        border-radius:14px;
    }

    .modal-content{
        padding:18px;
    }

    .detail-actions{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="header-inner">

        <a
            href="index.html"
            class="logo"
        >

            <span class="logo-mark">
                LO
            </span>

            <span>
                LosOja
            </span>

        </a>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back
        </a>


        <button
            type="button"
            class="top-publish-btn"
            onclick="openPostPropertyModal()"
        >
            + Post Property
        </button>

    </div>

</header>


<main class="page">

    <h1 class="page-title">
        Properties
    </h1>

    <p class="page-subtitle">
        Find houses, apartments, land and commercial properties on LosOja.
    </p>


    <section class="toolbar">

        <input
            type="search"
            id="propertySearch"
            class="search-box"
            placeholder="Search properties, locations..."
        >


        <div class="filters">

            <button
                class="filter-btn active"
                data-filter="all"
                onclick="setPropertyFilter('all',this)"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="available"
                onclick="setPropertyFilter('available',this)"
            >
                Available
            </button>

            <button
                class="filter-btn"
                data-filter="sale"
                onclick="setPropertyFilter('sale',this)"
            >
                For Sale
            </button>

            <button
                class="filter-btn"
                data-filter="rent"
                onclick="setPropertyFilter('rent',this)"
            >
                For Rent
            </button>

            <button
                class="filter-btn"
                data-filter="sold"
                onclick="setPropertyFilter('sold',this)"
            >
                Sold
            </button>

            <button
                class="filter-btn"
                data-filter="rented"
                onclick="setPropertyFilter('rented',this)"
            >
                Rented
            </button>

            <button
                class="filter-btn"
                data-filter="house"
                onclick="setPropertyFilter('house',this)"
            >
                Houses
            </button>

            <button
                class="filter-btn"
                data-filter="apartment"
                onclick="setPropertyFilter('apartment',this)"
            >
                Apartments
            </button>

            <button
                class="filter-btn"
                data-filter="land"
                onclick="setPropertyFilter('land',this)"
            >
                Land
            </button>

            <button
                class="filter-btn"
                data-filter="commercial"
                onclick="setPropertyFilter('commercial',this)"
            >
                Commercial
            </button>

        </div>

    </section>


    <div
        id="propertiesContainer"
        class="properties-grid"
    >

        <div class="loading">
            Loading properties...
        </div>

    </div>

</main>


<!-- =======================================================
     POST PROPERTY MODAL
======================================================= -->

<div
    id="postPropertyModal"
    class="modal"
    onclick="closePostPropertyOnBackdrop(event)"
>

    <div class="modal-box">

        <button
            type="button"
            class="modal-close"
            onclick="closePostPropertyModal()"
        >
            ×
        </button>


        <div class="modal-content">

            <div class="post-card">

                <h2>
                    Post Your Property
                </h2>

                <p class="modal-subtitle">
                    List your property on LosOja.
                </p>


                <form id="propertyForm">

                    <div class="form-group">

                        <label for="propertyTitle">
                            Property Title
                        </label>

                        <input
                            type="text"
                            id="propertyTitle"
                            required
                            placeholder="e.g. Modern 3 Bedroom House"
                        >

                    </div>


                    <div class="form-group">

                        <label for="propertyType">
                            Property Type
                        </label>

                        <select
                            id="propertyType"
                            required
                        >

                            <option value="">
                                Select type
                            </option>

                            <option value="House">
                                House
                            </option>

                            <option value="Apartment">
                                Apartment
                            </option>

                            <option value="Land">
                                Land
                            </option>

                            <option value="Commercial">
                                Commercial
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="listingType">
                            Listing Type
                        </label>

                        <select
                            id="listingType"
                            required
                        >

                            <option value="">
                                Select listing type
                            </option>

                            <option value="For Sale">
                                For Sale
                            </option>

                            <option value="For Rent">
                                For Rent
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="propertyPrice">
                            Price
                        </label>

                        <input
                            type="number"
                            id="propertyPrice"
                            min="0"
                            step="0.01"
                            required
                            placeholder="Enter price"
                        >

                    </div>


                    <div class="form-group">

                        <label for="propertyLocation">
                            Location
                        </label>

                        <input
                            type="text"
                            id="propertyLocation"
                            required
                            placeholder="e.g. Lekki, Lagos"
                        >

                    </div>


                    <div class="form-group">

                        <label for="propertyDescription">
                            Description
                        </label>

                        <textarea
                            id="propertyDescription"
                            placeholder="Describe the property..."
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="propertyImages">
                            Property Photos
                        </label>

                        <input
                            type="file"
                            id="propertyImages"
                            name="propertyImages"
                            accept="image/jpeg,image/jpg,image/png,image/webp,image/gif"
                            multiple
                        >

                        <div class="photo-help">
                            Select up to 10 photos. Maximum 5MB per photo.
                        </div>


                        <div
                            id="photoSelectionInfo"
                            class="photo-selection-info"
                        >
                            No photos selected
                        </div>


                        <div
                            id="propertyPhotoPreview"
                            class="property-photo-preview"
                        ></div>

                    </div>


                    <div class="form-actions">

                        <button
                            type="button"
                            class="secondary-btn"
                            onclick="closePostPropertyModal()"
                        >
                            Cancel
                        </button>


                        <button
                            type="submit"
                            id="publishPropertyButton"
                            class="primary-btn"
                        >
                            Publish Property
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- =======================================================
     PROPERTY DETAIL MODAL
======================================================= -->

<div
    id="detailModal"
    class="modal"
    onclick="closeDetailOnBackdrop(event)"
>

    <div class="modal-box">

        <button
            type="button"
            class="modal-close"
            onclick="closeDetailModal()"
        >
            ×
        </button>


        <div class="modal-content">

            <div class="detail-gallery">

                <div class="detail-main-wrap">

                    <img
                        id="detailMainImage"
                        class="detail-main-image"
                        src=""
                        alt="Property"
                        onclick="openViewerFromDetail()"
                    >


                    <button
                        type="button"
                        class="detail-arrow prev"
                        onclick="changeDetailImage(-1)"
                    >
                        ‹
                    </button>


                    <button
                        type="button"
                        class="detail-arrow next"
                        onclick="changeDetailImage(1)"
                    >
                        ›
                    </button>


                    <div
                        id="detailCounter"
                        class="detail-counter"
                    >
                        1 / 1
                    </div>

                </div>


                <div
                    id="detailThumbnails"
                    class="detail-thumbnails"
                ></div>

            </div>


            <div class="detail-info">

                <h2 id="detailTitle">
                    Property
                </h2>


                <div
                    id="detailPrice"
                    class="detail-price"
                ></div>


                <div
                    id="detailMeta"
                    class="property-meta"
                ></div>


                <div
                    id="detailLocation"
                    class="property-location"
                ></div>


                <div
                    id="detailDescription"
                    class="detail-description"
                ></div>


                <div class="detail-actions">

                    <button
                        type="button"
                        class="primary-btn"
                        onclick="contactProperty()"
                    >
                        💬 Chat Owner
                    </button>


                    <button
                        type="button"
                        class="secondary-btn"
                        onclick="closeDetailModal()"
                    >
                        Close
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =======================================================
     FULLSCREEN IMAGE VIEWER
======================================================= -->

<div
    id="imageViewer"
    class="viewer"
>

    <button
        type="button"
        class="viewer-close"
        onclick="closeViewer()"
    >
        ×
    </button>


    <button

/* =========================================================

========================================================= */

function publicHeaders(){

    return {

        "apikey":
            SUPABASE_KEY,

        "Content-Type":

    };

}


async function getAccessToken(){

    try{

        if(
            typeof window.getSupabaseAccessToken ===
            "function"
        ){

            return await window.getSupabaseAccessToken();

        }


        const raw =
            localStorage.getItem(
                "losoja_supabase_session"
            );


        if(!raw){

            return null;

        }


        const session =
            JSON.parse(raw);


        return (
            session.access_token ||
            session?.session?.access_token ||
            null
        );

    }catch(error){

        console.error(
            "Access token error:",
            error
        );

        return null;

    }

}


async function getAuthenticatedUser(){

    try{

        if(
            typeof window.getCurrentUser ===
            "function"
        ){

            return await window.getCurrentUser();

        }


        const raw =
            localStorage.getItem(
                "losoja_supabase_session"
            );


        if(!raw){

            return null;

        }


        const session =
            JSON.parse(raw);


        return (
            session.user ||
            session?.session?.user ||
            null
        );

    }catch(error){

        console.error(
            "User error:",
            error
        );

        return null;

    }

}


async function authHeaders(){

    const token =
        await getAccessToken();


    const headers = {

        "apikey":
            SUPABASE_KEY,

        "Content-Type":
            "application/json"

    };


    if(token){

        headers.Authorization =

    }

            <div class="empty-state">
                Unable to load properties right now.
            </div>
        `;

/* =========================================================
   LOAD ALL PROPERTY IMAGES
========================================================= */

async function loadPropertyImages(){

    if(!allProperties.length){

        return;

    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/property_images" +
                "?select=id,property_id,image_url,sort_order" +
                "&order=property_id.asc,sort_order.asc,id.asc",
                {
                    headers:
                        publicHeaders()
                }
            );


        if(!response.ok){

            console.error(
                "Property images response:",
                await response.text()
            );

            return;

        }


        const rows =
            await response.json();


        const imageMap =
            new Map();


        rows.forEach(
            function(row){

                if(
                    !imageMap.has(
                        row.property_id
                    )
                ){

                    imageMap.set(
                        row.property_id,
                        []
                    );

                }


                if(row.image_url){

                    imageMap
                        .get(row.property_id)
                        .push(
                            row.image_url
                        );

                }

            }
        );


        allProperties.forEach(
            function(property){

                property._images =
                    imageMap.get(
                        property.id
                    ) || [];


                property._images =
                    property._images.filter(
                        function(url,index,array){

                            return (
                                url &&
                                array.indexOf(url) ===
                                index
                            );

                        }
                    );

            }
        );


        console.log(
            "Loaded property image rows:",
            rows.length
        );


    }catch(error){

        console.error(
            "Property images error:",
            error
        );

    }

}

========================================================= */

function getPropertyImages(property){

    if(
        property &&
        Array.isArray(property._images) &&
        property._images.length
    ){

        return property._images;

    }


    if(property?.image_url){

        if(
            Array.isArray(
                property.image_url
            )
        ){

            return property.image_url;

        }


        return [
            property.image_url
        ];

    }


    return [
        "https://via.placeholder.com/800x500?text=LosOja+Property"
    ];

}

function setPropertyFilter(

){

function matchesFilter(
    property,
    filter
){

    const type =
        String(
            property.property_type || ""
        ).toLowerCase();


    const listing =
        String(
            property.listing_type || ""
        ).toLowerCase();


    const status =
        String(
            property.status || "available"
        ).toLowerCase();


    if(filter === "all"){

        return true;

    }


    if(filter === "available"){

        return (
            status === "available" ||
            status === ""
        );

    }


    if(filter === "sale"){

        return listing.includes(
            "sale"
        );

    }


    if(filter === "rent"){

        return listing.includes(
            "rent"
        );

    }


    if(filter === "sold"){

        return status === "sold";

    }


    if(filter === "rented"){

        return status === "rented";

    }


    if(filter === "house"){

        return type === "house";

    }


    if(filter === "apartment"){

        return type === "apartment";

    }


    if(filter === "land"){

        return type === "land";

    }


    if(filter === "commercial"){

        return type === "commercial";

    }


    return true;

}


function applyFilters(){

    const search =
        document
            .getElementById(
                "propertySearch"
            )
            .value
            .trim()
            .toLowerCase();


    const filtered =
        allProperties.filter(
            function(property){

                const matchesSearch =
                    !search ||
                    [
                        property.title,
                        property.property_type,
                        property.listing_type,
                        property.location,
                        property.description
                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase()
                    .includes(search);


                return (
                    matchesSearch &&
                    matchesFilter(
                        property,
                        currentPropertyFilter
                    )
                );

            }
        );


    renderProperties(
        filtered
    );

}

/* =========================================================
   CARD IMAGE CONTROLS
========================================================= */

function changeCardImage(
    event,
    propertyIndex,
    direction
){

    if(event){

        event.stopPropagation();

    }


    const property =
        allProperties[propertyIndex];


    if(!property){

        return;

    }


    const images =
        getPropertyImages(
            property
        );


    if(images.length <= 1){

        return;

    }


    const main =
        document.getElementById(
            `cardImage-${propertyIndex}`
        );


    if(!main){

        return;

    }


    let current =
        Number(
            main.dataset.imageIndex || 0
        );


    current +=
        direction;


    if(current < 0){

        current =
            images.length - 1;

    }


    if(current >= images.length){

        current =
            0;

    }


    setCardImage(
        event,
        propertyIndex,
        current
    );

}


function setCardImage(
    event,
    propertyIndex,
    imageIndex
){

    if(event){

        event.stopPropagation();

    }


    const property =
        allProperties[propertyIndex];


    if(!property){

        return;

    }


    const images =
        getPropertyImages(
            property
        );


    if(!images.length){

        return;

    }


    imageIndex =
        Math.max(
            0,
            Math.min(
                imageIndex,
                images.length - 1
            )
        );


    const main =
        document.getElementById(
            `cardImage-${propertyIndex}`
        );


    if(!main){

        return;

    }


    main.src =
        images[imageIndex];


    main.dataset.imageIndex =
        String(imageIndex);


    const card =
        main.closest(
            ".property-card"
        );


    if(card){

        const thumbs =
            card.querySelectorAll(
                ".card-thumb"
            );


        thumbs.forEach(
            function(thumb,index){

                thumb.classList.toggle(
                    "active",
                    index === imageIndex
                );

            }
        );


        const counter =
            card.querySelector(
                ".gallery-counter"
            );


        if(counter){

            counter.textContent =
                `${imageIndex + 1} / ${images.length}`;

        }

    }

}

async function contactProperty(){

    if(!currentDetailProperty){

        showToast(
            "Property information is unavailable."

    }


    const user =
        await getAuthenticatedUser();


    if(!user){

        showToast(
            "Please log in to chat with the property owner."
        );

        return;

    }


    const sellerId =
        currentDetailProperty.user_id;


    if(!sellerId){

        showToast(
            "This property does not have an owner account connected yet."
        );

        return;

    }


    if(
        sellerId ===
        user.id
    ){

        showToast(
            "This is your own property."
        );

        return;

    }


    const propertyId =
        currentDetailProperty.id;


    const propertyTitle =
        currentDetailProperty.title ||
        "Property";


    const chatUrl =
        "chat.html" +
        "?property_id=" +
        encodeURIComponent(
            propertyId
        ) +
        "&seller_id=" +
        encodeURIComponent(
            sellerId
        ) +
        "&property_title=" +
        encodeURIComponent(
            propertyTitle
        );


    window.location.href =
        chatUrl;

}

========================================================= */

async function uploadPropertyImage(
    file,
    propertyId,
    userId,
    index
){

    if(!file){

        throw new Error(
            "Photo is missing."
        );

    }


    if(
        file.size >
        5 * 1024 * 1024
    ){

        throw new Error(
            `${file.name} is larger than 5MB.`
        );

    }


    const extension =
        (
            file.name
                .split(".")
                .pop() ||
            "jpg"
        )
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        );


    const filePath =
        `properties/${propertyId}_${Date.now()}_${index}.${extension}`;


    const token =
        await getAccessToken();


    if(!token){

        throw new Error(
            "Your login session has expired."
        );

    }


    const uploadResponse =
        await fetch(
            SUPABASE_URL +
            "/storage/v1/object/" +
            PROPERTY_BUCKET +
            "/" +
            filePath,
            {
                method:"POST",

                headers:{
                    "Authorization":
                        "Bearer " +
                        token,

                    "apikey":
                        SUPABASE_KEY,

                    "Content-Type":
                        file.type ||
                        "application/octet-stream",

                    "x-upsert":
                        "false"
                },

                body:file
            }
        );


    if(!uploadResponse.ok){

        const errorText =
            await uploadResponse.text();


        throw new Error(
            "Photo upload failed: " +
            errorText
        );

    }


    const imageUrl =
        SUPABASE_URL +
        "/storage/v1/object/public/" +
        PROPERTY_BUCKET +
        "/" +
        filePath
            .split("/")
            .map(
                encodeURIComponent
            )
            .join("/");


    return {

        property_id:
            propertyId,

        user_id:
            userId,

        image_url:
            imageUrl,

        sort_order:
            index

    };

}


/* =========================================================
   SAVE PROPERTY IMAGE ROW
========================================================= */

async function savePropertyImageRow(
    imageRow
){

    const token =
        await getAccessToken();


    if(!token){

        throw new Error(
            "Your login session has expired."
        );

    }


    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/property_images",
            {
                method:"POST",

                headers:{
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        token,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=minimal"
                },

                body:
                    JSON.stringify(
                        imageRow
                    )
            }
        );


    if(!response.ok){

        const text =
            await response.text();


        throw new Error(
            "Photo database save failed: " +
            text
        );

    }

}


/* =========================================================
   PUBLISH PROPERTY
========================================================= */

document
    .getElementById(
        "propertyForm"
    )
    .addEventListener(
        "submit",
        publishProperty
    );


async function publishProperty(
    event
){

    event.preventDefault();


    const submitButton =
        document.getElementById(
            "publishPropertyButton"
        );


    const title =
        document.getElementById(
            "propertyTitle"
        ).value.trim();


    const propertyType =
        document.getElementById(
            "propertyType"
        ).value;


    const listingType =
        document.getElementById(
            "listingType"
        ).value;


    const price =
        document.getElementById(
            "propertyPrice"
        ).value;


    const location =
        document.getElementById(
            "propertyLocation"
        ).value.trim();


    const description =
        document.getElementById(
            "propertyDescription"
        ).value.trim();


    const files =
        Array.from(
            propertyImagesInput.files || []
        );


    if(!files.length){

        showToast(
            "Please select at least one property photo."
        );

        return;

    }


    if(files.length > 10){

        showToast(
            "You can select up to 10 photos."
        );

        return;

    }


    for(
        const file of files
    ){

        if(
            file.size >
            5 * 1024 * 1024
        ){

            showToast(
                `${file.name} is larger than 5MB.`
            );

            return;

        }

    }


    const user =
        await getAuthenticatedUser();


    if(!user){

        showToast(
            "Please log in before posting a property."
        );

        return;

    }


    try{

        submitButton.disabled =
            true;


        submitButton.textContent =
            "Creating property...";


        const token =
            await getAccessToken();


        if(!token){

            throw new Error(
                "Your login session has expired. Please log in again."
            );

        }


        /*
         ----------------------------------------------------
         CREATE PROPERTY
         ----------------------------------------------------
        */

        const propertyResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/property_listings",
                {
                    method:"POST",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            token,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=representation"
                    },

                    body:
                        JSON.stringify({

                            user_id:
                                user.id,

                            title:
                                title,

                            property_type:
                                propertyType,

                            listing_type:
                                listingType,

                            location:
                                location,

                            price:
                                Number(price),

                            description:
                                description,

                            status:
                                "available"

                        })
                }
            );


        if(!propertyResponse.ok){

            const errorText =
                await propertyResponse.text();


            throw new Error(
                "Property creation failed: " +
                errorText
            );

        }


        const createdProperties =
            await propertyResponse.json();


        const property =
            createdProperties[0];


        if(!property?.id){

            throw new Error(
                "Property was created but no property ID was returned."
            );

        }


        /*
         ----------------------------------------------------
         UPLOAD EVERY PHOTO
         ----------------------------------------------------
        */

        const uploadedImages =
            [];


        for(
            let index = 0;
            index < files.length;
            index++
        ){

            submitButton.textContent =
                `Uploading photo ${index + 1} of ${files.length}...`;


            const imageRow =
                await uploadPropertyImage(
                    files[index],
                    property.id,
                    user.id,
                    index
                );


            uploadedImages.push(
                imageRow
            );

        }


        /*
         ----------------------------------------------------
         SAVE EVERY PHOTO ROW
         ----------------------------------------------------
        */

        for(
            let index = 0;
            index < uploadedImages.length;
            index++
        ){

            submitButton.textContent =
                `Saving photo ${index + 1} of ${uploadedImages.length}...`;


            await savePropertyImageRow(
                uploadedImages[index]
            );

        }


        /*
         ----------------------------------------------------
         COMPLETE
         ----------------------------------------------------
        */

        showToast(
            files.length === 1
                ? "Property published successfully."
                : `Property published with ${files.length} photos.`
        );


        document
            .getElementById(
                "propertyForm"
            )
            .reset();


        propertyPhotoPreview.innerHTML =
            "";


        photoSelectionInfo.textContent =
            "No photos selected";


        closePostPropertyModal();


        /*
         Reload from database so the gallery
         uses the actual saved image rows.
        */

        await loadProperties();


    }catch(error){

        console.error(
            "Publish property error:",
            error
        );


        showToast(
            error.message ||
            "Unable to publish property."
        );


    }finally{

        submitButton.disabled =
            false;


        submitButton.textContent =
            "Publish Property";

    }

}


/* =========================================================
   PRICE FORMAT
========================================================= */

function formatPrice(
    price
){

    if(
        price === null ||
        price === undefined ||
        price === ""
    ){

        return "Price on request";

    }


    const number =
        Number(price);


    if(
        Number.isNaN(number)
    ){

        return String(price);

    }


    return (
        "₦" +
        number.toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        )
    );

}


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return escapeHtml(
        value
    );

}
