<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LosOja Properties</title>

<meta
    name="description"
    content="Find houses, apartments, land and commercial properties on LosOja."
>

<style>

:root{
    --green:#087a3e;
    --green-dark:#055c2e;
    --green-light:#eef8f2;
    --accent:#ffb703;
    --text:#17221b;
    --muted:#68756e;
    --border:#e4e9e5;
    --white:#ffffff;
    --danger:#c62828;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f9f8;
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:var(--white);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:14px 20px;
}

.logo{
    font-size:25px;
    font-weight:800;
    color:var(--green);
}

.topbar-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.back-btn,
.post-btn{
    border:0;
    border-radius:10px;
    padding:10px 15px;
    font-weight:700;
}

.back-btn{
    background:#f0f3f1;
    color:var(--text);
}

.post-btn{
    background:var(--green);
    color:white;
}

.post-btn:hover{
    background:var(--green-dark);
}

/* =========================================================
   HERO
========================================================= */

.hero{
    padding:45px 20px;
    background:
        linear-gradient(
            rgba(8,122,62,.95),
            rgba(5,92,46,.95)
        );
    color:white;
}

.hero-inner{
    max-width:1200px;
    margin:auto;
}

.hero h1{
    margin:0 0 10px;
    font-size:clamp(30px,5vw,52px);
}

.hero p{
    margin:0;
    max-width:650px;
    line-height:1.6;
    opacity:.95;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls{
    max-width:1200px;
    margin:25px auto 0;
    padding:0 20px;
}

.search-box{
    width:100%;
    padding:15px 17px;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    background:white;
    margin-bottom:15px;
}

.search-box:focus{
    border-color:var(--green);
}

.filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.filter-btn{
    border:1px solid var(--border);
    background:white;
    color:var(--text);
    border-radius:999px;
    padding:9px 14px;
    font-weight:600;
}

.filter-btn:hover{
    border-color:var(--green);
    color:var(--green);
}

.filter-btn.active{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

/* =========================================================
   PAGE
========================================================= */

.page{
    max-width:1200px;
    margin:0 auto;
    padding:25px 20px 70px;
}

.section-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
}

.section-heading h2{
    margin:0;
    font-size:24px;
}

.property-count{
    color:var(--muted);
    font-size:14px;
}

/* =========================================================
   PROPERTY GRID
========================================================= */

.property-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.property-card{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.04);
    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.property-card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

/* =========================================================
   CARD PHOTO
========================================================= */

.card-gallery{
    position:relative;
    height:235px;
    background:#e9eeeb;
    overflow:hidden;
}

.card-image{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
}

.no-photo{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:15px;
}

.photo-counter{
    position:absolute;
    top:12px;
    right:12px;
    background:rgba(0,0,0,.68);
    color:white;
    padding:6px 9px;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
}

.gallery-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.58);
    color:white;
    font-size:23px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:3;
}

.gallery-arrow:hover{
    background:rgba(0,0,0,.8);
}

.gallery-prev{
    left:10px;
}

.gallery-next{
    right:10px;
}

.status-badge{
    position:absolute;
    left:12px;
    top:12px;
    z-index:4;
    padding:6px 10px;
    border-radius:8px;
    color:white;
    font-size:11px;
    font-weight:800;
    letter-spacing:.3px;
}

.status-available{
    background:var(--green);
}

.status-sold{
    background:#b42318;
}

.status-rented{
    background:#7a4b00;
}

/* =========================================================
   THUMBNAILS
========================================================= */

.thumbnail-strip{
    display:flex;
    gap:6px;
    padding:8px;
    overflow-x:auto;
    background:#fafbfa;
    border-bottom:1px solid var(--border);
}

.thumbnail{
    width:54px;
    height:42px;
    flex:0 0 auto;
    object-fit:cover;
    border-radius:6px;
    border:2px solid transparent;
    cursor:pointer;
}

.thumbnail.active{
    border-color:var(--green);
}

/* =========================================================
   CARD CONTENT
========================================================= */

.card-content{
    padding:16px;
}

.card-labels{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:9px;
}

.listing-badge,
.type-badge{
    display:inline-block;
    border-radius:7px;
    padding:5px 8px;
    font-size:11px;
    font-weight:700;
}

.listing-badge{
    background:var(--green-light);
    color:var(--green-dark);
}

.type-badge{
    background:#f1f3f2;
    color:#4d5b52;
}

.card-content h3{
    margin:0 0 8px;
    font-size:20px;
}

.location{
    color:var(--muted);
    font-size:14px;
    margin-bottom:9px;
}

.price{
    color:var(--green);
    font-size:21px;
    font-weight:800;
    margin-bottom:10px;
}

.description{
    color:#536057;
    font-size:14px;
    line-height:1.5;
    margin-bottom:15px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.card-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.action-btn{
    border:0;
    border-radius:9px;
    padding:10px 12px;
    font-weight:700;
}

.view-btn{
    background:var(--green);
    color:white;
}

.contact-btn{
    background:#edf3ef;
    color:var(--green-dark);
}

.unavailable-btn{
    background:#eee;
    color:#777;
    cursor:not-allowed;
}

/* =========================================================
   REACTIONS
========================================================= */

.reactions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.reaction-btn{
    border:1px solid var(--border);
    background:white;
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
}

.reaction-btn:hover{
    border-color:var(--green);
}

/* =========================================================
   OWNER CONTROLS
========================================================= */

.owner-controls{
    margin-top:13px;
    padding-top:13px;
    border-top:1px solid var(--border);
}

.owner-title{
    font-size:12px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:8px;
}

.owner-buttons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.owner-btn{
    border:0;
    border-radius:8px;
    padding:8px 10px;
    font-size:12px;
    font-weight:700;
}

.owner-available{
    background:#e8f5ed;
    color:var(--green-dark);
}

.owner-sold{
    background:#fdeaea;
    color:#a11b1b;
}

.owner-rented{
    background:#fff3d9;
    color:#7a4b00;
}

.owner-delete{
    background:#f5eeee;
    color:var(--danger);
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.message{
    text-align:center;
    padding:55px 20px;
    color:var(--muted);
    background:white;
    border:1px solid var(--border);
    border-radius:15px;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.62);
    z-index:3000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(900px,100%);
    max-height:92vh;
    overflow-y:auto;
    background:white;
    border-radius:18px;
    position:relative;
}

.modal-header{
    position:sticky;
    top:0;
    z-index:5;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
}

.modal-header h2{
    margin:0;
    font-size:20px;
}

.close-btn{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#eef1ef;
    font-size:20px;
}

.modal-body{
    padding:20px;
}

/* =========================================================
   DETAIL GALLERY
========================================================= */

.detail-gallery{
    position:relative;
    background:#111;
    border-radius:14px;
    overflow:hidden;
}

.detail-main-image{
    width:100%;
    height:min(60vh,520px);
    object-fit:contain;
    display:block;
    background:#111;
    user-select:none;
    -webkit-user-drag:none;
}

.detail-counter{
    position:absolute;
    right:12px;
    top:12px;
    background:rgba(0,0,0,.7);
    color:white;
    padding:7px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
}

.detail-thumbnails{
    display:flex;
    gap:7px;
    padding:10px;
    background:#171717;
    overflow-x:auto;
}

.detail-thumb{
    width:70px;
    height:52px;
    object-fit:cover;
    flex:0 0 auto;
    border:2px solid transparent;
    border-radius:6px;
    cursor:pointer;
}

.detail-thumb.active{
    border-color:white;
}

.detail-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:white;
    font-size:25px;
    z-index:4;
}

.detail-prev{
    left:12px;
}

.detail-next{
    right:12px;
}

/* =========================================================
   DETAIL INFO
========================================================= */

.detail-info{
    padding-top:20px;
}

.detail-info h2{
    margin:0 0 10px;
}

.detail-price{
    color:var(--green);
    font-size:25px;
    font-weight:800;
    margin:10px 0;
}

.detail-description{
    color:#536057;
    line-height:1.7;
}

.detail-actions{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-top:20px;
}

.detail-owner-controls{
    margin-top:20px;
    padding-top:18px;
    border-top:1px solid var(--border);
}

/* =========================================================
   POST PROPERTY FORM
========================================================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-weight:700;
    font-size:14px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--green);
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.photo-preview{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(90px,1fr));
    gap:8px;
    margin-top:10px;
}

.preview-image{
    width:100%;
    height:90px;
    object-fit:cover;
    border-radius:8px;
}

.form-note{
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

.submit-btn{
    border:0;
    background:var(--green);
    color:white;
    border-radius:10px;
    padding:13px 18px;
    font-weight:800;
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    z-index:5000;
    background:#17221b;
    color:white;
    padding:12px 17px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:.25s ease;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .topbar{
        padding:12px 14px;
    }

    .logo{
        font-size:22px;
    }

    .back-btn,
    .post-btn{
        padding:8px 10px;
        font-size:13px;
    }

    .hero{
        padding:35px 18px;
    }

    .controls,
    .page{
        padding-left:14px;
        padding-right:14px;
    }

    .property-grid{
        grid-template-columns:1fr;
    }

    .card-gallery{
        height:225px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .detail-main-image{
        height:45vh;
    }

}

</style>

</head>

<body>

<header class="topbar">

    <div class="logo">
        LosOja
    </div>

    <div class="topbar-actions">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back
        </button>

        <button
            class="post-btn"
            onclick="openPostModal()"
        >
            + Post Property
        </button>

    </div>

</header>


<section class="hero">

    <div class="hero-inner">

        <h1>
            Find Your Next Property
        </h1>

        <p>
            Browse houses, apartments, land and commercial
            properties available on LosOja.
        </p>

    </div>

</section>


<div class="controls">

    <input
        id="searchInput"
        class="search-box"
        type="search"
        placeholder="Search properties, locations, houses..."
        oninput="applyFilters()"
    >

    <div class="filters">

        <button
            class="filter-btn active"
            data-filter="all"
            onclick="setFilter('all',this)"
        >
            All
        </button>

        <button
            class="filter-btn"
            data-filter="available"
            onclick="setFilter('available',this)"
        >
            Available
        </button>

        <button
            class="filter-btn"
            data-filter="sale"
            onclick="setFilter('sale',this)"
        >
            For Sale
        </button>

        <button
            class="filter-btn"
            data-filter="rent"
            onclick="setFilter('rent',this)"
        >
            For Rent
        </button>

        <button
            class="filter-btn"
            data-filter="sold"
            onclick="setFilter('sold',this)"
        >
            Sold
        </button>

        <button
            class="filter-btn"
            data-filter="rented"
            onclick="setFilter('rented',this)"
        >
            Rented
        </button>

        <button
            class="filter-btn"
            data-filter="house"
            onclick="setFilter('house',this)"
        >
            Houses
        </button>

        <button
            class="filter-btn"
            data-filter="apartment"
            onclick="setFilter('apartment',this)"
        >
            Apartments
        </button>

        <button
            class="filter-btn"
            data-filter="land"
            onclick="setFilter('land',this)"
        >
            Land
        </button>

        <button
            class="filter-btn"
            data-filter="commercial"
            onclick="setFilter('commercial',this)"
        >
            Commercial
        </button>

    </div>

</div>


<main class="page">

    <div class="section-heading">

        <h2>
            Properties
        </h2>

        <span
            id="propertyCount"
            class="property-count"
        >
            Loading...
        </span>

    </div>

    <div
        id="propertyGrid"
        class="property-grid"
    ></div>

</main>


<!-- =======================================================
     PROPERTY DETAIL MODAL
======================================================= -->

<div
    id="detailModal"
    class="modal"
    onclick="closeModalOutside(event,'detailModal')"
>

    <div class="modal-card">

        <div class="modal-header">

            <h2>
                Property Details
            </h2>

            <button
                class="close-btn"
                onclick="closeModal('detailModal')"
            >
                ×
            </button>

        </div>

        <div
            id="detailBody"
            class="modal-body"
        ></div>

    </div>

</div>


<!-- =======================================================
     POST PROPERTY MODAL
======================================================= -->

<div
    id="postModal"
    class="modal"
    onclick="closeModalOutside(event,'postModal')"
>

    <div class="modal-card">

        <div class="modal-header">

            <h2>
                Post Property
            </h2>

            <button
                class="close-btn"
                onclick="closeModal('postModal')"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <form
                id="propertyForm"
                onsubmit="publishProperty(event)"
            >

                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            Property Title
                        </label>

                        <input
                            id="propertyTitle"
                            required
                            placeholder="e.g. 3 Bedroom Duplex"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Property Type
                        </label>

                        <select
                            id="propertyCategory"
                            required
                        >

                            <option value="">
                                Select type
                            </option>

                            <option value="house">
                                House
                            </option>

                            <option value="apartment">
                                Apartment
                            </option>

                            <option value="land">
                                Land
                            </option>

                            <option value="commercial">
                                Commercial
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Listing Type
                        </label>

                        <select
                            id="listingType"
                            required
                        >

                            <option value="sale">
                                For Sale
                            </option>

                            <option value="rent">
                                For Rent
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Price (₦)
                        </label>

                        <input
                            id="propertyPrice"
                            type="number"
                            min="0"
                            required
                            placeholder="250000"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Location
                        </label>

                        <input
                            id="propertyLocation"
                            required
                            placeholder="e.g. Ikeja, Lagos"
                        >

                    </div>


                    <div class="form-group full">

                        <label>
                            Description
                        </label>

                        <textarea
                            id="propertyDescription"
                            placeholder="Describe the property..."
                        ></textarea>

                    </div>


                    <div class="form-group full">

                        <label>
                            Property Photos
                        </label>

                        <input
                            id="propertyPhotos"
                            type="file"
                            accept="image/jpeg,image/jpg,image/png,image/webp,image/gif"
                            multiple
                            onchange="previewPhotos(event)"
                        >

                        <div class="form-note">
                            You can select multiple photos.
                            The gallery will display all uploaded photos.
                        </div>

                        <div
                            id="photoPreview"
                            class="photo-preview"
                        ></div>

                    </div>


                    <div class="form-group full">

                        <button
                            id="publishBtn"
                            class="submit-btn"
                            type="submit"
                        >
                            Publish Property
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script src="auth.js"></script>

<script>

"use strict";

   CONFIG
========================================================= */

   HEADERS

/* =========================================================
   AUTH
========================================================= */

async function getAuthDetails(){

    try{

        if(
            typeof window.getSupabaseSession ===
            "function"
        ){

            const session =
                await window.getSupabaseSession();

            if(session && session.user){

                return {
                    user:session.user,
                    token:session.access_token
                };

            }

        }

    }catch(error){

        console.warn(
            "Auth session check failed:",
            error
        );

    }

    return {
        user:null,
        token:null
    };

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   FORMATTING
========================================================= */

function formatMoney(value){

    const amount =
        Number(value || 0);

    return "₦" +
        amount.toLocaleString("en-NG");

}


function formatPropertyType(value){

    const type =
        String(value || "")
            .trim()
            .toLowerCase();

    const labels = {
        house:"House",
        apartment:"Apartment",
        land:"Land",
        commercial:"Commercial",
        property:"Property"
    };

    return labels[type] ||
        (
            type
                ? type.charAt(0).toUpperCase() +
                  type.slice(1)
                : "Property"
        );

}


function formatListingType(value){

    const type =
        String(value || "")
            .trim()
            .toLowerCase();

    if(type.includes("rent")){
        return "For Rent";
    }

    return "For Sale";

}


function formatStatus(value){

    const status =
        String(value || "available")
            .trim()
            .toLowerCase();

    if(status === "sold"){
        return "SOLD";
    }

    if(status === "rented"){
        return "RENTED";
    }

    return "AVAILABLE";

}


function statusClass(value){

    const status =
        String(value || "available")
            .toLowerCase();

    if(status === "sold"){
        return "status-sold";
    }

    if(status === "rented"){
        return "status-rented";
    }

    return "status-available";

}


/* =========================================================
   TOAST
========================================================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    if(!toast) return;

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(window.losojaToastTimer);

    window.losojaToastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        },3000);

}


/* =========================================================
   NAVIGATION
========================================================= */

function goBack(){

    if(
        document.referrer &&
        document.referrer.includes(location.hostname)
    ){

        history.back();

    }else{

        window.location.href =
            "index.html";

    }

}


/* =========================================================
   MODALS
========================================================= */

function openModal(id){

    const modal =
        document.getElementById(id);

    if(modal){
        modal.classList.add("show");
        document.body.style.overflow = "hidden";
    }

}


function closeModal(id){

    const modal =
        document.getElementById(id);

    if(modal){
        modal.classList.remove("show");
        document.body.style.overflow = "";
    }

}


function closeModalOutside(event,id){

    if(event.target.id === id){
        closeModal(id);
    }

}


function openPostModal(){

    openModal("postModal");

}


/* =========================================================
   LOAD PROPERTIES
========================================================= */

async function loadProperties(){

    const grid =
        document.getElementById("propertyGrid");

    grid.innerHTML = `
        <div class="message">
            Loading properties...
        </div>
    `;

    try{

        const auth =
            await getAuthDetails();

        currentUserId =
            auth.user?.id || "";


        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/property_listings" +
                "?select=*"+
                "&order=created_at.desc",
                {
                    headers:publicHeaders()
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(errorText);

        }


        allProperties =
            await response.json();


        if(!Array.isArray(allProperties)){
            allProperties = [];
        }


        /*
         * IMPORTANT:
         * Load ALL property image records.
         * We do not use an "in" filter here.
         * This prevents the gallery from accidentally
         * receiving only one image.
         */

        await loadPropertyImages();


        /*
         * Keep reaction counts already stored on
         * property_listings.
         */

        renderProperties();


    }catch(error){

        console.error(
            "Property loading error:",
            error
        );

        grid.innerHTML = `
            <div class="message">
                Unable to load properties right now.
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


/* =========================================================
   LOAD ALL PROPERTY IMAGES
========================================================= */

async function loadPropertyImages(){

    allProperties.forEach(property => {

        property._images = [];

    });


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/property_images" +
                "?select=property_id,image_url,sort_order" +
                "&order=property_id.asc,sort_order.asc",
                {
                    headers:publicHeaders()
                }
            );


        if(!response.ok){

            console.error(
                "Property image request failed:",
                await response.text()
            );

            return;

        }


        const images =
            await response.json();


        console.log(
            "LosOja property images loaded:",
            images.length
        );


        const imageMap = {};


        images.forEach(image => {

            if(!image.property_id){
                return;
            }


            if(!imageMap[image.property_id]){
                imageMap[image.property_id] = [];
            }


            imageMap[image.property_id].push({

                image_url:
                    image.image_url,

                sort_order:
                    Number(image.sort_order || 0)

            });

        });


        Object.keys(imageMap).forEach(propertyId => {

            imageMap[propertyId].sort(
                (a,b) =>
                    a.sort_order -
                    b.sort_order
            );

        });


        allProperties.forEach(property => {

            property._images =
                imageMap[property.id] || [];

        });


        console.log(
            "LosOja property image map:",
            imageMap
        );

    }catch(error){

        console.error(
            "Property image loading error:",
            error
        );

    }

}


/* =========================================================
   FILTERS
========================================================= */

function setFilter(filter,button){

    currentFilter = filter;


    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    if(button){
        button.classList.add("active");
    }


    applyFilters();

}


function propertyMatchesFilter(property){

    const filter =
        currentFilter;


    if(filter === "all"){
        return true;
    }


    const status =
        String(property.status || "available")
            .toLowerCase();


    const listing =
        String(property.listing_type || "")
            .toLowerCase();


    const type =
        String(
            property.property_type ||
            property.category ||
            ""
        ).toLowerCase();


    if(filter === "available"){
        return status === "available";
    }


    if(filter === "sold"){
        return status === "sold";
    }


    if(filter === "rented"){
        return status === "rented";
    }


    if(filter === "sale"){
        return listing.includes("sale");
    }


    if(filter === "rent"){
        return listing.includes("rent");
    }


    if(
        filter === "house" ||
        filter === "apartment" ||
        filter === "land" ||
        filter === "commercial"
    ){

        return type === filter;

    }


    return true;

}


function applyFilters(){

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    const filtered =
        allProperties.filter(property => {

            if(
                !propertyMatchesFilter(property)
            ){
                return false;
            }


            if(!search){
                return true;
            }


            const searchable = [

                property.title,

                property.location,

                property.description,

                property.property_type,

                property.category,

                property.listing_type,

                property.status

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            return searchable.includes(search);

        });


    renderProperties(filtered);

}


/* =========================================================
   RENDER PROPERTIES
========================================================= */

function renderProperties(properties){

    const grid =
        document.getElementById("propertyGrid");

    const count =
        document.getElementById("propertyCount");


    const list =
        properties ||
        allProperties.filter(
            propertyMatchesFilter
        );


    count.textContent =
        list.length +
        (
            list.length === 1
                ? " property"
                : " properties"
        );


    if(!list.length){

        grid.innerHTML = `
            <div class="message">
                No properties found.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        list.map(
            createPropertyCard
        ).join("");


    /*
     * Enable touch / mouse swiping on cards.
     */

    list.forEach(property => {

        setupCardSwipe(property.id);

    });

}


/* =========================================================
   CREATE PROPERTY CARD
========================================================= */

function createPropertyCard(property){

    const images =
        Array.isArray(property._images)
            ? property._images
            : [];


    if(
        typeof cardImageIndexes[property.id]
        !== "number"
    ){

        cardImageIndexes[property.id] = 0;

    }


    let imageIndex =
        cardImageIndexes[property.id];


    if(imageIndex >= images.length){
        imageIndex = 0;
        cardImageIndexes[property.id] = 0;
    }


    const currentImage =
        images[imageIndex];


    const status =
        String(
            property.status || "available"
        ).toLowerCase();


    const isOwner =
        !!currentUserId &&
        property.user_id === currentUserId;


    const type =
        property.property_type ||
        property.category ||
        "property";


    const listingType =
        property.listing_type ||
        "sale";


    const title =
        property.title ||
        "Property";


    const location =
        property.location ||
        "Location not provided";


    const price =
        formatMoney(property.price);


    const description =
        property.description ||
        "No description provided.";


    const imageCount =
        images.length;


    let galleryHtml = "";


    if(currentImage && currentImage.image_url){

        galleryHtml = `
            <img
                id="card-image-${property.id}"
                class="card-image"
                src="${escapeHtml(currentImage.image_url)}"
                alt="${escapeHtml(title)}"
                draggable="false"
            >
        `;

    }else{

        galleryHtml = `
            <div class="no-photo">
                No photos
            </div>
        `;

    }


    const arrows =
        imageCount > 1
            ? `
                <button
                    class="gallery-arrow gallery-prev"
                    onclick="changeCardImage(event,'${property.id}',-1)"
                    aria-label="Previous photo"
                >
                    ‹
                </button>

                <button
                    class="gallery-arrow gallery-next"
                    onclick="changeCardImage(event,'${property.id}',1)"
                    aria-label="Next photo"
                >
                    ›
                </button>
            `
            : "";


    const thumbnails =
        imageCount > 1
            ? `
                <div class="thumbnail-strip">

                    ${images.map((image,index) => `

                        <img
                            class="thumbnail ${
                                index === imageIndex
                                    ? "active"
                                    : ""
                            }"
                            src="${escapeHtml(image.image_url)}"
                            alt="Property photo ${index + 1}"
                            onclick="setCardImage(event,'${property.id}',${index})"
                        >

                    `).join("")}

                </div>
            `
            : "";


    let ownerControls = "";


    if(isOwner){

        ownerControls = `
            <div class="owner-controls">

                <div class="owner-title">
                    Your Property Controls
                </div>

                <div class="owner-buttons">

                    ${
                        status !== "available"
                            ? `
                                <button
                                    class="owner-btn owner-available"
                                    onclick="updatePropertyStatus('${property.id}','available')"
                                >
                                    Mark Available
                                </button>
                            `
                            : ""
                    }


                    ${
                        status !== "sold"
                            ? `
                                <button
                                    class="owner-btn owner-sold"
                                    onclick="updatePropertyStatus('${property.id}','sold')"
                                >
                                    Mark Sold
                                </button>
                            `
                            : ""
                    }


                    ${
                        status !== "rented"
                            ? `
                                <button
                                    class="owner-btn owner-rented"
                                    onclick="updatePropertyStatus('${property.id}','rented')"
                                >
                                    Mark Rented
                                </button>
                            `
                            : ""
                    }


                    <button
                        class="owner-btn owner-delete"
                        onclick="deleteProperty('${property.id}')"
                    >
                        Delete Property
                    </button>

                </div>

            </div>
        `;

    }


    return `

        <article
            class="property-card"
            data-property-id="${escapeHtml(property.id)}"
        >

            <div
                class="card-gallery"
                id="gallery-${property.id}"
                data-index="${imageIndex}"
            >

                <div class="status-badge ${statusClass(status)}">
                    ${formatStatus(status)}
                </div>

                ${galleryHtml}

                ${
                    imageCount
                        ? `
                            <div class="photo-counter">
                                ${imageIndex + 1} / ${imageCount}
                            </div>
                        `
                        : ""
                }

                ${arrows}

            </div>

            ${thumbnails}

            <div class="card-content">

                <div class="card-labels">

                    <span class="listing-badge">
                        ${escapeHtml(
                            formatListingType(listingType)
                        )}
                    </span>

                    <span class="type-badge">
                        ${escapeHtml(
                            formatPropertyType(type)
                        )}
                    </span>

                </div>


                <h3>
                    ${escapeHtml(title)}
                </h3>


                <div class="location">
                    📍 ${escapeHtml(location)}
                </div>


                <div class="price">
                    ${price}
                </div>


                <div class="description">
                    ${escapeHtml(description)}
                </div>


                <div class="card-actions">

                    <button
                        class="action-btn view-btn"
                        onclick="openProperty('${property.id}')"
                    >
                        View Property
                    </button>


                    ${
                        status === "available"
                            ? `
                                <button
                                    class="action-btn contact-btn"
                                    onclick="contactProperty('${property.id}')"
                                >
                                    Contact
                                </button>
                            `
                            : `
                                <button
                                    class="action-btn unavailable-btn"
                                    disabled
                                >
                                    ${formatStatus(status)}
                                </button>
                            `
                    }

                </div>


                <div class="reactions">

                    <button
                        class="reaction-btn"
                        onclick="reactToProperty('${property.id}','like')"
                    >
                        👍 ${Number(property.like_count || 0)}
                    </button>

                    <button
                        class="reaction-btn"
                        onclick="reactToProperty('${property.id}','dislike')"
                    >
                        👎 ${Number(property.dislike_count || 0)}
                    </button>

                </div>


                ${ownerControls}

            </div>

        </article>

    `;

}


/* =========================================================
   CARD IMAGE CONTROLS
========================================================= */

function changeCardImage(event,propertyId,direction){

    if(event){
        event.stopPropagation();
    }


    const property =
        allProperties.find(
            item => item.id === propertyId
        );


    if(!property){
        return;
    }


    const images =
        property._images || [];


    if(images.length <= 1){
        return;
    }


    let index =
        Number(
            cardImageIndexes[propertyId] || 0
        );


    index += direction;


    if(index < 0){
        index = images.length - 1;
    }


    if(index >= images.length){
        index = 0;
    }


    cardImageIndexes[propertyId] =
        index;


    updateCardImage(property);

}


function setCardImage(event,propertyId,index){

    if(event){
        event.stopPropagation();
    }


    const property =
        allProperties.find(
            item => item.id === propertyId
        );


    if(!property){
        return;
    }


    const images =
        property._images || [];


    if(!images[index]){
        return;
    }


    cardImageIndexes[propertyId] =
        index;


    updateCardImage(property);

}


function updateCardImage(property){

    const images =
        property._images || [];


    if(!images.length){
        return;
    }


    let index =
        Number(
            cardImageIndexes[property.id] || 0
        );


    if(index >= images.length){
        index = 0;
    }


    const image =
        images[index];


    const imageElement =
        document.getElementById(
            "card-image-" + property.id
        );


    if(imageElement){

        imageElement.src =
            image.image_url;

    }


    const gallery =
        document.getElementById(
            "gallery-" + property.id
        );


    if(gallery){

        gallery.dataset.index =
            index;


        const counter =
            gallery.querySelector(
                ".photo-counter"
            );


        if(counter){

            counter.textContent =
                `${index + 1} / ${images.length}`;

        }

    }


    const card =
        document.querySelector(
            `[data-property-id="${CSS.escape(property.id)}"]`
        );


    if(card){

        card
            .querySelectorAll(".thumbnail")
            .forEach(
                (thumbnail,thumbnailIndex) => {

                    thumbnail.classList.toggle(
                        "active",
                        thumbnailIndex === index
                    );

                }
            );

    }

}


/* =========================================================
   CARD SWIPE
========================================================= */

function setupCardSwipe(propertyId){

    const gallery =
        document.getElementById(
            "gallery-" + propertyId
        );


    if(!gallery){
        return;
    }


    if((gallery.dataset.swipeReady || "") === "yes"){
        return;
    }


    gallery.dataset.swipeReady = "yes";


    let startX = null;


    gallery.addEventListener(
        "pointerdown",
        event => {

            startX =
                event.clientX;

        }
    );


    gallery.addEventListener(
        "pointerup",
        event => {

            if(startX === null){
                return;
            }


            const endX =
                event.clientX;


            const difference =
                endX - startX;


            startX = null;


            if(Math.abs(difference) < 45){
                return;
            }


            changeCardImage(
                event,
                propertyId,
                difference < 0 ? 1 : -1
            );

        }
    );

}


/* =========================================================
   OPEN PROPERTY
========================================================= */

function openProperty(propertyId){

    const property =
        allProperties.find(
            item => item.id === propertyId
        );


    if(!property){
        return;
    }


    detailPropertyId =
        propertyId;


    detailImageIndex = 0;


    renderPropertyDetail(property);


    openModal("detailModal");


    setupDetailSwipe(property);

}

        String(
            property.status || "available"
        ).toLowerCase();

/* =========================================================
   DETAIL IMAGE CONTROLS
========================================================= */

function changeDetailImage(direction){

    const property =
        allProperties.find(
            item => item.id === detailPropertyId
        );


    if(!property){
        return;
    }


    const images =
        property._images || [];


    if(images.length <= 1){
        return;
    }


    detailImageIndex += direction;


    if(detailImageIndex < 0){
        detailImageIndex =
            images.length - 1;
    }


    if(detailImageIndex >= images.length){
        detailImageIndex = 0;
    }


    renderPropertyDetail(property);


    setupDetailSwipe(property);

}


function setDetailImage(index){

    const property =
        allProperties.find(
            item => item.id === detailPropertyId
        );


    if(!property){
        return;
    }


    if(
        !property._images ||
        !property._images[index]
    ){

        return;

    }


    detailImageIndex =
        index;


    renderPropertyDetail(property);


    setupDetailSwipe(property);

}


/* =========================================================
   DETAIL SWIPE
========================================================= */

function setupDetailSwipe(property){

    const gallery =
        document.getElementById(
            "detailGallery"
        );


    if(!gallery){
        return;
    }


    if(
        gallery.dataset.swipeReady === "yes"
    ){
        return;
    }


    gallery.dataset.swipeReady = "yes";


    let startX = null;


    gallery.addEventListener(
        "pointerdown",
        event => {

            startX =
                event.clientX;

        }
    );


    gallery.addEventListener(
        "pointerup",
        event => {

            if(startX === null){
                return;
            }


            const difference =
                event.clientX - startX;


            startX = null;


            if(Math.abs(difference) < 45){
                return;
            }


            changeDetailImage(
                difference < 0 ? 1 : -1
            );

        }
    );

}


/* =========================================================
   CONTACT
========================================================= */

function contactProperty(propertyId){

    const property =
        allProperties.find(
            item => item.id === propertyId
        );


    if(!property){
        return;
    }


    if(
        String(property.status || "available")
            .toLowerCase() !== "available"
    ){

        showToast(
            "This property is no longer available."
        );

        return;

    }


    showToast(
        "Contact messaging will be available here."
    );

}


/* =========================================================
   REACTIONS
========================================================= */

async function reactToProperty(
    propertyId,
    reaction
){

    const auth =
        await getAuthDetails();


    if(!auth.user){

        showToast(
            "Please log in to react to a property."
        );

        return;

    }


    try{

        const existingResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/property_reactions" +
                "?select=id,reaction" +
                "&property_id=eq." +
                encodeURIComponent(propertyId) +
                "&user_id=eq." +
                encodeURIComponent(auth.user.id),
                {
                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " +
                            auth.token
                    }
                }
            );


        if(!existingResponse.ok){

            throw new Error(
                await existingResponse.text()
            );

        }


        const existing =
            await existingResponse.json();


        if(existing.length){

            if(existing[0].reaction === reaction){

                showToast(
                    "You already voted on this property."
                );

                return;

            }


            const updateResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/property_reactions" +
                    "?id=eq." +
                    encodeURIComponent(
                        existing[0].id
                    ),
                    {
                        method:"PATCH",
                        headers:{
                            "apikey":SUPABASE_KEY,
                            "Authorization":
                                "Bearer " +
                                auth.token,
                            "Content-Type":
                                "application/json"
                        },
                        body:JSON.stringify({
                            reaction:reaction
                        })
                    }
                );


            if(!updateResponse.ok){

                throw new Error(
                    await updateResponse.text()
                );

            }


        }else{

            const insertResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/property_reactions",
                    {
                        method:"POST",
                        headers:{
                            "apikey":SUPABASE_KEY,
                            "Authorization":
                                "Bearer " +
                                auth.token,
                            "Content-Type":
                                "application/json"
                        },
                        body:JSON.stringify({

                            property_id:
                                propertyId,

                            user_id:
                                auth.user.id,

                            reaction:
                                reaction

                        })
                    }
                );


            if(!insertResponse.ok){

                throw new Error(
                    await insertResponse.text()
                );

            }

        }


        /*
         * Refresh reaction counts from
         * property_listings.
         */

        await loadProperties();


        showToast(
            reaction === "like"
                ? "👍 Vote saved."
                : "👎 Vote saved."
        );


    }catch(error){

        console.error(
            "Reaction error:",
            error
        );

        showToast(
            "Could not save your vote."
        );

    }

}


/* =========================================================
   UPDATE PROPERTY STATUS
========================================================= */

async function updatePropertyStatus(
    propertyId,
    newStatus
){

    const auth =
        await getAuthDetails();


    if(!auth.user){

        showToast(
            "Please log in again."
        );

        return;

    }


    const property =
        allProperties.find(
            item => item.id === propertyId
        );


    if(!property){
        return;
    }


    if(
        property.user_id !==
        auth.user.id
    ){

        showToast(
            "Only the property owner can change its status."
        );

        return;

    }


    const allowed = [
        "available",
        "sold",
        "rented"
    ];


    if(!allowed.includes(newStatus)){

        showToast(
            "Invalid property status."
        );

        return;

    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/property_listings" +
                "?id=eq." +
                encodeURIComponent(propertyId) +
                "&user_id=eq." +
                encodeURIComponent(auth.user.id),
                {
                    method:"PATCH",
                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " +
                            auth.token,
                        "Content-Type":
                            "application/json",
                        "Prefer":
                            "return=minimal"
                    },
                    body:JSON.stringify({
                        status:newStatus
                    })
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        property.status =
            newStatus;


        showToast(
            newStatus === "available"
                ? "Property marked available."
                : newStatus === "sold"
                    ? "Property marked SOLD."
                    : "Property marked RENTED."
        );


        if(
            detailPropertyId === propertyId
        ){

            renderPropertyDetail(property);

            setupDetailSwipe(property);

        }


        applyFilters();


    }catch(error){

        console.error(
            "Status update error:",
            error
        );

        showToast(
            "Could not update property status."
        );

    }

}


/* =========================================================
   DELETE PROPERTY
========================================================= */

async function deleteProperty(propertyId){

    const auth =
        await getAuthDetails();


    if(!auth.user){

        showToast(
            "Please log in again."
        );

        return;

    }


    const property =
        allProperties.find(
            item => item.id === propertyId
        );


    if(!property){
        return;
    }


    if(
        property.user_id !==
        auth.user.id
    ){

        showToast(
            "Only the property owner can delete it."
        );

        return;

    }


    const confirmed =
        window.confirm(
            "Delete this property permanently?"
        );


    if(!confirmed){
        return;
    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/property_listings" +
                "?id=eq." +
                encodeURIComponent(propertyId) +
                "&user_id=eq." +
                encodeURIComponent(auth.user.id),
                {
                    method:"DELETE",
                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " +
                            auth.token,
                        "Prefer":
                            "return=minimal"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        /*
         * property_images has ON DELETE CASCADE,
         * so its database records will be removed
         * automatically with the property.
         */

        allProperties =
            allProperties.filter(
                item => item.id !== propertyId
            );


        delete cardImageIndexes[propertyId];


        if(
            detailPropertyId === propertyId
        ){

            detailPropertyId = null;

            closeModal("detailModal");

        }


        renderProperties();


        showToast(
            "Property deleted."
        );


    }catch(error){

        console.error(
            "Delete property error:",
            error
        );

        showToast(
            "Could not delete property."
        );

    }

}


/* =========================================================
   PHOTO PREVIEW
========================================================= */

function previewPhotos(event){

    const preview =
        document.getElementById(
            "photoPreview"
        );


    preview.innerHTML = "";


    const files =
        Array.from(
            event.target.files || []
        );


    files.forEach(file => {

        if(!file.type.startsWith("image/")){
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(){

                const img =
                    document.createElement("img");


                img.className =
                    "preview-image";


                img.src =
                    reader.result;


                preview.appendChild(img);

            };


        reader.readAsDataURL(file);

    });


}


/* =========================================================
   PUBLISH PROPERTY
========================================================= */

async function publishProperty(event){

    event.preventDefault();


    const publishBtn =
        document.getElementById(
            "publishBtn"
        );


    publishBtn.disabled = true;

    publishBtn.textContent =
        "Publishing...";


    try{

        const auth =
            await getAuthDetails();


        if(!auth.user){

            throw new Error(
                "Please log in before posting a property."
            );

        }


        if(!auth.user.id){

            throw new Error(
                "Your account ID could not be found. Please log in again."
            );

        }


        const title =
            document
                .getElementById("propertyTitle")
                .value
                .trim();


        const category =
            document
                .getElementById("propertyCategory")
                .value;


        const listingType =
            document
                .getElementById("listingType")
                .value;


        const price =
            Number(
                document
                    .getElementById("propertyPrice")
                    .value
            );


        const location =
            document
                .getElementById("propertyLocation")
                .value
                .trim();


        const description =
            document
                .getElementById("propertyDescription")
                .value
                .trim();


        const photoInput =
            document.getElementById(
                "propertyPhotos"
            );


        const files =
            Array.from(
                photoInput.files || []
            );


        /*
         * STEP 1
         * Create property.
         */

        const propertyResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/property_listings",
                {
                    method:"POST",
                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " +
                            auth.token,
                        "Content-Type":
                            "application/json",
                        "Prefer":
                            "return=representation"
                    },
                    body:JSON.stringify({

                        user_id:
                            auth.user.id,

                        title:
                            title,

                        property_type:
                            category,

                        listing_type:
                            listingType,

                        price:
                            price,

                        location:
                            location,

                        description:
                            description,

                        status:
                            "available"

                    })
                }
            );


        if(!propertyResponse.ok){

            throw new Error(
                await propertyResponse.text()
            );

        }


        const created =
            await propertyResponse.json();


        const property =
            Array.isArray(created)
                ? created[0]
                : created;


        if(!property || !property.id){

            throw new Error(
                "Property was created but its ID was not returned."
            );

        }


        /*
         * STEP 2
         * Upload every selected photo.
         */

        const uploadedImages = [];


        for(
            let index = 0;
            index < files.length;
            index++
        ){

            const file =
                files[index];


            if(!file.type.startsWith("image/")){
                continue;
            }


            if(file.size > 5 * 1024 * 1024){

                throw new Error(
                    file.name +
                    " is larger than 5MB."
                );

            }


            const extension =
                (
                    file.name
                        .split(".")
                        .pop() ||
                    "jpg"
                )
                .toLowerCase();


            const randomId =
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2,10);


            const storagePath =
                auth.user.id +
                "/" +
                property.id +
                "/" +
                randomId +
                "." +
                extension;


            const uploadResponse =
                await fetch(
                    SUPABASE_URL +
                    "/storage/v1/object/" +
                    PROPERTY_BUCKET +
                    "/" +
                    storagePath,
                    {
                        method:"POST",
                        headers:{
                            "apikey":SUPABASE_KEY,
                            "Authorization":
                                "Bearer " +
                                auth.token,
                            "Content-Type":
                                file.type,
                            "x-upsert":
                                "false"
                        },
                        body:file
                    }
                );


            if(!uploadResponse.ok){

                throw new Error(
                    "Could not upload " +
                    file.name +
                    ": " +
                    await uploadResponse.text()
                );

            }


            const encodedPath =
                storagePath
                    .split("/")
                    .map(
                        part =>
                            encodeURIComponent(part)
                    )
                    .join("/");


            const publicUrl =
                SUPABASE_URL +
                "/storage/v1/object/public/" +
                PROPERTY_BUCKET +
                "/" +
                encodedPath;


            uploadedImages.push({

                property_id:
                    property.id,

                user_id:
                    auth.user.id,

                image_url:
                    publicUrl,

                sort_order:
                    index

            });

        }


        /*
         * STEP 3
         * Save ALL photo records.
         */

        if(uploadedImages.length){

            const imageResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/property_images",
                    {
                        method:"POST",
                        headers:{
                            "apikey":SUPABASE_KEY,
                            "Authorization":
                                "Bearer " +
                                auth.token,
                            "Content-Type":
                                "application/json",
                            "Prefer":
                                "return=minimal"
                        },
                        body:
                            JSON.stringify(
                                uploadedImages
                            )
                    }
                );


            if(!imageResponse.ok){

                const imageError =
                    await imageResponse.text();


                console.error(
                    "Image database insert failed:",
                    imageError
                );


                throw new Error(
                    "Property was published, but the photo records could not be saved."
                );

            }

        }


        /*
         * Reset form.
         */

        document
            .getElementById("propertyForm")
            .reset();


        document
            .getElementById("photoPreview")
            .innerHTML = "";


        closeModal("postModal");


        showToast(
            files.length
                ? "Property and photos published successfully."
                : "Property published successfully."
        );


        /*
         * Reload everything so the new property
         * immediately receives ALL its photos.
         */

        await loadProperties();


    }catch(error){

        console.error(
            "Publish property error:",
            error
        );


        showToast(
            error.message ||
            "Could not publish property."
        );

    }finally{

        publishBtn.disabled = false;

        publishBtn.textContent =
            "Publish Property";

    }

}


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadProperties();

    }
);

</script>
