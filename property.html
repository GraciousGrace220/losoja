<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LosOja Properties</title>

<meta
    name="description"
    content="Browse houses, apartments, land and commercial properties available on LosOja."
>

<style>

:root{
    --green:#087a3e;
    --green-dark:#055c2e;
    --green-light:#eef8f2;
    --accent:#ffb703;
    --text:#17251d;
    --muted:#68756e;
    --border:#e3e9e5;
    --white:#ffffff;
    --danger:#d93025;
    --shadow:0 8px 25px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f7faf8;
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
    background:var(--green);
    color:white;
    padding:14px 18px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.topbar-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:23px;
    font-weight:800;
    letter-spacing:-.5px;
}

.back-btn{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12);
    color:white;
    padding:9px 14px;
    border-radius:10px;
    font-weight:700;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    max-width:1200px;
    margin:auto;
    padding:28px 18px 15px;
}

.hero h1{
    margin:0 0 8px;
    font-size:32px;
}

.hero p{
    margin:0;
    color:var(--muted);
    line-height:1.5;
}

/* =========================================================
   FILTERS
========================================================= */

.filters-wrap{
    max-width:1200px;
    margin:auto;
    padding:10px 18px 20px;
}

.search-row{
    display:flex;
    gap:10px;
    margin-bottom:12px;
}

.search-row input{
    flex:1;
    min-width:0;
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px 15px;
    outline:none;
    background:white;
}

.search-row input:focus{
    border-color:var(--green);
    box-shadow:0 0 0 3px rgba(8,122,62,.10);
}

.filter-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
}

.filter-row::-webkit-scrollbar{
    height:4px;
}

.filter-btn{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:white;
    color:#34423a;
    padding:9px 13px;
    border-radius:999px;
    font-weight:700;
}

.filter-btn.active{
    background:var(--green);
    color:white;
    border-color:var(--green);
}

/* =========================================================
   MAIN
========================================================= */

.main{
    max-width:1200px;
    margin:auto;
    padding:0 18px 50px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin:10px 0 18px;
}

.section-title h2{
    margin:0;
    font-size:22px;
}

.property-count{
    color:var(--muted);
    font-size:14px;
}

/* =========================================================
   PROPERTY GRID
========================================================= */

.property-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
}

.property-card{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    box-shadow:var(--shadow);
}

.card-gallery{
    position:relative;
    background:#eaf0ec;
}

.card-main-image{
    display:block;
    width:100%;
    height:230px;
    object-fit:cover;
    background:#eaf0ec;
}

.image-counter{
    position:absolute;
    top:12px;
    right:12px;
    background:rgba(0,0,0,.68);
    color:white;
    padding:5px 9px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

.gallery-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.58);
    color:white;
    font-size:20px;
    z-index:3;
}

.gallery-arrow:hover{
    background:rgba(0,0,0,.78);
}

.gallery-arrow.prev{
    left:10px;
}

.gallery-arrow.next{
    right:10px;
}

/* =========================================================
   CARD THUMBNAILS
========================================================= */

.card-thumbnails{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:9px;
    background:#f4f7f5;
}

.card-thumbnails::-webkit-scrollbar{
    height:4px;
}

.thumbnail{
    flex:0 0 auto;
    width:54px;
    height:45px;
    padding:0;
    border:2px solid transparent;
    border-radius:8px;
    overflow:hidden;
    background:#ddd;
    cursor:pointer;
}

.thumbnail:hover{
    border-color:#7aa88d;
}

.thumbnail.active{
    border-color:var(--green);
}

.thumbnail img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    pointer-events:none;
}

/* =========================================================
   CARD CONTENT
========================================================= */

.card-content{
    padding:16px;
}

.property-badges{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:9px;
}

.badge{
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    padding:5px 9px;
    font-size:11px;
    font-weight:800;
}

.badge-sale{
    background:#e8f6ed;
    color:var(--green-dark);
}

.badge-rent{
    background:#fff4d5;
    color:#825f00;
}

.badge-status{
    background:#eef1f0;
    color:#48544e;
}

.card-content h3{
    margin:0 0 7px;
    font-size:19px;
}

.location{
    color:var(--muted);
    font-size:14px;
    margin-bottom:8px;
}

.price{
    color:var(--green-dark);
    font-size:20px;
    font-weight:800;
    margin-bottom:10px;
}

.description{
    color:#56625b;
    line-height:1.45;
    font-size:14px;
    margin-bottom:14px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.card-actions{
    display:flex;
    gap:8px;
}

.primary-btn,
.secondary-btn,
.danger-btn{
    border:0;
    border-radius:10px;
    padding:10px 13px;
    font-weight:800;
}

.primary-btn{
    background:var(--green);
    color:white;
    flex:1;
}

.primary-btn:hover{
    background:var(--green-dark);
}

.secondary-btn{
    background:var(--green-light);
    color:var(--green-dark);
}

.danger-btn{
    background:#fff0ef;
    color:var(--danger);
}

/* =========================================================
   EMPTY / LOADING / ERROR
========================================================= */

.center-message{
    text-align:center;
    padding:55px 20px;
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    color:var(--muted);
}

.error-message{
    color:var(--danger);
}

.retry-btn{
    margin-top:12px;
    border:0;
    background:var(--green);
    color:white;
    padding:10px 16px;
    border-radius:10px;
    font-weight:700;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.62);
    z-index:500;
    padding:20px;
    overflow-y:auto;
}

.modal.show{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-box{
    width:min(950px,100%);
    max-height:92vh;
    overflow-y:auto;
    background:white;
    border-radius:20px;
    position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
}

.modal-close{
    position:absolute;
    right:14px;
    top:14px;
    z-index:20;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:22px;
}

.modal-content{
    padding:22px;
}

.modal-title{
    margin:0 0 8px;
    font-size:27px;
}

.modal-meta{
    color:var(--muted);
    margin-bottom:15px;
}

.detail-main{
    position:relative;
    background:#eaf0ec;
    border-radius:14px;
    overflow:hidden;
}

.detail-main img{
    width:100%;
    height:min(520px,60vh);
    object-fit:contain;
    display:block;
    background:#eaf0ec;
}

.detail-counter{
    position:absolute;
    right:12px;
    top:12px;
    background:rgba(0,0,0,.68);
    color:white;
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
}

.detail-thumbnails{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px 0;
}

.detail-thumbnails .thumbnail{
    width:72px;
    height:58px;
}

.detail-description{
    color:#4f5c54;
    line-height:1.6;
    white-space:pre-wrap;
}

.detail-actions{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:18px;
}

.reaction-group{
    display:flex;
    gap:8px;
}

.reaction-btn{
    border:1px solid var(--border);
    background:white;
    padding:9px 13px;
    border-radius:10px;
    font-weight:800;
}

.reaction-btn.selected{
    border-color:var(--green);
    background:var(--green-light);
    color:var(--green-dark);
}

/* =========================================================
   FULLSCREEN IMAGE VIEWER
========================================================= */

.viewer{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.94);
    align-items:center;
    justify-content:center;
}

.viewer.show{
    display:flex;
}

.viewer img{
    max-width:94vw;
    max-height:90vh;
    object-fit:contain;
}

.viewer-close{
    position:absolute;
    right:20px;
    top:18px;
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:white;
    font-size:25px;
}

.viewer-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    color:white;
    font-size:25px;
}

.viewer-arrow.prev{
    left:18px;
}

.viewer-arrow.next{
    right:18px;
}

/* =========================================================
   POST PROPERTY
========================================================= */

.post-section{
    max-width:1200px;
    margin:0 auto 40px;
    padding:0 18px;
}

.post-card{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    box-shadow:var(--shadow);
}

.post-card h2{
    margin-top:0;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:13px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1 / -1;
}

.form-group label{
    font-weight:700;
    font-size:14px;
}

.form-group input,
.form-group select,
.form-group textarea{
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    outline:none;
    background:white;
}

.form-group textarea{
    min-height:110px;
    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--green);
}

.photo-preview{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:8px;
}

.preview-item{
    width:90px;
    height:75px;
    border-radius:9px;
    overflow:hidden;
    border:1px solid var(--border);
}

.preview-item img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.submit-row{
    margin-top:16px;
    display:flex;
    justify-content:flex-end;
}

.submit-btn{
    border:0;
    background:var(--green);
    color:white;
    padding:12px 20px;
    border-radius:10px;
    font-weight:800;
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#17251d;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    z-index:1500;
    opacity:0;
    pointer-events:none;
    transition:.25s ease;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    .property-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

}

@media(max-width:620px){

    .hero h1{
        font-size:26px;
    }

    .property-grid{
        grid-template-columns:1fr;
    }

    .card-main-image{
        height:240px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .search-row{
        flex-direction:column;
    }

    .modal{
        padding:8px;
    }

    .modal-box{
        max-height:96vh;
        border-radius:16px;
    }

    .modal-content{
        padding:16px;
    }

    .detail-main img{
        height:50vh;
    }

}

</style>

</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <div class="logo">
            LosOja
        </div>

        <a
            href="index.html"
            class="back-btn"
        >
            ← Back
        </a>

    </div>

</header>


<section class="hero">

    <h1>
        Find Your Next Property
    </h1>

    <p>
        Browse houses, apartments, land and commercial properties available on LosOja.
    </p>

</section>


<section class="filters-wrap">

    <div class="search-row">

        <input
            id="searchInput"
            type="search"
            placeholder="Search by title, location or property type..."
            autocomplete="off"
        >

    </div>


    <div class="filter-row">

        <button
            type="button"
            class="filter-btn active"
            data-filter="all"
        >
            All
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="available"
        >
            Available
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="for sale"
        >
            For Sale
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="for rent"
        >
            For Rent
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="sold"
        >
            Sold
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="rented"
        >
            Rented
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="house"
        >
            Houses
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="apartment"
        >
            Apartments
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="land"
        >
            Land
        </button>

        <button
            type="button"
            class="filter-btn"
            data-filter="commercial"
        >
            Commercial
        </button>

    </div>

</section>


<main class="main">

    <div class="section-title">

        <h2>
            Properties
        </h2>

        <span
            id="propertyCount"
            class="property-count"
        >
            Loading...
        </span>

    </div>


    <div
        id="propertyGrid"
        class="property-grid"
    ></div>

</main>


<section class="post-section">

    <div class="post-card">

        <h2>
            Post a Property
        </h2>

        <p class="location">
            List your property on LosOja.
        </p>


        <form id="propertyForm">

            <div class="form-grid">

                <div class="form-group">

                    <label for="propertyTitle">
                        Property Title
                    </label>

                    <input
                        id="propertyTitle"
                        required
                        placeholder="e.g. 3 Bedroom House"
                    >

                </div>


                <div class="form-group">

                    <label for="propertyType">
                        Property Type
                    </label>

                    <select
                        id="propertyType"
                        required
                    >

                        <option value="">
                            Select type
                        </option>

                        <option value="house">
                            House
                        </option>

                        <option value="apartment">
                            Apartment
                        </option>

                        <option value="land">
                            Land
                        </option>

                        <option value="commercial">
                            Commercial
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="listingType">
                        Listing Type
                    </label>

                    <select
                        id="listingType"
                        required
                    >

                        <option value="">
                            Select listing type
                        </option>

                        <option value="For Sale">
                            For Sale
                        </option>

                        <option value="For Rent">
                            For Rent
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="propertyPrice">
                        Price
                    </label>

                    <input
                        id="propertyPrice"
                        type="number"
                        min="0"
                        step="1"
                        required
                        placeholder="250000"
                    >

                </div>


                <div class="form-group full">

                    <label for="propertyLocation">
                        Location
                    </label>

                    <input
                        id="propertyLocation"
                        required
                        placeholder="e.g. Lekki, Lagos"
                    >

                </div>


                <div class="form-group full">

                    <label for="propertyDescription">
                        Description
                    </label>

                    <textarea
                        id="propertyDescription"
                        placeholder="Describe the property..."
                    ></textarea>

                </div>


                <div class="form-group full">

                    <label for="propertyImages">
                        Property Photos
                    </label>

                    <input
                        id="propertyImages"
                        type="file"
                        accept="image/jpeg,image/jpg,image/png,image/webp,image/gif"
                        multiple
                    >

                    <div
                        id="photoPreview"
                        class="photo-preview"
                    ></div>

                </div>

            </div>


            <div class="submit-row">

                <button
                    id="submitPropertyBtn"
                    type="submit"
                    class="submit-btn"
                >
                    Publish Property
                </button>

            </div>

        </form>

    </div>

</section>


<!-- =========================================================
     PROPERTY DETAIL MODAL
========================================================= -->

<div
    id="detailModal"
    class="modal"
>

    <div class="modal-box">

        <button
            type="button"
            class="modal-close"
            onclick="closeDetailModal()"
            aria-label="Close"
        >
            ×
        </button>

        <div
            id="detailContent"
            class="modal-content"
        ></div>

    </div>

</div>


<!-- =========================================================
     FULLSCREEN IMAGE VIEWER
========================================================= -->

<div
    id="imageViewer"
    class="viewer"
>

    <button
        type="button"
        class="viewer-close"
        onclick="closeImageViewer()"
        aria-label="Close image"
    >
        ×
    </button>

    <button
        type="button"
        class="viewer-arrow prev"
        onclick="viewerPrevious()"
        aria-label="Previous image"
    >
        ‹
    </button>

    <img
        id="viewerImage"
        src=""
        alt="Property photo"
    >

    <button
        type="button"
        class="viewer-arrow next"
        onclick="viewerNext()"
        aria-label="Next image"
    >
        ›
    </button>

</div>


<div
    id="toast"
    class="toast"
></div>


<script src="auth.js"></script>

"use strict";


/* =========================================================
   SUPABASE CONFIG

const SUPABASE_URL =
    "https://ycxshwgeebskdozmornh.supabase.co";

let allProperties = [];

/* =========================================================

function publicHeaders(){

        "apikey": SUPABASE_KEY,

        "Authorization":
            "Bearer " + SUPABASE_KEY,

        "Content-Type":
            "application/json"

    };

}


function authHeaders(){

    const token =
        typeof window.getSupabaseAccessToken === "function"
            ? window.getSupabaseAccessToken()
            : null;

    return {

        "apikey": SUPABASE_KEY,

        "Authorization":
            "Bearer " + (token || SUPABASE_KEY),

    };

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        }, 3200);

}


/* =========================================================
   AUTH
========================================================= */

async function getAuthenticatedUser(){

    try{

        if(
            typeof window.getCurrentUser === "function"
        ){

            const user =

/* =========================================================
   FORMATTERS
========================================================= */

function formatMoney(value){

    const amount =
        Number(value || 0);

    return "₦" +
        amount.toLocaleString(
            "en-NG",
            {
                maximumFractionDigits:2
            }
        );

}


function formatPropertyType(value){

    const type =
        String(value || "")
            .trim()
            .toLowerCase();

    const labels = {

        house:"House",

        apartment:"Apartment",

        land:"Land",

        commercial:"Commercial",

        property:"Property"

    };

    return labels[type] ||
        (
            type
                ? type.charAt(0).toUpperCase() +
                  type.slice(1)
                : "Property"
        );

}


function formatListingType(value){

    const type =
        String(value || "")
            .trim()
            .toLowerCase();

    if(type.includes("rent")){

        return "For Rent";

    }

    return "For Sale";

}


function formatStatus(value){

    const status =
        String(value || "available")
            .trim()
            .toLowerCase();

    if(status === "sold"){

        return "Sold";

    }

    if(status === "rented"){

        return "Rented";

    }

    return "Available";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   IMAGE HELPERS
========================================================= */

function placeholderImage(){

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="800"
                 height="500"
                 viewBox="0 0 800 500">
                <rect width="800" height="500" fill="#eaf0ec"/>
                <text
                    x="400"
                    y="250"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    font-family="Arial"
                    font-size="34"
                    fill="#68756e">
                    LosOja Property
                </text>
            </svg>
        `);

}


function getPropertyImages(property){

    const images =
        Array.isArray(property._images)
            ? property._images
            : [];

    const valid =
        images
            .map(item => {

                if(typeof item === "string"){

                    return {
                        image_url:item,
                        sort_order:0
                    };

                }

                return item;

            })
            .filter(item =>
                item &&
                item.image_url
            )
            .sort(
                (a,b) =>
                    Number(a.sort_order || 0) -
                    Number(b.sort_order || 0)
            );

    if(valid.length){

        return valid;

    }

    if(property.image_url){

        return [

            {
                image_url:
                    property.image_url,

                sort_order:0

            }

        ];

    }

    return [

        {
            image_url:
                placeholderImage(),

            sort_order:0

        }

    ];

}

   LOAD PROPERTIES
========================================================= */

async function loadProperties(){

    const grid =
        document.getElementById(
            "propertyGrid"
        );

    grid.innerHTML = `
        <div class="center-message">
            Loading properties...
        </div>
    `;

    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/property_listings" +
            "?select=*" +
            "&order=created_at.desc";

        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    headers:publicHeaders()
                }
            );

        const text =
            await response.text();

        let data;

        try{

            data =
                text
                    ? JSON.parse(text)
                    : [];

        }catch(error){

            throw new Error(
                "Supabase returned an invalid response."
            );

        }


        if(!response.ok){

            const message =
                data?.message ||
                data?.hint ||
                "Unable to load properties.";

            throw new Error(message);

        }


        allProperties =
            Array.isArray(data)
                ? data
                : [];


        await loadPropertyImages();


        applyFilters();


    }catch(error){

        console.error(
            "Property loading error:",
            error
        );

        grid.innerHTML = `
            <div class="center-message error-message">
                <strong>
                    Unable to load properties.
                </strong>

                <br><br>

                ${escapeHtml(error.message)}

                <br>

                <button
                    type="button"
                    class="retry-btn"
                    onclick="loadProperties()"
                >
                    Try Again
                </button>
            </div>
        `;

        document.getElementById(
            "propertyCount"
        ).textContent = "Unable to load";

    }

}


/* =========================================================
   LOAD ALL PROPERTY IMAGES
========================================================= */

async function loadPropertyImages(){

    allProperties.forEach(property => {

        property._images = [];

    });


    if(!allProperties.length){

        return;

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/property_images" +
                "?select=property_id,image_url,sort_order" +
                "&order=property_id.asc,sort_order.asc",

                {
                    method:"GET",
                    headers:publicHeaders()
                }

            );


        if(!response.ok){

            console.warn(
                "Could not load property images."
            );

            return;

        }


        const images =
            await response.json();


        const imageMap = {};


        images.forEach(image => {

            if(!image.property_id){

                return;

            }


            if(!imageMap[image.property_id]){

                imageMap[image.property_id] = [];

            }


            imageMap[image.property_id].push({

                image_url:
                    image.image_url,

                sort_order:
                    Number(
                        image.sort_order || 0
                    )

            });

        });


        Object.keys(imageMap).forEach(propertyId => {

            imageMap[propertyId].sort(
                (a,b) =>
                    a.sort_order -
                    b.sort_order
            );

        });


        allProperties.forEach(property => {

            property._images =
                imageMap[property.id] || [];

        });


    }catch(error){

        console.warn(
            "Property image loading error:",
            error
        );

    }

}

                ).toLowerCase();

                String(
                    property.status ||
                    "available"
                ).toLowerCase();


            const matchesSearch =

                title.includes(search) ||

/* =========================================================
   CARD IMAGE CONTROLS
========================================================= */

function setCardImage(
    propertyIndex,
    imageIndex
){

    const property =
        filteredProperties[propertyIndex];

    if(!property){

        return;

    }


    const images =
        getPropertyImages(
            property
        );


    if(
        imageIndex < 0 ||
        imageIndex >= images.length
    ){

        return;

    }


    const main =
        document.getElementById(
            "card-main-" +
            propertyIndex
        );


    const counter =
        document.getElementById(
            "card-counter-" +
            propertyIndex
        );


    const thumbnails =
        document.querySelectorAll(
            "#card-thumbnails-" +
            propertyIndex +
            " .thumbnail"
        );


    if(main){

        main.src =
            images[imageIndex].image_url;

        main.onerror =
            function(){

                this.src =
                    placeholderImage();

            };

    }


    if(counter){

        counter.textContent =
            (
                imageIndex + 1
            ) +
            " / " +
            images.length;

    }


    thumbnails.forEach(
        (thumbnail,index) => {

            thumbnail.classList.toggle(
                "active",
                index === imageIndex
            );

        }
    );

}


function changeCardImage(
    propertyIndex,
    direction
){

    const property =
        filteredProperties[propertyIndex];

    if(!property){

        return;

    }


    const images =
        getPropertyImages(
            property
        );


    const main =
        document.getElementById(
            "card-main-" +
            propertyIndex
        );


    let currentIndex = 0;


    if(main){

        const currentSrc =
            main.getAttribute("src");


        const foundIndex =
            images.findIndex(
                image =>
                    image.image_url ===
                    currentSrc
            );


        if(foundIndex >= 0){

            currentIndex =
                foundIndex;

        }

    }


    let nextIndex =
        currentIndex + direction;


    if(nextIndex < 0){

        nextIndex =
            images.length - 1;

    }


    if(nextIndex >= images.length){

        nextIndex = 0;

    }


    setCardImage(
        propertyIndex,
        nextIndex
    );

}

async function loadCurrentReaction(){

    if(!currentDetailProperty){

        return;

    }


    const user =
        await getAuthenticatedUser();


    const likeBtn =
        document.getElementById(
            "likeBtn"
        );

    const dislikeBtn =
        document.getElementById(
            "dislikeBtn"
        );


    const ownerActions =
        document.getElementById(
            "ownerActions"
        );


    if(!user){

        if(ownerActions){

            ownerActions.style.display =
                "none";

        }

        return;

    }


    if(
        currentDetailProperty.user_id &&
        currentDetailProperty.user_id ===
        user.id
    ){

        if(ownerActions){

            ownerActions.style.display =
                "block";

        }

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/property_reactions" +
                "?select=reaction" +
                "&property_id=eq." +
                encodeURIComponent(
                    currentDetailProperty.id
                ) +
                "&user_id=eq." +
                encodeURIComponent(
                    user.id
                ) +
                "&limit=1",

                {
                    method:"GET",
                    headers:authHeaders()
                }

            );


        if(!response.ok){

            return;

        }


        const rows =
            await response.json();


        if(!rows.length){

            return;

        }


        const reaction =
            rows[0].reaction;


        if(
            reaction === "like" &&
            likeBtn
        ){

            likeBtn.classList.add(
                "selected"
            );

        }


        if(
            reaction === "dislike" &&
            dislikeBtn
        ){

            dislikeBtn.classList.add(
                "selected"
            );

        }

    }catch(error){

        console.warn(
            "Could not load reaction:",
            error
        );

    }

}


async function reactToProperty(
    reaction
){

    if(!currentDetailProperty){

        return;

    }


    const user =
        await getAuthenticatedUser();


    if(!user){

        showToast(
            "Please log in to react to a property."
        );

        return;

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/property_reactions" +
                "?on_conflict=property_id,user_id",

                {
                    method:"POST",

                    headers:{
                        ...authHeaders(),
                        "Prefer":
                            "resolution=merge-duplicates,return=minimal"
                    },

                    body:JSON.stringify({

                        property_id:
                            currentDetailProperty.id,

                        user_id:
                            user.id,

                        reaction:
                            reaction

                    })

                }

            );


        if(!response.ok){

            const text =
                await response.text();

            throw new Error(
                text ||
                "Could not save reaction."
            );

        }


        const likeBtn =
            document.getElementById(
                "likeBtn"
            );

        const dislikeBtn =
            document.getElementById(
                "dislikeBtn"
            );


        if(likeBtn){

            likeBtn.classList.toggle(
                "selected",
                reaction === "like"
            );

        }


        if(dislikeBtn){

            dislikeBtn.classList.toggle(
                "selected",
                reaction === "dislike"
            );

        }


        showToast(
            reaction === "like"
                ? "You liked this property."
                : "You disliked this property."
        );


    }catch(error){

        console.error(
            "Reaction error:",
            error
        );

        showToast(
            "Unable to save your reaction."
        );

    }

}


/* =========================================================
   OWNER STATUS
========================================================= */

async function markPropertyStatus(
    status
){

    if(!currentDetailProperty){

        return;

    }


    const user =
        await getAuthenticatedUser();


    if(!user){

        showToast(
            "Please log in first."
        );

        return;

    }


    if(
        currentDetailProperty.user_id !==
        user.id
    ){

        showToast(
            "Only the property owner can change this status."
        );

        return;

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/property_listings" +
                "?id=eq." +
                encodeURIComponent(
                    currentDetailProperty.id
                ),

                {
                    method:"PATCH",

                    headers:{
                        ...authHeaders(),
                        "Prefer":
                            "return=representation"
                    },

                    body:JSON.stringify({
                        status:status
                    })

                }

            );


        if(!response.ok){

            const text =
                await response.text();

            throw new Error(
                text ||
                "Could not update property."
            );

        }


        const updated =
            await response.json();


        if(
            Array.isArray(updated) &&
            updated[0]
        ){

            currentDetailProperty =
                updated[0];

        }else{

            currentDetailProperty.status =
                status;

        }


        const index =
            allProperties.findIndex(
                property =>
                    property.id ===
                    currentDetailProperty.id
            );


        if(index >= 0){

            allProperties[index] =
                currentDetailProperty;

        }


        showToast(
            "Property status updated."
        );


        renderDetailModal();

        applyFilters();


    }catch(error){

        console.error(
            "Status update error:",
            error
        );

        showToast(
            "Unable to update property. Check the property owner permissions."
        );

    }

}


/* =========================================================
   DELETE PROPERTY
========================================================= */

async function deleteCurrentProperty(){

    if(!currentDetailProperty){

        return;

    }


    const user =
        await getAuthenticatedUser();


    if(!user){

        showToast(
            "Please log in first."
        );

        return;

    }


    if(
        currentDetailProperty.user_id !==
        user.id
    ){

        showToast(
            "Only the property owner can delete this property."
        );

        return;

    }


    const confirmed =
        window.confirm(
            "Delete this property from LosOja?"
        );


    if(!confirmed){

        return;

    }


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/property_listings" +
                "?id=eq." +
                encodeURIComponent(
                    currentDetailProperty.id
                ),

                {
                    method:"DELETE",

                    headers:{
                        ...authHeaders(),
                        "Prefer":
                            "return=minimal"
                    }

                }

            );


        if(!response.ok){

            const text =
                await response.text();

            throw new Error(
                text ||
                "Could not delete property."
            );

        }


        allProperties =
            allProperties.filter(
                property =>
                    property.id !==
                    currentDetailProperty.id
            );


        closeDetailModal();

        applyFilters();

        showToast(
            "Property deleted."
        );


    }catch(error){

        console.error(
            "Delete property error:",
            error
        );

        showToast(
            "Unable to delete property."
        );

    }

}


/* =========================================================
   PHOTO PREVIEW
========================================================= */

document
    .getElementById("propertyImages")
    .addEventListener(
        "change",
        function(){

            const preview =
                document.getElementById(
                    "photoPreview"
                );


            preview.innerHTML = "";


            const files =
                Array.from(
                    this.files || []
                );


            files.forEach(file => {

                if(
                    !file.type.startsWith(
                        "image/"
                    )
                ){

                    return;

                }


                const url =
                    URL.createObjectURL(
                        file
                    );


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "preview-item";


                const image =
                    document.createElement(
                        "img"
                    );


                image.src = url;

                image.alt =
                    "Property photo preview";


                item.appendChild(
                    image
                );


                preview.appendChild(
                    item
                );

            });

        }
    );


/* =========================================================
   UPLOAD PROPERTY IMAGE
========================================================= */

async function uploadPropertyImage(
    file,
    propertyId,
    userId,
    index
){

    const extension =
        (
            file.name.split(".").pop() ||
            "jpg"
        ).toLowerCase();


    const filePath =
        "properties/" +
        propertyId +
        "_" +
        Date.now() +
        "_" +
        index +
        "." +
        extension;


    const uploadResponse =
        await fetch(

            SUPABASE_URL +
            "/storage/v1/object/" +
            PROPERTY_BUCKET +
            "/" +
            filePath,

            {
                method:"POST",

                headers:{
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        (
                            window.getSupabaseAccessToken
                                ? window.getSupabaseAccessToken()
                                : SUPABASE_KEY
                        ),

                    "Content-Type":
                        file.type,

                    "x-upsert":
                        "false"
                },

                body:file

            }

        );


    if(!uploadResponse.ok){

        const text =
            await uploadResponse.text();

        throw new Error(
            text ||
            "Image upload failed."
        );

    }


    const publicUrl =
        SUPABASE_URL +
        "/storage/v1/object/public/" +
        PROPERTY_BUCKET +
        "/" +
        filePath;


    return {

        property_id:
            propertyId,

        user_id:
            userId,

        image_url:
            publicUrl,

        sort_order:
            index

    };

}


/* =========================================================
   PUBLISH PROPERTY
========================================================= */

document
    .getElementById("propertyForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const user =
                await getAuthenticatedUser();


            if(!user){

                showToast(
                    "Please log in before posting a property."
                );

                return;

            }


            const submitButton =
                document.getElementById(
                    "submitPropertyBtn"
                );


            submitButton.disabled =
                true;

            submitButton.textContent =
                "Publishing...";


            try{

                const title =
                    document
                        .getElementById(
                            "propertyTitle"
                        )
                        .value
                        .trim();


                const propertyType =
                    document
                        .getElementById(
                            "propertyType"
                        )
                        .value;


                const listingType =
                    document
                        .getElementById(
                            "listingType"
                        )
                        .value;


                const price =
                    Number(
                        document
                            .getElementById(
                                "propertyPrice"
                            )
                            .value
                    );


                const location =
                    document
                        .getElementById(
                            "propertyLocation"
                        )
                        .value
                        .trim();


                const description =
                    document
                        .getElementById(
                            "propertyDescription"
                        )
                        .value
                        .trim();


                const imageInput =
                    document.getElementById(
                        "propertyImages"
                    );


                const files =
                    Array.from(
                        imageInput.files || []
                    );


                if(
                    files.length > 10
                ){

                    throw new Error(
                        "You can upload up to 10 property photos."
                    );

                }


                for(const file of files){

                    if(
                        file.size >
                        5 * 1024 * 1024
                    ){

                        throw new Error(
                            file.name +
                            " is larger than 5MB."
                        );

                    }

                }


                const propertyPayload = {

                    user_id:
                        user.id,

                    title:
                        title,

                    property_type:
                        propertyType,

                    listing_type:
                        listingType,

                    location:
                        location,

                    price:
                        price,

                    description:
                        description,

                    status:
                        "available"

                };


                const propertyResponse =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/property_listings",

                        {
                            method:"POST",

                            headers:{
                                ...authHeaders(),
                                "Prefer":
                                    "return=representation"
                            },

                            body:
                                JSON.stringify(
                                    propertyPayload
                                )

                        }

                    );


                const propertyText =
                    await propertyResponse.text();


                let propertyData;


                try{

                    propertyData =
                        propertyText
                            ? JSON.parse(
                                propertyText
                            )
                            : [];

                }catch(error){

                    propertyData = [];

                }


                if(
                    !propertyResponse.ok
                ){

                    throw new Error(
                        propertyData?.message ||
                        propertyData?.hint ||
                        propertyText ||
                        "Could not create property."
                    );

                }


                const property =
                    Array.isArray(
                        propertyData
                    )
                        ? propertyData[0]
                        : propertyData;


                if(
                    !property ||
                    !property.id
                ){

                    throw new Error(
                        "Property was created but its ID was not returned."
                    );

                }


                /* -----------------------------------------
                   UPLOAD PHOTOS
                ----------------------------------------- */

                if(files.length){

                    submitButton.textContent =
                        "Uploading photos...";


                    const uploadedImages = [];


                    for(
                        let index = 0;
                        index < files.length;
                        index++
                    ){

                        const imageRow =
                            await uploadPropertyImage(
                                files[index],
                                property.id,
                                user.id,
                                index
                            );


                        uploadedImages.push(
                            imageRow
                        );

                    }


                    if(
                        uploadedImages.length
                    ){

                        const imageResponse =
                            await fetch(

                                SUPABASE_URL +
                                "/rest/v1/property_images",

                                {
                                    method:"POST",

                                    headers:{
                                        ...authHeaders(),
                                        "Prefer":
                                            "return=minimal"
                                    },

                                    body:
                                        JSON.stringify(
                                            uploadedImages
                                        )

                                }

                            );


                        if(
                            !imageResponse.ok
                        ){

                            const imageError =
                                await imageResponse.text();


                            console.error(
                                "Property image database error:",
                                imageError
                            );

                            showToast(
                                "Property posted, but some photo records could not be saved."
                            );

                        }

                    }

                }


                showToast(
                    "Property published successfully."
                );


                document
                    .getElementById(
                        "propertyForm"
                    )
                    .reset();


                document
                    .getElementById(
                        "photoPreview"
                    )
                    .innerHTML = "";


                await loadProperties();


                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });


            }catch(error){

                console.error(
                    "Publish property error:",
                    error
                );

                showToast(
                    error.message ||
                    "Unable to publish property."
                );

            }finally{

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Publish Property";

            }

        }
    );
