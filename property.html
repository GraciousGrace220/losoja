<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LosOja Property</title>

<meta
    name="description"
    content="Find homes, apartments, land and commercial property on LosOja."
>

<style>

:root{
    --green:#087a3e;
    --green-dark:#055c2e;
    --green-light:#eef8f2;
    --accent:#ffb703;
    --text:#17231c;
    --muted:#6b756f;
    --border:#e1e7e3;
    --white:#ffffff;
    --danger:#d93025;
    --shadow:0 8px 25px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f9f8;
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:#fff;
    border-bottom:1px solid var(--border);
}

.topbar-inner{
    max-width:1200px;
    margin:auto;
    min-height:68px;
    padding:12px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.brand{
    color:var(--green);
    font-size:24px;
    font-weight:900;
    letter-spacing:-.5px;
}

.header-actions{
    display:flex;
    gap:8px;
    align-items:center;
}

.back-btn,
.post-btn{
    border:0;
    border-radius:10px;
    padding:11px 15px;
    font-weight:700;
}

.back-btn{
    background:#f0f4f1;
    color:var(--text);
}

.post-btn{
    background:var(--green);
    color:#fff;
}

.post-btn:hover{
    background:var(--green-dark);
}

/* =========================================================
   HERO
========================================================= */

.hero{
    background:
        linear-gradient(
            135deg,
            rgba(8,122,62,.98),
            rgba(5,92,46,.94)
        );
    color:#fff;
    padding:42px 18px;
}

.hero-inner{
    max-width:1200px;
    margin:auto;
}

.hero h1{
    margin:0 0 10px;
    font-size:clamp(30px,5vw,48px);
    line-height:1.05;
}

.hero p{
    margin:0;
    max-width:650px;
    color:rgba(255,255,255,.88);
    line-height:1.6;
}

/* =========================================================
   MAIN
========================================================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:24px 18px 60px;
}

/* =========================================================
   SEARCH / FILTERS
========================================================= */

.search-box{
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
}

.search-input{
    width:100%;
    border:1px solid var(--border);
    border-radius:11px;
    padding:14px;
    outline:none;
}

.search-input:focus{
    border-color:var(--green);
}

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:3px 0 4px;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter-btn{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    border-radius:999px;
    padding:10px 15px;
    font-weight:700;
}

.filter-btn.active{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
}

/* =========================================================
   SECTION HEADER
========================================================= */

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:26px 0 16px;
}

.section-head h2{
    margin:0;
    font-size:22px;
}

.property-count{
    color:var(--muted);
    font-size:14px;
}

/* =========================================================
   PROPERTY GRID
========================================================= */

.property-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
}

.property-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.05);
    min-width:0;
}

.property-card:hover{
    box-shadow:var(--shadow);
}

/* =========================================================
   CARD GALLERY
========================================================= */

.card-gallery{
    position:relative;
    height:230px;
    background:#eaf0ec;
    overflow:hidden;
    touch-action:pan-y;
    user-select:none;
    -webkit-user-select:none;
    cursor:grab;
}

.card-gallery.dragging{
    cursor:grabbing;
}

.card-gallery img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    pointer-events:none;
    -webkit-user-drag:none;
}

.no-image{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    color:#93a098;
}

.gallery-count{
    position:absolute;
    left:10px;
    bottom:10px;
    z-index:3;
    padding:5px 9px;
    border-radius:999px;
    background:rgba(0,0,0,.62);
    color:#fff;
    font-size:12px;
    font-weight:700;
}

.gallery-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.58);
    color:#fff;
    font-size:21px;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
}

.gallery-arrow:hover{
    background:rgba(0,0,0,.78);
}

.gallery-arrow.left{
    left:10px;
}

.gallery-arrow.right{
    right:10px;
}

/* =========================================================
   PHOTO THUMBNAILS
========================================================= */

.photo-strip{
    display:flex;
    gap:5px;
    overflow-x:auto;
    padding:7px;
    background:#fff;
    scrollbar-width:none;
}

.photo-strip::-webkit-scrollbar{
    display:none;
}

.photo-thumb{
    width:48px;
    height:38px;
    flex:0 0 48px;
    border-radius:6px;
    overflow:hidden;
    border:2px solid transparent;
    padding:0;
    background:#eee;
}

.photo-thumb.active{
    border-color:var(--green);
}

.photo-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================================================
   CARD CONTENT
========================================================= */

.property-content{
    padding:15px;
}

.property-badge{
    display:inline-flex;
    align-items:center;
    max-width:100%;
    background:var(--green-light);
    color:var(--green-dark);
    border-radius:999px;
    padding:6px 9px;
    font-size:12px;
    font-weight:800;
    margin-bottom:9px;
}

.property-badge.rent{
    background:#fff4d8;
    color:#7b5600;
}

.property-title{
    margin:0 0 7px;
    font-size:18px;
    line-height:1.25;
}

.property-location{
    color:var(--muted);
    font-size:14px;
    margin-bottom:9px;
}

.property-price{
    color:var(--green);
    font-size:19px;
    font-weight:900;
    margin-bottom:9px;
}

.property-description{
    color:#59645d;
    font-size:14px;
    line-height:1.5;
    min-height:42px;
}

.card-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.view-btn,
.contact-btn{
    flex:1;
    border:0;
    border-radius:9px;
    padding:11px 9px;
    font-weight:800;
}

.view-btn{
    background:var(--green);
    color:#fff;
}

.contact-btn{
    background:#eef2ef;
    color:var(--text);
}

/* =========================================================
   REACTIONS
========================================================= */

.reactions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.reaction-btn{
    border:1px solid var(--border);
    background:#fff;
    border-radius:999px;
    padding:7px 11px;
    font-size:13px;
    font-weight:700;
    color:#536057;
}

.reaction-btn.active{
    background:var(--green-light);
    border-color:var(--green);
    color:var(--green-dark);
}

.reaction-btn.dislike.active{
    background:#fff0ef;
    border-color:#d93025;
    color:#a52018;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.loading,
.empty{
    grid-column:1/-1;
    text-align:center;
    padding:55px 20px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
    color:var(--muted);
}

.spinner{
    width:34px;
    height:34px;
    border:4px solid #dfe8e2;
    border-top-color:var(--green);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 14px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   MODALS
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(700px,100%);
    max-height:92vh;
    overflow:auto;
    background:#fff;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-header{
    position:sticky;
    top:0;
    z-index:4;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    background:#fff;
    padding:17px 18px;
    border-bottom:1px solid var(--border);
}

.modal-header h2{
    margin:0;
    font-size:20px;
}

.close-btn{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#eef2ef;
    font-size:20px;
}

.modal-body{
    padding:18px;
}

/* =========================================================
   DETAIL GALLERY
========================================================= */

.detail-gallery{
    position:relative;
    height:360px;
    background:#eaf0ec;
    border-radius:14px;
    overflow:hidden;
    touch-action:pan-y;
    user-select:none;
}

.detail-gallery img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
}

.detail-thumbs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:9px 0;
}

.detail-thumb{
    flex:0 0 62px;
    width:62px;
    height:48px;
    border:2px solid transparent;
    border-radius:7px;
    padding:0;
    overflow:hidden;
}

.detail-thumb.active{
    border-color:var(--green);
}

.detail-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.detail-info h3{
    margin:15px 0 7px;
    font-size:24px;
}

.detail-info p{
    line-height:1.6;
    color:#59645d;
}

.detail-price{
    color:var(--green);
    font-weight:900;
    font-size:24px;
}

/* =========================================================
   POST PROPERTY FORM
========================================================= */

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:800;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    outline:none;
    background:#fff;
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--green);
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.photo-help{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

.preview-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:10px;
}

.preview-item{
    position:relative;
    height:85px;
    border-radius:8px;
    overflow:hidden;
    background:#eef2ef;
}

.preview-item img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.submit-btn{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    background:var(--green);
    color:#fff;
    font-weight:900;
    margin-top:5px;
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================================================
   FULLSCREEN IMAGE
========================================================= */

.image-viewer{
    position:fixed;
    inset:0;
    z-index:4000;
    background:rgba(0,0,0,.94);
    display:none;
    align-items:center;
    justify-content:center;
}

.image-viewer.show{
    display:flex;
}

.viewer-image{
    max-width:94vw;
    max-height:88vh;
    object-fit:contain;
}

.viewer-close{
    position:absolute;
    top:18px;
    right:18px;
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:#fff;
    font-size:26px;
}

.viewer-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.15);
    color:#fff;
    font-size:28px;
}

.viewer-arrow.left{
    left:18px;
}

.viewer-arrow.right{
    right:18px;
}

.viewer-count{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.6);
    color:#fff;
    padding:7px 12px;
    border-radius:999px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    z-index:5000;
    background:#17231c;
    color:#fff;
    padding:12px 17px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

    .property-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

}

@media(max-width:620px){

    .topbar-inner{
        padding:10px 12px;
    }

    .brand{
        font-size:21px;
    }

    .back-btn,
    .post-btn{
        padding:9px 11px;
        font-size:13px;
    }

    .hero{
        padding:32px 15px;
    }

    .container{
        padding:18px 12px 45px;
    }

    .property-grid{
        grid-template-columns:1fr;
    }

    .card-gallery{
        height:245px;
    }

    .form-row{
        grid-template-columns:1fr;
    }

    .preview-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .detail-gallery{
        height:280px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="topbar">

    <div class="topbar-inner">

        <a
            href="index.html"
            class="brand"
        >
            LosOja
        </a>


        <div class="header-actions">

            <button
                type="button"
                class="back-btn"
                onclick="history.back()"
            >
                ← Back
            </button>


            <button
                type="button"
                class="post-btn"
                onclick="openPostModal()"
            >
                + Post Property
            </button>

        </div>

    </div>

</header>


<!-- =========================================================
     HERO
========================================================= -->

<section class="hero">

    <div class="hero-inner">

        <h1>
            Find Your Next Property
        </h1>

        <p>
            Browse homes, apartments, land and commercial
            properties from LosOja sellers across Nigeria.
        </p>

    </div>

</section>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">


    <!-- SEARCH -->

    <div class="search-box">

        <input
            id="propertySearch"
            class="search-input"
            type="search"
            placeholder="Search property, location or description..."
            autocomplete="off"
        >

        <div
            class="filters"
            style="margin-top:12px;"
        >

            <button
                class="filter-btn active"
                data-filter="all"
                type="button"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="sale"
                type="button"
            >
                For Sale
            </button>

            <button
                class="filter-btn"
                data-filter="rent"
                type="button"
            >
                For Rent
            </button>

            <button
                class="filter-btn"
                data-filter="house"
                type="button"
            >
                Houses
            </button>

            <button
                class="filter-btn"
                data-filter="apartment"
                type="button"
            >
                Apartments
            </button>

            <button
                class="filter-btn"
                data-filter="land"
                type="button"
            >
                Land
            </button>

            <button
                class="filter-btn"
                data-filter="commercial"
                type="button"
            >
                Commercial
            </button>

        </div>

    </div>


    <!-- SECTION HEADER -->

    <div class="section-head">

        <h2>
            Properties
        </h2>

        <span
            id="propertyCount"
            class="property-count"
        >
            Loading...
        </span>

    </div>


    <!-- PROPERTY GRID -->

    <div
        id="propertyGrid"
        class="property-grid"
    >

        <div class="loading">

            <div class="spinner"></div>

            Loading properties...

        </div>

    </div>


</main>


<!-- =========================================================
     PROPERTY DETAIL MODAL
========================================================= -->

<div
    id="detailModal"
    class="modal"
    onclick="closeModalOnBackdrop(event,'detailModal')"
>

    <div class="modal-card">

        <div class="modal-header">

            <h2>
                Property Details
            </h2>

            <button
                class="close-btn"
                type="button"
                onclick="closeModal('detailModal')"
            >
                ×
            </button>

        </div>


        <div
            id="detailBody"
            class="modal-body"
        ></div>

    </div>

</div>


<!-- =========================================================
     POST PROPERTY MODAL
========================================================= -->

<div
    id="postModal"
    class="modal"
    onclick="closeModalOnBackdrop(event,'postModal')"
>

    <div class="modal-card">

        <div class="modal-header">

            <h2>
                Post Property
            </h2>

            <button
                class="close-btn"
                type="button"
                onclick="closeModal('postModal')"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <form id="propertyForm">


                <div class="form-group">

                    <label for="propertyTitle">
                        Property Title
                    </label>

                    <input
                        id="propertyTitle"
                        type="text"
                        placeholder="e.g. 3 Bedroom House"
                        required
                    >

                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label for="propertyType">
                            Property Type
                        </label>

                        <select
                            id="propertyType"
                            required
                        >

                            <option value="">
                                Select type
                            </option>

                            <option value="house">
                                House
                            </option>

                            <option value="apartment">
                                Apartment
                            </option>

                            <option value="land">
                                Land
                            </option>

                            <option value="commercial">
                                Commercial
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="listingType">
                            Listing Type
                        </label>

                        <select
                            id="listingType"
                            required
                        >

                            <option value="sale">
                                For Sale
                            </option>

                            <option value="rent">
                                For Rent
                            </option>

                        </select>

                    </div>


                </div>


                <div class="form-row">


                    <div class="form-group">

                        <label for="propertyPrice">
                            Price (₦)
                        </label>

                        <input
                            id="propertyPrice"
                            type="number"
                            min="0"
                            step="1"
                            placeholder="250000"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="propertyLocation">
                            Location
                        </label>

                        <input
                            id="propertyLocation"
                            type="text"
                            placeholder="Lagos, Nigeria"
                            required
                        >

                    </div>


                </div>


                <div class="form-group">

                    <label for="propertyDescription">
                        Description
                    </label>

                    <textarea
                        id="propertyDescription"
                        placeholder="Describe the property..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="propertyPhotos">
                        Property Photos
                    </label>

                    <input
                        id="propertyPhotos"
                        type="file"
                        accept="image/jpeg,image/jpg,image/png,image/webp,image/gif"
                        multiple
                    >

                    <div class="photo-help">
                        Add multiple photos. LosOja can display and swipe
                        through all uploaded photos.
                    </div>


                    <div
                        id="photoPreview"
                        class="preview-grid"
                    ></div>

                </div>


                <button
                    id="publishButton"
                    class="submit-btn"
                    type="submit"
                >
                    Publish Property
                </button>


            </form>

        </div>

    </div>

</div>


<!-- =========================================================
     FULLSCREEN IMAGE VIEWER
========================================================= -->

<div
    id="imageViewer"
    class="image-viewer"
>

    <button
        class="viewer-close"
        type="button"
        onclick="closeImageViewer()"
    >
        ×
    </button>


    <button
        class="viewer-arrow left"
        type="button"
        onclick="moveViewerImage(-1)"
    >
        ‹
    </button>


    <img
        id="viewerImage"
        class="viewer-image"

/* =========================================================

function publicHeaders(){

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================

========================================================= */

function formatPropertyType(value){

    const type =
        String(value || "")

            .toLowerCase();


    const labels = {

        house:"House",

        apartment:"Apartment",

        land:"Land",

        commercial:"Commercial",

        property:"Property"

    };


    return labels[type] ||
        (
            type
                ? type.charAt(0).toUpperCase() +
                  type.slice(1)
                : "Property"
        );

}


function formatListingType(value){

    const type =
        String(value || "")
            .trim()
            .toLowerCase();


    if(
        type.includes("rent")
    ){

        return "For Rent";

    }


    return "For Sale";

}


function formatPrice(value){

async function loadPropertyImages(){

                "&property_id=in.(" +

                        publicHeaders()
                }
            );


        if(!response.ok){

            );

            return;

        }

    const type =
        String(
            property.property_type || ""
        ).toLowerCase();


    if(
        activeFilter === "sale"
    ){

        return listing.includes("sale");

    }


    if(
        activeFilter === "rent"
    ){

        return listing.includes("rent");

    }


    return type === activeFilter;

}

function propertyMatchesSearch(property){

    if(!search){

        property.location,

        property.description,

        property.property_type,

        property.listing_type

    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();


    return text.includes(search);

}

/* =========================================================
   CARD IMAGE
========================================================= */

function setCardImage(
    propertyId,
    index
){

    const property =
        allProperties.find(
            item =>
                String(item.id) ===
                String(propertyId)
        );


    if(!property){

        return;

    }


    const images =
        getPropertyImages(property);


    if(
        !images.length ||
        index < 0 ||
        index >= images.length
    ){

        return;

    }


    const gallery =
        document.getElementById(
            "gallery-" +
            propertyId
        );


    if(!gallery){

        return;

    }


    gallery.dataset.index =
        String(index);


    const image =
        gallery.querySelector("img");


    if(image){

        image.src =
            images[index];

    }


    updateCardGalleryCount(
        gallery,
        index,
        images.length
    );


    const card =
        gallery.closest(
            ".property-card"
        );


    if(card){

        card
            .querySelectorAll(
                ".photo-thumb"
            )
            .forEach(
                (thumb,thumbIndex) => {

                    thumb.classList.toggle(
                        "active",
                        thumbIndex === index
                    );

                }
            );

    }

}


/* =========================================================
   CARD IMAGE ARROWS
========================================================= */

function moveCardImage(
    propertyId,
    direction
){

    const property =
        allProperties.find(
            item =>
                String(item.id) ===
                String(propertyId)
        );


    if(!property){

        return;

    }


    const images =
        getPropertyImages(property);


    if(images.length < 2){

        return;

    }


    const gallery =
        document.getElementById(
            "gallery-" +
            propertyId
        );


    if(!gallery){

        return;

    }


    let index =
        Number(
            gallery.dataset.index || 0
        );


    index += direction;


    if(index < 0){

        index =
            images.length - 1;

    }


    if(index >= images.length){

        index = 0;

    }


    setCardImage(
        propertyId,
        index
    );

}


/* =========================================================
   CARD GALLERY COUNT
========================================================= */

function updateCardGalleryCount(
    gallery,
    index,
    total
){

    if(!gallery){

        return;

    }


    const count =
        gallery.querySelector(
            ".gallery-count"
        );


    if(count){

        count.textContent =
            (index + 1) +
            " / " +
            total;

    }

}


/* =========================================================
   MOUSE + TOUCH + POINTER SWIPE
========================================================= */

let pointerStartX = 0;
let pointerStartY = 0;
let pointerActive = false;
let pointerGallery = null;


document.addEventListener(
    "pointerdown",
    function(event){

        const gallery =
            event.target.closest(
                ".card-gallery"
            );


        if(!gallery){

            return;

        }


        if(
            !gallery.querySelector("img") ||
            !gallery.id.startsWith(
                "gallery-"
            )
        ){

            return;

        }


        pointerStartX =
            event.clientX;


        pointerStartY =
            event.clientY;


        pointerActive = true;

        pointerGallery =
            gallery;


        gallery.classList.add(
            "dragging"
        );


        try{

            gallery.setPointerCapture(
                event.pointerId
            );

        }catch(error){}

    }
);


document.addEventListener(
    "pointermove",
    function(event){

        if(
            !pointerActive ||
            !pointerGallery
        ){

            return;

        }


        const diffX =
            event.clientX -
            pointerStartX;


        const diffY =
            event.clientY -
            pointerStartY;


        if(
            Math.abs(diffX) >
            Math.abs(diffY)
        ){

            event.preventDefault();

        }

    },
    {
        passive:false
    }
);


document.addEventListener(
    "pointerup",
    function(event){

        if(
            !pointerActive ||
            !pointerGallery
        ){

            return;

        }


        const gallery =
            pointerGallery;


        const diffX =
            event.clientX -
            pointerStartX;


        const diffY =
            event.clientY -
            pointerStartY;


        gallery.classList.remove(
            "dragging"
        );


        if(
            Math.abs(diffX) >= 45 &&
            Math.abs(diffX) >
            Math.abs(diffY)
        ){

            const propertyId =
                gallery.id.replace(
                    "gallery-",
                    ""
                );


            if(diffX < 0){

                moveCardImage(
                    propertyId,
                    1
                );

            }else{

                moveCardImage(
                    propertyId,
                    -1
                );

            }

        }


        pointerActive = false;
        pointerGallery = null;
        pointerStartX = 0;
        pointerStartY = 0;

    }
);


document.addEventListener(
    "pointercancel",
    function(){

        if(pointerGallery){

            pointerGallery.classList.remove(
                "dragging"
            );

        }


        pointerActive = false;
        pointerGallery = null;

    }
);

    let index =
        viewerIndex +
        direction;


    if(index < 0){

        index =
            images.length - 1;

    }


    if(index >= images.length){

        index = 0;

    }


    setDetailImage(
        index
    );

}


/* =========================================================
   DETAIL POINTER SWIPE
========================================================= */

let detailStartX = 0;
let detailStartY = 0;
let detailDragging = false;


function enableDetailPointerSwipe(){

    const gallery =
        document.getElementById(
            "detailGallery"
        );


    if(!gallery){

        return;

    }


    gallery.onpointerdown =
        function(event){

            detailStartX =
                event.clientX;

            detailStartY =
                event.clientY;

            detailDragging = true;


            try{

                gallery.setPointerCapture(
                    event.pointerId
                );

            }catch(error){}

        };


    gallery.onpointerup =
        function(event){

            if(!detailDragging){

                return;

            }


            const diffX =
                event.clientX -
                detailStartX;


            const diffY =
                event.clientY -
                detailStartY;


            if(
                Math.abs(diffX) >= 45 &&
                Math.abs(diffX) >
                Math.abs(diffY)
            ){

                if(diffX < 0){

                    moveDetailImage(1);

                }else{

                    moveDetailImage(-1);

                }

            }


            detailDragging = false;

        };


    gallery.onpointercancel =
        function(){

            detailDragging = false;

        };

}


/* =========================================================
   REACT TO PROPERTY
   ONE VOTE PER USER
========================================================= */

async function reactToProperty(
    propertyId,
    reaction
){

    const auth =
        await getAuthDetails();


    if(
        !auth.user ||
        !auth.token
    ){

        showToast(
            "Please log in to react to a property."
        );

        return;

    }


    if(
        reaction !== "like" &&
        reaction !== "dislike"
    ){

        return;

    }


    const property =
        allProperties.find(
            item =>
                String(item.id) ===
                String(propertyId)
        );


    if(!property){

        return;

    }


    try{

        const existingResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/property_reactions" +
                "?select=id,reaction" +
                "&property_id=eq." +
                encodeURIComponent(
                    propertyId
                ) +
                "&user_id=eq." +
                encodeURIComponent(
                    auth.user.id
                ),
                {
                    headers:
                        authHeaders(
                            auth.token
                        )
                }
            );


        if(!existingResponse.ok){

            throw new Error(
                "Could not check your existing reaction."
            );

        }


        const existingRows =
            await existingResponse.json();


        const existing =
            existingRows[0] || null;


        /* SAME REACTION:
           DO NOTHING
        */

        if(
            existing &&
            existing.reaction === reaction
        ){

            showToast(
                "You already voted on this property."
            );

            return;

        }


        let likeCount =
            Number(
                property.like_count || 0
            );


        let dislikeCount =
            Number(
                property.dislike_count || 0
            );


        if(existing){

            /* CHANGE VOTE */

            if(
                existing.reaction === "like"
            ){

                likeCount =
                    Math.max(
                        0,
                        likeCount - 1
                    );

            }


            if(
                existing.reaction === "dislike"
            ){

                dislikeCount =
                    Math.max(
                        0,
                        dislikeCount - 1
                    );

            }


            if(reaction === "like"){

                likeCount++;

            }else{

                dislikeCount++;

            }


            const updateReaction =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/property_reactions" +
                    "?id=eq." +
                    encodeURIComponent(
                        existing.id
                    ),
                    {
                        method:"PATCH",
                        headers:
                            authHeaders(
                                auth.token
                            ),
                        body:
                            JSON.stringify({
                                reaction:
                                    reaction
                            })
                    }
                );


            if(!updateReaction.ok){

                throw new Error(
                    "Could not update your reaction."
                );

            }

        }else{

            /* FIRST VOTE */

            if(reaction === "like"){

                likeCount++;

            }else{

                dislikeCount++;

            }


            const insertReaction =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/property_reactions",
                    {
                        method:"POST",
                        headers:{
                            ...authHeaders(
                                auth.token
                            ),
                            "Prefer":
                                "return=minimal"
                        },
                        body:
                            JSON.stringify({
                                property_id:
                                    propertyId,
                                user_id:
                                    auth.user.id,
                                reaction:
                                    reaction
                            })
                    }
                );


            if(!insertReaction.ok){

                const errorText =
                    await insertReaction.text();

                throw new Error(
                    errorText ||
                    "Could not save your reaction."
                );

            }

        }


        /* UPDATE PROPERTY COUNTS */

        const updateProperty =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/property_listings" +
                "?id=eq." +
                encodeURIComponent(
                    propertyId
                ),
                {
                    method:"PATCH",
                    headers:{
                        ...authHeaders(
                            auth.token
                        ),
                        "Prefer":
                            "return=minimal"
                    },
                    body:
                        JSON.stringify({
                            like_count:
                                likeCount,
                            dislike_count:
                                dislikeCount
                        })
                }
            );


        if(!updateProperty.ok){

            throw new Error(
                "Reaction saved, but the property count could not be updated."
            );

        }


        property.like_count =
            likeCount;


        property.dislike_count =
            dislikeCount;


        propertyUserReactions[
            propertyId
        ] =
            reaction;


        renderProperties();


        if(
            document
                .getElementById(
                    "detailModal"
                )
                .classList.contains("show")
        ){

            openPropertyDetails(
                propertyId
            );

        }


    }catch(error){

        console.error(
            "Reaction error:",
            error
        );


        showToast(
            "Could not save your reaction. Please try again."
        );

    }

}

/* =========================================================
   PUBLISH PROPERTY
========================================================= */

async function publishProperty(
    event
){

    event.preventDefault();


    const button =
        document.getElementById(
            "publishButton"
        );


    button.disabled = true;

    button.textContent =
        "Publishing...";


    try{

        const auth =
            await getAuthDetails();


        if(
            !auth.user ||
            !auth.token
        ){

            throw new Error(
                "Please log in before posting a property."
            );

        }


        if(!auth.user.id){

            throw new Error(
                "Your account ID could not be found. Please log in again."
            );

        }


        const title =
            document.getElementById(
                "propertyTitle"
            ).value.trim();


        const propertyType =
            document.getElementById(
                "propertyType"
            ).value;


        const listingType =
            document.getElementById(
                "listingType"
            ).value;


        const price =
            Number(
                document.getElementById(
                    "propertyPrice"
                ).value
            );


        const location =
            document.getElementById(
                "propertyLocation"
            ).value.trim();


        const description =
            document.getElementById(
                "propertyDescription"
            ).value.trim();


        const photoInput =
            document.getElementById(
                "propertyPhotos"
            );


        if(!title){

            throw new Error(
                "Please enter a property title."
            );

        }


        if(!propertyType){

            throw new Error(
                "Please select a property type."
            );

        }


        if(!listingType){

            throw new Error(
                "Please select For Sale or For Rent."
            );

        }


        if(
            !Number.isFinite(price) ||
            price < 0
        ){

            throw new Error(
                "Please enter a valid price."
            );

        }


        if(!location){

            throw new Error(
                "Please enter the property location."
            );

        }


        /* =================================================
           CREATE PROPERTY
        ================================================= */

        const propertyPayload = {

            user_id:
                auth.user.id,

            title:
                title,

            property_type:
                propertyType,

            listing_type:
                listingType,

            price:
                price,

            location:
                location,

            description:
                description

        };


        const propertyResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/property_listings",
                {
                    method:"POST",
                    headers:{
                        ...authHeaders(
                            auth.token
                        ),
                        "Prefer":
                            "return=representation"
                    },
                    body:
                        JSON.stringify(
                            propertyPayload
                        )
                }
            );


        if(!propertyResponse.ok){

            const errorText =
                await propertyResponse.text();


            throw new Error(
                errorText ||
                "Property could not be published."
            );

        }


        const createdProperties =
            await propertyResponse.json();


        const property =
            createdProperties[0];


        if(!property){

            throw new Error(
                "Property was created but no property ID was returned."
            );

        }


        /* =================================================
           UPLOAD PHOTOS
        ================================================= */

        const files =
            photoInput.files
                ? Array.from(
                    photoInput.files
                )
                : [];


        const uploadedImages = [];


        for(
            let index = 0;
            index < files.length;
            index++
        ){

            const file =
                files[index];


            if(
                file.size >
                5 * 1024 * 1024
            ){

                throw new Error(
                    "Each property image must be 5MB or smaller."
                );

            }


            const allowedTypes = [

                "image/jpeg",

                "image/jpg",

                "image/png",

                "image/webp",

                "image/gif"

            ];


            if(
                !allowedTypes.includes(
                    file.type
                )
            ){

                throw new Error(
                    "Unsupported image format: " +
                    file.name
                );

            }


            const extension =
                (
                    file.name
                        .split(".")
                        .pop() ||
                    "jpg"
                )
                .toLowerCase();


            const randomId =
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .slice(2);


            const storagePath =
                auth.user.id +
                "/" +
                property.id +
                "/" +
                randomId +
                "." +
                extension;


            const uploadResponse =
                await fetch(
                    SUPABASE_URL +
                    "/storage/v1/object/" +
                    PROPERTY_BUCKET +
                    "/" +
                    storagePath,
                    {
                        method:"POST",
                        headers:{
                            "apikey":
                                SUPABASE_KEY,
                            "Authorization":
                                "Bearer " +
                                auth.token,
                            "Content-Type":
                                file.type,
                            "x-upsert":
                                "false"
                        },
                        body:file
                    }
                );


            if(!uploadResponse.ok){

                const uploadError =
                    await uploadResponse.text();


                throw new Error(
                    "Image upload failed: " +
                    uploadError
                );

            }


            const encodedPath =
                storagePath
                    .split("/")
                    .map(
                        part =>
                            encodeURIComponent(
                                part
                            )
                    )
                    .join("/");


            const publicUrl =
                SUPABASE_URL +
                "/storage/v1/object/public/" +
                PROPERTY_BUCKET +
                "/" +
                encodedPath;


            uploadedImages.push({

                property_id:
                    property.id,

                user_id:
                    auth.user.id,

                image_url:
                    publicUrl,

                sort_order:
                    index

            });

        }


        /* =================================================
           SAVE PHOTO RECORDS
        ================================================= */

        if(uploadedImages.length){

            const imageResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/property_images",
                    {
                        method:"POST",
                        headers:{
                            ...authHeaders(
                                auth.token
                            ),
                            "Prefer":
                                "return=minimal"
                        },
                        body:
                            JSON.stringify(
                                uploadedImages
                            )
                    }
                );


            if(!imageResponse.ok){

                const imageError =
                    await imageResponse.text();


                console.error(
                    "Image database insert failed:",
                    imageError
                );


                throw new Error(
                    "Photo records could not be saved: " +
                    imageError
                );

            }

        }


        /* =================================================
           SUCCESS
        ================================================= */

        closeModal(
            "postModal"
        );


        document
            .getElementById(
                "propertyForm"
            )
            .reset();


        document
            .getElementById(
                "photoPreview"
            )
            .innerHTML = "";


        showToast(
            "Property published successfully!"
        );


        await loadProperties();


    }catch(error){

        console.error(
            "Publish property error:",
            error
        );


        showToast(
            error.message ||
            "Could not publish property."
        );


    }finally{

        button.disabled = false;

        button.textContent =
            "Publish Property";

    }

}


document
    .getElementById(
        "propertyForm"
    )
    .addEventListener(
        "submit",
        publishProperty
    );

/* =========================================================
   FULLSCREEN VIEWER
========================================================= */

function openImageViewer(
    property,
    index
){

    viewerProperty =
        property;

    viewerIndex =
        index || 0;


    const images =
        getPropertyImages(
            property
        );


    if(!images.length){

        return;

    }


    const viewer =
        document.getElementById(
            "imageViewer"
        );


    viewer.classList.add(
        "show"
    );


    updateViewer();

}


function updateViewer(){

    if(!viewerProperty){

        return;

    }


    const images =
        getPropertyImages(
            viewerProperty
        );


    if(!images.length){

        return;

    }


    if(
        viewerIndex < 0
    ){

        viewerIndex =
            images.length - 1;

    }


    if(
        viewerIndex >= images.length
    ){

        viewerIndex = 0;

    }


    document.getElementById(
        "viewerImage"
    ).src =
        images[viewerIndex];


    document.getElementById(
        "viewerCount"
    ).textContent =
        (viewerIndex + 1) +
        " / " +
        images.length;

}


function moveViewerImage(
    direction
){

    if(!viewerProperty){

        return;

    }


    const images =
        getPropertyImages(
            viewerProperty
        );


    if(images.length < 2){

        return;

    }


    viewerIndex += direction;


    if(
        viewerIndex < 0
    ){

        viewerIndex =
            images.length - 1;

    }


    if(
        viewerIndex >= images.length
    ){

        viewerIndex = 0;

    }


    updateViewer();

}


function closeImageViewer(){

    document
        .getElementById(
            "imageViewer"
        )
        .classList.remove(
            "show"
        );

}
