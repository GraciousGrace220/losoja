<script>

(function () {

    "use strict";


    const SUPABASE_URL =
        "https://ycxshwgeebskdozmornh.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe";


    /*
    =========================================================
       PAYMENT SAFETY LOCK

       Prevents accidental duplicate submissions.

       IMPORTANT:
       We never automatically retry a bill payment.
    =========================================================
    */

    let paymentInProgress = false;

    let activePaymentType = null;


    function lockPayment(type) {

        if (paymentInProgress) {

            return false;

        }

        paymentInProgress = true;

        activePaymentType = type;

        return true;

    }


    function unlockPayment() {

        paymentInProgress = false;

        activePaymentType = null;

    }


    function isPaymentLocked() {

        return paymentInProgress;

    }


    /*
    =========================================================
       BUTTON STATE
    =========================================================
    */

    function setProcessingState(
        form,
        text
    ) {

        if (!form) {

            return;

        }


        const button =
            form.querySelector(
                ".pay-btn"
            );


        if (button) {

            button.disabled = true;

            button.textContent = text;

        }


        form
            .querySelectorAll(
                "input, select"
            )
            .forEach(
                function (field) {

                    field.disabled = true;

                }
            );

    }


    function restoreFormState(
        form,
        buttonText
    ) {

        if (!form) {

            return;

        }


        const button =
            form.querySelector(
                ".pay-btn"
            );


        if (button) {

            button.disabled = false;

            button.textContent =
                buttonText;

        }


        form
            .querySelectorAll(
                "input, select"
            )
            .forEach(
                function (field) {

                    field.disabled = false;

                }
            );

    }


    /*
    =========================================================
       PROCESSING MESSAGE
    =========================================================
    */

    function showProcessingMessage(
        boxId,
        timeId,
        message
    ) {

        const box =
            document.getElementById(
                boxId
            );

        const timeElement =
            document.getElementById(
                timeId
            );


        if (box) {

            box.classList.add(
                "active"
            );

        }


        if (timeElement) {

            timeElement.textContent =
                message ||
                "Your transaction is being processed. Please keep this page open.";

        }

    }


    function updateProcessingMessage(
        timeId,
        seconds
    ) {

        const element =
            document.getElementById(
                timeId
            );


        if (!element) {

            return;

        }


        element.textContent =
            "Processing for " +
            seconds +
            " second" +
            (
                seconds === 1
                    ? ""
                    : "s"
            ) +
            ". Please do not click the payment button again.";

    }


    function hideProcessingMessage(
        boxId
    ) {

        const box =
            document.getElementById(
                boxId
            );


        if (box) {

            box.classList.remove(
                "active"
            );

        }

    }


    function startProcessingTimer(
        boxId,
        timeId
    ) {

        let seconds = 0;


        showProcessingMessage(
            boxId,
            timeId,
            "Your transaction is being processed. Please do not click the payment button again."
        );


        const interval =
            setInterval(
                function () {

                    seconds++;

                    updateProcessingMessage(
                        timeId,
                        seconds
                    );

                },
                1000
            );


        return interval;

    }


    function stopProcessingTimer(
        boxId,
        interval
    ) {

        if (interval) {

            clearInterval(
                interval
            );

        }


        hideProcessingMessage(
            boxId
        );

    }


    /*
    =========================================================
       ACCESS TOKEN
    =========================================================
    */

    async function getAccessToken() {

        try {

            if (
                typeof window.getSupabaseAccessToken ===
                "function"
            ) {

                return await window.getSupabaseAccessToken();

            }

            return null;

        } catch (error) {

            console.error(
                "LosOja bills token error:",
                error
            );

            return null;

        }

    }


    /*
    =========================================================
       BILL HISTORY REQUEST
    =========================================================
    */

    async function billRequest(endpoint) {

        const token =
            await getAccessToken();


        const headers = {

            "apikey":
                SUPABASE_KEY,

            "Content-Type":
                "application/json",

            "Accept":
                "application/json"

        };


        if (token) {

            headers.Authorization =
                "Bearer " + token;

        }


        const response =
            await fetch(
                SUPABASE_URL + endpoint,
                {
                    method:
                        "GET",

                    headers:
                        headers
                }
            );


        const text =
            await response.text();


        let data = null;


        try {

            data =
                text
                    ? JSON.parse(text)
                    : null;

        } catch {

            data = text;

        }


        if (!response.ok) {

            console.error(
                "LosOja bills request error:",
                data
            );

            throw new Error(
                data?.message ||
                data?.error ||
                "Unable to load bill history."
            );

        }


        return data;

    }


    /*
    =========================================================
       TAB SWITCHING
    =========================================================
    */

    const tabButtons =
        document.querySelectorAll(
            ".tab-btn"
        );


    const forms =
        document.querySelectorAll(
            ".bill-form"
        );


    tabButtons.forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    /*
                    Do not allow switching services
                    while a payment is being processed.
                    */

                    if (
                        isPaymentLocked()
                    ) {

                        alert(
                            "A bill payment is currently being processed. Please wait for the transaction result."
                        );

                        return;

                    }


                    const tab =
                        button.dataset.tab;


                    tabButtons.forEach(
                        function (item) {

                            item.classList.remove(
                                "active"
                            );

                        }
                    );


                    forms.forEach(
                        function (form) {

                            form.classList.remove(
                                "active"
                            );

                        }
                    );


                    button.classList.add(
                        "active"
                    );


                    const target =
                        document.getElementById(
                            tab + "Form"
                        );


                    if (target) {

                        target.classList.add(
                            "active"
                        );

                    }

                }
            );

        }
    );


    /*
    =========================================================
       REAL AIRTIME
    =========================================================
    */

    const PAY_BILL_FUNCTION_URL =
        SUPABASE_URL +
        "/functions/v1/pay-bill";


    async function runRealAirtimePayment(
        network,
        phone,
        amount
    ) {

        const token =
            await getAccessToken();


        if (!token) {

            throw new Error(
                "Please log in to buy Airtime."
            );

        }


        const response =
            await fetch(
                PAY_BILL_FUNCTION_URL,
                {
                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " + token

                    },

                    body:
                        JSON.stringify({

                            service_type:
                                "airtime",

                            network:
                                network,

                            phone:
                                phone,

                            amount:
                                Number(amount)

                        })

                }
            );


        const text =
            await response.text();


        let data = null;


        try {

            data =
                text
                    ? JSON.parse(text)
                    : null;

        } catch {

            data = null;

        }


        if (!response.ok) {

            throw new Error(
                data?.error ||
                data?.message ||
                "Airtime payment failed."
            );

        }


        return data;

    }


    /*
    =========================================================
       AIRTIME FORM
    =========================================================
    */

    const airtimeForm =
        document.getElementById(
            "airtimeForm"
        );


    if (airtimeForm) {

        airtimeForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /*
                HARD DUPLICATE PROTECTION
                */

                if (
                    !lockPayment(
                        "airtime"
                    )
                ) {

                    alert(
                        "A payment is already being processed. Please wait."
                    );

                    return;

                }


                const network =
                    document.getElementById(
                        "airtimeNetwork"
                    )?.value
                    .trim()
                    .toLowerCase();


                const phone =
                    document.getElementById(
                        "airtimePhone"
                    )?.value
                    .trim();


                const amount =
                    Number(
                        document.getElementById(
                            "airtimeAmount"
                        )?.value
                    );


                if (!network) {

                    unlockPayment();

                    alert(
                        "Please select a network."
                    );

                    return;

                }


                if (
                    !/^[0-9]{11}$/.test(
                        phone
                    )
                ) {

                    unlockPayment();

                    alert(
                        "Enter a valid 11-digit Nigerian phone number."
                    );

                    return;

                }


                if (
                    !Number.isFinite(
                        amount
                    ) ||
                    amount < 50
                ) {

                    unlockPayment();

                    alert(
                        "Airtime amount must be at least ₦50."
                    );

                    return;

                }


                if (
                    amount > 100000
                ) {

                    unlockPayment();

                    alert(
                        "Airtime amount cannot exceed ₦100,000 in sandbox."
                    );

                    return;

                }


                setProcessingState(
                    airtimeForm,
                    "Processing Airtime..."
                );


                const processingInterval =
                    startProcessingTimer(
                        "airtimeProcessing",
                        "airtimeProcessingTime"
                    );


                try {

                    const result =
                        await runRealAirtimePayment(
                            network,
                            phone,
                            amount
                        );


                    if (
                        result?.status ===
                        "successful"
                    ) {

                        stopProcessingTimer(
                            "airtimeProcessing",
                            processingInterval
                        );


                        alert(
                            "Airtime purchase successful.\n\n" +
                            "Network: " +
                            network.toUpperCase() +
                            "\n" +
                            "Amount: ₦" +
                            Number(
                                amount
                            ).toLocaleString(
                                "en-NG"
                            )
                        );


                        airtimeForm.reset();


                        restoreFormState(
                            airtimeForm,
                            "Buy Airtime"
                        );


                        unlockPayment();


                        /*
                        History refresh happens AFTER
                        the transaction result is shown.
                        It cannot delay the success message.
                        */

                        loadBillHistory();

                        return;

                    }


                    if (
                        result?.status ===
                        "pending"
                    ) {

                        stopProcessingTimer(
                            "airtimeProcessing",
                            processingInterval
                        );


                        /*
                        IMPORTANT:
                        Keep the payment locked.

                        The provider may already have
                        received the transaction.
                        */

                        if (airtimeForm) {

                            const button =
                                airtimeForm.querySelector(
                                    ".pay-btn"
                                );

                            if (button) {

                                button.textContent =
                                    "Transaction Pending — Do Not Retry";

                            }

                        }


                        alert(
                            "Your Airtime transaction is still being processed.\n\n" +
                            "Do not submit the payment again. Check Bill History shortly."
                        );


                        loadBillHistory();

                        return;

                    }


                    stopProcessingTimer(
                        "airtimeProcessing",
                        processingInterval
                    );


                    alert(
                        result?.message ||
                        "Airtime payment could not be completed."
                    );


                    restoreFormState(
                        airtimeForm,
                        "Buy Airtime"
                    );


                    unlockPayment();


                } catch (error) {

                    console.error(
                        "LosOja Airtime error:",
                        error
                    );


                    stopProcessingTimer(
                        "airtimeProcessing",
                        processingInterval
                    );


                    /*
                    A network error does NOT mean
                    the payment was never received.

                    Therefore we DO NOT automatically
                    unlock and retry.
                    */

                    const button =
                        airtimeForm.querySelector(
                            ".pay-btn"
                        );


                    if (button) {

                        button.textContent =
                            "Request Sent — Check History";

                    }


                    alert(
                        "We could not confirm the Airtime result.\n\n" +
                        "The request may already have been received. " +
                        "Please check Bill History before trying again."
                    );


                    loadBillHistory();

                }

            }
        );

    }

    /*
    =========================================================
       FORMAT SERVICE TYPE
    =========================================================
    */

    function formatServiceType(type) {

        const names = {

            airtime:
                "Airtime",

            data:
                "Data",

            electricity:
                "Electricity"

        };


        return (
            names[type] ||
            String(
                type ||
                "Bill"
            )
                .replace(
                    /_/g,
                    " "
                )
                .replace(
                    /\b\w/g,
                    function (letter) {

                        return letter.toUpperCase();

                    }
                )
        );

    }


    /*
    =========================================================
       FORMAT STATUS
    =========================================================
    */

    function formatStatus(status) {

        const names = {

            pending:
                "Pending",

            successful:
                "Successful",

            failed:
                "Failed",

            reversed:
                "Reversed"

        };


        return (
            names[status] ||
            String(
                status ||
                "Unknown"
            )
        );

    }


    /*
    =========================================================
       FORMAT DATE
    =========================================================
    */

    function formatDate(value) {

        if (!value) {

            return "";

        }


        try {

            return new Date(
                value
            ).toLocaleString(
                "en-NG"
            );

        } catch {

            return "";

        }

    }


    /*
    =========================================================
       ESCAPE HTML
    =========================================================
    */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /*
    =========================================================
       LOAD BILL HISTORY
    =========================================================
    */

    async function loadBillHistory() {

        const container =
            document.getElementById(
                "billHistory"
            );


        if (!container) {

            return;

        }


        container.innerHTML =
            `
            <div class="empty">
                Loading bill history...
            </div>
            `;


        try {

            const user =
                typeof window.getCurrentUser ===
                "function"
                    ? await window.getCurrentUser()
                    : null;


            if (!user?.id) {

                container.innerHTML =
                    `
                    <div class="empty">
                        Please login to view bill history.
                    </div>
                    `;

                return;

            }


            const data =
                await billRequest(
                    `/rest/v1/bill_transactions?select=*&user_id=eq.${encodeURIComponent(
                        user.id
                    )}&order=created_at.desc&limit=50`
                );


            if (
                !data ||
                !data.length
            ) {

                container.innerHTML =
                    `
                    <div class="empty">
                        No bill payments yet.
                    </div>
                    `;

                return;

            }


            container.innerHTML =
                data.map(
                    function (transaction) {

                        const amount =
                            Number(
                                transaction.amount ||
                                0
                            );


                        const fee =
                            Number(
                                transaction.fee ||
                                0
                            );


                        const total =
                            Number(
                                transaction.total_amount ||
                                amount + fee
                            );


                        return `

                            <div
                                class="history-item"
                            >

                                <div
                                    class="history-row"
                                >

                                    <div>

                                        <div
                                            class="history-type"
                                        >
                                            ${escapeHTML(
                                                formatServiceType(
                                                    transaction.service_type
                                                )
                                            )}
                                        </div>

                                        <div>
                                            ${
                                                escapeHTML(
                                                    transaction.network ||
                                                    transaction.provider ||
                                                    transaction.customer_identifier ||
                                                    ""
                                                )
                                            }
                                        </div>

                                        <div
                                            class="history-date"
                                        >
                                            ${escapeHTML(
                                                formatDate(
                                                    transaction.created_at
                                                )
                                            )}
                                        </div>

                                        <div
                                            class="history-date"
                                        >
                                            Status:
                                            ${escapeHTML(
                                                formatStatus(
                                                    transaction.status
                                                )
                                            )}
                                        </div>

                                    </div>


                                    <div>

                                        <strong>
                                            ₦${total.toLocaleString(
                                                "en-NG",
                                                {
                                                    minimumFractionDigits:
                                                        2,

                                                    maximumFractionDigits:
                                                        2
                                                }
                                            )}
                                        </strong>

                                    </div>

                                </div>

                            </div>

                        `;

                    }
                ).join("");


        } catch (error) {

            console.error(
                "LosOja bill history error:",
                error
            );


            container.innerHTML =
                `
                <div class="error">
                    Unable to load bill history.
                </div>
                `;

        }

    }


    /*
    =========================================================
       INITIALIZE
    =========================================================
    */

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            loadBillHistory();

        }
    );


    console.log(
        "LosOja bills page loaded — duplicate payment protection active"
    );

})();

</script>
