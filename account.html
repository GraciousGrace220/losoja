<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - LosOja</title>
    <meta name="theme-color" content="#087a3e">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, Helvetica, sans-serif; background: #f5f7f6; color: #111827; min-height: 100vh; }
        .header { background: #087a3e; color: white; padding: 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
        .back-button { border: none; background: rgba(255,255,255,0.15); color: white; width: 40px; height: 40px; border-radius: 10px; font-size: 20px; cursor: pointer; }
        .header h1 { font-size: 21px; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; padding: 20px 16px 40px; }
        .profile-card { background: white; border-radius: 18px; padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); }
        .profile-icon { width: 62px; height: 62px; background: #e8f5ee; color: #087a3e; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 14px; }
        .profile-name { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .profile-email { color: #6b7280; font-size: 14px; word-break: break-word; }
        .section-title { font-size: 16px; font-weight: 700; margin: 22px 4px 10px; }
        .logout-button { width: 100%; border: none; background: #fff; color: #dc2626; padding: 16px; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 14px rgba(0,0,0,0.05); }
        .status { text-align: center; padding: 40px 20px; color: #6b7280; }
        .error { background: #fee2e2; color: #991b1b; padding: 14px; border-radius: 12px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
    <header class="header">
        <button class="back-button" type="button" onclick="history.back()" aria-label="Go back">←</button>
        <h1>My Account</h1>
    </header>
    <main class="container">
        <div id="status" class="status">Loading your account...</div>
        <div id="accountContent" style="display:none;">
            <section class="profile-card">
                <div class="profile-icon">👤</div>
                <div id="profileName" class="profile-name">LosOja User</div>
                <div id="profileEmail" class="profile-email">—</div>
            </section>
            <div id="errorMessage" class="error"></div>
            <div class="section-title">Account</div>
            <button id="logoutButton" class="logout-button" type="button">🚪 Logout</button>
        </div>
    </main>
   <script src="js/auth.js?v=5"></script>
    <script>
    (async function () {
        const status = document.getElementById("status");
        const accountContent = document.getElementById("accountContent");
        const profileName = document.getElementById("profileName");
        const profileEmail = document.getElementById("profileEmail");
        const errorMessage = document.getElementById("errorMessage");
        const logoutButton = document.getElementById("logoutButton");
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
        }
        try {
            if (typeof window.getCurrentUser !== "function") {
                throw new Error("Auth system not ready");
            }
            const user = await window.getCurrentUser();
            if (!user) {
                window.location.href = "index.html?openLogin=1";
                return;
            }
            const metadata = user.user_metadata || {};
            const name = metadata.full_name || metadata.name || user.email?.split("@")[0] || "LosOja User";
            profileName.textContent = name;
            profileEmail.textContent = user.email || "—";
            status.style.display = "none";
            accountContent.style.display = "block";
        } catch (error) {
            console.error("LosOja account error:", error);
            status.style.display = "none";
            accountContent.style.display = "block";
            showError("Unable to load your account right now.");
        }
        if(logoutButton){
            logoutButton.addEventListener("click", async function () {
                logoutButton.disabled = true;
                logoutButton.textContent = "Logging out...";
                try { if (typeof window.logout === "function") await window.logout(); } catch(e){}
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = "index.html";
            });
        }
    })();
    </script>
</body>
</html>
