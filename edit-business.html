<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Business - LosOja</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f5}
.topbar{position:sticky;top:0;background:#087a3e;color:#fff;padding:12px 18px}
.topbar-inner{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.brand{color:#fff;text-decoration:none;font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center}
.brand-mark{width:38px;height:38px;background:#fff;color:#087a3e;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}
.back-btn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:700}
.page{width:min(650px,calc(100% - 24px));margin:28px auto}
.card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 8px 32px rgba(0,0,0,.08);border:1px solid #e5ebe7}
h1{margin:0 0 18px;color:#123d25;font-size:23px}
label{display:block;margin:14px 0 6px;font-weight:700;font-size:13px;color:#123d25}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid #d7e1da;border-radius:11px;font-size:15px;outline:none;background:#fff}
input:focus,textarea:focus,select:focus{border-color:#087a3e;box-shadow:0 0 0 3px rgba(8,122,62,.12)}
textarea{min-height:100px;resize:vertical}
.btn{width:100%;margin-top:20px;background:#087a3e;color:#fff;border:0;border-radius:11px;padding:13px;font-weight:800;font-size:15px;cursor:pointer}
.btn2{width:100%;margin-top:10px;background:#fff;color:#123d25;border:1px solid #d7e1da;border-radius:11px;padding:12px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#17201b;color:#fff;padding:12px 17px;border-radius:10px;z-index:999;opacity:0;transition:.2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a href="index.html" class="brand"><div class="brand-mark">L</div>LosOja</a><button class="back-btn" onclick="history.back()">← Back</button></div></header>
<main class="page">
<div class="card">
<h1>✏️ Edit Business</h1>
<div id="loading">Loading...</div>
<form id="form" style="display:none">
<label>Business Name *</label><input id="name" required>
<label>Category</label><select id="category"><option>Business</option><option>Fashion</option><option>Electronics</option><option>Food</option><option>Services</option><option>Mobility</option><option>Beauty</option><option>Other</option></select>
<label>Location *</label><input id="location" required placeholder="e.g. Yaba, Lagos">
<label>Phone</label><input id="phone" placeholder="e.g. 080...">
<label>Price (optional)</label><input id="price" type="number" placeholder="Main price">
<label>Image URL</label><input id="image_url" type="url" placeholder="https://...">
<label>Description</label><textarea id="description" placeholder="About your business"></textarea>
<button type="submit" class="btn" id="saveBtn">Save Changes</button>
<button type="button" class="btn2" onclick="history.back()">Cancel</button>
</form>
</div>
</main>
<div id="toast" class="toast"></div>
<script src="js/auth.js?v=2"></script>
<script>
const SUPABASE_URL="https://ycxshwgeebskdozmornh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljeHNod2dlZWJza2Rvem1vcm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDY0NjUsImV4cCI6MjEwMzg4MjQ2NX0.tMl7wILdVDhu0RWFaG_84ngJEryLt2c5cB8MEKW3kfU";
const toast=document.getElementById("toast"),form=document.getElementById("form"),loading=document.getElementById("loading");
function showToast(m){toast.textContent=m;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),3000)}
function getId(){return new URLSearchParams(location.search).get("id")}
async function getUser(){try{if(window.getCurrentUser){const r=await window.getCurrentUser();if(r?.user?.id)return r.user;if(r?.id)return r}}catch{}try{const raw=localStorage.getItem("losoja_supabase_session");if(raw){const j=JSON.parse(raw);return j.user||j.data?.user}}catch{}return null}
async function load(){
 const id=getId();if(!id){loading.textContent="No business id";return}
 const user=await getUser();if(!user){location.href="index.html#login";return}
 try{
  const res=await fetch(`${SUPABASE_URL}/rest/v1/businesses?id=eq.${id}&select=*`,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
  const data=await res.json();if(!data.length)throw new Error("Business not found");
  const b=data[0];if(String(b.user_id)!==String(user.id)){showToast("You no own this business");setTimeout(()=>location.href=`shop.html?id=${id}`,1500);return}
  document.getElementById("name").value=b.name||"";document.getElementById("category").value=b.category||"Business";document.getElementById("location").value=b.location||"";document.getElementById("phone").value=b.phone||"";document.getElementById("price").value=b.price||"";document.getElementById("image_url").value=b.image_url||b.image||"";document.getElementById("description").value=b.description||"";
  loading.style.display="none";form.style.display="block";
 }catch(e){loading.textContent=e.message}
}
form.onsubmit=async(e)=>{
 e.preventDefault();const id=getId();const btn=document.getElementById("saveBtn");btn.disabled=true;btn.textContent="Saving...";
 const payload={name:document.getElementById("name").value.trim(),category:document.getElementById("category").value,location:document.getElementById("location").value.trim(),phone:document.getElementById("phone").value.trim(),price:document.getElementById("price").value?parseFloat(document.getElementById("price").value):null,image_url:document.getElementById("image_url").value.trim()||null,description:document.getElementById("description").value.trim()||null};
 try{
  let token=null;try{token=JSON.parse(localStorage.getItem("losoja_supabase_session"))?.access_token}catch{}
  const res=await fetch(`${SUPABASE_URL}/rest/v1/businesses?id=eq.${id}`,{method:"PATCH",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${token||SUPABASE_KEY}`,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(payload)});
  if(!res.ok){const t=await res.text();throw new Error(t)}
  showToast("Saved!");setTimeout(()=>location.href=`shop.html?id=${id}`,1000);
 }catch(err){showToast("Error: "+err.message);btn.disabled=false;btn.textContent="Save Changes"}
};
load();
</script>
</body>
</html>
