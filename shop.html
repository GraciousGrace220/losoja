<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LosOja Business</title>
<style>/* YOUR SAME CSS - I keep am */
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f5;color:#17201b}
.topbar{position:sticky;top:0;z-index:1000;background:#087a3e;color:#fff;padding:12px 18px}
.topbar-inner{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:21px}
.brand-mark{width:40px;height:40px;border-radius:11px;background:#fff;color:#087a3e;display:flex;align-items:center;justify-content:center;font-weight:900}
.back-btn{border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700}
.page{width:min(1150px,calc(100% - 28px));margin:24px auto 50px}.shop-card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.09);border:1px solid #e5ebe7}
.hero{min-height:360px;position:relative;background:#dfeae3;display:flex;align-items:flex-end;overflow:hidden}.hero-image{width:100%;height:390px;object-fit:cover}
.hero-placeholder{width:100%;height:390px;display:flex;align-items:center;justify-content:center;font-size:85px;background:radial-gradient(circle at center,#f5faf7 0,#e6f1ea 48%,#d9e9df 100%)}
.hero-overlay{position:absolute;left:0;right:0;bottom:0;padding:75px 30px 27px;background:linear-gradient(transparent 0%,rgba(0,0,0,.12) 18%,rgba(0,0,0,.78) 100%);color:#fff}
.hero-title{margin:0 0 10px;font-size:38px;line-height:1.1}.badge{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.32);padding:7px 11px;border-radius:999px;font-weight:600}
.content{padding:0 28px 30px}.section{padding:28px 0;border-bottom:1px solid #e7ede9}.section-title{margin:0 0 15px;font-size:21px;color:#123d25}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.action-btn{width:100%;min-height:48px;border:1px solid #d7e1da;background:#fff;color:#123d25;border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:700}
.action-primary{background:#087a3e;color:#fff;border-color:#087a3e}.owner-actions,.buyer-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.owner-note,.buyer-note{margin-top:12px;padding:11px 13px;border-radius:10px;background:#f7faf8;border:1px solid #e2ebe5;color:#637168;font-size:13px}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info-item{border:1px solid #e0e8e2;border-radius:13px;padding:15px;background:#fafcfb}
.info-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#718078;margin-bottom:6px;font-weight:700}.info-value{font-weight:650;word-break:break-word}
.description{color:#4d5b52;line-height:1.75;white-space:pre-wrap;font-size:15px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gallery-item{position:relative;border:0;padding:0;background:#eef3ef;border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:1/1}.gallery-item img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#17201b;color:#fff;padding:12px 17px;border-radius:10px;z-index:7000;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{text-align:center;color:#758078;padding:28px 10px;font-size:13px}
@media(max-width:700px){.page{width:calc(100% - 14px)}.actions{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.owner-actions,.buyer-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a href="index.html" class="brand"><div class="brand-mark">L</div><span>LosOja</span></a><button type="button" class="back-btn" id="backBtn">← Back</button></div></header>
<main class="page">
<div id="loading" style="text-align:center;padding:80px">Loading business...</div>
<div id="errorBox" style="display:none;background:#fff;border:1px solid #fecaca;border-radius:16px;padding:24px;text-align:center;margin-top:30px"></div>
<article id="shopCard" class="shop-card" style="display:none;">
<section id="hero" class="hero"></section>
<div class="content">
<div style="display:flex;justify-content:flex-end;padding:18px 0 3px"><button type="button" id="saveBtn" style="border:1px solid #cfdcd3;background:#fff;border-radius:999px;padding:10px 17px;font-weight:700;cursor:pointer">♡ Save</button></div>
<section class="section"><h2 class="section-title">Contact & Actions</h2><div id="publicActions" class="actions"></div><div id="ownerActions" class="owner-actions" style="display:none;"></div><div id="buyerActions" class="buyer-actions" style="display:none;"></div><div id="actionNote" class="owner-note" style="display:none;"></div></section>
<section class="section"><h2 class="section-title">Business Information</h2><div id="businessInfo" class="info-grid"></div></section>
<section id="descriptionSection" class="section"><h2 class="section-title">About This Business</h2><div id="description" class="description"></div></section>
<section class="section"><h2 class="section-title">Business Photos</h2><div id="gallery" class="gallery"></div></section>
<section class="section"><h2 class="section-title">Find This Business</h2><div id="locationText" class="info-item"></div></section>
</div>
</article>
</main>
<footer class="footer">© 2026 LosOja — Find What You Need Across Nigeria</footer>
<div id="toast" class="toast"></div>
<script src="js/auth.js?v=2"></script>
<script>
"use strict";
const SUPABASE_URL="https://ycxshwgeebskdozmornh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljeHNod2dlZWJza2Rvem1vcm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDY0NjUsImV4cCI6MjEwMzg4MjQ2NX0.tMl7wILdVDhu0RWFaG_84ngJEryLt2c5cB8MEKW3kfU";
const toast=document.getElementById("toast"),loading=document.getElementById("loading"),errorBox=document.getElementById("errorBox"),shopCard=document.getElementById("shopCard"),hero=document.getElementById("hero"),publicActions=document.getElementById("publicActions"),ownerActions=document.getElementById("ownerActions"),buyerActions=document.getElementById("buyerActions"),actionNote=document.getElementById("actionNote"),businessInfo=document.getElementById("businessInfo"),description=document.getElementById("description"),descriptionSection=document.getElementById("descriptionSection"),gallery=document.getElementById("gallery"),locationText=document.getElementById("locationText"),backBtn=document.getElementById("backBtn");
let currentBusiness=null;
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showToast(m){toast.textContent=m;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2800)}
function getBusinessId(){return new URLSearchParams(location.search).get("id")}
async function getShopUser(){try{if(typeof window.getCurrentUser==="function"){const r=await window.getCurrentUser();if(r?.user?.id)return r.user;if(r?.data?.user?.id)return r.data.user;if(r?.id)return r}}catch{}try{const raw=localStorage.getItem("losoja_supabase_session");if(raw){const j=JSON.parse(raw);if(j?.user?.id)return j.user;if(j?.data?.user?.id)return j.data.user}}catch{}return null}
async function requireShopLogin(){const u=await getShopUser();if(u)return u;try{sessionStorage.setItem("losoja_return_to_shop",location.href)}catch{}location.href="index.html#login";return null}
backBtn.onclick=()=>history.back();
async function loadBusiness(){
 const id=getBusinessId();if(!id){loading.style.display="none";errorBox.style.display="block";errorBox.textContent="No business selected";return}
 try{const res=await fetch(`${SUPABASE_URL}/rest/v1/businesses?id=eq.${encodeURIComponent(id)}&select=*`,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});const data=await res.json();if(!data.length)throw new Error("Business not found");currentBusiness=data[0];await renderBusiness(currentBusiness);loading.style.display="none";shopCard.style.display="block"}catch(e){loading.style.display="none";errorBox.style.display="block";errorBox.innerHTML=`<b>Error:</b> ${esc(e.message)}<br><br><button onclick="location.href='index.html'" style="padding:10px 15px;background:#087a3e;color:#fff;border:0;border-radius:9px">Back to LosOja</button>`}
}
async function renderBusiness(b){
 const name=b.name||"Business",cat=b.category||"Business",loc=b.location||"Nigeria",phone=(b.phone||"").trim(),img=b.image_url||b.image||"",price=b.price;
 document.title=name+" | LosOja";
 hero.innerHTML=img?`<img class="hero-image" src="${esc(img)}" alt="${esc(name)}"><div style="position:absolute;left:0;right:0;bottom:0;padding:75px 30px 27px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff"><h1 style="margin:0 0 10px;font-size:32px">${esc(name)} ${b.verified?'<span style="background:#fff;color:#087a3e;padding:3px 8px;border-radius:10px;font-size:11px">✓ Verified</span>':''}</h1><span style="background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.32);padding:7px 11px;border-radius:999px;margin-right:6px">${esc(cat)}</span><span style="background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.32);padding:7px 11px;border-radius:999px">📍 ${esc(loc)}</span></div>`:`<div style="width:100%;height:320px;display:flex;align-items:center;justify-content:center;font-size:80px;background:#e6f1ea">🏪</div><div style="position:absolute;left:0;right:0;bottom:0;padding:20px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7))"><h1>${esc(name)}</h1></div>`;
 businessInfo.innerHTML=`<div class="info-item"><span class="info-label">Category</span><span class="info-value">${esc(cat)}</span></div><div class="info-item"><span class="info-label">Location</span><span class="info-value">${esc(loc)}</span></div>${phone?`<div class="info-item"><span class="info-label">Phone</span><span class="info-value">${esc(phone)}</span></div>`:""}${price?`<div class="info-item"><span class="info-label">Price</span><span class="info-value">₦${Number(price).toLocaleString()}</span></div>`:""}`;
 if(b.description){description.textContent=b.description;descriptionSection.style.display="block"}else descriptionSection.style.display="none";
 locationText.innerHTML=`<span class="info-label">Business Location</span><span class="info-value">📍 ${esc(loc)}</span>`;
 renderPublicActions(b);await renderOwnerBuyerActions(b);
}
function renderPublicActions(b){
 publicActions.innerHTML="";
 if(b.phone){
  const clean=String(b.phone).replace(/[^0-9+]/g,""),wa=clean.replace(/^\+/,"");
  const btnWA=document.createElement("button");btnWA.className="action-btn action-primary";btnWA.textContent="💬 WhatsApp";btnWA.onclick=()=>window.open(`https://wa.me/${encodeURIComponent(wa)}?text=Hi%20${encodeURIComponent(b.name)}%20I%20saw%20you%20on%20LosOja`,"_blank");publicActions.appendChild(btnWA);
  const btnCall=document.createElement("button");btnCall.className="action-btn";btnCall.textContent="📞 Call";btnCall.onclick=()=>location.href=`tel:${clean}`;publicActions.appendChild(btnCall);
 }
 const btnDir=document.createElement("button");btnDir.className="action-btn";btnDir.textContent="🧭 Directions";btnDir.onclick=()=>window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.name+" "+b.location)}`,"_blank");publicActions.appendChild(btnDir);
}
async function renderOwnerBuyerActions(b){
 ownerActions.innerHTML="";buyerActions.innerHTML="";ownerActions.style.display="none";buyerActions.style.display="none";actionNote.style.display="none";
 const user=await getShopUser();
 if(!user){renderBuyerActions(b);return}
 if(String(user.id)===String(b.user_id)){renderOwnerActions(b)}else{renderBuyerActions(b)}
}
function renderOwnerActions(b){
 ownerActions.style.display="grid";
 actionNote.style.display="block";
 actionNote.textContent="You own this listing. Manage from here.";
 ownerActions.innerHTML="";
 const btnEdit=document.createElement("button");
 btnEdit.className="action-btn action-primary";
 btnEdit.textContent="✏️ Edit Business";
 btnEdit.onclick=()=>location.href=`edit-business.html?id=${b.id}`;
 ownerActions.appendChild(btnEdit);
 const btnAddProduct=document.createElement("button");
 btnAddProduct.className="action-btn";
 btnAddProduct.style.border="2px solid #087a3e";
 btnAddProduct.style.color="#087a3e";
 btnAddProduct.style.fontWeight="800";
 btnAddProduct.textContent="+ Add Product";
 btnAddProduct.onclick=()=>location.href=`add-product.html?business=${b.id}`;
 ownerActions.appendChild(btnAddProduct);
 const btnDel=document.createElement("button");
 btnDel.className="action-btn";
 btnDel.style.color="#b91c1c";
 btnDel.textContent="🗑️ Delete";
 btnDel.onclick=()=>{if(confirm("Delete this business?"))deleteBusiness(b.id)};
 ownerActions.appendChild(btnDel);
}
function renderBuyerActions(b){
 buyerActions.style.display="grid";
 actionNote.style.display="block";
 actionNote.textContent="🔐 Safe with LosOja Escrow: Chat seller, then create escrow inside chat. Money safe until delivery!";
 buyerActions.innerHTML="";
 const btnChat=document.createElement("button");
 btnChat.className="action-btn action-primary";
 btnChat.textContent="💬 Oja Chat / Escrow";
 btnChat.style.gridColumn="1 / -1";
 btnChat.style.minHeight="52px";
 btnChat.style.fontSize="16px";
 btnChat.onclick=async()=>{await openLosOjaChat(b,false)};
 buyerActions.appendChild(btnChat);
}
async function openLosOjaChat(b,openEscrow=false){
 const user=await requireShopLogin();if(!user)return;
 if(!b.user_id){showToast("Seller no get Oja account - Use WhatsApp");return}
 if(String(user.id)===String(b.user_id)){showToast("You own this shop");return}
 let url=`chat.html?user=${encodeURIComponent(b.user_id)}&business=${encodeURIComponent(b.id)}`;
 if(openEscrow)url+=`&escrow=1`;
 location.href=url;
}
async function deleteBusiness(id){
 try{const token=await (async()=>{try{if(typeof window.getSupabaseAccessToken==="function"){const r=await window.getSupabaseAccessToken();return r?.access_token||r} }catch{}return null})();const res=await fetch(`${SUPABASE_URL}/rest/v1/businesses?id=eq.${id}`,{method:"DELETE",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${token||SUPABASE_KEY}`}});if(!res.ok)throw new Error("Delete failed");showToast("Deleted!");setTimeout(()=>location.href="index.html",1000)}catch(e){showToast(e.message)}
}
loadBusiness();
</script>
</body>
</html>
