<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LosOja Business</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f5;color:#17201b}
.topbar{position:sticky;top:0;z-index:1000;background:#087a3e;color:#fff;padding:12px 18px}
.topbar-inner{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:21px}
.brand-mark{width:40px;height:40px;border-radius:11px;background:#fff;color:#087a3e;display:flex;align-items:center;justify-content:center;font-weight:900}
.back-btn{border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700}
.page{width:min(1150px,calc(100% - 28px));margin:24px auto 50px}.shop-card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.09);border:1px solid #e5ebe7}
.hero{min-height:360px;position:relative;background:#dfeae3;display:flex;align-items:flex-end;overflow:hidden}.hero-image{width:100%;height:390px;object-fit:cover}
.content{padding:0 28px 30px}.section{padding:28px 0;border-bottom:1px solid #e7ede9}.section-title{margin:0 0 15px;font-size:21px;color:#123d25}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.action-btn{width:100%;min-height:48px;border:1px solid #d7e1da;background:#fff;color:#123d25;border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:700}
.action-primary{background:#087a3e;color:#fff;border-color:#087a3e}.owner-actions,.buyer-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.owner-note{margin-top:12px;padding:11px 13px;border-radius:10px;background:#f7faf8;border:1px solid #e2ebe5;color:#637168;font-size:13px}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info-item{border:1px solid #e0e8e2;border-radius:13px;padding:15px;background:#fafcfb}
.info-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#718078;margin-bottom:6px;font-weight:700}.info-value{font-weight:650;word-break:break-word}
.description{color:#4d5b52;line-height:1.75;white-space:pre-wrap;font-size:15px}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#17201b;color:#fff;padding:12px 17px;border-radius:10px;z-index:7000;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{text-align:center;color:#758078;padding:28px 10px;font-size:13px}
@media(max-width:700px){.page{width:calc(100% - 14px)}.actions{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.owner-actions,.buyer-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a href="index.html" class="brand"><div class="brand-mark">L</div><span>LosOja</span></a><button type="button" class="back-btn" id="backBtn">← Back</button></div></header>
<main class="page">
<div id="loading" style="text-align:center;padding:80px">Loading business...</div>
<div id="errorBox" style="display:none;background:#fff;border:1px solid #fecaca;border-radius:16px;padding:24px;text-align:center;margin-top:30px"></div>
<article id="shopCard" class="shop-card" style="display:none;">
<section id="hero" class="hero"></section>
<div class="content">
<div style="display:flex;justify-content:flex-end;padding:18px 0 3px"><button type="button" id="saveBtn" style="border:1px solid #cfdcd3;background:#fff;border-radius:999px;padding:10px 17px;font-weight:700;cursor:pointer">♡ Save</button></div>
<section class="section"><h2 class="section-title">Contact & Actions</h2><div id="publicActions" class="actions"></div><div id="ownerActions" class="owner-actions" style="display:none;"></div><div id="buyerActions" class="buyer-actions" style="display:none;"></div><div id="actionNote" class="owner-note" style="display:none;"></div></section>
<section class="section"><h2 class="section-title">Business Information</h2><div id="businessInfo" class="info-grid"></div></section>
<section class="section" id="productsSection"><h2 class="section-title">🛍️ Products from this business</h2><div id="productFilters" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"></div><div id="productsList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px">Loading products...</div></section>
<section id="descriptionSection" class="section"><h2 class="section-title">About This Business</h2><div id="description" class="description"></div></section>
<section class="section"><h2 class="section-title">Business Photos</h2><div id="gallery" class="gallery"></div></section>
<section class="section"><h2 class="section-title">Find This Business</h2><div id="locationText" class="info-item"></div></section>
</div>
</article>
</main>
<footer class="footer">© 2026 LosOja</footer>
<div id="toast" class="toast"></div>
<script src="js/auth.js?v=2"></script>
<script>
"use strict";
const SUPABASE_URL="https://ycxshwgeebskdozmornh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljeHNod2dlZWJza2Rvem1vcm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDY0NjUsImV4cCI6MjEwMzg4MjQ2NX0.tMl7wILdVDhu0RWFaG_84ngJEryLt2c5cB8MEKW3kfU";
const toast=document.getElementById("toast"),loading=document.getElementById("loading"),errorBox=document.getElementById("errorBox"),shopCard=document.getElementById("shopCard"),hero=document.getElementById("hero"),publicActions=document.getElementById("publicActions"),ownerActions=document.getElementById("ownerActions"),buyerActions=document.getElementById("buyerActions"),actionNote=document.getElementById("actionNote"),businessInfo=document.getElementById("businessInfo"),description=document.getElementById("description"),descriptionSection=document.getElementById("descriptionSection"),gallery=document.getElementById("gallery"),locationText=document.getElementById("locationText"),backBtn=document.getElementById("backBtn");
let currentBusiness=null;let allProducts=[];let activeFilter="All";
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}))}
function showToast(m){toast.textContent=m;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2800)}
function getBusinessId(){return new URLSearchParams(location.search).get("id")}
async function getShopUser(){try{if(typeof window.getCurrentUser==="function"){const r=await window.getCurrentUser();if(r?.user?.id)return r.user;if(r?.data?.user?.id)return r.data.user;if(r?.id)return r}}catch{}try{const raw=localStorage.getItem("losoja_supabase_session");if(raw){const j=JSON.parse(raw);if(j?.user?.id)return j.user;if(j?.data?.user?.id)return j.data.user}}catch{}return null}
async function requireShopLogin(){const u=await getShopUser();if(u)return u;try{sessionStorage.setItem("losoja_return_to_shop",location.href)}catch{}location.href="index.html#login";return null}
backBtn.onclick=()=>history.back();
async function loadBusiness(){
 const id=getBusinessId();if(!id){loading.style.display="none";errorBox.style.display="block";errorBox.textContent="No business selected";return}
 try{
  const res=await fetch(`${SUPABASE_URL}/rest/v1/businesses?id=eq.${encodeURIComponent(id)}`,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
  const data=await res.json();if(!data.length)throw new Error("Business not found");
  currentBusiness=data[0];await renderBusiness(currentBusiness);loading.style.display="none";shopCard.style.display="block";loadProducts();
 }catch(e){loading.style.display="none";errorBox.style.display="block";errorBox.innerHTML=`<b>Error:</b> ${esc(e.message)}`}
}
async function renderBusiness(b){
 const name=b.name||"Business",cat=b.category||"Business",loc=b.location||"Nigeria",phone=(b.phone||"").trim(),img=b.image_url||b.image||"";
 document.title=name+" | LosOja";
 hero.innerHTML=img?`<img class="hero-image" src="${esc(img)}" alt="${esc(name)}"><div style="position:absolute;left:0;right:0;bottom:0;padding:75px 30px 27px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff"><h1 style="margin:0 0 10px;font-size:32px">${esc(name)}</h1><span style="background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.32);padding:7px 11px;border-radius:999px;margin-right:6px">${esc(cat)}</span><span style="background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.32);padding:7px 11px;border-radius:999px">📍 ${esc(loc)}</span></div>`:`<div style="width:100%;height:320px;display:flex;align-items:center;justify-content:center;font-size:80px;background:#e6f1ea">🏪</div>`;
 businessInfo.innerHTML=`<div class="info-item"><span class="info-label">Category</span><span class="info-value">${esc(cat)}</span></div><div class="info-item"><span class="info-label">Location</span><span class="info-value">${esc(loc)}</span></div>${phone?`<div class="info-item"><span class="info-label">Phone</span><span class="info-value">${esc(phone)}</span></div>`:""}`;
 if(b.description){description.textContent=b.description;descriptionSection.style.display="block"}else descriptionSection.style.display="none";
 locationText.innerHTML=`<span class="info-label">Business Location</span><span class="info-value">📍 ${esc(loc)}</span>`;
 renderPublicActions(b);await renderOwnerBuyerActions(b);
}
function renderPublicActions(b){
 publicActions.innerHTML="";
 if(b.phone){
  const clean=String(b.phone).replace(/[^0-9+]/g,""),wa=clean.replace(/^\+/,"");
  const btnWA=document.createElement("button");btnWA.className="action-btn action-primary";btnWA.textContent="💬 WhatsApp";btnWA.onclick=()=>window.open(`https://wa.me/${encodeURIComponent(wa)}`,"_blank");publicActions.appendChild(btnWA);
  const btnCall=document.createElement("button");btnCall.className="action-btn";btnCall.textContent="📞 Call";btnCall.onclick=()=>location.href=`tel:${clean}`;publicActions.appendChild(btnCall);
 }
 const btnDir=document.createElement("button");btnDir.className="action-btn";btnDir.textContent="🧭 Directions";btnDir.onclick=()=>window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.name+" "+b.location)}`,"_blank");publicActions.appendChild(btnDir);
}
async function renderOwnerBuyerActions(b){
 ownerActions.innerHTML="";buyerActions.innerHTML="";ownerActions.style.display="none";buyerActions.style.display="none";actionNote.style.display="none";
 const user=await getShopUser();
 if(!user){renderBuyerActions(b);return}
 if(String(user.id)===String(b.user_id)){renderOwnerActions(b)}else{renderBuyerActions(b)}
}
function renderOwnerActions(b){
 ownerActions.style.display="grid";actionNote.style.display="block";actionNote.textContent="You own this listing.";
 ownerActions.innerHTML="";
 const btnEdit=document.createElement("button");btnEdit.className="action-btn action-primary";btnEdit.textContent="✏️ Edit Business";btnEdit.onclick=()=>location.href=`edit-business.html?id=${b.id}`;ownerActions.appendChild(btnEdit);
 const btnAdd=document.createElement("button");btnAdd.className="action-btn";btnAdd.style.border="2px solid #087a3e";btnAdd.style.color="#087a3e";btnAdd.style.fontWeight="800";btnAdd.textContent="+ Add Product";btnAdd.onclick=()=>location.href=`add-product.html?business=${b.id}`;ownerActions.appendChild(btnAdd);
 const btnDel=document.createElement("button");btnDel.className="action-btn";btnDel.style.color="#b91c1c";btnDel.textContent="🗑️ Delete";btnDel.onclick=()=>{if(confirm("Delete this business?"))deleteBusiness(b.id)};ownerActions.appendChild(btnDel);
}
function renderBuyerActions(b){
 buyerActions.style.display="grid";actionNote.style.display="block";actionNote.textContent="🔐 Safe with LosOja Escrow";
 buyerActions.innerHTML="";
 const btnChat=document.createElement("button");btnChat.className="action-btn action-primary";btnChat.textContent="💬 Oja Chat / Escrow";btnChat.style.gridColumn="1 / -1";btnChat.onclick=async()=>{await openLosOjaChat(b)};buyerActions.appendChild(btnChat);
}
async function openLosOjaChat(b){const user=await requireShopLogin();if(!user)return;if(!b.user_id){showToast("Seller no get account");return}if(String(user.id)===String(b.user_id)){showToast("You own this shop");return}location.href=`chat.html?user=${encodeURIComponent(b.user_id)}&business=${encodeURIComponent(b.id)}`;}
async function deleteBusiness(id){try{let token=null;try{token=JSON.parse(localStorage.getItem("losoja_supabase_session"))?.access_token}catch{}const res=await fetch(`${SUPABASE_URL}/rest/v1/businesses?id=eq.${id}`,{method:"DELETE",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${token||SUPABASE_KEY}`}});if(!res.ok)throw new Error("Delete failed");showToast("Deleted!");setTimeout(()=>location.href="index.html",1000)}catch(e){showToast(e.message)}}
async function loadProducts(){
 const businessId=getBusinessId();const list=document.getElementById("productsList");const filters=document.getElementById("productFilters");if(!list)return;
 try{
  const res=await fetch(`${SUPABASE_URL}/rest/v1/products?business_id=eq.${businessId}&order=created_at.desc`,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
  const products=await res.json();
  allProducts=products||[];
  if(!allProducts.length){list.innerHTML='<p style="color:#888;font-size:14px">No products yet.</p>';filters.innerHTML="";return}
  const cats=["All",...new Set(allProducts.map(p=>p.product_category||"General"))];
  filters.innerHTML=cats.map(c=>`<button onclick="setFilter('${esc(c)}')" id="f-${esc(c)}" style="padding:7px 14px;border-radius:999px;border:1px solid ${activeFilter===c?'#087a3e':'#d7e1da'};background:${activeFilter===c?'#087a3e':'#fff'};color:${activeFilter===c?'#fff':'#123d25'};font-weight:700;cursor:pointer;font-size:13px">${esc(c)}</button>`).join("");
  renderFiltered();
 }catch(e){list.innerHTML='Error loading products'}
}
function setFilter(c){activeFilter=c;document.querySelectorAll("#productFilters button").forEach(b=>{const is=b.id===`f-${c}`;b.style.background=is?'#087a3e':'#fff';b.style.color=is?'#fff':'#123d25';b.style.borderColor=is?'#087a3e':'#d7e1da'});renderFiltered()}
async function renderFiltered(){
 const list=document.getElementById("productsList");
 const filtered=activeFilter==="All"?allProducts:allProducts.filter(p=>(p.product_category||"General")===activeFilter);
 const user=await getShopUser();const isOwner=user&&currentBusiness&&String(user.id)===String(currentBusiness.user_id);
 list.innerHTML=filtered.map(p=>{
  const stock=Number(p.stock||0);let stockLabel=stock>0?`${stock} left`:`<span style="color:#b91c1c">Out of stock</span>`;if(stock>0&&stock<=3)stockLabel=`<span style="color:#d97706">Only ${stock} left!</span>`;
  return `
   <div style="border:1px solid #e5ebe7;border-radius:14px;overflow:hidden;background:#fff;opacity:${stock===0?'0.7':'1'}">
    <img src="${esc(p.image_url||'https://via.placeholder.com/300')}" style="width:100%;height:140px;object-fit:cover">
    <div style="padding:10px">
     <div style="font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>
     <div style="color:#5a6b5f;font-size:12px;margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px">${esc(p.description||'No description')}</div>
     <div style="color:#087a3e;font-weight:800;margin-top:6px">₦${Number(p.price||0).toLocaleString()}</div>
     <div style="font-size:11px;margin-top:4px">${stockLabel} • ${esc(p.product_category||'General')}</div>
     ${isOwner?`<div style="display:flex;gap:6px;margin-top:8px"><button onclick="location.href='edit-product.html?id=${p.id}'" style="flex:1;padding:7px;border:1px solid #d7e1da;border-radius:8px;background:#fff;cursor:pointer;font-size:12px;font-weight:700">✏️ Edit</button><button onclick="deleteProd('${p.id}')" style="flex:1;padding:7px;border:0;border-radius:8px;background:#ffe5e5;color:#b91c1c;cursor:pointer;font-size:12px;font-weight:700">🗑️</button></div>`:''}
    </div>
   </div>`
 }).join("")||'<p style="color:#888">No products in this category.</p>';
}
async function deleteProd(id){if(!confirm("Delete this product?"))return;let token=null;try{token=JSON.parse(localStorage.getItem("losoja_supabase_session"))?.access_token}catch{}await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`,{method:"DELETE",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${token||SUPABASE_KEY}`}});showToast("Deleted");loadProducts();}
loadBusiness();
</script>
</body>
</html>
