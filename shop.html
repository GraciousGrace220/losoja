function escapeHTML(value){

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function showToast(
    message
){

    if(!toast){
        return;
    }

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(
        function(){

            toast.classList.remove(

            );

        },
        2800
    );

}


function getBusinessId(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get(
        "id"
    );

}


function extractUser(
    result
){

    if(!result){
        return null;
    }

    if(
        result.user &&
        result.user.id
    ){

        return result.user;

    }

    if(
        result.data &&
        result.data.user &&
        result.data.user.id
    ){

        return result.data.user;

    }

    if(
        result.id
    ){

        return result;

    }

    return null;

}


function extractToken(
    result
){

    if(!result){
        return null;
    }

    if(
        typeof result ===
        "string"
    ){

        return result;

    }

    if(
        result.access_token
    ){

        return result.access_token;

    }

    if(
        result.session &&
        result.session.access_token
    ){

        return result.session.access_token;

    }

    if(
        result.data &&
        result.data.session &&
        result.data.session.access_token
    ){

        return result.data.session.access_token;

    }

    return null;

}


/* =========================================================
   AUTH
========================================================= */

async function getShopUser(){

    try{

        if(
            typeof window.getCurrentUser ===
            "function"
        ){

            const result =
                await window.getCurrentUser();

            const user =
                extractUser(
                    result
                );

            if(user){
                return user;
            }

        }

    }catch(error){

        console.warn(
            "LosOja shop: getCurrentUser failed.",
            error
        );

    }


    try{

        if(
            window.losojaSupabase &&
            window.losojaSupabase.auth &&
            typeof window.losojaSupabase.auth.getSession ===
            "function"
        ){

            const result =
                await window.losojaSupabase.auth.getSession();

            const user =
                extractUser(
                    result
                );

            if(user){
                return user;
            }

        }

    }catch(error){

        console.warn(
            "LosOja shop: Supabase session lookup failed.",
            error
        );

    }


    try{

        const raw =
            localStorage.getItem(
                "losoja_supabase_session"
            );

        if(raw){

            const parsed =
                JSON.parse(
                    raw
                );

            const user =
                extractUser(
                    parsed
                );

            if(user){
                return user;
            }

        }

    }catch(error){

        console.warn(
            "LosOja shop: local session lookup failed."
        );

    }


    return null;

}


async function getShopAccessToken(){

    try{

        if(
            typeof window.ensureValidSupabaseSession ===
            "function"
        ){

            const result =
                await window.ensureValidSupabaseSession();

            const token =
                extractToken(
                    result
                );

            if(token){
                return token;
            }

        }

    }catch(error){

        console.warn(
            "LosOja shop: session validation failed."
        );

    }


    try{

        if(
            typeof window.getSupabaseAccessToken ===
            "function"
        ){

            const result =
                await window.getSupabaseAccessToken();

            const token =
                extractToken(
                    result
                );

            if(token){
                return token;
            }

        }

    }catch(error){

        console.warn(
            "LosOja shop: access token helper failed."
        );

    }


    try{

        if(
            window.losojaSupabase &&
            window.losojaSupabase.auth &&
            typeof window.losojaSupabase.auth.getSession ===
            "function"
        ){

            const result =
                await window.losojaSupabase.auth.getSession();

            const token =
                extractToken(
                    result
                );

            if(token){
                return token;
            }

        }

    }catch(error){

        console.warn(
            "LosOja shop: direct session token lookup failed."
        );

    }


    try{

        const raw =
            localStorage.getItem(
                "losoja_supabase_session"
            );

        if(raw){

            const parsed =
                JSON.parse(
                    raw
                );

            const token =
                extractToken(
                    parsed
                );

            if(token){
                return token;
            }

        }

    }catch(error){

        console.warn(
            "LosOja shop: local token lookup failed."
        );

    }


    return null;

}

/* =========================================================
   LOAD BUSINESS
========================================================= */

async function loadBusiness(){

    const businessId =
        getBusinessId();

    if(!businessId){

        showError(
            "No business was selected."
        );

        return;

    }


    try{

        loading.style.display =
            "block";

        errorBox.style.display =
            "none";

        shopCard.style.display =
            "none";


        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/businesses?id=eq." +
                encodeURIComponent(
                    businessId
                ) +
                "&select=*",
                {
                    method:"GET",

                    headers:{
                        apikey:
                            SUPABASE_KEY,

                        Authorization:
                            "Bearer " +
                            SUPABASE_KEY,

                        Accept:
                            "application/json"
                    }
                }
            );


        if(!response.ok){

            let message =
                "Could not load this business.";

            try{

                const data =
                    await response.json();

                message =
                    data.message ||
                    data.error_description ||
                    data.details ||
                    message;

            }catch(error){

                /* Ignore JSON error. */

            }

            throw new Error(
                message
            );

        }


        const businesses =
            await response.json();


        if(
            !Array.isArray(
                businesses
            ) ||
            businesses.length === 0
        ){

            throw new Error(
                "This business could not be found."
            );

        }


        currentBusiness =
            businesses[0];


        await renderBusiness(
            currentBusiness
        );


        loading.style.display =
            "none";

        shopCard.style.display =
            "block";


    }catch(error){

        console.error(
            "LosOja shop load error:",
            error
        );

        showError(
            error.message ||
            "Unable to load this business."
        );

    }

}

}

async function openLosOjaChat(
    business
){

    const user =
        await requireShopLogin();

    if(!user){
        return;
    }


    if(
        !business.user_id
    ){

        showToast(
            "This business does not have an owner account."
        );

        return;

    }


    if(
        String(user.id) ===
        String(business.user_id)
    ){

        showToast(
            "You cannot chat with yourself."
        );

        return;

    }


    const chatUrl =
        "chat.html?user=" +
        encodeURIComponent(
            String(
                business.user_id
            )
        ) +
        "&business=" +
        encodeURIComponent(
            String(
                business.id
            )
        );


    window.location.href =
        chatUrl;

}


/* =========================================================
   ESCROW
========================================================= */

async function openBusinessEscrow(
    business
){

    const user =
        await requireShopLogin();

    if(!user){
        return;
    }


    if(
        !business.user_id
    ){

        showToast(
            "This business does not have an owner account."
        );

        return;

    }


    if(
        String(user.id) ===
        String(business.user_id)
    ){

        showToast(
            "You cannot create escrow with your own business."
        );

        return;

    }


    try{

        sessionStorage.setItem(
            "losoja_escrow_business",
            JSON.stringify(
                {
                    id:
                        String(
                            business.id
                        ),

                    name:
                        String(
                            business.name ||
                            ""
                        ),

                    user_id:
                        String(
                            business.user_id ||
                            ""
                        ),

                    category:
                        String(
                            business.category ||
                            ""
                        ),

                    location:
                        String(
                            business.location ||
                            ""
                        ),

                        String(

                            ""
                        ),

                    image:
                        String(
                            business.image_url ||

                        )

/* =========================================================
   IMAGE FILE VALIDATION
========================================================= */

function validateBusinessImage(
    file
){

    if(!file){
        return "Invalid image.";
    }


    const allowedTypes = [
        "image/jpeg",
        "image/jpg",
        "image/png",
        "image/webp",
        "image/gif"
    ];


    if(
        !allowedTypes.includes(
            file.type
        )
    ){

        return (
            file.name +
            " is not a supported image type."
        );

    }


    if(
        file.size >
        MAX_IMAGE_SIZE
    ){

        return (
            file.name +
            " is larger than 5 MB."
        );

    }


    return "";

}


/* =========================================================
   HANDLE NEW IMAGES
========================================================= */

function handleEditImageSelection(
    event
){

    const input =
        event.target;

    const files =
        Array.from(
            input.files || []
        );


    if(!files.length){
        return;
    }


    const currentCount =
        getCurrentEditImageCount();


    const availableSlots =
        MAX_BUSINESS_IMAGES -
        currentCount;


    if(
        availableSlots <= 0
    ){

        showToast(
            "You already have the maximum of 5 pictures."
        );

        input.value =
            "";

        return;

    }


    let addedCount =
        0;


    for(
        let index = 0;
        index < files.length;
        index++
    ){

        if(
            addedCount >=
            availableSlots
        ){

            break;

        }


        const file =
            files[index];


        const error =
            validateBusinessImage(
                file
            );


        if(error){

            showToast(
                error
            );

            continue;

        }


        /*
         * Prevent the same file from being selected
         * more than once before saving.
         */

        const alreadySelected =
            editSelectedFiles.some(
                function(existingFile){

                    return (
                        existingFile.name ===
                            file.name &&

                        existingFile.size ===
                            file.size &&

                        existingFile.lastModified ===
                            file.lastModified
                    );

                }
            );


        if(alreadySelected){

            showToast(
                file.name +
                " is already selected."
            );

            continue;

        }


        editSelectedFiles.push(
            file
        );


        addedCount++;

    }


    if(
        files.length >
        availableSlots
    ){

        showToast(
            "Only " +
            availableSlots +
            " more picture(s) can be added."
        );

    }


    input.value =
        "";


    renderNewImagePreviews();

    updateEditImageCount();

}

/* =========================================================
   UPLOAD BUSINESS IMAGE
========================================================= */

async function uploadBusinessImage(
    file,
    businessId,
    userId,
    accessToken,
    sortOrder,
    saveToDatabase = true
){

    const extension =
        (
            file.name
                .split(".")
                .pop() ||
            "jpg"
        )
        .toLowerCase()
        .replace(
            /[^a-z0-9]/g,
            ""
        );


    const safeExtension =
        extension ||
        "jpg";


    const randomPart =
        Math.random()
            .toString(36)
            .slice(2,10);


    const uploadPath =
        "businesses/" +
        "business_" +
        String(
            businessId
        ) +
        "_" +
        Date.now() +
        "_" +
        randomPart +
        "." +
        safeExtension;


    const uploadResponse =
        await fetch(
            SUPABASE_URL +
            "/storage/v1/object/" +
            BUSINESS_IMAGE_BUCKET +
            "/" +
            uploadPath,
            {
                method:"POST",

                headers:{
                    apikey:
                        SUPABASE_KEY,

                    Authorization:
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        file.type ||
                        "image/jpeg"
                },

                body:
                    file
            }
        );


    if(!uploadResponse.ok){

        let message =
            "Could not upload picture.";

        try{

            const data =
                await uploadResponse.json();

            message =
                data.message ||
                data.error ||
                data.statusCode ||
                message;

        }catch(error){

            /* Ignore response parsing errors. */

        }


        throw new Error(
            message
        );

    }


    const imageUrl =
        SUPABASE_URL +
        "/storage/v1/object/public/" +
        BUSINESS_IMAGE_BUCKET +
        "/" +
        uploadPath;


    /*
     * When saveToDatabase is false, the picture is
     * uploaded to storage only.
     *
     * This is used when the picture may become the
     * new main business picture.
     */

    if(!saveToDatabase){

        return imageUrl;

    }


    const insertResponse =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/business_images",
            {
                method:"POST",

                headers:{
                    apikey:
                        SUPABASE_KEY,

                    Authorization:
                        "Bearer " +
                        accessToken,

                    "Content-Type":
                        "application/json",

                    Accept:
                        "application/json",

                    Prefer:
                        "return=representation"
                },

                body:
                    JSON.stringify(
                        {
                            business_id:
                                String(
                                    businessId
                                ),

                            user_id:
                                String(
                                    userId
                                ),

                            image_url:
                                imageUrl,

                            sort_order:
                                sortOrder
                        }
                    )
            }
        );


    if(!insertResponse.ok){

        let message =
            "Picture uploaded but could not be saved.";

        try{

            const data =
                await insertResponse.json();

            message =
                data.message ||
                data.details ||
                data.hint ||
                message;

        }catch(error){

            /* Ignore response parsing errors. */

        }


        throw new Error(
            message
        );

    }


    return imageUrl;

}

            modal.style.display =
                "none";

            editSelectedFiles =
                [];

            editImagesToRemove =
                new Set();

        }


        if(closeButton){

            closeButton.addEventListener(
                "click",
                closeEditModal
            );

        }


        if(cancelButton){

            cancelButton.addEventListener(
                "click",
                closeEditModal
            );

        }


        modal.addEventListener(
            "click",
            function(event){

                if(
                    event.target ===
                    modal
                ){

                    closeEditModal();

                }

            }
        );


        /* -----------------------------------------------------
           IMAGE INPUT
        ----------------------------------------------------- */

        const imageInput =
            document.getElementById(
                "shopEditBusinessImages"
            );


        if(imageInput){

            imageInput.addEventListener(
                "change",
                handleEditImageSelection
            );

        }


        /* -----------------------------------------------------
           SAVE BUSINESS
        ----------------------------------------------------- */

        const form =
            document.getElementById(
                "shopEditBusinessForm"
            );


        if(form){

            form.addEventListener(
                "submit",
                async function(event){

                    event.preventDefault();


                    const name =
                        document
                            .getElementById(
                                "shopEditBusinessName"
                            )
                            ?.value
                            .trim() || "";


                    const category =
                        document
                            .getElementById(
                                "shopEditBusinessCategory"
                            )
                            ?.value
                            .trim() || "";


                    const location =
                        document
                            .getElementById(
                                "shopEditBusinessLocation"
                            )
                            ?.value
                            .trim() || "";


                    const phone =
                        document
                            .getElementById(
                                "shopEditBusinessPhone"
                            )
                            ?.value
                            .trim() || "";


                    const priceInput =
                        document
                            .getElementById(
                                "shopEditBusinessPrice"
                            )
                            ?.value
                            .trim() || "";


                    const description =
                        document
                            .getElementById(
                                "shopEditBusinessDescription"
                            )
                            ?.value
                            .trim() || "";


                    const errorElement =
                        document.getElementById(
                            "shopEditBusinessError"
                        );


                    const saveButton =
                        document.getElementById(
                            "shopEditBusinessSave"
                        );


                    if(
                        !name ||
                        !category ||
                        !location
                    ){

                        if(errorElement){

                            errorElement.textContent =
                                "Please complete the required fields.";

                            errorElement.style.display =
                                "block";

                        }

                        return;

                    }


                    if(
                        priceInput !== "" &&
                        (
                            Number.isNaN(
                                Number(
                                    priceInput
                                )
                            ) ||
                            Number(
                                priceInput
                            ) < 0
                        )
                    ){

                        if(errorElement){

                            errorElement.textContent =
                                "Please enter a valid price.";

                            errorElement.style.display =
                                "block";

                        }

                        return;

                    }


                    const totalImages =
                        getCurrentEditImageCount() +
                        editSelectedFiles.length;


                    if(
                        totalImages >
                        MAX_BUSINESS_IMAGES
                    ){

                        if(errorElement){

                            errorElement.textContent =
                                "You can have a maximum of 5 pictures.";

                            errorElement.style.display =
                                "block";

                        }

                        return;

                    }


                    if(saveButton){

                        saveButton.disabled =
                            true;

                        saveButton.textContent =
                            "Saving...";

                    }


                    if(errorElement){

                        errorElement.style.display =
                            "none";

                    }


                    try{

                        /* ---------------------------------
                           FRESH AUTH TOKEN
                        --------------------------------- */

                        const accessToken =
                            await getShopAccessToken();


                        if(!accessToken){

                            throw new Error(
                                "Your login session has expired. Please log in again."
                            );

                        }


                        /* ---------------------------------
                           LOAD CURRENT IMAGES
                        --------------------------------- */

                        currentBusinessImages =
                            await getEditableBusinessImages(
                                business.id,
                                accessToken
                            );


                        /*
                         * Re-check the image count after
                         * loading the latest Supabase data.
                         */

                        const freshImageCount =
                            getCurrentEditImageCount() +
                            editSelectedFiles.length;


                        if(
                            freshImageCount >
                            MAX_BUSINESS_IMAGES
                        ){

                            throw new Error(
                                "You can have a maximum of 5 pictures."
                            );

                        }


                        /* ---------------------------------
                           DETERMINE CURRENT MAIN PICTURE
                        --------------------------------- */

                        const currentMainUrl =
                            currentBusiness &&
                            (
                                currentBusiness.image_url ||
                                currentBusiness.image ||
                                ""
                            );


                        const keepCurrentMain =
                            Boolean(
                                currentMainUrl
                            ) &&
                            !editImagesToRemove.has(
                                "__main__"
                            );


                        /*
                         * If the main picture is kept,
                         * preserve it.
                         *
                         * If it was removed, the first
                         * newly uploaded picture will become
                         * the new main picture.
                         */

                        let uploadedUrls = [];


                        /* ---------------------------------
                           UPLOAD NEW PICTURES TO STORAGE
                           ONLY
                        --------------------------------- */

                        for(
                            let index = 0;
                            index < editSelectedFiles.length;
                            index++
                        ){

                            const file =
                                editSelectedFiles[index];


                            const imageUrl =
                                await uploadBusinessImage(
                                    file,
                                    business.id,
                                    user.id,
                                    accessToken,
                                    0,
                                    false
                                );


                            uploadedUrls.push(
                                imageUrl
                            );

                        }


                        let finalMainUrl =
                            keepCurrentMain
                                ? currentMainUrl
                                : (
                                    uploadedUrls.length
                                        ? uploadedUrls[0]
                                        : ""
                                );


                        /* ---------------------------------
                           UPDATE BUSINESS
                        --------------------------------- */

                        const businessUpdate = {

                            name:
                                name,

                            category:
                                category,

                            location:
                                location,

                            phone:
                                phone,

                            description:
                                description,

                            price:
                                priceInput === ""
                                    ? null
                                    : Number(
                                        priceInput
                                    ),

                            image_url:
                                finalMainUrl ||
                                null

                        };


                        /*
                         * Clear the legacy image column too
                         * when it exists on this business.
                         *
                         * This prevents an old image value from
                         * coming back after the main picture is
                         * removed.
                         */

                        if(
                            Object.prototype.hasOwnProperty.call(
                                currentBusiness,
                                "image"
                            )
                        ){

                            businessUpdate.image =
                                finalMainUrl ||
                                null;

                        }


                        const response =
                            await fetch(
                                SUPABASE_URL +
                                "/rest/v1/businesses?id=eq." +
                                encodeURIComponent(
                                    String(
                                        business.id
                                    )
                                ) +
                                "&user_id=eq." +
                                encodeURIComponent(
                                    String(
                                        user.id
                                    )
                                ),
                                {

                                    method:
                                        "PATCH",

                                    headers:{

                                        "apikey":
                                            SUPABASE_KEY,

                                        "Authorization":
                                            "Bearer " +
                                            accessToken,

                                        "Content-Type":
                                            "application/json",

                                        "Accept":
                                            "application/json",

                                        "Prefer":
                                            "return=representation"

                                    },

                                    body:
                                        JSON.stringify(
                                            businessUpdate
                                        )

                                }
                            );


                        const responseText =
                            await response.text();


                        let result =
                            null;


                        try{

                            result =
                                responseText
                                    ? JSON.parse(
                                        responseText
                                    )
                                    : null;

                        }catch{

                            result =
                                responseText;

                        }


                        if(!response.ok){

                            const message =
                                result &&
                                typeof result ===
                                    "object"
                                    ? (
                                        result.message ||
                                        result.details ||
                                        result.hint
                                    )
                                    : null;


                            throw new Error(
                                message ||
                                "Could not save your changes."
                            );

                        }


                        /* ---------------------------------
                           DELETE REMOVED PHOTO ROWS
                        --------------------------------- */

                        const rowsToDelete =
                            Array.from(
                                editImagesToRemove
                            )
                            .filter(
                                function(id){

                                    return (
                                        id &&
                                        id !==
                                        "__main__"
                                    );

                                }
                            );


                        for(
                            let index = 0;
                            index < rowsToDelete.length;
                            index++
                        ){

                            const imageId =
                                rowsToDelete[index];


                            const deleteResponse =
                                await fetch(
                                    SUPABASE_URL +
                                    "/rest/v1/business_images?id=eq." +
                                    encodeURIComponent(
                                        String(
                                            imageId
                                        )
                                    ) +
                                    "&business_id=eq." +
                                    encodeURIComponent(
                                        String(
                                            business.id
                                        )
                                    ) +
                                    "&user_id=eq." +
                                    encodeURIComponent(
                                        String(
                                            user.id
                                        )
                                    ),
                                    {

                                        method:
                                            "DELETE",

                                        headers:{

                                            "apikey":
                                                SUPABASE_KEY,

                                            "Authorization":
                                                "Bearer " +
                                                accessToken,

                                            "Accept":
                                                "application/json",

                                            "Prefer":
                                                "return=minimal"

                                        }

                                    }
                                );


                            if(!deleteResponse.ok){

                                throw new Error(
                                    "Business details saved, but one or more pictures could not be removed."
                                );

                            }

                        }


                        /* ---------------------------------
                           SAVE NEW ADDITIONAL PICTURES
                        --------------------------------- */

                        const newAdditionalUrls =
                            keepCurrentMain
                                ? uploadedUrls
                                : uploadedUrls.slice(1);


                        if(
                            newAdditionalUrls.length
                        ){

                            const existingAdditionalImages =
                                Array.isArray(
                                    currentBusinessImages
                                )
                                    ? currentBusinessImages.filter(
                                        function(item){

                                            return (
                                                item &&
                                                item.image_url &&
                                                !editImagesToRemove.has(
                                                    String(
                                                        item.id
                                                    )
                                                )
                                            );

                                        }
                                    )
                                    : [];


                            let nextSortOrder =
                                existingAdditionalImages.length;


                            /*
                             * Keep sort_order after the
                             * existing additional pictures.
                             */

                            const imageRows =
                                newAdditionalUrls.map(
                                    function(imageUrl,index){

                                        return {

                                            business_id:
                                                String(
                                                    business.id
                                                ),

                                            user_id:
                                                String(
                                                    user.id
                                                ),

                                            image_url:
                                                imageUrl,

                                            sort_order:
                                                nextSortOrder +
                                                index

                                        };

                                    }
                                );


                            const insertResponse =
                                await fetch(
                                    SUPABASE_URL +
                                    "/rest/v1/business_images",
                                    {

                                        method:
                                            "POST",

                                        headers:{

                                            "apikey":
                                                SUPABASE_KEY,

                                            "Authorization":
                                                "Bearer " +
                                                accessToken,

                                            "Content-Type":
                                                "application/json",

                                            "Accept":
                                                "application/json",

                                            "Prefer":
                                                "return=representation"

                                        },

                                        body:
                                            JSON.stringify(
                                                imageRows
                                            )

                                    }
                                );


                            if(!insertResponse.ok){

                                let message =
                                    "Pictures uploaded but could not be saved.";

                                try{

                                    const data =
                                        await insertResponse.json();

                                    message =
                                        data.message ||
                                        data.details ||
                                        data.hint ||
                                        message;

                                }catch(error){

                                    /* Ignore response parsing errors. */

                                }


                                throw new Error(
                                    message
                                );

                            }

                        }


                        /* ---------------------------------
                           UPDATE CURRENT STOREFRONT DATA
                        --------------------------------- */

                        currentBusiness = {

                            ...currentBusiness,

                            ...businessUpdate

                        };


                        /*
                         * Refresh images from Supabase so the
                         * storefront immediately reflects the
                         * saved picture changes.
                         */

                        currentBusinessImages =
                            await getEditableBusinessImages(
                                business.id,
                                accessToken
                            );


                        /* ---------------------------------
                           CLOSE MODAL
                        --------------------------------- */

                        modal.classList.remove(
                            "show"
                        );

                        modal.setAttribute(
                            "aria-hidden",
                            "true"
                        );

                        modal.style.display =
                            "none";


                        editSelectedFiles =
                            [];

                        editImagesToRemove =
                            new Set();


                        /* ---------------------------------
                           REFRESH STOREFRONT
                        --------------------------------- */

                        await renderBusiness(
                            currentBusiness
                        );


                        showToast(
                            "Business updated successfully!"
                        );


                    }catch(error){

                        console.error(
                            "LosOja: Edit business save error:",
                            error
                        );


                        if(errorElement){

                            errorElement.textContent =
                                error.message ||
                                "Could not save your changes.";

                            errorElement.style.display =
                                "block";

                        }

                    }finally{

                        if(saveButton){

                            saveButton.disabled =
                                false;

                            saveButton.textContent =
                                "Save Changes";

                        }

                    }

                }
            );

        }

    }


    /* -----------------------------------------------------
       FILL FORM
    ----------------------------------------------------- */

    const nameInput =
        document.getElementById(
            "shopEditBusinessName"
        );


    const categoryInput =
        document.getElementById(
            "shopEditBusinessCategory"
        );


    const locationInput =
        document.getElementById(
            "shopEditBusinessLocation"
        );


    const phoneInput =
        document.getElementById(
            "shopEditBusinessPhone"
        );


    const priceInput =
        document.getElementById(
            "shopEditBusinessPrice"
        );


    const descriptionInput =
        document.getElementById(
            "shopEditBusinessDescription"
        );


    if(nameInput){

        nameInput.value =
            business.name || "";

    }


    if(categoryInput){

        categoryInput.value =
            business.category || "";

    }


    if(locationInput){

        locationInput.value =
            business.location || "";

    }


    if(phoneInput){

        phoneInput.value =
            business.phone || "";

    }


    if(priceInput){

        priceInput.value =
            business.price !== null &&
            business.price !== undefined
                ? business.price
                : "";

    }


    if(descriptionInput){

        descriptionInput.value =
            business.description || "";

    }


    /* -----------------------------------------------------
       RESET EDIT STATE
    ----------------------------------------------------- */

    editImagesToRemove =
        new Set();

    editSelectedFiles =
        [];


    /* -----------------------------------------------------
       LOAD CURRENT PICTURES
    ----------------------------------------------------- */

    try{

        const accessToken =
            await getShopAccessToken();


        if(!accessToken){

            throw new Error(
                "Your login session has expired."
            );

        }


        currentBusinessImages =
            await getEditableBusinessImages(
                business.id,
                accessToken
            );

    }catch(error){

        console.error(
            "LosOja: Could not load edit pictures:",
            error
        );

        currentBusinessImages =
            [];

        showToast(
            "The business editor opened, but current extra pictures could not be loaded."
        );

    }


    const imageGrid =
        document.getElementById(
            "shopEditBusinessImageGrid"
        );


    renderEditImages(
        imageGrid
    );


    renderNewImagePreviews();

    updateEditImageCount();


    /* -----------------------------------------------------
       SHOW MODAL
    ----------------------------------------------------- */

    modal.style.display =
        "flex";

    modal.classList.add(
        "show"
    );

    modal.setAttribute(
        "aria-hidden",
        "false"
    );


    if(nameInput){

        setTimeout(
            function(){

                nameInput.focus();

            },
            50
        );

    }

}

/* =========================================================
   DELETE BUSINESS
========================================================= */

async function deleteCurrentBusiness(){

    if(
        !currentBusiness ||
        !currentBusiness.id
    ){

        showToast(
            "Business information is missing."
        );

        return;

    }


    const user =
        await getShopUser();

    if(!user){

        closeDeleteModal();

        await requireShopLogin();

        return;

    }


    if(
        String(user.id) !==
        String(
            currentBusiness.user_id
        )
    ){

        closeDeleteModal();

        showToast(
            "You can only delete your own business."
        );

        return;

    }


    currentAccessToken =
        await getShopAccessToken();


    if(!currentAccessToken){

        closeDeleteModal();

        try{

            sessionStorage.setItem(
                "losoja_return_to_shop",
                window.location.href
            );

        }catch(error){

            /* Ignore storage errors. */

        }

        window.location.href =
            "index.html#login";

        return;

    }


    const confirmButton =
        document.getElementById(
            "confirmDeleteBtn"
        );

    if(confirmButton){

        confirmButton.disabled =
            true;

        confirmButton.textContent =
            "Deleting...";

    }


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/businesses?id=eq." +
                encodeURIComponent(
                    String(
                        currentBusiness.id
                    )
                ) +
                "&user_id=eq." +
                encodeURIComponent(
                    String(
                        user.id
                    )
                ),
                {
                    method:"DELETE",

                    headers:{
                        apikey:
                            SUPABASE_KEY,

                        Authorization:
                            "Bearer " +
                            currentAccessToken,

                        Accept:
                            "application/json",

                        Prefer:
                            "return=minimal"
                    }
                }
            );


        if(!response.ok){

            let message =
                "Business could not be deleted.";

            try{

                const data =
                    await response.json();

                message =
                    data.message ||
                    data.error_description ||
                    data.details ||
                    data.hint ||
                    message;

            }catch(error){

                /* Ignore JSON parsing failure. */

            }

            throw new Error(
                message
            );

        }


        closeDeleteModal();

        showToast(
            "Business deleted successfully."
        );


        setTimeout(
            function(){

                window.location.href =
                    "index.html";

            },
            900
        );


    }catch(error){

        console.error(
            "LosOja delete business error:",
            error
        );

        showToast(
            error.message ||
            "Business could not be deleted."
        );


    }finally{

        if(confirmButton){

            confirmButton.disabled =
                false;

            confirmButton.textContent =
                "Delete Business";

        }

    }

}


/* =========================================================
   BUSINESS PHOTOS
========================================================= */

async function loadBusinessImages(
    businessId
){

    gallery.innerHTML =
        `
            <div class="empty-gallery">
                Loading business photos...
            </div>
        `;


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/business_images" +
                "?business_id=eq." +
                encodeURIComponent(
                    String(
                        businessId
                    )
                ) +
                "&select=*" +
                "&order=sort_order.asc,created_at.asc",
                {
                    method:"GET",

                    headers:{
                        apikey:
                            SUPABASE_KEY,

                        Authorization:
                            "Bearer " +
                            SUPABASE_KEY,

                        Accept:
                            "application/json"
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "Could not load business photos."
            );

        }


        const images =
            await response.json();


        currentBusinessImages =
            Array.isArray(
                images
            )
                ? images
                : [];


        if(
            currentBusinessImages.length ===
            0
        ){

            gallery.innerHTML =
                `
                    <div class="empty-gallery">
                        No additional business photos yet.
                    </div>
                `;

            return;

        }


        gallery.innerHTML =
            "";


        currentBusinessImages.forEach(
            function(item){

                const imageUrl =
                    item.image_url ||
                    item.url ||
                    item.image;

                if(!imageUrl){
                    return;
                }


                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "gallery-item";

                button.setAttribute(
                    "aria-label",
                    "Open business photo"
                );


                const image =
                    document.createElement(
                        "img"
                    );

                image.src =
                    imageUrl;

                image.alt =
                    currentBusiness?.name ||
                    "Business photo";

                image.loading =
                    "lazy";


                image.addEventListener(
                    "error",
                    function(){

                        button.remove();

                        if(
                            gallery.children.length ===
                            0
                        ){

                            gallery.innerHTML =
                                `
                                    <div class="empty-gallery">
                                        No business photos are available.
                                    </div>
                                `;

                        }

                    }
                );


                button.appendChild(
                    image
                );


                button.addEventListener(
                    "click",
                    function(){

                        openImageViewer(
                            imageUrl
                        );

                    }
                );


                gallery.appendChild(
                    button
                );

            }
        );


        if(
            gallery.children.length ===
            0
        ){

            gallery.innerHTML =
                `
                    <div class="empty-gallery">
                        No business photos are available.
                    </div>
                `;

        }

    }catch(error){

        console.error(
            "LosOja business images error:",
            error
        );

        gallery.innerHTML =
            `
                <div class="empty-gallery">
                    Business photos could not be loaded.
                </div>
            `;

    }

}


/* =========================================================
   SAVE BUSINESS
========================================================= */

function getSavedBusinesses(){

    try{

        const raw =
            localStorage.getItem(
                "losoja_saved_businesses"
            );

        if(!raw){
            return [];
        }

        const parsed =
            JSON.parse(
                raw
            );

        return Array.isArray(
            parsed
        )
            ? parsed
            : [];

    }catch(error){

        return [];

    }

}


function setSavedBusinesses(
    list
){

    try{

        localStorage.setItem(
            "losoja_saved_businesses",
            JSON.stringify(
                list
            )
        );

    }catch(error){

        console.warn(
            "LosOja: Could not save business locally."
        );

    }

}


function setupSaveButton(
    business
){

    if(!saveBtn){
        return;
    }


    const saved =
        getSavedBusinesses();


    const id =
        String(
            business.id
        );


    if(
        saved.includes(
            id
        )
    ){

        saveBtn.textContent =
            "♥ Saved";

        saveBtn.classList.add(
            "saved"
        );

    }else{

        saveBtn.textContent =
            "♡ Save";

        saveBtn.classList.remove(
            "saved"
        );

    }


    saveBtn.onclick =
        function(){

            const current =
                getSavedBusinesses();

            const exists =
                current.includes(
                    id
                );


            if(exists){

                const updated =
                    current.filter(
                        function(item){

                            return String(
                                item
                            ) !==
                            id;

                        }
                    );

                setSavedBusinesses(
                    updated
                );

                saveBtn.textContent =
                    "♡ Save";

                saveBtn.classList.remove(
                    "saved"
                );

                showToast(
                    "Removed from Saved."
                );

            }else{

                current.push(
                    id
                );

                setSavedBusinesses(
                    current
                );

                saveBtn.textContent =
                    "♥ Saved";

                saveBtn.classList.add(
                    "saved"
                );

                showToast(
                    "Business saved."
                );

            }

        };

}

        "click",
        function(){

            closeImageViewer();

        }
    );


imageViewer.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            imageViewer
        ){

            closeImageViewer();

        }

    }
);


document
    .getElementById(
        "cancelDeleteBtn"
    )
    .addEventListener(
        "click",
        function(){

            closeDeleteModal();

        }
    );


document
    .getElementById(
        "confirmDeleteBtn"
    )
    .addEventListener(
        "click",
        function(){

            deleteCurrentBusiness();

        }
    );


deleteModal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            deleteModal
        ){

            closeDeleteModal();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Escape"
        ){

            closeImageViewer();

            closeDeleteModal();

            const editModal =
                document.getElementById(
                    "shopEditBusinessModal"
                );

            if(editModal){

                editModal.classList.remove(
                    "show"
                );

                editModal.setAttribute(
                    "aria-hidden",
                    "true"
                );

                editModal.style.display =
                    "none";

            }

        }

    }
);


/* =========================================================
   START
========================================================= */

loadBusiness();

</script>
