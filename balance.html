<script>

/* =========================================================
   LOSOJA SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://ycxshwgeebskdozmornh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe";


/* =========================================================
   AUTH TOKEN
========================================================= */

async function getAccessToken() {

    try {

        if (
            typeof window.getSupabaseAccessToken ===
            "function"
        ) {

            return await window.getSupabaseAccessToken();

        }

        if (
            window.losojaSupabase &&
            window.losojaSupabase.auth
        ) {

            const {
                data
            } = await window.losojaSupabase.auth.getSession();

            return data?.session?.access_token || null;

        }

        return null;

    } catch (error) {

        console.error(
            "LosOja: token error:",
            error
        );

        return null;

    }

}


/* =========================================================
   HEADERS
========================================================= */

async function getHeaders() {

    const token =
        await getAccessToken();

    const headers = {

        "Content-Type":
            "application/json",

        "apikey":
            SUPABASE_KEY

    };

    if (token) {

        headers.Authorization =
            `Bearer ${token}`;

    }

    return headers;

}


/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function supabaseRequest(
    endpoint,
    options = {}
) {

    const headers =
        await getHeaders();

    const response =
        await fetch(
            SUPABASE_URL + endpoint,
            {
                ...options,
                headers: {
                    ...headers,
                    ...(options.headers || {})
                }
            }
        );

    const text =
        await response.text();

    let data = null;

    try {

        data =
            text
                ? JSON.parse(text)
                : null;

    } catch {

        data = text;

    }

    if (!response.ok) {

        console.error(
            "LosOja Supabase error:",
            data
        );

        throw new Error(
            data?.message ||
            data?.error ||
            data?.hint ||
            "Supabase request failed"
        );

    }

    return data;

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   GET CURRENT USER
========================================================= */

async function getCurrentUserId() {

    try {

        if (
            typeof window.getCurrentUser ===
            "function"
        ) {

            const user =
                await window.getCurrentUser();

            if (user?.id) {

                return user.id;

            }

        }

    } catch (error) {

        console.warn(
            "LosOja: getCurrentUser failed:",
            error
        );

    }


    try {

        const token =
            await getAccessToken();

        if (!token) {

            return null;

        }

        const user =
            await supabaseRequest(
                "/auth/v1/user"
            );

        return user?.id || null;

    } catch (error) {

        console.error(
            "LosOja: unable to get current user:",
            error
        );

        return null;

    }

}


/* =========================================================
   LOAD WALLET
========================================================= */

async function loadWallet() {

    const balanceElement =
        document.getElementById(
            "balanceAmount"
        );

    if (!balanceElement) {

        return;

    }

    try {

        const userId =
            await getCurrentUserId();

        if (!userId) {

            balanceElement.textContent =
                "₦0.00";

            return;

        }

        const data =
            await supabaseRequest(
                `/rest/v1/wallets?select=balance,currency&user_id=eq.${encodeURIComponent(userId)}&limit=1`
            );

        if (
            !data ||
            !data.length
        ) {

            balanceElement.textContent =
                "₦0.00";

            return;

        }

        const wallet =
            data[0];

        const balance =
            Number(wallet.balance || 0);

        balanceElement.textContent =
            `₦${balance.toLocaleString(
                "en-NG",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            )}`;

    } catch (error) {

        console.error(
            "LosOja: wallet load error:",
            error
        );

        balanceElement.textContent =
            "₦0.00";

    }

}


/* =========================================================
   FORMAT TRANSACTION TYPE
========================================================= */

function formatTransactionType(
    type
) {

    const names = {

        deposit:
            "Deposit",

        withdrawal:
            "Withdrawal",

        escrow_hold:
            "Escrow Hold",

        escrow_release:
            "Escrow Release",

        escrow_refund:
            "Escrow Refund"

    };

    return (
        names[type] ||
        String(type || "Transaction")
            .replace(/_/g, " ")
            .replace(
                /\b\w/g,
                letter =>
                    letter.toUpperCase()
            )
    );

}


/* =========================================================
   LOAD TRANSACTIONS
========================================================= */

async function loadTransactions() {

    const container =
        document.getElementById(
            "transactions"
        );

    if (!container) {

        return;

    }

    container.innerHTML =
        `<div class="loading">
            Loading transactions...
        </div>`;

    try {

        const userId =
            await getCurrentUserId();

        if (!userId) {

            container.innerHTML =
                `<div class="empty">
                    Please login to view transactions.
                </div>`;

            return;

        }

        const data =
            await supabaseRequest(
                `/rest/v1/wallet_transactions?select=*&user_id=eq.${encodeURIComponent(userId)}&order=created_at.desc&limit=50`
            );

        if (
            !data ||
            !data.length
        ) {

            container.innerHTML =
                `<div class="empty">
                    No transactions yet.
                </div>`;

            return;

        }

        container.innerHTML =
            data.map(transaction => {

                const type =
                    transaction.type ||
                    "transaction";

                const amount =
                    Number(
                        transaction.amount || 0
                    );

                const positive =
                    type === "deposit" ||
                    type === "escrow_release" ||
                    type === "escrow_refund";

                const sign =
                    positive
                        ? "+"
                        : "-";

                const className =
                    positive
                        ? "positive"
                        : "negative";

                const date =
                    transaction.created_at
                        ? new Date(
                            transaction.created_at
                        ).toLocaleString(
                            "en-NG"
                        )
                        : "";

                return `

                    <div class="transaction">

                        <div class="transaction-row">

                            <div>

                                <div class="transaction-type">
                                    ${escapeHTML(
                                        formatTransactionType(type)
                                    )}
                                </div>

                                <div>
                                    ${escapeHTML(
                                        transaction.description || ""
                                    )}
                                </div>

                                <div class="transaction-date">
                                    ${escapeHTML(date)}
                                </div>

                            </div>

                            <div class="${className}">
                                ${sign}₦${amount.toLocaleString(
                                    "en-NG",
                                    {
                                        minimumFractionDigits: 2,
                                        maximumFractionDigits: 2
                                    }
                                )}
                            </div>

                        </div>

                    </div>

                `;

            }).join("");

    } catch (error) {

        console.error(
            "LosOja: transactions error:",
            error
        );

        container.innerHTML =
            `<div class="error">
                Unable to load transactions.
            </div>`;

    }

}


/* =========================================================
   DEPOSIT
========================================================= */

async function depositFunds() {

    try {

        if (
            typeof window.losojaDepositFunds ===
            "function"
        ) {

            await window.losojaDepositFunds();

            await loadWallet();

            await loadTransactions();

            return;

        }

        alert(
            "Deposit system is not available yet."
        );

    } catch (error) {

        console.error(
            "LosOja deposit error:",
            error
        );

        alert(
            error.message ||
            "Unable to start deposit."
        );

    }

}


/* =========================================================
   WITHDRAW
========================================================= */

async function withdrawFunds() {

    alert(
        "Withdrawals will be available soon."
    );

}


/* =========================================================
   RELEASE ESCROW
========================================================= */

async function releaseEscrow(
    escrowId
) {

    return await supabaseRequest(
        "/rest/v1/rpc/release_escrow",
        {
            method: "POST",

            body: JSON.stringify({
                p_escrow_id:
                    escrowId
            })
        }
    );

}


/* =========================================================
   REFUND ESCROW
========================================================= */

async function refundEscrow(
    escrowId
) {

    return await supabaseRequest(
        "/rest/v1/rpc/refund_escrow",
        {
            method: "POST",

            body: JSON.stringify({
                p_escrow_id:
                    escrowId
            })
        }
    );

}


/* =========================================================
   MARK ESCROW SHIPPED
========================================================= */

async function markEscrowShipped(
    escrowId
) {

    return await supabaseRequest(
        "/rest/v1/rpc/mark_escrow_shipped",
        {
            method: "POST",

            body: JSON.stringify({
                p_escrow_id:
                    escrowId
            })
        }
    );

}


/* =========================================================
   CONFIRM DELIVERY
========================================================= */

async function confirmEscrowDelivery(
    escrowId
) {

    return await supabaseRequest(
        "/rest/v1/rpc/confirm_escrow_delivery",
        {
            method: "POST",

            body: JSON.stringify({
                p_escrow_id:
                    escrowId
            })
        }
    );

}


/* =========================================================
   DISPUTE ESCROW
========================================================= */

async function disputeEscrow(
    escrowId,
    reason
) {

    return await supabaseRequest(
        "/rest/v1/rpc/dispute_escrow",
        {
            method: "POST",

            body: JSON.stringify({
                p_escrow_id:
                    escrowId,

                p_reason:
                    reason
            })
        }
    );

}


/* =========================================================
   STATUS LABEL
========================================================= */

function formatEscrowStatus(
    status
) {

    const labels = {

        funded:
            "Funded",

        shipped:
            "Shipped",

        delivered:
            "Delivered",

        disputed:
            "Disputed",

        released:
            "Released",

        refunded:
            "Refunded"

    };

    return (
        labels[status] ||
        String(status || "Unknown")
            .replace(/_/g, " ")
    );

}


/* =========================================================
   LOAD ESCROW TRANSACTIONS
========================================================= */

async function loadEscrowTransactions(
    section
) {

    if (!section) {

        return;

    }

    section.innerHTML =
        `<div class="loading">
            Loading escrow transactions...
        </div>`;

    try {

        const userId =
            await getCurrentUserId();

        if (!userId) {

            section.innerHTML =
                `<div class="empty">
                    Please login to view escrow transactions.
                </div>`;

            return;

        }

        const data =
            await supabaseRequest(
                `/rest/v1/escrow_transactions?select=*&or=(buyer_id.eq.${encodeURIComponent(userId)},seller_id.eq.${encodeURIComponent(userId)})&order=created_at.desc&limit=30`
            );

        if (
            !data ||
            !data.length
        ) {

            section.innerHTML =
                `<div class="empty">
                    No escrow transactions yet.
                </div>`;

            return;

        }


        section.innerHTML =
            data.map(transaction => {

                const amount =
                    Number(
                        transaction.amount || 0
                    );

                const isBuyer =
                    transaction.buyer_id ===
                    userId;

                const isSeller =
                    transaction.seller_id ===
                    userId;

                const status =
                    String(
                        transaction.status ||
                        ""
                    ).toLowerCase();

                const created =
                    transaction.created_at
                        ? new Date(
                            transaction.created_at
                        ).toLocaleString(
                            "en-NG"
                        )
                        : "";

                const shipped =
                    transaction.shipped_at
                        ? new Date(
                            transaction.shipped_at
                        ).toLocaleString(
                            "en-NG"
                        )
                        : "";

                const delivered =
                    transaction.delivered_at
                        ? new Date(
                            transaction.delivered_at
                        ).toLocaleString(
                            "en-NG"
                        )
                        : "";

                const description =
                    escapeHTML(
                        transaction.description ||
                        "Escrow transaction"
                    );

                const disputeReason =
                    escapeHTML(
                        transaction.dispute_reason ||
                        ""
                    );

                let role =
                    "Participant";

                if (isBuyer) {

                    role =
                        "Buyer";

                } else if (isSeller) {

                    role =
                        "Seller";

                }


                /* -----------------------------------------
                   ACTION BUTTONS
                ------------------------------------------ */

                let actions = "";

                /*
                   SELLER:
                   funded -> mark shipped
                */

                if (
                    isSeller &&
                    status === "funded"
                ) {

                    actions = `

                        <div
                            class="escrow-actions"
                        >

                            <button
                                class="ship-btn"
                                onclick="handleMarkEscrowShipped(
                                    '${transaction.id}',
                                    this
                                )"
                            >
                                Mark as Shipped
                            </button>

                        </div>

                    `;

                }


                /*
                   BUYER:
                   funded -> refund only
                */

                if (
                    isBuyer &&
                    status === "funded"
                ) {

                    actions = `

                        <div
                            class="escrow-actions"
                        >

                            <button
                                class="refund-btn"
                                onclick="handleRefundEscrow(
                                    '${transaction.id}',
                                    this
                                )"
                            >
                                Refund
                            </button>

                        </div>

                        <div class="escrow-note">
                            You can refund this payment before the seller ships.
                        </div>

                    `;

                }


                /*
                   BUYER:
                   shipped -> confirm delivery or dispute
                */

                if (
                    isBuyer &&
                    status === "shipped"
                ) {

                    actions = `

                        <div
                            class="escrow-actions"
                        >

                            <button
                                class="confirm-btn"
                                onclick="handleConfirmEscrowDelivery(
                                    '${transaction.id}',
                                    this
                                )"
                            >
                                Confirm Delivery
                            </button>

                            <button
                                class="dispute-btn"
                                onclick="handleDisputeEscrow(
                                    '${transaction.id}',
                                    this
                                )"
                            >
                                Dispute
                            </button>

                        </div>

                    `;

                }


                /*
                   BUYER:
                   delivered -> release or dispute
                */

                if (
                    isBuyer &&
                    status === "delivered"
                ) {

                    actions = `

                        <div
                            class="escrow-actions"
                        >

                            <button
                                class="release-btn"
                                onclick="handleReleaseEscrow(
                                    '${transaction.id}',
                                    this
                                )"
                            >
                                Release to Seller
                            </button>

                            <button
                                class="dispute-btn"
                                onclick="handleDisputeEscrow(
                                    '${transaction.id}',
                                    this
                                )"
                            >
                                Dispute
                            </button>

                        </div>

                    `;

                }


                /*
                   SELLER:
                   shipped -> waiting
                */

                if (
                    isSeller &&
                    status === "shipped"
                ) {

                    actions = `

                        <div class="escrow-note">
                            Waiting for the buyer to confirm delivery.
                        </div>

                    `;

                }


                /*
                   SELLER:
                   delivered -> waiting for release
                */

                if (
                    isSeller &&
                    status === "delivered"
                ) {

                    actions = `

                        <div class="escrow-note">
                            Delivery confirmed. Waiting for buyer to release payment.
                        </div>

                    `;

                }


                /*
                   DISPUTED
                */

                if (
                    status === "disputed"
                ) {

                    actions = `

                        <div class="escrow-dispute">

                            <strong>
                                Dispute opened.
                            </strong>

                            ${
                                disputeReason
                                    ? `
                                        <div style="margin-top:5px;">
                                            ${disputeReason}
                                        </div>
                                    `
                                    : ""
                            }

                            <div style="margin-top:5px;">
                                LosOja will review the dispute before the payment is released or refunded.
                            </div>

                        </div>

                    `;

                }


                return `

                    <div class="escrow-item">

                        <div class="escrow-description">
                            ${description}
                        </div>

                        <div class="escrow-line">
                            <strong>Role:</strong>
                            ${role}
                        </div>

                        <div class="escrow-line">
                            <strong>Amount:</strong>
                            ₦${amount.toLocaleString(
                                "en-NG",
                                {
                                    minimumFractionDigits: 2,
                                    maximumFractionDigits: 2
                                }
                            )}
                        </div>

                        <div class="escrow-line">
                            <strong>Status:</strong>
                            <span class="escrow-status">
                                ${escapeHTML(
                                    formatEscrowStatus(status)
                                )}
                            </span>
                        </div>

                        <div class="escrow-line">
                            <strong>Created:</strong>
                            ${escapeHTML(created)}
                        </div>

                        ${
                            shipped
                                ? `
                                    <div class="escrow-line">
                                        <strong>Shipped:</strong>
                                        ${escapeHTML(shipped)}
                                    </div>
                                `
                                : ""
                        }

                        ${
                            delivered
                                ? `
                                    <div class="escrow-line">
                                        <strong>Delivered:</strong>
                                        ${escapeHTML(delivered)}
                                    </div>
                                `
                                : ""
                        }

                        ${actions}

                    </div>

                `;

            }).join("");

    } catch (error) {

        console.error(
            "LosOja: escrow load error:",
            error
        );

        section.innerHTML =
            `<div class="error">
                Unable to load escrow transactions.
            </div>`;

    }

}

/* =========================================================
   HANDLE DISPUTE
========================================================= */

async function handleDisputeEscrow(
    escrowId,
    button
) {

    const reason =
        prompt(
            "Why are you disputing this escrow?"
        );

    if (
        reason === null
    ) {

        return;

    }

    const trimmedReason =
        reason.trim();

    if (!trimmedReason) {

        alert(
            "Please enter a dispute reason."
        );

        return;

    }

    if (
        trimmedReason.length > 1000
    ) {

        alert(
            "Dispute reason must be 1000 characters or less."
        );

        return;

    }

    const actionButtons =
        button
            ?.parentElement
            ?.querySelectorAll(
                "button"
            );

    if (actionButtons) {

        actionButtons.forEach(
            btn => {
                btn.disabled = true;
            }
        );

    }

    try {

        await disputeEscrow(
            escrowId,
            trimmedReason
        );

        alert(
            "Dispute opened successfully."
        );

        const section =
            document.getElementById(
                "escrowInfo"
            );

        await loadEscrowTransactions(
            section
        );

    } catch (error) {

        console.error(
            "LosOja: dispute escrow error:",
            error
        );

        alert(

            "Unable to open dispute."
        );

        if (actionButtons) {

            actionButtons.forEach(
                btn => {
                    btn.disabled = false;
                }
            );

        }

    }

}
