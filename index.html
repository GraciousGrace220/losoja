<!-- =====================================================
     LOGIN MODAL
====================================================== -->

<div
    id="loginModal"
    class="modal-overlay hidden"
    aria-hidden="true"
>

<div class="modal-content">

    <button
        type="button"
        class="modal-close"
        aria-label="Close"
        onclick="closeModal('loginModal')"
    >
        ×
    </button>

    <h2>Welcome Back</h2>

    <p>
        Log in to your LosOja account.
    </p>

    <form id="loginForm">

        <label for="loginEmail">
            Email
        </label>

        <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="loginPassword">
            Password
        </label>

        <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            class="primary-button"
        >
            Log In
        </button>

        <button
            type="button"
            class="secondary-button"
            id="createAccountBtn"
        >
            Create Account
        </button>

    </form>

    <p
        id="loginError"
        class="error-message"
        aria-live="polite"
    ></p>

</div>

</div>

<!-- =====================================================
     SIGNUP MODAL
====================================================== -->

<div
    id="signupModal"
    class="modal-overlay hidden"
    aria-hidden="true"
>

<div class="modal-content">

    <button
        type="button"
        class="modal-close"
        aria-label="Close"
        onclick="closeModal('signupModal')"
    >
        ×
    </button>

    <h2>Create Your LosOja Account</h2>

    <p>
        Sign up to add businesses and use LosOja features.
    </p>

    <form id="signupForm">

        <label for="signupName">
            Name
        </label>

        <input
            id="signupName"
            type="text"
            placeholder="Enter your name"
            autocomplete="name"
            required
        >

        <label for="signupEmail">
            Email
        </label>

        <input
            id="signupEmail"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="signupPassword">
            Password
        </label>

        <input
            id="signupPassword"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            required
        >

        <button
            type="submit"
            class="primary-button"
        >
            Create Account
        </button>

    </form>

    <p
        id="signupError"
        class="error-message"
        aria-live="polite"
    ></p>

    <button
        type="button"
        class="secondary-button"
        id="backToLoginBtn"
    >
        Already have an account? Log In
    </button>

</div>

</div>

<!-- =====================================================
     LOGIN / SIGNUP HANDLERS
====================================================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    const createAccountBtn =
        document.getElementById("createAccountBtn");

    const backToLoginBtn =
        document.getElementById("backToLoginBtn");


    if (createAccountBtn) {

        createAccountBtn.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                if (
                    typeof window.openSignup ===
                    "function"
                ) {
                    window.openSignup();
                }

            }
        );

    }


    if (backToLoginBtn) {

        backToLoginBtn.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                if (
                    typeof window.closeModal ===
                    "function"
                ) {
                    window.closeModal("signupModal");
                }

                if (
                    typeof window.openLogin ===
                    "function"
                ) {
                    window.openLogin();
                }

            }
        );

    }


    /*
     * RETURN FROM BARTER
     */

    const returnToBarter =
        sessionStorage.getItem(
            "losoja_return_to_barter"
        );

    const params =
        new URLSearchParams(
            window.location.search
        );

    const cameFromBarter =
        returnToBarter === "true" ||
        params.get("openLogin") === "1";


    if (!cameFromBarter) {
        return;
    }


    /*
     * Wait for auth.js.
     */

    const timer =
        setInterval(function () {

            if (
                typeof window.openLogin ===
                "function"
            ) {

                window.openLogin();

                clearInterval(timer);

            }

        }, 100);


    setTimeout(function () {

        clearInterval(timer);

    }, 10000);

});

</script>

</body>
</html>
