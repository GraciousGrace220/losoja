<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Oja - LosOja Marketplace</title>

    <meta
        name="theme-color"
        content="#087a3e"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* =====================================================
           OJA MARKETPLACE
        ===================================================== */

        .oja-page {
            padding: 30px 15px 80px;
        }

        .oja-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .oja-hero {
            background: #087a3e;
            color: white;
            border-radius: 16px;
            padding: 30px 20px;
            margin-bottom: 25px;
        }

        .oja-hero h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .oja-hero p {
            margin: 0;
            line-height: 1.6;
        }

        .oja-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .oja-button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .oja-button-primary {
            background: white;
            color: #087a3e;
        }

        .oja-button-secondary {
            background: #055c2e;
            color: white;
        }

        .oja-search {
            background: white;
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .oja-search input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .oja-categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-bottom: 25px;
        }

        .oja-category {
            flex: 0 0 auto;
            border: 1px solid #ddd;
            background: white;
            color: #333;
            border-radius: 20px;
            padding: 9px 15px;
            cursor: pointer;
        }

        .oja-category.active {
            background: #087a3e;
            color: white;
            border-color: #087a3e;
        }

        .oja-section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .oja-section-title h2 {
            margin: 0;
        }

        .oja-listings {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );
            gap: 18px;
        }

        .oja-empty {
            background: white;
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            color: #666;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
            grid-column: 1 / -1;
        }

        .oja-empty-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .oja-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        /* PERFECT SQUARE IMAGE FRAME */

        .oja-card-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            height: auto;
            overflow: hidden;
            background: #eef8f2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .oja-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .oja-card-placeholder {
            font-size: 55px;
        }

        .oja-card-body {
            padding: 15px;
        }

        .oja-card h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .oja-price {
            color: #087a3e;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .oja-location {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .oja-status {
            display: inline-block;
            background: #eef8f2;
            color: #087a3e;
            padding: 5px 9px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }

        /* =====================================================
           POST FORM
        ===================================================== */

        .oja-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.55);
            padding: 20px;
            overflow-y: auto;
        }

        .oja-modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .oja-modal-box {
            width: 100%;
            max-width: 560px;
            background: white;
            border-radius: 16px;
            padding: 22px;
            box-sizing: border-box;
        }

        .oja-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .oja-modal-header h2 {
            margin: 0;
        }

        .oja-close {
            border: none;
            background: transparent;
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
        }

        .oja-form-group {
            margin-bottom: 16px;
        }

        .oja-form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .oja-form-group input,
        .oja-form-group select,
        .oja-form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d7d7d7;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        .oja-form-group textarea {
            min-height: 110px;
            resize: vertical;
        }

        .oja-form-note {
            color: #666;
            font-size: 13px;
            margin-top: 5px;
        }

        /* PHOTO UPLOADER */

        .oja-photo-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px dashed #087a3e;
            border-radius: 8px;
            background: #f7fbf8;
            cursor: pointer;
        }

        .oja-photo-preview {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .oja-photo-preview-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 8px;
            background: #eef8f2;
            border: 1px solid #ddd;
        }

        .oja-photo-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .oja-photo-main {
            position: absolute;
            left: 5px;
            bottom: 5px;
            background: rgba(8, 122, 62, 0.9);
            color: white;
            font-size: 10px;
            padding: 3px 5px;
            border-radius: 4px;
        }

        .oja-form-error {
            display: none;
            background: #fff1f1;
            color: #b42318;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .oja-form-success {
            display: none;
            background: #eef8f2;
            color: #087a3e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .oja-submit {
            width: 100%;
            background: #087a3e;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .oja-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {

            .oja-page {
                padding-top: 20px;
            }

            .oja-hero h1 {
                font-size: 27px;
            }

            .oja-listings {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .oja-photo-preview {
                grid-template-columns: repeat(3, 1fr);
            }

            .oja-modal {
                padding: 10px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="container">

            <a
                href="index.html"
                class="logo"
            >
                LosOja
            </a>

            <div class="header-actions">

                <button
                    id="loginButton"
                    type="button"
                    onclick="goToLogin()"
                >
                    Login
                </button>

            </div>

        </div>

    </header>


    <!-- =====================================================
         OJA
    ===================================================== -->

    <main class="oja-page">

        <div class="oja-container">


            <!-- HERO -->

            <section class="oja-hero">

                <h1>
                    🛍️ Oja
                </h1>

                <p>
                    Buy and sell products with people
                    across Nigeria.
                </p>

                <div class="oja-actions">

                    <button
                        class="oja-button oja-button-primary"
                        type="button"
                        onclick="startPosting()"
                    >
                        + Post an Item
                    </button>

                    <button
                        class="oja-button oja-button-secondary"
                        type="button"
                        onclick="window.location.href='index.html'"
                    >
                        Back to LosOja
                    </button>

                </div>

            </section>


            <!-- SEARCH -->

            <section class="oja-search">

                <input
                    id="ojaSearch"
                    type="search"
                    placeholder="Search Oja..."
                    autocomplete="off"
                >

            </section>


            <!-- CATEGORIES -->

            <div
                class="oja-categories"
                id="ojaCategories"
            >

                <button
                    class="oja-category active"
                    data-category="all"
                >
                    All
                </button>

                <button
                    class="oja-category"
                    data-category="phones"
                >
                    📱 Phones
                </button>

                <button
                    class="oja-category"
                    data-category="fashion"
                >
                    👕 Fashion
                </button>

                <button
                    class="oja-category"
                    data-category="electronics"
                >
                    💻 Electronics
                </button>

                <button
                    class="oja-category"
                    data-category="vehicles"
                >
                    🚗 Vehicles
                </button>

                <button
                    class="oja-category"
                    data-category="property"
                >
                    🏠 Property
                </button>

                <button
                    class="oja-category"
                    data-category="home"
                >
                    🛋️ Home
                </button>

                <button
                    class="oja-category"
                    data-category="other"
                >
                    📦 Other
                </button>

            </div>


            <!-- LISTINGS -->

            <section>

                <div class="oja-section-title">

                    <h2>
                        Oja Listings
                    </h2>

                </div>

                <div
                    id="ojaListings"
                    class="oja-listings"
                ></div>

            </section>

        </div>

    </main>


    <!-- =====================================================
         POST ITEM MODAL
    ====================================================== -->

    <div
        id="ojaPostModal"
        class="oja-modal"
    >

        <div class="oja-modal-box">

            <div class="oja-modal-header">

                <h2>
                    Post an Item
                </h2>

                <button
                    type="button"
                    class="oja-close"
                    onclick="closePostModal()"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <div
                id="ojaFormError"
                class="oja-form-error"
            ></div>

            <div
                id="ojaFormSuccess"
                class="oja-form-success"
            ></div>


            <form id="ojaPostForm">


                <!-- TITLE -->

                <div class="oja-form-group">

                    <label for="ojaTitle">
                        Item name
                    </label>

                    <input
                        id="ojaTitle"
                        name="title"
                        type="text"
                        maxlength="120"
                        required
                        placeholder="e.g. iPhone 13"
                    >

                </div>


                <!-- CATEGORY -->

                <div class="oja-form-group">

                    <label for="ojaCategory">
                        Category
                    </label>

                    <select
                        id="ojaCategory"
                        name="category"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        <option value="phones">
                            Phones
                        </option>

                        <option value="fashion">
                            Fashion
                        </option>

                        <option value="electronics">
                            Electronics
                        </option>

                        <option value="vehicles">
                            Vehicles
                        </option>

                        <option value="property">
                            Property
                        </option>

                        <option value="home">
                            Home
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- PRICE -->

                <div class="oja-form-group">

                    <label for="ojaPrice">
                        Price (₦)
                    </label>

                    <input
                        id="ojaPrice"
                        name="price"
                        type="number"
                        min="1"
                        step="0.01"
                        required
                        placeholder="e.g. 250000"
                    >

                </div>


                <!-- LOCATION -->

                <div class="oja-form-group">

                    <label for="ojaLocation">
                        Location
                    </label>

                    <input
                        id="ojaLocation"
                        name="location"
                        type="text"
                        maxlength="150"
                        placeholder="e.g. Port Harcourt"
                    >

                </div>


                <!-- PHOTOS -->

                <div class="oja-form-group">

                    <label for="ojaImages">
                        Photos
                    </label>

                    <input
                        id="ojaImages"
                        class="oja-photo-input"
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                        multiple
                    >

                    <div class="oja-form-note">
                        Add 1–5 photos. Maximum 5 MB per photo.
                        The first photo will be the main photo.
                    </div>

                    <div
                        id="ojaPhotoPreview"
                        class="oja-photo-preview"
                    ></div>

                </div>


                <!-- DESCRIPTION -->

                <div class="oja-form-group">

                    <label for="ojaDescription">
                        Description
                    </label>

                    <textarea
                        id="ojaDescription"
                        name="description"
                        maxlength="1000"
                        placeholder="Describe the item..."
                    ></textarea>

                    <div class="oja-form-note">
                        Give buyers useful information about the item.
                    </div>

                </div>


                <button
                    id="ojaSubmitButton"
                    class="oja-submit"
                    type="submit"
                >
                    Post Item
                </button>

            </form>

        </div>

    </div>


    <!-- =====================================================
         EXISTING LOSOJA AUTH
    ====================================================== -->

    <script src="js/auth.js"></script>


    <!-- =====================================================
         OJA JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           SUPABASE CONFIG
        ===================================================== */

        const OJA_SUPABASE_URL =
            "https://ycxshwgeebskdozmornh.supabase.co";

        const OJA_SUPABASE_KEY =
            "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe";


        /* =====================================================
           LOGIN
        ===================================================== */

        async function getOjaCurrentUser() {

            if (
                typeof window.ensureValidSupabaseSession ===
                "function"
            ) {

                const session =
                    await window.ensureValidSupabaseSession();

                return session?.user || null;
            }

            if (
                typeof window.getCurrentUser ===
                "function"
            ) {

                return await window.getCurrentUser();
            }

            return null;
        }


        async function updateLoginButton() {

            const button =
                document.getElementById(
                    "loginButton"
                );

            if (!button) {
                return;
            }

            const user =
                await getOjaCurrentUser();

            if (user) {

                button.textContent =
                    "My Account";

                button.onclick =
                    function () {

                        window.location.href =
                            "account.html";

                    };

            } else {

                button.textContent =
                    "Login";

                button.onclick =
                    goToLogin;

            }

        }


        function goToLogin() {

            window.location.href =
                "login.html";

        }


        /* =====================================================
           ESCAPE HTML
        ===================================================== */

        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =====================================================
           SUPABASE ACCESS TOKEN
        ===================================================== */

        function getOjaAccessToken() {

            if (
                typeof window.getSupabaseAccessToken ===
                "function"
            ) {

                return window.getSupabaseAccessToken();

            }

            try {

                const raw =
                    localStorage.getItem(
                        "losoja_supabase_session"
                    );

                if (!raw) {
                    return null;
                }

                const session =
                    JSON.parse(raw);

                return (
                    session.access_token ||
                    session.accessToken ||
                    null
                );

            } catch (error) {

                console.error(
                    "LosOja session lookup error:",
                    error
                );

                return null;
            }

        }


        /* =====================================================
           POST ITEM MODAL
        ===================================================== */

        async function startPosting() {

            const user =
                await getOjaCurrentUser();

            if (!user) {

                alert(
                    "Please login before posting an item."
                );

                goToLogin();

                return;
            }

            const modal =
                document.getElementById(
                    "ojaPostModal"
                );

            if (modal) {

                modal.classList.add(
                    "show"
                );

            }

        }


        function closePostModal() {

            const modal =
                document.getElementById(
                    "ojaPostModal"
                );

            if (modal) {

                modal.classList.remove(
                    "show"
                );

            }

        }


        /* Close when clicking outside modal */

        document
            .getElementById("ojaPostModal")
            .addEventListener(
                "click",
                function (event) {

                    if (
                        event.target ===
                        this
                    ) {

                        closePostModal();

                    }

                }
            );


        /* =====================================================
           FORM MESSAGE
        ===================================================== */

        function showOjaError(message) {

            const errorBox =
                document.getElementById(
                    "ojaFormError"
                );

            const successBox =
                document.getElementById(
                    "ojaFormSuccess"
                );

            if (successBox) {
                successBox.style.display =
                    "none";
            }

            if (errorBox) {

                errorBox.textContent =
                    message;

                errorBox.style.display =
                    "block";

            }

        }


        function showOjaSuccess(message) {

            const errorBox =
                document.getElementById(
                    "ojaFormError"
                );

            const successBox =
                document.getElementById(
                    "ojaFormSuccess"
                );

            if (errorBox) {
                errorBox.style.display =
                    "none";
            }

            if (successBox) {

                successBox.textContent =
                    message;

                successBox.style.display =
                    "block";

            }

        }


        /* =====================================================
           PHOTO VARIABLES
        ===================================================== */

        let selectedOjaImages = [];


        /* =====================================================
           PHOTO PREVIEW
        ===================================================== */

        const ojaImagesInput =
            document.getElementById(
                "ojaImages"
            );

        const ojaPhotoPreview =
            document.getElementById(
                "ojaPhotoPreview"
            );


        if (ojaImagesInput) {

            ojaImagesInput.addEventListener(
                "change",
                function () {

                    selectedOjaImages = [];

                    const files =
                        Array.from(
                            this.files || []
                        );


                    if (!files.length) {

                        if (ojaPhotoPreview) {
                            ojaPhotoPreview.innerHTML =
                                "";
                        }

                        return;

                    }


                    if (files.length > 5) {

                        showOjaError(
                            "You can upload a maximum of 5 photos."
                        );

                        this.value =
                            "";

                        if (ojaPhotoPreview) {
                            ojaPhotoPreview.innerHTML =
                                "";
                        }

                        return;

                    }


                    const allowedTypes = [
                        "image/jpeg",
                        "image/png",
                        "image/webp"
                    ];


                    for (
                        const file of files
                    ) {

                        if (
                            !allowedTypes.includes(
                                file.type
                            )
                        ) {

                            showOjaError(
                                "Only JPG, PNG and WebP images are allowed."
                            );

                            this.value =
                                "";

                            selectedOjaImages =
                                [];

                            if (ojaPhotoPreview) {
                                ojaPhotoPreview.innerHTML =
                                    "";
                            }

                            return;

                        }


                        if (
                            file.size >
                            5 * 1024 * 1024
                        ) {

                            showOjaError(
                                "Each photo must be 5 MB or smaller."
                            );

                            this.value =
                                "";

                            selectedOjaImages =
                                [];

                            if (ojaPhotoPreview) {
                                ojaPhotoPreview.innerHTML =
                                    "";
                            }

                            return;

                        }

                    }


                    selectedOjaImages =
                        files;


                    renderOjaPhotoPreviews();

                }
            );

        }


        function renderOjaPhotoPreviews() {

            if (!ojaPhotoPreview) {
                return;
            }

            ojaPhotoPreview.innerHTML =
                "";


            selectedOjaImages.forEach(
                function (file, index) {

                    const wrapper =
                        document.createElement(
                            "div"
                        );

                    wrapper.className =
                        "oja-photo-preview-item";


                    const image =
                        document.createElement(
                            "img"
                        );

                    const reader =
                        new FileReader();


                    reader.onload =
                        function (event) {

                            image.src =
                                event.target.result;

                        };


                    reader.readAsDataURL(
                        file
                    );


                    wrapper.appendChild(
                        image
                    );


                    if (index === 0) {

                        const mainLabel =
                            document.createElement(
                                "span"
                            );

                        mainLabel.className =
                            "oja-photo-main";

                        mainLabel.textContent =
                            "Main";

                        wrapper.appendChild(
                            mainLabel
                        );

                    }


                    ojaPhotoPreview.appendChild(
                        wrapper
                    );

                }
            );

        }


        /* =====================================================
           LOAD OJA LISTINGS
        ===================================================== */

        let ojaListings = [];

        let activeOjaCategory =
            "all";


        async function loadOjaListings() {

            const listingsContainer =
                document.getElementById(
                    "ojaListings"
                );

            if (!listingsContainer) {
                return;
            }

            listingsContainer.innerHTML =
                `
                <div class="oja-empty">
                    Loading Oja listings...
                </div>
                `;

            try {

                const response =
                    await fetch(
                        OJA_SUPABASE_URL +
                        "/rest/v1/oja_listings" +
                        "?select=*" +
                        "&status=eq.available" +
                        "&order=created_at.desc",
                        {
                            method: "GET",

                            headers: {
                                "apikey":
                                    OJA_SUPABASE_KEY,

                                "Authorization":
                                    "Bearer " +
                                    OJA_SUPABASE_KEY,

                                "Content-Type":
                                    "application/json"
                            }
                        }
                    );

                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "LosOja Oja loading error:",
                        response.status,
                        errorText
                    );

                    throw new Error(
                        "Oja listings could not be loaded."
                    );

                }

                const data =
                    await response.json();

                ojaListings =
                    Array.isArray(data)
                        ? data
                        : [];


                /* ---------------------------------------------
                   LOAD OJA IMAGES
                --------------------------------------------- */

                if (ojaListings.length) {

                    const imageResponse =
                        await fetch(
                            OJA_SUPABASE_URL +
                            "/rest/v1/oja_listing_images" +
                            "?select=*" +
                            "&order=sort_order.asc",
                            {
                                method: "GET",

                                headers: {
                                    "apikey":
                                        OJA_SUPABASE_KEY,

                                    "Authorization":
                                        "Bearer " +
                                        OJA_SUPABASE_KEY,

                                    "Content-Type":
                                        "application/json"
                                }
                            }
                        );


                    if (imageResponse.ok) {

                        const imageData =
                            await imageResponse.json();


                        if (
                            Array.isArray(
                                imageData
                            )
                        ) {

                            const imagesByListing =
                                {};


                            imageData.forEach(
                                function (image) {

                                    if (
                                        !imagesByListing[
                                            image.listing_id
                                        ]
                                    ) {

                                        imagesByListing[
                                            image.listing_id
                                        ] = [];

                                    }


                                    imagesByListing[
                                        image.listing_id
                                    ].push(
                                        image
                                    );

                                }
                            );


                            ojaListings =
                                ojaListings.map(
                                    function (item) {

                                        return {
                                            ...item,

                                            images:
                                                imagesByListing[
                                                    item.id
                                                ] || []
                                        };

                                    }
                                );

                        }

                    } else {

                        console.warn(
                            "LosOja: Oja images could not be loaded."
                        );

                    }

                }


                renderOjaListings();

            } catch (error) {

                console.error(
                    "LosOja Oja error:",
                    error
                );

                listingsContainer.innerHTML =
                    `
                    <div class="oja-empty">

                        <div class="oja-empty-icon">
                            ⚠️
                        </div>

                        <h3>
                            Could not load Oja
                        </h3>

                        <p>
                            Please refresh and try again.
                        </p>

                    </div>
                    `;

            }

        }


     /* =====================================================
   RENDER OJA LISTINGS
===================================================== */

function renderOjaListings() {

    const container =
        document.getElementById(
            "ojaListings"
        );

    if (!container) {
        return;
    }

    const searchInput =
        document.getElementById(
            "ojaSearch"
        );

    const search =
        searchInput
            ? searchInput.value
                .trim()
                .toLowerCase()
            : "";

    const filtered =
        ojaListings.filter(
            function (item) {

                const matchesCategory =
                    activeOjaCategory ===
                    "all" ||
                    String(
                        item.category || ""
                    ).toLowerCase() ===
                    activeOjaCategory;

                const searchableText =
                    (
                        String(item.title || "") +
                        " " +
                        String(item.description || "") +
                        " " +
                        String(item.location || "") +
                        " " +
                        String(item.category || "")
                    )
                    .toLowerCase();

                const matchesSearch =
                    !search ||
                    searchableText.includes(
                        search
                    );

                return (
                    matchesCategory &&
                    matchesSearch
                );

            }
        );


    if (!filtered.length) {

        container.innerHTML =
            `
            <div class="oja-empty">

                <div class="oja-empty-icon">
                    🛍️
                </div>

                <h3>
                    No listings found
                </h3>

                <p>
                    Be the first to post an item on Oja.
                </p>

                <button
                    class="oja-button oja-button-primary"
                    type="button"
                    onclick="startPosting()"
                >
                    + Post an Item
                </button>

            </div>
            `;

        return;
    }


    container.innerHTML =
        filtered
            .map(
                function (item) {

                    const price =
                        Number(
                            item.price || 0
                        ).toLocaleString(
                            "en-NG",
                            {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2
                            }
                        );


                    const images =
                        Array.isArray(
                            item.images
                        )
                            ? [...item.images].sort(
                                function (
                                    a,
                                    b
                                ) {

                                    return (
                                        Number(
                                            a.sort_order || 0
                                        ) -
                                        Number(
                                            b.sort_order || 0
                                        )
                                    );

                                }
                            )
                            : [];


                    const mainImage =
                        images.length
                            ? images[0]
                            : null;


                    const imageHTML =
                        mainImage &&
                        mainImage.image_url
                            ? `
                                <div class="oja-card-image">
                                    <img
                                        src="${escapeHTML(
                                            mainImage.image_url
                                        )}"
                                        alt="${escapeHTML(
                                            item.title
                                        )}"
                                        loading="lazy"
                                    >
                                </div>
                            `
                            : `
                                <div class="oja-card-image">
                                    <span class="oja-card-placeholder">
                                        🛍️
                                    </span>
                                </div>
                            `;


                    return `
                        <article
                            class="oja-card"
                            data-category="${escapeHTML(
                                item.category
                            )}"
                        >

                            ${imageHTML}

                            <div class="oja-card-body">

                                <h3>
                                    ${escapeHTML(
                                        item.title
                                    )}
                                </h3>

                                <div class="oja-price">
                                    ₦${price}
                                </div>

                                ${
                                    item.location
                                        ? `
                                        <div class="oja-location">
                                            📍
                                            ${escapeHTML(
                                                item.location
                                            )}
                                        </div>
                                        `
                                        : ""
                                }

                                ${
                                    item.description
                                        ? `
                                        <p>
                                            ${escapeHTML(
                                                item.description
                                            )}
                                        </p>
                                        `
                                        : ""
                                }

                                <span class="oja-status">
                                    Available
                                </span>

                                <div
                                    class="oja-card-actions"
                                    style="
                                        display:flex;
                                        gap:8px;
                                        margin-top:12px;
                                    "
                                >

                                    <button
                                        type="button"
                                        class="oja-button oja-button-secondary"
                                        style="
                                            flex:1;
                                            padding:10px;
                                        "
                                        onclick="viewOjaDetails('${item.id}')"
                                    >
                                        View Details
                                    </button>

                                    <button
                                        type="button"
                                        class="oja-button oja-button-primary"
                                        style="
                                            flex:1;
                                            padding:10px;
                                            border:1px solid #087a3e;
                                        "
                                        onclick="chatWithOjaSeller('${item.id}')"
                                    >
                                        Chat Seller
                                    </button>

                                </div>

                            </div>

                        </article>
                    `;

                }
            )
               .join("");

}

        /* =====================================================
           UPLOAD OJA IMAGE
        ===================================================== */

        async function uploadOjaImage(
            file,
            userId,
            listingId,
            index,
            accessToken
        ) {

            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const safeExtension =
                extension === "jpg"
                    ? "jpg"
                    : extension;


            const fileName =
                userId +
                "/" +
                listingId +
                "/" +
                Date.now() +
                "_" +
                index +
                "_" +
                crypto.randomUUID() +
                "." +
                safeExtension;


            const uploadUrl =
                OJA_SUPABASE_URL +
                "/storage/v1/object/oja-images/" +
                fileName;


            const response =
                await fetch(
                    uploadUrl,
                    {
                        method: "POST",

                        headers: {
                            "apikey":
                                OJA_SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                accessToken,

                            "Content-Type":
                                file.type,

                            "x-upsert":
                                "false"
                        },

                        body:
                            file
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(
                    "LosOja image upload error:",
                    response.status,
                    errorText
                );

                throw new Error(
                    "A photo could not be uploaded."
                );

            }


            return (
                OJA_SUPABASE_URL +
                "/storage/v1/object/public/oja-images/" +
                fileName
            );

        }


        /* =====================================================
           SAVE OJA IMAGE RECORD
        ===================================================== */

        async function saveOjaImageRecord(
            listingId,
            userId,
            imageUrl,
            sortOrder,
            accessToken
        ) {

            const response =
                await fetch(
                    OJA_SUPABASE_URL +
                    "/rest/v1/oja_listing_images",
                    {
                        method: "POST",

                        headers: {

                            "apikey":
                                OJA_SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                accessToken,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=minimal"

                        },

                        body:
                            JSON.stringify({

                                listing_id:
                                    listingId,

                                user_id:
                                    userId,

                                image_url:
                                    imageUrl,

                                sort_order:
                                    sortOrder

                            })
                    }
                );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(
                    "LosOja image record error:",
                    response.status,
                    errorText
                );

                throw new Error(
                    "The photo record could not be saved."
                );

            }

        }


        /* =====================================================
           SUBMIT OJA LISTING
        ===================================================== */

        const ojaForm =
            document.getElementById(
                "ojaPostForm"
            );


        if (ojaForm) {

            ojaForm.addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();

                    const user =
                        await getOjaCurrentUser();

                    if (!user || !user.id) {

                        showOjaError(
                            "Please login before posting."
                        );

                        return;
                    }


                    const accessToken =
                        getOjaAccessToken();

                    if (!accessToken) {

                        showOjaError(
                            "Your login session has expired. Please log in again."
                        );

                        return;
                    }


                    const title =
                        document
                            .getElementById(
                                "ojaTitle"
                            )
                            .value
                            .trim();

                    const category =
                        document
                            .getElementById(
                                "ojaCategory"
                            )
                            .value
                            .trim();

                    const price =
                        Number(
                            document
                                .getElementById(
                                    "ojaPrice"
                                )
                                .value
                        );

                    const location =
                        document
                            .getElementById(
                                "ojaLocation"
                            )
                            .value
                            .trim();

                    const description =
                        document
                            .getElementById(
                                "ojaDescription"
                            )
                            .value
                            .trim();


                    if (!title) {

                        showOjaError(
                            "Please enter the item name."
                        );

                        return;
                    }


                    if (!category) {

                        showOjaError(
                            "Please select a category."
                        );

                        return;
                    }


                    if (
                        !Number.isFinite(price) ||
                        price <= 0
                    ) {

                        showOjaError(
                            "Please enter a valid price."
                        );

                        return;
                    }


                    /* PHOTO REQUIRED */

                    if (
                        selectedOjaImages.length <
                        1
                    ) {

                        showOjaError(
                            "Please add at least 1 photo."
                        );

                        return;
                    }


                    if (
                        selectedOjaImages.length >
                        5
                    ) {

                        showOjaError(
                            "You can upload a maximum of 5 photos."
                        );

                        return;
                    }


                    const submitButton =
                        document.getElementById(
                            "ojaSubmitButton"
                        );

                    submitButton.disabled =
                        true;

                    submitButton.textContent =
                        "Posting...";


                    try {

                        /* -----------------------------------------
                           CREATE LISTING
                        ----------------------------------------- */

                        const response =
                            await fetch(
                                OJA_SUPABASE_URL +
                                "/rest/v1/oja_listings",
                                {
                                    method: "POST",

                                    headers: {

                                        "apikey":
                                            OJA_SUPABASE_KEY,

                                        "Authorization":
                                            "Bearer " +
                                            accessToken,

                                        "Content-Type":
                                            "application/json",

                                        "Accept":
                                            "application/json",

                                        "Prefer":
                                            "return=representation"

                                    },

                                    body:
                                        JSON.stringify({

                                            user_id:
                                                user.id,

                                            title:
                                                title,

                                            description:
                                                description ||
                                                null,

                                            category:
                                                category,

                                            price:
                                                price,

                                            currency:
                                                "NGN",

                                            location:
                                                location ||
                                                null,

                                            status:
                                                "available"

                                        })
                                }
                            );


                        if (!response.ok) {

                            const errorText =
                                await response.text();

                            console.error(
                                "LosOja Oja posting error:",
                                response.status,
                                errorText
                            );

                            throw new Error(
                                "The item could not be posted. Please try again."
                            );

                        }


                        const createdListing =
                            await response.json();


                        const listing =
                            Array.isArray(
                                createdListing
                            )
                                ? createdListing[0]
                                : createdListing;


                        if (
                            !listing ||
                            !listing.id
                        ) {

                            throw new Error(
                                "The item was posted but its ID could not be found."
                            );

                        }


                        /* -----------------------------------------
                           UPLOAD PHOTOS
                        ----------------------------------------- */

                        for (
                            let index = 0;
                            index <
                            selectedOjaImages.length;
                            index++
                        ) {

                            submitButton.textContent =
                                "Uploading photo " +
                                (index + 1) +
                                " of " +
                                selectedOjaImages.length +
                                "...";


                            const imageUrl =
                                await uploadOjaImage(
                                    selectedOjaImages[index],
                                    user.id,
                                    listing.id,
                                    index,
                                    accessToken
                                );


                            await saveOjaImageRecord(
                                listing.id,
                                user.id,
                                imageUrl,
                                index,
                                accessToken
                            );

                        }


                        showOjaSuccess(
                            "Item and photos posted successfully!"
                        );


                        ojaForm.reset();

                        selectedOjaImages =
                            [];


                        if (ojaPhotoPreview) {

                            ojaPhotoPreview.innerHTML =
                                "";

                        }


                        await loadOjaListings();


                        setTimeout(
                            function () {

                                closePostModal();

                            },
                            1000
                        );


                    } catch (error) {

                        console.error(
                            "LosOja Oja posting error:",
                            error
                        );

                        showOjaError(
                            error.message ||
                            "The item could not be posted."
                        );

                    } finally {

                        submitButton.disabled =
                            false;

                        submitButton.textContent =
                            "Post Item";

                    }

                }
            );

        }


        /* =====================================================
           SEARCH
        ===================================================== */

        const searchInput =
            document.getElementById(
                "ojaSearch"
            );

        if (searchInput) {

            searchInput.addEventListener(
                "input",
                function () {

                    renderOjaListings();

                }
            );

        }


        /* =====================================================
           CATEGORY BUTTONS
        ===================================================== */

        document
            .querySelectorAll(
                ".oja-category"
            )
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            document
                                .querySelectorAll(
                                    ".oja-category"
                                )
                                .forEach(
                                    function (item) {

                                        item.classList.remove(
                                            "active"
                                        );

                                    }
                                );


                            this.classList.add(
                                "active"
                            );


                            activeOjaCategory =
                                this.dataset.category ||
                                "all";


                            renderOjaListings();

                        }
                    );

                }
            );


        /* =====================================================
           INITIALIZE
        ===================================================== */

        updateLoginButton();

        loadOjaListings();

        console.log(
            "LosOja Oja marketplace loaded"
        );

    </script>
