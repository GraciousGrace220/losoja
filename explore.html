<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Businesses Across Nigeria | LosOja</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#17201b;font-family:Arial,sans-serif}.top{background:#087a3e;color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.brand{color:#fff;text-decoration:none;font-weight:800;font-size:21px}.top a:last-child{color:#fff;text-decoration:none;font-weight:700}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filters select{padding:12px;border:1px solid #d3ded6;border-radius:10px;background:#fff;min-width:220px}.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.cat{border:1px solid #e1e9e3;border-radius:14px;background:#fff;padding:18px 12px;text-align:center;font-weight:700;cursor:pointer}.cat.active{border:2px solid #087a3e;background:#eef8f2}.cat span{display:block;font-size:27px;margin-bottom:8px}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:20px}.business{background:#fff;border:1px solid #e3eae5;border-radius:14px;overflow:hidden;cursor:pointer}.business img{width:100%;height:150px;object-fit:cover;background:#FFC107}.business div{padding:12px}.muted{color:#68766d;font-size:14px}.empty{background:#fff;border:1px solid #e3eae5;padding:22px;border-radius:14px;text-align:center;grid-column:1/-1}@media(max-width:600px){.wrap{margin:18px auto}.filters select{width:100%}}
</style></head><body><header class="top"><a class="brand" href="index.html">LosOja</a><a href="index.html">Home</a></header><main class="wrap"><h1>Explore Businesses</h1><p class="muted">Discover businesses, shops and services across Nigeria. Choose a category or state to narrow your search.</p><div class="filters"><select id="stateFilter"><option value="">All Nigeria</option><option value="Abia State">Abia State</option><option value="Adamawa State">Adamawa State</option><option value="Akwa Ibom State">Akwa Ibom State</option><option value="Anambra State">Anambra State</option><option value="Bauchi State">Bauchi State</option><option value="Bayelsa State">Bayelsa State</option><option value="Benue State">Benue State</option><option value="Borno State">Borno State</option><option value="Cross River State">Cross River State</option><option value="Delta State">Delta State</option><option value="Ebonyi State">Ebonyi State</option><option value="Edo State">Edo State</option><option value="Ekiti State">Ekiti State</option><option value="Enugu State">Enugu State</option><option value="FCT">FCT</option><option value="Gombe State">Gombe State</option><option value="Imo State">Imo State</option><option value="Jigawa State">Jigawa State</option><option value="Kaduna State">Kaduna State</option><option value="Kano State">Kano State</option><option value="Katsina State">Katsina State</option><option value="Kebbi State">Kebbi State</option><option value="Kogi State">Kogi State</option><option value="Kwara State">Kwara State</option><option value="Lagos State">Lagos State</option><option value="Nasarawa State">Nasarawa State</option><option value="Niger State">Niger State</option><option value="Ogun State">Ogun State</option><option value="Ondo State">Ondo State</option><option value="Osun State">Osun State</option><option value="Oyo State">Oyo State</option><option value="Plateau State">Plateau State</option><option value="Rivers State">Rivers State</option><option value="Sokoto State">Sokoto State</option><option value="Taraba State">Taraba State</option><option value="Yobe State">Yobe State</option><option value="Zamfara State">Zamfara State</option></select><select id="categoryFilter"><option value="">All categories</option><option value="Food">Food</option><option value="Fashion">Fashion</option><option value="Beauty">Beauty</option><option value="Services">Services</option><option value="Hotels">Hotels</option><option value="Phones & Electronics">Phones & Electronics</option><option value="Vehicles">Vehicles</option><option value="Property">Property</option><option value="Furniture & Home">Furniture & Home</option><option value="Hair & Salons">Hair & Salons</option><option value="Healthcare">Healthcare</option><option value="Education">Education</option><option value="Technology">Technology</option><option value="Agriculture">Agriculture</option><option value="Logistics">Logistics</option><option value="Cleaning">Cleaning</option><option value="Repairs">Repairs</option><option value="Professional Services">Professional Services</option><option value="Restaurants">Restaurants</option><option value="Events">Events</option></select></div><div class="categories" id="categories"><button class="cat" type="button" data-category="Food"><span>🍲</span>Food</button><button class="cat" type="button" data-category="Fashion"><span>👗</span>Fashion</button><button class="cat" type="button" data-category="Beauty"><span>💄</span>Beauty</button><button class="cat" type="button" data-category="Services"><span>🧰</span>Services</button><button class="cat" type="button" data-category="Hotels"><span>🏨</span>Hotels</button><button class="cat" type="button" data-category="Phones & Electronics"><span>📱</span>Phones & Electronics</button><button class="cat" type="button" data-category="Vehicles"><span>🚗</span>Vehicles</button><button class="cat" type="button" data-category="Property"><span>🏠</span>Property</button><button class="cat" type="button" data-category="Furniture & Home"><span>🛋️</span>Furniture & Home</button><button class="cat" type="button" data-category="Hair & Salons"><span>💇</span>Hair & Salons</button><button class="cat" type="button" data-category="Healthcare"><span>🩺</span>Healthcare</button><button class="cat" type="button" data-category="Education"><span>📚</span>Education</button><button class="cat" type="button" data-category="Technology"><span>💻</span>Technology</button><button class="cat" type="button" data-category="Agriculture"><span>🌾</span>Agriculture</button><button class="cat" type="button" data-category="Logistics"><span>🚚</span>Logistics</button><button class="cat" type="button" data-category="Cleaning"><span>🧹</span>Cleaning</button><button class="cat" type="button" data-category="Repairs"><span>🔧</span>Repairs</button><button class="cat" type="button" data-category="Professional Services"><span>💼</span>Professional Services</button><button class="cat" type="button" data-category="Restaurants"><span>🍽️</span>Restaurants</button><button class="cat" type="button" data-category="Events"><span>🎉</span>Events</button></div><h2>Businesses</h2><div class="results" id="results"><div class="empty">Loading businesses...</div></div></main>
<script src="js/auth.js?v=14"></script><script>
const URL=window.SUPABASE_URL,KEY=window.SUPABASE_KEY;let all=[],activeCategory="";
const state=document.getElementById("stateFilter"),category=document.getElementById("categoryFilter"),results=document.getElementById("results");
function norm(s){return String(s||"").trim().toLowerCase()}
function stateOf(b){if(b.state)return String(b.state);const l=String(b.location||b.address||"");const i=l.indexOf(",");return i>=0?l.slice(i+1).trim():l}
function render(){const wanted=norm(state.value),cat=norm(activeCategory||category.value);const rows=all.filter(b=>{const bs=norm(stateOf(b)),loc=norm(b.location||b.address),short=wanted.replace(/s+state$/,"");const stateOK=!wanted||bs===wanted||bs.includes(wanted)||loc.includes(wanted)||loc.includes(short);const catOK=!cat||norm(b.category).includes(cat)||cat.includes(norm(b.category));return stateOK&&catOK});
if(!rows.length){results.innerHTML='<div class="empty">No businesses found for these filters yet.</div>';return}
results.innerHTML=rows.map(()=>'<article class="business"><img alt="LosOja business" loading="lazy" onerror="this.onerror=null;this.src=\'fallback.svg\'"><div><strong></strong><p class="muted"></p><p class="muted"></p></div></article>').join("");
results.querySelectorAll(".business").forEach((el,i)=>{const b=rows[i],img=el.querySelector("img");img.src=b.image_url||b.image||"fallback.svg";el.querySelector("strong").textContent=b.name||"Business";const p=el.querySelectorAll("p");p[0].textContent=b.category||"Business";p[1].textContent=b.location||"Nigeria";el.onclick=()=>location.href="shop.html?id="+encodeURIComponent(b.id)});
}
async function load(){try{const r=await fetch(URL+"/rest/v1/businesses?select=*",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});if(!r.ok)throw new Error("Unable to load businesses");all=await r.json();render()}catch(e){results.innerHTML='<div class="empty">Businesses could not load right now. Please try again later.</div>'}}
state.addEventListener("change",render);category.addEventListener("change",()=>{activeCategory="";document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));render()});
document.querySelectorAll(".cat").forEach(btn=>btn.addEventListener("click",()=>{activeCategory=btn.dataset.category;category.value=activeCategory;document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("active",x===btn));render()}));load();
</script></body></html>
