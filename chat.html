
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oja Chat - LosOja</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;display:flex;flex-direction:column;height:100dvh}
.topbar{background:#087a3e;color:white;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{color:white;text-decoration:none;font-weight:800;white-space:nowrap}
#chatHeader{flex:1;text-align:center;font-weight:700;overflow-wrap:anywhere;font-size:14px}
.chat-wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:800px;width:100%;margin:0 auto}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;line-height:1.5;font-size:14px;word-break:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:#087a3e;color:white;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:white;border:1px solid #e0e8e2;border-bottom-left-radius:4px}
.msg img{max-width:250px;width:100%;height:auto;border-radius:10px;display:block;cursor:pointer}
.escrow-card{background:white;border:2px solid #087a3e;border-radius:14px;padding:14px;margin:10px auto;max-width:768px}
.escrow-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.escrow-actions button{padding:8px 12px;border-radius:8px;border:0;font-weight:700;cursor:pointer;font-size:12px}
.btn-deliver{background:#087a3e;color:white}
.btn-release{background:#0a8a4a;color:white}
.btn-dispute{background:#fff0f0;color:#b91c1c;border:1px solid #fecaca!important}
.btn-cancel{background:#eee;color:#333}
.input-bar{position:sticky;bottom:0;background:white;border-top:1px solid #e0e8e2;padding:10px;display:flex;gap:8px;max-width:800px;width:100%;margin:0 auto;align-items:center}
.input-bar input[type=text]{flex:1;min-width:0;padding:12px;border:1px solid #d7e1da;border-radius:10px}
.input-bar button{padding:12px 14px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.input-bar button:disabled{opacity:.5;cursor:not-allowed}
.btn-send{background:#087a3e;color:white}
.btn-escrow{background:white;border:1px solid #087a3e!important;color:#087a3e}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.modal.show{display:flex}
.modal-card{background:white;border-radius:16px;padding:20px;width:min(400px,100%)}
.modal-card input,.modal-card textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;margin:8px 0;font:inherit}
.modal-card textarea{min-height:90px;resize:vertical}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17201b;color:white;padding:10px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:10000;max-width:90%;overflow-wrap:anywhere}
.toast.show{opacity:1}
.small-note{font-size:12px;color:#777;text-align:center;padding:10px}
.buyer-list{max-width:800px;width:100%;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.buyer-item{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.buyer-item:hover{border-color:#087a3e}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #ffb703;outline-offset:2px}
@media(max-width:480px){
 .topbar{padding:8px;gap:5px}
 .brand{font-size:12px}
 .topbar>button{font-size:11px;padding:6px 8px}
 #chatHeader{font-size:12px}
 .msg{max-width:88%}
 .input-bar{gap:5px;padding:7px}
 .input-bar button{padding:12px 9px}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand">← LosOja</a>
  <div id="chatHeader">Opening chat...</div>
  <button id="notifyToggle" type="button"
    style="background:#055c2e;color:white;border:1px solid #ffffff55;padding:7px 10px;border-radius:20px;font-weight:700;cursor:pointer">🔔 ON</button>
  <button id="headerEscrowBtn" type="button"
    style="background:white;color:#087a3e;border:0;padding:7px 10px;border-radius:8px;font-weight:700;cursor:pointer">🔐 Escrow</button>
</header>

<div id="buyerList" class="buyer-list" style="display:none"></div>
<div id="chatWrap" class="chat-wrap">
  <div class="small-note">Connecting to chat...</div>
</div>
<div id="escrowList" style="max-width:800px;width:100%;margin:0 auto;padding:0 16px"></div>

<div class="input-bar">
  <label style="padding:11px;background:white;border:1px solid #d7e1da;border-radius:10px;cursor:pointer" title="Send image">
    📷
    <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
  </label>
  <input type="text" id="msgInput" placeholder="Type message..." autocomplete="off" disabled>
  <button class="btn-send" id="sendBtn" type="button" disabled>Send</button>
  <button class="btn-escrow" id="bottomEscrowBtn" type="button" aria-label="Create escrow record">🔐</button>
</div>

<div id="escrowModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="escrowTitle">
  <div class="modal-card">
    <h3 id="escrowTitle" style="margin:0;color:#087a3e">🔐 Create Escrow Record</h3>
    <p style="font-size:13px;color:#666">
      This records the proposed agreement only. It does not hold, transfer, or protect funds.
    </p>
    <label for="escrowAmount">Amount in naira</label>
    <input id="escrowAmount" type="number" min="1" step="0.01" placeholder="e.g. 50000">
    <label for="escrowDesc">What are you buying?</label>
    <textarea id="escrowDesc" maxlength="1000" placeholder="Describe the item or service"></textarea>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button id="cancelEscrowBtn" type="button" style="flex:1;padding:12px;background:#eee;border:0;border-radius:9px;cursor:pointer">Cancel</button>
      <button id="createEscrowBtn" type="button" style="flex:1;padding:12px;background:#087a3e;color:white;border:0;border-radius:9px;font-weight:700;cursor:pointer">Create Record</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Use the root authentication file used by LosOja. -->
<script src="auth.js?v=13"></script>
<script>
"use strict";

const SUPABASE_URL = "https://ycxshwgeebskdozmornh.supabase.co";
const SUPABASE_KEY = "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe";
const $ = id => document.getElementById(id);

const chatWrap = $("chatWrap");
const chatHeader = $("chatHeader");
const msgInput = $("msgInput");
const sendBtn = $("sendBtn");
const imageInput = $("imageInput");
const escrowList = $("escrowList");
const escrowModal = $("escrowModal");
const toast = $("toast");
const buyerListEl = $("buyerList");
const notifyToggle = $("notifyToggle");

let currentUser = null;
let currentChat = null;
let sellerId = null;
let businessId = null;
let listingId = null;
let directChatId = null;
let accessToken = null;
let sending = false;
let lastMessageId = null;
let pollTimer = null;
let notifyEnabled = false;
let notificationKey = null;
let loadingChat = false;

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[char]));
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 3500);
}

function getParams() {
  const p = new URLSearchParams(location.search);
  return {
    sellerId: p.get("user"),
    businessId: p.get("business"),
    listingId: p.get("oja_listing"),
    chatId: p.get("chat_id"),
    inbox: p.get("inbox"),
    escrow: p.get("escrow")
  };
}

function loadNotificationPreference() {
  notificationKey = "losoja_notify_enabled_" + currentUser.id;
  notifyEnabled = localStorage.getItem(notificationKey) !== "0";
  updateNotifyUI();
}

function updateNotifyUI() {
  notifyToggle.textContent = notifyEnabled ? "🔔 ON" : "🔕 OFF";
  notifyToggle.style.opacity = notifyEnabled ? "1" : "0.65";
  notifyToggle.setAttribute("aria-pressed", String(notifyEnabled));
  notifyToggle.title = notifyEnabled ? "Turn notifications off" : "Turn notifications on";
}

function browserNotificationsAvailable() {
  return typeof window.Notification !== "undefined";
}

function playBeep() {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;

    const ctx = new AudioContextClass();
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 880;
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
    oscillator.start();
    oscillator.stop(ctx.currentTime + 0.27);
    oscillator.onended = () => ctx.close().catch(() => {});
  } catch (error) {
    console.debug("Sound notification unavailable.");
  }
}

async function toggleNotifications() {
  if (!currentUser?.id) {
    showToast("Log in to change your notification setting.");
    return;
  }

  notifyEnabled = !notifyEnabled;
  localStorage.setItem(notificationKey, notifyEnabled ? "1" : "0");
  updateNotifyUI();

  if (notifyEnabled && browserNotificationsAvailable()) {
    if (Notification.permission === "default") {
      try {
        await Notification.requestPermission();
      } catch (error) {
        console.warn("Notification permission was not granted.", error);
      }
    }

    if (Notification.permission === "denied") {
      showToast("Browser notifications are blocked. You can still receive in-page alerts.");
      return;
    }
  }

  showToast(notifyEnabled ? "Notifications ON 🔔" : "Notifications OFF 🔕");
  if (notifyEnabled) playBeep();
}

function notifyNewMessage(message, senderLabel) {
  if (!notifyEnabled || document.hasFocus()) return;

  playBeep();

  if (browserNotificationsAvailable() && Notification.permission === "granted") {
    try {
      new Notification("New LosOja message", {
        body: (senderLabel ? senderLabel + ": " : "") + String(message || "You have a new message").slice(0, 100),
        tag: "losoja-chat-" + (currentChat?.id || "message")
      });
    } catch (error) {
      console.warn("Browser notification could not be shown.", error);
    }
  }
}

async function getUserAndToken() {
  let session = null;

  if (typeof window.ensureValidSupabaseSession === "function") {
    try {
      session = await window.ensureValidSupabaseSession();
    } catch (error) {
      console.warn("Existing LosOja session helper did not return a session.", error);
    }
  }

  if (!session?.access_token) {
    try {
      session = JSON.parse(localStorage.getItem("losoja_supabase_session") || "null");
    } catch {
      session = null;
    }
  }

  if (!session?.access_token && typeof window.getSupabaseAccessToken === "function") {
    try {
      const token = await window.getSupabaseAccessToken();
      if (token) {
        session = session || {};
        session.access_token = token;
      }
    } catch (error) {
      console.warn("Existing token helper did not return a token.", error);
    }
  }

  if (!session?.access_token) {
    throw new Error("No LosOja login session was found. Log in again, then reopen the chat.");
  }

  function tokenExpiry(token) {
    try {
      const payload = token.split(".")[1];
      const decoded = atob(payload.replace(/-/g, "+").replace(/_/g, "/"));
      return JSON.parse(decoded).exp || 0;
    } catch {
      return 0;
    }
  }

  if (tokenExpiry(session.access_token) * 1000 < Date.now() + 60000) {
    if (!session.refresh_token) {
      throw new Error("Your login session has expired. Please log in again.");
    }

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_KEY
        },
        body: JSON.stringify({refresh_token: session.refresh_token})
      }
    );

    const refreshed = await response.json().catch(() => ({}));
    if (!response.ok || !refreshed.access_token) {
      throw new Error(refreshed.msg || refreshed.message || "Session expired. Please log in again.");
    }

    session = {...session, ...refreshed};
    try {
      localStorage.setItem("losoja_supabase_session", JSON.stringify(session));
    } catch {}
  }

  accessToken = session.access_token;
  currentUser = session.user || null;

  if (!currentUser?.id && typeof window.getCurrentUser === "function") {
    try {
      currentUser = await window.getCurrentUser();
    } catch {}
  }

  if (!currentUser?.id) {
    const response = await fetch(SUPABASE_URL + "/auth/v1/user", {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + accessToken
      }
    });
    const user = await response.json().catch(() => ({}));
    if (response.ok && user.id) currentUser = user;
  }

  if (!currentUser?.id) {
    throw new Error("Your login session has no user information. Log out and log in again.");
  }

  loadNotificationPreference();
  return currentUser;
}

async function api(path, method = "GET", body = null, extraHeaders = {}) {
  async function request() {
    const headers = {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + accessToken,
      ...extraHeaders
    };

    if (body !== null) headers["Content-Type"] = "application/json";
    if (method === "POST" || method === "PATCH") {
      headers["Prefer"] = "return=representation";
    }

    return fetch(SUPABASE_URL + "/rest/v1/" + path, {
      method,
      headers,
      body: body === null ? undefined : JSON.stringify(body)
    });
  }

  let response = await request();

  if (response.status === 401) {
    const errorText = await response.clone().text();
    if (/jwt expired|expired jwt|invalid jwt/i.test(errorText)) {
      await getUserAndToken();
      response = await request();
    }
  }

  const responseText = await response.text();

  if (!response.ok) {
    let message = responseText || "Supabase request failed (" + response.status + ")";
    try {
      const parsed = JSON.parse(responseText);
      message = parsed.message || parsed.details || parsed.hint || message;
    } catch {}
    throw new Error(message);
  }

  if (!responseText) return null;
  try {
    return JSON.parse(responseText);
  } catch {
    return responseText;
  }
}

function showLoginMessage() {
  chatHeader.textContent = "Login required";
  chatWrap.innerHTML = `
    <div style="text-align:center;padding:40px 10px">
      <b>Please log in to chat.</b>
      <p>You need an account to contact the seller.</p>
      <a href="index.html" style="display:inline-block;padding:11px 16px;background:#087a3e;color:white;border-radius:8px;text-decoration:none">Go to LosOja</a>
    </div>`;
}

function enableComposer(enabled) {
  msgInput.disabled = !enabled;
  sendBtn.disabled = !enabled;
  imageInput.disabled = !enabled;
}

function isParticipant(chat) {
  return !!chat && !!currentUser?.id &&
    (chat.buyer_id === currentUser.id || chat.seller_id === currentUser.id);
}

async function resolveSellerFromListing() {
  const rows = await api(
    "oja_listings?id=eq." + encodeURIComponent(listingId) +
    "&select=id,user_id,title,price&limit=1"
  );

  if (!Array.isArray(rows) || !rows.length) {
    throw new Error("The Oja listing could not be found.");
  }

  const listing = rows[0];
  if (!listing.user_id) throw new Error("This listing has no seller account.");

  sellerId = listing.user_id;
  const title = listing.title || "Oja listing";
  chatHeader.textContent = title.length > 28 ? title.slice(0, 25) + "..." : title;
  return listing;
}

async function openExistingChat(chatId) {
  const rows = await api(
    "chats?id=eq." + encodeURIComponent(chatId) + "&select=*&limit=1"
  );

  if (!Array.isArray(rows) || !rows.length) {
    throw new Error("This conversation could not be found.");
  }

  const chat = rows[0];
  if (!isParticipant(chat)) {
    throw new Error("Access denied: this conversation does not belong to your account.");
  }

  currentChat = chat;
  sellerId = chat.seller_id;
  businessId = chat.business_id || businessId;
  return chat;
}

async function getOrCreateChat() {
  if (directChatId) return openExistingChat(directChatId);

  if (!currentUser?.id) throw new Error("Please log in to open a chat.");

  if (sellerId && currentUser.id === sellerId) {
    return openSellerInbox();
  }

  if (!sellerId) throw new Error("Seller not identified.");

  if (currentUser.id === sellerId) {
    return openSellerInbox();
  }

  const query =
    "chats?buyer_id=eq." + encodeURIComponent(currentUser.id) +
    "&seller_id=eq." + encodeURIComponent(sellerId) +
    "&select=*&order=created_at.desc&limit=1";

  let chats = await api(query);

  if (Array.isArray(chats) && chats.length) {
    currentChat = chats[0];
    if (!isParticipant(currentChat)) throw new Error("Chat participant check failed.");
    return currentChat;
  }

  // Check the reverse direction for older conversations created by the other flow.
  const reverseQuery =
    "chats?buyer_id=eq." + encodeURIComponent(sellerId) +
    "&seller_id=eq." + encodeURIComponent(currentUser.id) +
    "&select=*&order=created_at.desc&limit=1";

  const reverseChats = await api(reverseQuery);
  if (Array.isArray(reverseChats) && reverseChats.length) {
    currentChat = reverseChats[0];
    if (!isParticipant(currentChat)) throw new Error("Chat participant check failed.");
    return currentChat;
  }

  const created = await api("chats", "POST", {
    buyer_id: currentUser.id,
    seller_id: sellerId,
    business_id: businessId || null
  });

  if (Array.isArray(created) && created.length) {
    currentChat = created[0];
    if (!isParticipant(currentChat)) throw new Error("Chat participant check failed.");
    return currentChat;
  }

  // A second check handles a possible simultaneous conversation creation.
  chats = await api(query);
  if (Array.isArray(chats) && chats.length) {
    currentChat = chats[0];
    if (!isParticipant(currentChat)) throw new Error("Chat participant check failed.");
    return currentChat;
  }

  throw new Error("The conversation could not be created. Please try again.");
}

async function openSellerInbox() {
  const incoming = await api(
    "chats?seller_id=eq." + encodeURIComponent(currentUser.id) +
    "&select=*&order=created_at.desc&limit=50"
  );

  if (!Array.isArray(incoming) || incoming.length === 0) {
    buyerListEl.style.display = "none";
    chatHeader.textContent = "Your inbox";
    chatWrap.innerHTML = `
      <div style="text-align:center;padding:40px 10px">
        <b>No buyer conversations yet.</b>
        <p>When a buyer contacts you about a listing, the conversation will appear here.</p>
      </div>`;
    enableComposer(false);
    return null;
  }

  buyerListEl.style.display = "flex";
  buyerListEl.innerHTML = "";

  for (const chat of incoming) {
    if (!isParticipant(chat)) continue;

    const item = document.createElement("div");
    item.className = "buyer-item";

    const info = document.createElement("div");
    const title = document.createElement("b");
    title.textContent = "Buyer: " + String(chat.buyer_id || "").slice(0, 8);
    const date = document.createElement("small");
    date.textContent = chat.created_at ? new Date(chat.created_at).toLocaleString() : "Conversation";
    date.style.display = "block";
    info.append(title, date);

    const openLabel = document.createElement("span");
    openLabel.textContent = "Open chat 💬";
    item.append(info, openLabel);
    item.addEventListener("click", () => selectInboxChat(chat.id));
    buyerListEl.appendChild(item);
  }

  chatHeader.textContent = "Your inbox";
  chatWrap.innerHTML = '<div class="small-note">Select a buyer to open the existing conversation.</div>';
  escrowList.innerHTML = "";
  enableComposer(false);
  return null;
}

async function selectInboxChat(chatId) {
  if (loadingChat) return;
  loadingChat = true;
  try {
    await openExistingChat(chatId);
    buyerListEl.style.display = "none";
    chatHeader.textContent = "Chat with buyer";
    enableComposer(true);
    lastMessageId = null;
    await Promise.all([loadMessages(), loadEscrows()]);
    startPolling();
  } catch (error) {
    console.error(error);
    showToast("Could not open conversation: " + error.message);
  } finally {
    loadingChat = false;
  }
}

async function init() {
  const params = getParams();
  sellerId = params.sellerId;
  businessId = params.businessId;
  listingId = params.listingId;
  directChatId = params.chatId;

  try {
    await getUserAndToken();

    if (!currentUser?.id || !accessToken) {
      showLoginMessage();
      return;
    }

    if (directChatId) {
      await openExistingChat(directChatId);
      chatHeader.textContent = "LosOja Chat";
      enableComposer(true);
      await Promise.all([loadMessages(), loadEscrows()]);
      startPolling();
      if (params.escrow === "1") setTimeout(openEscrowModal, 500);
      return;
    }

    if (params.inbox === "1") {
      await openSellerInbox();
      return;
    }

    if (listingId) await resolveSellerFromListing();

    if (!sellerId && !listingId && !businessId) {
      await openSellerInbox();
      return;
    }

    // A business ID alone is not necessarily a seller user ID.
    // The calling page should pass ?user=SELLER_USER_ID or ?oja_listing=LISTING_ID.
    if (!sellerId) {
      throw new Error("Seller ID missing. Open chat from the seller's listing page.");
    }

    if (currentUser.id === sellerId) {
      await openSellerInbox();
      return;
    }

    if (!businessId && !listingId) chatHeader.textContent = "LosOja Chat";

    const chat = await getOrCreateChat();
    if (!chat) return;

    enableComposer(true);
    await Promise.all([loadMessages(), loadEscrows()]);
    startPolling();

    if (params.escrow === "1") setTimeout(openEscrowModal, 500);
  } catch (error) {
    console.error("LosOja chat initialization failed:", error);
    chatHeader.textContent = "Chat unavailable";
    chatWrap.innerHTML = `
      <div style="text-align:center;padding:32px 12px">
        <b>Couldn't open chat.</b>
        <p style="color:#a12626;overflow-wrap:anywhere">${esc(error.message)}</p>
        <button id="retryChatBtn" type="button"
          style="padding:10px 16px;background:#087a3e;color:white;border:0;border-radius:8px;cursor:pointer">
          Try again
        </button>
      </div>`;
    $("retryChatBtn").addEventListener("click", () => location.reload());
    enableComposer(false);
  }
}

function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if (!currentChat?.id || !isParticipant(currentChat)) return;
    try {
      await loadMessages(true);
      await loadEscrows(true);
    } catch (error) {
      console.warn("Chat refresh failed.", error);
    }
  }, 5000);
}

async function loadMessages(isPoll = false) {
  if (!currentChat?.id || !isParticipant(currentChat)) return;

  const messages = await api(
    "messages?chat_id=eq." + encodeURIComponent(currentChat.id) +
    "&select=*&order=created_at.asc"
  );

  if (!Array.isArray(messages)) return;

  const latest = messages[messages.length - 1];
  const latestId = latest?.id ? String(latest.id) : null;

  if (isPoll && latest && latestId && latestId !== lastMessageId &&
      latest.sender_id !== currentUser.id) {
    notifyNewMessage(latest.message, "New message");
  }
  lastMessageId = latestId;

  const wasAtBottom =
    chatWrap.scrollTop + chatWrap.clientHeight >= chatWrap.scrollHeight - 60;

  chatWrap.innerHTML = "";

  if (messages.length === 0) {
    chatWrap.innerHTML = '<div class="small-note">No messages yet. Start the conversation.</div>';
    return;
  }

  for (const message of messages) {
    const bubble = document.createElement("div");
    bubble.className = "msg " + (message.sender_id === currentUser.id ? "me" : "them");

    const value = String(message.message || "");
    const match = value.match(/https?:\/\/[^\s]+/);

    if (match && (value.includes("📷 Image:") ||
        value.includes("/storage/") ||
        /\.(jpg|jpeg|png|webp|gif)(\?|$)/i.test(match[0]))) {
      const imageUrl = match[0].replace(/[),]+$/, "");
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = "Shared image";
      img.loading = "lazy";
      img.addEventListener("click", () => window.open(imageUrl, "_blank", "noopener,noreferrer"));
      bubble.appendChild(img);

      const caption = document.createElement("div");
      caption.textContent = "📷 Image";
      caption.style.marginTop = "5px";
      bubble.appendChild(caption);
    } else {
      bubble.textContent = value;
    }

    chatWrap.appendChild(bubble);
  }

  if (!isPoll || wasAtBottom) chatWrap.scrollTop = chatWrap.scrollHeight;
}

async function sendMessage() {
  const message = msgInput.value.trim();
  if (!message || !currentChat?.id || !isParticipant(currentChat) || sending) return;

  sending = true;
  sendBtn.disabled = true;
  msgInput.value = "";

  try {
    await api("messages", "POST", {
      chat_id: currentChat.id,
      sender_id: currentUser.id,
      message
    });
    await loadMessages();
  } catch (error) {
    console.error(error);
    msgInput.value = message;
    showToast("Message failed: " + error.message);
  } finally {
    sending = false;
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

/* ===========================
   ESCROW RECORDS
   These are records only.
   They do not transfer money.
=========================== */

async function loadEscrows(isPoll = false) {
  if (!currentChat?.id || !isParticipant(currentChat)) return;

  try {
    const records = await api(
      "escrows?chat_id=eq." + encodeURIComponent(currentChat.id) +
      "&select=*&order=created_at.desc"
    );

    escrowList.innerHTML = "";

    if (!Array.isArray(records) || records.length === 0) {
      escrowList.innerHTML =
        '<div style="text-align:center;color:#888;font-size:12px;padding:10px">No escrow records for this chat yet.</div>';
      return;
    }

    for (const record of records) {
      // Never display a record for a different buyer/seller pair.
      const isBuyer = record.buyer_id === currentUser.id;
      const isSeller = record.seller_id === currentUser.id;
      if (!isBuyer && !isSeller) continue;

      const status = String(record.status || "pending").toLowerCase();
      const card = document.createElement("div");
      card.className = "escrow-card";

      const heading = document.createElement("b");
      heading.textContent =
        "🔐 ₦" + Number(record.amount || 0).toLocaleString() + " — " + status.toUpperCase();

      const description = document.createElement("p");
      description.style.cssText = "font-size:13px;margin:6px 0";
      description.textContent = record.description || "";

      const meta = document.createElement("small");
      const created = record.created_at ? new Date(record.created_at).toLocaleString() : "";
      meta.textContent = created + " | Record: " + String(record.id || "").slice(0, 8) +
        " | You: " + (isBuyer ? "Buyer" : "Seller");

      const note = document.createElement("p");
      note.style.cssText = "font-size:12px;color:#666;margin:8px 0 0";
      note.textContent = "Record only — no money has been moved by this action.";

      const actions = document.createElement("div");
      actions.className = "escrow-actions";

      function addAction(label, nextStatus, className) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = className;
        button.textContent = label;
        button.addEventListener("click", () => updateEscrow(record.id, nextStatus));
        actions.appendChild(button);
      }

      if (status === "pending") {
        if (isSeller) addAction("📦 Mark Delivered", "delivered", "btn-deliver");
        if (isBuyer || isSeller) addAction("❌ Cancel Record", "cancelled", "btn-cancel");
        if (isBuyer) addAction("⚠️ Dispute", "disputed", "btn-dispute");
      } else if (status === "delivered") {
        if (isBuyer) {
          addAction("✅ Confirm Delivery (Record Only)", "released", "btn-release");
          addAction("⚠️ Dispute", "disputed", "btn-dispute");
        } else {
          const waiting = document.createElement("span");
          waiting.style.cssText = "font-size:12px;color:#666";
          waiting.textContent = "Waiting for buyer confirmation.";
          actions.appendChild(waiting);
        }
      } else if (status === "released") {
        const done = document.createElement("span");
        done.style.cssText = "color:#087a3e;font-weight:700";
        done.textContent = "✅ Buyer confirmed — record completed";
        actions.appendChild(done);
      } else if (status === "cancelled") {
        actions.textContent = "❌ Record cancelled";
      } else if (status === "disputed") {
        const disputed = document.createElement("span");
        disputed.style.cssText = "color:#b91c1c;font-weight:700";
        disputed.textContent = "⚠️ Disputed — review required";
        actions.appendChild(disputed);
      } else {
        actions.textContent = "Status: " + status;
      }

      card.append(heading, description, meta, note, actions);
      escrowList.appendChild(card);
    }

    if (!escrowList.children.length) {
      escrowList.innerHTML =
        '<div style="text-align:center;color:#888;font-size:12px;padding:10px">No escrow records available for this account.</div>';
    }
  } catch (error) {
    console.warn("Escrow load error:", error);
    escrowList.innerHTML =
      '<small style="color:#b91c1c">Escrow records could not load: ' + esc(error.message) + '</small>';
    if (!isPoll) showToast("Escrow load failed. Check Supabase table access.");
  }
}

async function updateEscrow(id, nextStatus) {
  if (!currentChat?.id || !isParticipant(currentChat)) {
    showToast("Open a valid conversation first.");
    return;
  }

  const allowed = ["delivered", "released", "cancelled", "disputed"];
  if (!allowed.includes(nextStatus)) {
    showToast("Invalid escrow status.");
    return;
  }

  try {
    const found = await api(
      "escrows?id=eq." + encodeURIComponent(id) +
      "&chat_id=eq." + encodeURIComponent(currentChat.id) +
      "&select=*"
    );

    if (!Array.isArray(found) || !found.length) {
      throw new Error("Escrow record not found in this chat.");
    }

    const record = found[0];
    const isBuyer = record.buyer_id === currentUser.id;
    const isSeller = record.seller_id === currentUser.id;
    if (!isBuyer && !isSeller) throw new Error("You are not a participant in this escrow.");

    const status = String(record.status || "pending").toLowerCase();

    // Client-side checks improve the UI; Supabase RLS must enforce them too.
    const permitted =
      (status === "pending" && nextStatus === "delivered" && isSeller) ||
      (status === "pending" && nextStatus === "cancelled" && (isBuyer || isSeller)) ||
      (status === "pending" && nextStatus === "disputed" && isBuyer) ||
      (status === "delivered" && nextStatus === "released" && isBuyer) ||
      (status === "delivered" && nextStatus === "disputed" && isBuyer);

    if (!permitted) {
      throw new Error("That action is not allowed for your role or the current status.");
    }

    const promptText = nextStatus === "released"
      ? "Confirm delivery in the record? This does NOT transfer or release money."
      : "Change the record status to " + nextStatus.toUpperCase() + "?";
    if (!window.confirm(promptText)) return;

    showToast("Updating escrow record...");

    const updated = await api(
      "escrows?id=eq." + encodeURIComponent(id) +
      "&chat_id=eq." + encodeURIComponent(currentChat.id),
      "PATCH",
      {status: nextStatus}
    );

    if (!Array.isArray(updated) || updated.length === 0) {
      throw new Error("Supabase did not confirm an update. Check table permissions and RLS.");
    }

    showToast("Escrow record updated: " + nextStatus);
    await loadEscrows();

    try {
      await api("messages", "POST", {
        chat_id: currentChat.id,
        sender_id: currentUser.id,
        message: "🔐 Escrow record status changed to " + nextStatus.toUpperCase() +
          ". This is a record update only; no funds were transferred."
      });
      await loadMessages();
    } catch (messageError) {
      console.warn("Status updated, but chat notice could not be sent.", messageError);
    }
  } catch (error) {
    console.error("Escrow update failed:", error);
    showToast("Escrow update failed: " + error.message);
  }
}

function openEscrowModal() {
  if (!currentChat?.id || !isParticipant(currentChat)) {
    showToast("Open a conversation first.");
    return;
  }
  escrowModal.classList.add("show");
  $("escrowAmount").focus();
}

function closeEscrowModal() {
  escrowModal.classList.remove("show");
}

async function createEscrow() {
  if (!currentChat?.id || !isParticipant(currentChat)) {
    showToast("Open a valid conversation first.");
    return;
  }

  const amount = Number($("escrowAmount").value);
  const description = $("escrowDesc").value.trim();

  if (!Number.isFinite(amount) || amount <= 0) {
    showToast("Enter a valid amount greater than zero.");
    return;
  }

  if (!description) {
    showToast("Describe what is being bought.");
    return;
  }

  if (!currentChat.buyer_id || !currentChat.seller_id) {
    showToast("This chat is missing buyer or seller details.");
    return;
  }

  const button = $("createEscrowBtn");
  button.disabled = true;
  button.textContent = "Saving...";

  try {
    const created = await api("escrows", "POST", {
      chat_id: currentChat.id,
      business_id: currentChat.business_id || businessId || null,
      buyer_id: currentChat.buyer_id,
      seller_id: currentChat.seller_id,
      amount,
      description,
      status: "pending"
    });

    if (!Array.isArray(created) || created.length === 0) {
      throw new Error("Supabase did not confirm the new escrow record.");
    }

    closeEscrowModal();
    $("escrowAmount").value = "";
    $("escrowDesc").value = "";
    showToast("Escrow record created. No funds were transferred.");

    await loadEscrows();

    try {
      await api("messages", "POST", {
        chat_id: currentChat.id,
        sender_id: currentUser.id,
        message: "🔐 ESCROW RECORD CREATED: ₦" + amount.toLocaleString() +
          " for " + description + ". Status: PENDING. Record only; no money transferred."
      });
      await loadMessages();
    } catch (messageError) {
      console.warn("Escrow saved, but chat notice could not be sent.", messageError);
    }
  } catch (error) {
    console.error("Escrow creation failed:", error);
    showToast("Escrow failed: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Create Record";
  }
}

$("headerEscrowBtn").addEventListener("click", openEscrowModal);
$("bottomEscrowBtn").addEventListener("click", openEscrowModal);
$("cancelEscrowBtn").addEventListener("click", closeEscrowModal);
$("createEscrowBtn").addEventListener("click", createEscrow);
$("notifyToggle").addEventListener("click", toggleNotifications);
sendBtn.addEventListener("click", sendMessage);

msgInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
});

escrowModal.addEventListener("click", event => {
  if (event.target === escrowModal) closeEscrowModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeEscrowModal();
});

imageInput.addEventListener("change", async event => {
  const file = event.target.files?.[0];
  if (!file) return;

  if (!currentChat?.id || !isParticipant(currentChat) || !accessToken) {
    showToast("Open a chat and log in first.");
    imageInput.value = "";
    return;
  }

  const allowedTypes = ["image/jpeg", "image/png", "image/webp", "image/gif"];
  if (!allowedTypes.includes(file.type)) {
    showToast("Use a JPG, PNG, WEBP, or GIF image.");
    imageInput.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    showToast("Images must be 5MB or smaller.");
    imageInput.value = "";
    return;
  }

  const label = imageInput.parentElement;
  label.style.opacity = "0.5";
  imageInput.disabled = true;
  showToast("Uploading image...");

  try {
    const cleanName = file.name
      .replace(/\s+/g, "_")
      .replace(/[^a-zA-Z0-9._-]/g, "");

    const fileName =
      encodeURIComponent(currentChat.id) + "/" + Date.now() + "_" + cleanName;

    const response = await fetch(
      SUPABASE_URL + "/storage/v1/object/chat-images/" + fileName,
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + accessToken,
          "Content-Type": file.type,
          "x-upsert": "false"
        },
        body: file
      }
    );

    if (!response.ok) {
      const details = await response.text();
      throw new Error("Image upload failed: " + details);
    }

    const publicUrl =
      SUPABASE_URL + "/storage/v1/object/public/chat-images/" + fileName;

    await api("messages", "POST", {
      chat_id: currentChat.id,
      sender_id: currentUser.id,
      message: "📷 Image: " + publicUrl
    });

    await loadMessages();
    showToast("Image sent.");
  } catch (error) {
    console.error("Image upload failed:", error);
    showToast(error.message);
  } finally {
    label.style.opacity = "1";
    imageInput.disabled = false;
    imageInput.value = "";
  }
});

window.addEventListener("beforeunload", () => clearInterval(pollTimer));

init();
</script>
