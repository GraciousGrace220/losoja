<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LosOja Chat</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background: #f4f7f5;
        color: #111827;
        min-height: 100vh;
    }

    header {
        background: #087a3e;
        color: white;
        padding: 14px 16px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        position: sticky;
        top: 0;
        z-index: 10;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .back-button {
        border: none;
        background: transparent;
        color: white;

        font-size: 30px;
        line-height: 1;

        cursor: pointer;
        padding: 0 5px;
    }

    .header-title {
        font-size: 20px;
        font-weight: 700;
    }

    .login-button {
        border: 1px solid rgba(255,255,255,.7);
        background: transparent;
        color: white;

        padding: 7px 12px;
        border-radius: 8px;

        cursor: pointer;
        font-weight: 600;
    }

    .page {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;

        padding: 16px;
    }

    .status {
        background: white;
        border-radius: 12px;
        padding: 12px 14px;

        margin-bottom: 12px;

        border: 1px solid #e5e7eb;
    }

    .status strong {
        color: #087a3e;
    }

    .conversation-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;

        padding: 14px;
        margin-bottom: 10px;

        cursor: pointer;
    }

    .conversation-card:hover {
        border-color: #087a3e;
    }

    .conversation-title {
        font-weight: 700;
        margin-bottom: 5px;
    }

    .conversation-time {
        color: #6b7280;
        font-size: 13px;
    }

    .chat-header {
        background: white;
        border-radius: 12px;

        padding: 14px;
        margin-bottom: 12px;

        border: 1px solid #e5e7eb;
    }

    .chat-user {
        font-weight: 700;
        font-size: 17px;
    }

    .listing-info {
        color: #6b7280;
        font-size: 14px;
        margin-top: 4px;
    }

    /* =====================================================
       ESCROW PURCHASE DETAILS
    ===================================================== */

    .escrow-details {
        display: none;

        background: white;
        border: 1px solid #dfe7e2;
        border-left: 4px solid #087a3e;

        border-radius: 12px;

        padding: 15px;

        margin-bottom: 12px;
    }

    .escrow-details-title {
        font-size: 16px;
        font-weight: 700;

        color: #087a3e;

        margin-bottom: 12px;
    }

    .escrow-detail-row {
        margin-bottom: 10px;
    }

    .escrow-detail-row:last-child {
        margin-bottom: 0;
    }

    .escrow-detail-label {
        display: block;

        color: #6b7280;

        font-size: 12px;
        font-weight: 600;

        margin-bottom: 3px;

        text-transform: uppercase;
    }

    .escrow-detail-value {
        color: #111827;

        font-size: 14px;

        line-height: 1.5;

        word-break: break-word;
    }

    .escrow-amount {
        font-weight: 700;
        color: #087a3e;
        font-size: 16px;
    }

    .escrow-status {
        display: inline-block;

        background: #eef8f2;
        color: #087a3e;

        padding: 4px 9px;

        border-radius: 20px;

        font-size: 12px;
        font-weight: 700;

        text-transform: capitalize;
    }

    .escrow-dispute {
        background: #fff7ed;
        color: #9a3412;

        border-radius: 8px;

        padding: 10px;

        margin-top: 10px;

        font-size: 13px;

        line-height: 1.5;
    }

    .messages {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;

        padding: 14px;

        min-height: 350px;
        max-height: 55vh;

        overflow-y: auto;

        margin-bottom: 12px;
    }

    .message-row {
        display: flex;
        margin-bottom: 10px;
    }

    .message-row.mine {
        justify-content: flex-end;
    }

    .message-bubble {
        max-width: 80%;

        background: #eef2f0;

        border-radius: 14px;
        padding: 10px 12px;

        word-break: break-word;
    }

    .message-row.mine .message-bubble {
        background: #087a3e;
        color: white;
    }

    .message-time {
        font-size: 11px;
        opacity: .7;
        margin-top: 4px;
    }

    .empty-message {
        text-align: center;
        color: #6b7280;
        padding: 60px 15px;
    }

    .chat-form {
        display: flex;
        gap: 8px;

        background: white;

        padding: 10px;

        border-radius: 12px;

        border: 1px solid #e5e7eb;
    }

    .message-input {
        flex: 1;

        border: 1px solid #d1d5db;

        border-radius: 9px;

        padding: 11px 12px;

        font-size: 15px;

        outline: none;
    }

    .message-input:focus {
        border-color: #087a3e;
    }

    .send-button {
        width: 48px;

        border: none;

        border-radius: 9px;

        background: #087a3e;
        color: white;

        font-size: 20px;
        font-weight: 700;

        cursor: pointer;
    }

    .send-button:disabled {
        opacity: .6;
        cursor: not-allowed;
    }

    .error {
        display: none;

        background: #fee2e2;
        color: #991b1b;

        border-radius: 10px;

        padding: 12px;

        margin-bottom: 12px;
    }

    .loading {
        text-align: center;
        color: #6b7280;
        padding: 30px;
    }

    @media (max-width: 600px) {

        .page {
            padding: 10px;
        }

        .messages {
            max-height: 60vh;
        }

        .message-bubble {
            max-width: 88%;
        }

    }

</style>

</head>

<body>

<header>

<div class="header-left">

</div>

<section

    <div

        </div>

            id="listingInfo"

    <!-- =====================================================

    <div

        <div class="escrow-details-title">
            Escrow Purchase Details

            <span class="escrow-detail-label">

            </span>

            <div
                id="escrowDescription"

                -
            </div>

        </div>


        <div class="escrow-detail-row">

            </span>

            <div
                id="escrowAmount"

        <div class="escrow-detail-row">

            <span class="escrow-detail-label">

                id="escrowStatus"

</main>

<script src="js/auth.js?v=2"></script>

<script>

"use strict";


const SUPABASE_URL =
    "https://ycxshwgeebskdozmornh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe";


let currentUser = null;

let currentConversationId = null;

let currentOtherUserId = null;

let currentListingId = null;

let currentEscrowId = null;

let currentEscrow = null;

let currentOjaListingId = null;

let currentOjaListing = null;

let currentOjaImages = [];

let messagePolling = null;


/* =========================================================
   HELPERS
========================================================= */

function showError(message) {

    const box =
        document.getElementById(
            "errorMessage"
        );

    if (!box) return;

    box.textContent = message;

    box.style.display = "block";
}


function clearError() {

    const box =
        document.getElementById(
            "errorMessage"
        );

    if (!box) return;

    box.textContent = "";

    box.style.display = "none";
}


function goToLogin() {

    localStorage.setItem(
        "losoja_return_to_chat",
        window.location.href
    );

    if (
        typeof window.openLogin ===
        "function"
    ) {

        window.openLogin();

        return;
    }

    window.location.href =
        "index.html";
}


function getAccessToken() {

    if (
        typeof window.getSupabaseAccessToken ===
        "function"
    ) {

        return window.getSupabaseAccessToken();
    }

    return null;
}


function getHeaders() {

    const token =
        getAccessToken();

    return {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " +
            (token || SUPABASE_KEY),

        "Content-Type":
            "application/json",

        "Prefer":
            "return=representation"

    };
}


async function supabaseRequest(
    path,
    options = {}
) {

    const response =
        await fetch(
            SUPABASE_URL + path,
            {
                ...options,

                headers: {
                    ...getHeaders(),

                    ...(options.headers || {})
                }
            }
        );


    const text =
        await response.text();


    let data = null;


    try {

        data =
            text
                ? JSON.parse(text)
                : null;

    } catch {

        data = text;

    }


    if (!response.ok) {

        console.error(
            "LosOja Supabase error:",
            response.status,
            data
        );

        throw new Error(
            data?.message ||
            data?.error_description ||
            data?.error ||
            "Supabase request failed."
        );
    }


    return data;
}


/* =========================================================
   LOAD ESCROW CHAT CONTEXT
========================================================= */

async function loadEscrowChatContext() {

    if (!currentEscrowId) {

        return false;
    }


    const escrow =
        await supabaseRequest(
            "/rest/v1/escrow_transactions" +
            "?select=id,buyer_id,seller_id,amount,currency,status,description,dispute_reason" +
            "&id=eq." +
            encodeURIComponent(
                currentEscrowId
            )
        );


    if (
        !Array.isArray(escrow) ||
        !escrow[0]
    ) {

        throw new Error(
            "Escrow transaction could not be found."
        );
    }


    currentEscrow =
        escrow[0];


    const buyerId =
        currentEscrow.buyer_id;

    const sellerId =
        currentEscrow.seller_id;


    if (
        currentUser.id !== buyerId &&
        currentUser.id !== sellerId
    ) {

        throw new Error(
            "You are not a participant in this escrow."
        );
    }


    currentOtherUserId =
        currentUser.id === buyerId
            ? sellerId
            : buyerId;


    return true;
}


/* =========================================================
   DISPLAY ESCROW DETAILS
========================================================= */

function renderEscrowDetails() {

    if (!currentEscrow) {

        return;
    }


    const details =
        document.getElementById(
            "escrowDetails"
        );


    if (!details) {

        return;
    }


    const description =
        currentEscrow.description ||
        "No purchase description was provided.";


    const amount =
        Number(
            currentEscrow.amount || 0
        ).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:
                    2,

                maximumFractionDigits:
                    2
            }
        );


    const currency =
        currentEscrow.currency ||
        "NGN";


    const status =
        currentEscrow.status ||
        "active";


    document.getElementById(
        "escrowDescription"
    ).textContent =
        description;


    document.getElementById(
        "escrowAmount"
    ).textContent =
        currency +
        " " +
        amount;


    document.getElementById(
        "escrowStatus"
    ).innerHTML = `

        <span class="escrow-status">

            ${escapeHTML(status)}

        </span>

    `;


    const disputeBox =
        document.getElementById(
            "escrowDispute"
        );


    if (
        currentEscrow.dispute_reason &&
        disputeBox
    ) {

        disputeBox.textContent =
            "Dispute reason: " +
            currentEscrow.dispute_reason;

        disputeBox.style.display =
            "block";

    } else if (disputeBox) {

        disputeBox.style.display =
            "none";
    }


    details.style.display =
        "block";
}


/* =========================================================
   FIND OR CREATE CONVERSATION
========================================================= */

async function findOrCreateConversation() {

    if (!currentUser) {

        throw new Error(
            "You must be logged in."
        );
    }


    if (!currentOtherUserId) {

        throw new Error(
            "The other user could not be found."
        );
    }


    if (
        currentOtherUserId ===
        currentUser.id
    ) {

        throw new Error(
            "You cannot chat with yourself."
        );
    }


    let query;


    if (currentListingId) {

        query =
            "/rest/v1/conversations" +
            "?select=*" +

            "&barter_listing_id=eq." +
            encodeURIComponent(
                currentListingId
            ) +

            "&or=(" +

            "and(user_one_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            ",user_two_id.eq." +
            encodeURIComponent(
                currentOtherUserId
            ) +
            ")," +

            "and(user_one_id.eq." +
            encodeURIComponent(
                currentOtherUserId
            ) +

            ",user_two_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            ")" +

            ")";

    } else {

        query =
            "/rest/v1/conversations" +
            "?select=*" +

            "&or=(" +

            "and(user_one_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            ",user_two_id.eq." +
            encodeURIComponent(
                currentOtherUserId
            ) +
            ")," +

            "and(user_one_id.eq." +
            encodeURIComponent(
                currentOtherUserId
            ) +

            ",user_two_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            ")" +

            ")";
    }


    const existing =
        await supabaseRequest(
            query
        );


    if (
        Array.isArray(existing) &&
        existing.length > 0
    ) {

        return existing[0];
    }


    const conversation = {

        user_one_id:
            currentUser.id,

        user_two_id:
            currentOtherUserId,

        barter_listing_id:
            currentListingId || null

    };


    const created =
        await supabaseRequest(
            "/rest/v1/conversations",
            {
                method: "POST",

                body:
                    JSON.stringify(
                        conversation
                    )
            }
        );


    if (
        !Array.isArray(created) ||
        !created[0]
    ) {

        throw new Error(
            "Conversation could not be created."
        );
    }


    return created[0];
}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

    if (!currentConversationId) {

        return;
    }


    const messages =
        await supabaseRequest(

            "/rest/v1/messages" +

            "?select=*" +

            "&conversation_id=eq." +

            encodeURIComponent(
                currentConversationId
            ) +

            "&order=created_at.asc"
        );


    renderMessages(
        Array.isArray(messages)
            ? messages
            : []
    );
}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(messages) {

    const container =
        document.getElementById(
            "messages"
        );


    if (!container) {

        return;
    }


    if (!messages.length) {

        container.innerHTML = `

            <div class="empty-message">

                No messages yet.<br>

                Start the conversation.

            </div>

        `;

        return;
    }


    container.innerHTML =

        messages

            .map(message => {

                const mine =
                    message.sender_id ===
                    currentUser.id;


                const time =
                    message.created_at

                        ? new Date(
                            message.created_at
                        ).toLocaleTimeString(
                            [],
                            {
                                hour:
                                    "2-digit",

                                minute:
                                    "2-digit"
                            }
                        )

                        : "";


                return `

                    <div
                        class="message-row ${
                            mine
                                ? "mine"
                                : ""
                        }"
                    >

                        <div
                            class="message-bubble"
                        >

                            <div>

                                ${
                                    escapeHTML(
                                        message.message
                                    )
                                }

                            </div>

                            <div
                                class="message-time"
                            >

                                ${time}

                            </div>

                        </div>

                    </div>

                `;

            })

            .join("");


    container.scrollTop =
        container.scrollHeight;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (
        !currentUser ||
        !currentConversationId
    ) {

        showError(
            "Chat is not ready yet."
        );

        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    if (!input) {

        return;
    }


    const cleanMessage =
        input.value.trim();


    if (!cleanMessage) {

        return;
    }


    if (
        cleanMessage.length >
        2000
    ) {

        showError(
            "Message is too long."
        );

        return;
    }


    clearError();


    if (button) {

        button.disabled = true;
    }


    try {

        const message = {

            conversation_id:
                currentConversationId,

            sender_id:
                currentUser.id,

            message:
                cleanMessage

        };


        await supabaseRequest(
            "/rest/v1/messages",
            {
                method: "POST",

                body:
                    JSON.stringify(
                        message
                    )
            }
        );


        input.value = "";


        console.log(
            "LosOja message saved."
        );


        await loadMessages();


    } catch (error) {

        console.error(
            "LosOja send message error:",
            error
        );


        showError(
            error.message ||
            "Message could not be sent."
        );


    } finally {

        if (button) {

            button.disabled = false;
        }


        input.focus();
    }
}


/* =========================================================
   LOAD CONVERSATIONS
========================================================= */

async function loadConversations() {

    if (!currentUser) {

        return;
    }


    const conversations =
        await supabaseRequest(

            "/rest/v1/conversations" +

            "?select=*" +

            "&or=(" +

            "user_one_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            "," +

            "user_two_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            ")" +

            "&order=updated_at.desc"
        );


    renderConversationList(
        Array.isArray(
            conversations
        )
            ? conversations
            : []
    );
}


/* =========================================================
   RENDER CONVERSATION LIST
========================================================= */

async function renderConversationList(
    conversations
) {

    const container =
        document.getElementById(
            "conversationList"
        );


    if (!container) {

        return;
    }


    if (!conversations.length) {

        container.innerHTML = `

            <div class="status">

                You do not have any chats yet.

            </div>

        `;

        return;
    }


    container.innerHTML = "";


    for (
        const conversation
        of conversations
    ) {

        const otherUserId =

            conversation.user_one_id ===
            currentUser.id

                ? conversation.user_two_id

                : conversation.user_one_id;


        let listingTitle =
            "General chat";


        if (
            conversation.barter_listing_id
        ) {

            try {

                const listing =
                    await supabaseRequest(

                        "/rest/v1/barter_listings" +

                        "?select=title" +

                        "&id=eq." +

                        encodeURIComponent(
                            conversation.barter_listing_id
                        )
                    );


                if (
                    Array.isArray(listing) &&
                    listing[0]
                ) {

                    listingTitle =
                        listing[0].title ||
                        "Trade listing";
                }


            } catch (error) {

                console.warn(
                    "Could not load listing:",
                    error
                );
            }
        }


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "conversation-card";


        card.innerHTML = `

            <div
                class="conversation-title"
            >

                ${
                    escapeHTML(
                        listingTitle
                    )
                }

            </div>

            <div
                class="conversation-time"
            >

                Open chat

            </div>

        `;


        card.addEventListener(
            "click",
            () => {

                const url =
                    "chat.html" +

                    "?user=" +

                    encodeURIComponent(
                        otherUserId
                    ) +

                    (
                        conversation.barter_listing_id

                            ? "&listing=" +

                              encodeURIComponent(
                                  conversation.barter_listing_id
                              )

                            : ""
                    );


                window.location.href =
                    url;
            }
        );


        container.appendChild(
            card
        );
    }
}


/* =========================================================
   OPEN SPECIFIC CHAT
========================================================= */

async function openSpecificChat() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    currentOtherUserId =
        params.get("user");


    currentListingId =
        params.get("listing");


    currentEscrowId =
        params.get("escrow");


    /*
       ESCROW CHAT

       If an escrow ID exists,
       the buyer/seller are determined
       from the escrow itself.
    */

    if (currentEscrowId) {

        await loadEscrowChatContext();

    }


    /*
       NORMAL CHAT

       If there is no escrow and
       no user parameter, show chats.
    */

    if (!currentOtherUserId) {

        await loadConversations();

        return;
    }


    if (
        currentOtherUserId ===
        currentUser.id
    ) {

        showError(
            "You cannot open a chat with yourself."
        );

        return;
    }


    document.getElementById(
        "conversationList"
    ).style.display =
        "none";


    document.getElementById(
        "chatSection"
    ).style.display =
        "block";


    /*
       Change title depending
       on whether this is escrow.
    */

    if (currentEscrowId) {

        const isBuyer =
            currentUser.id ===
            currentEscrow.buyer_id;


        document.getElementById(
            "chatUser"
        ).textContent =
            isBuyer
                ? "Chat with Seller"
                : "Chat with Buyer";


        const amount =
            Number(
                currentEscrow.amount || 0
            ).toLocaleString(
                "en-NG",
                {
                    minimumFractionDigits:
                        2,

                    maximumFractionDigits:
                        2
                }
            );


        document.getElementById(
            "listingInfo"
        ).textContent =
            "Escrow • ₦" +
            amount +
            " • " +
            (
                currentEscrow.status ||
                "active"
            );


        /*
           Show the full escrow
           purchase information.
        */

        renderEscrowDetails();


    } else {

        document.getElementById(
            "chatUser"
        ).textContent =
            "Chat with Owner";


        if (currentListingId) {

            document.getElementById(
                "listingInfo"
            ).textContent =
                "Trade listing";
        }
    }


    const conversation =
        await findOrCreateConversation();


    currentConversationId =
        conversation.id;


    await loadMessages();


    if (messagePolling) {

        clearInterval(
            messagePolling
        );
    }


    messagePolling =
        setInterval(
            async () => {

                try {

                    await loadMessages();

                } catch (error) {

                    console.warn(
                        "Message refresh failed:",
                        error
                    );
                }

            },
            3000
        );
}


/* =========================================================
   AUTH INITIALIZATION
========================================================= */

async function initializeChat() {

    clearError();


    try {

        if (
            typeof window.getCurrentUser !==
            "function"
        ) {

            throw new Error(
                "LosOja authentication is not available."
            );
        }


        currentUser =
            await window.getCurrentUser();


        /*
           Hide Login button when
           the user is already logged in.
        */

        const loginButton =
            document.getElementById(
                "loginButton"
            );


        if (loginButton) {

            loginButton.style.display =
                currentUser
                    ? "none"
                    : "block";
        }


        if (!currentUser) {

            document.getElementById(
                "status"
            ).innerHTML =
                "<strong>Please login to use chat.</strong>";


            document.getElementById(
                "conversationList"
            ).innerHTML = `

                <div class="status">

                    Please login to send and receive messages.

                </div>

            `;

            return;
        }


        document.getElementById(
            "status"
        ).innerHTML =
            "<strong>Connected</strong>";


        await openSpecificChat();


    } catch (error) {

        console.error(
            "LosOja chat initialization error:",
            error
        );


        showError(
            error.message ||
            "Chat could not be loaded."
        );
    }
}


/* =========================================================
   FORM
========================================================= */

document
    .getElementById("chatForm")
    .addEventListener(
        "submit",
        event => {

            event.preventDefault();

            sendMessage();

        }
    );


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    initializeChat
);

</script>
