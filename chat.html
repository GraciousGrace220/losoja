<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oja Chat - LosOja</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f5;display:flex;flex-direction:column;height:100vh}
.topbar{background:#087a3e;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{color:#fff;text-decoration:none;font-weight:800}
.chat-wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:800px;width:100%;margin:0 auto}
.msg{max-width:75%;padding:10px 14px;border-radius:14px;line-height:1.5;font-size:14px;word-break:break-word}
.msg.me{align-self:flex-end;background:#087a3e;color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#fff;border:1px solid #e0e8e2;border-bottom-left-radius:4px}
.escrow-card{background:#fff;border:2px solid #087a3e;border-radius:14px;padding:14px;margin:10px 0}
.input-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e0e8e2;padding:10px;display:flex;gap:8px;max-width:800px;width:100%;margin:0 auto}
.input-bar input{flex:1;padding:12px;border:1px solid #d7e1da;border-radius:10px}
.input-bar button{padding:12px 16px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.btn-send{background:#087a3e;color:#fff}.btn-escrow{background:#fff;border:1px solid #087a3e;color:#087a3e}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}.modal.show{display:flex}
.modal-card{background:#fff;border-radius:16px;padding:20px;width:min(400px,100%)}
.modal-card input,.modal-card textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17201b;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:10000}.toast.show{opacity:1}
</style>
</head>
<body>
<header class="topbar">
<a href="index.html" class="brand">← LosOja</a>
<div id="chatHeader" style="flex:1;text-align:center;font-weight:700">Loading...</div>
<button onclick="openEscrowModal()" style="background:#fff;color:#087a3e;border:0;padding:8px 12px;border-radius:8px;font-weight:700">🔐 Escrow</button>
</header>
<div id="chatWrap" class="chat-wrap"><div style="text-align:center;color:#888;padding:40px">Loading...</div></div>
<div id="escrowList" style="max-width:800px;width:100%;margin:0 auto;padding:0 16px"></div>
<div class="input-bar">
<input id="msgInput" placeholder="Type message..."><button class="btn-send" id="sendBtn">Send</button><button class="btn-escrow" onclick="openEscrowModal()">🔐</button>
</div>
<div id="escrowModal" class="modal"><div class="modal-card">
<h3 style="margin:0;color:#087a3e">🔐 Create Escrow</h3>
<p style="font-size:13px;color:#666">LosOja go hold your money until you confirm delivery. Safe!</p>
<input id="escrowAmount" type="number" placeholder="Amount ₦ e.g 50000">
<textarea id="escrowDesc" placeholder="What are you buying?"></textarea>
<div style="display:flex;gap:10px;margin-top:12px"><button onclick="closeEscrowModal()" style="flex:1;padding:12px;background:#eee;border:0;border-radius:9px">Cancel</button><button onclick="createEscrow()" style="flex:1;padding:12px;background:#087a3e;color:#fff;border:0;border-radius:9px;font-weight:700">Lock Money</button></div>
</div></div>
<div id="toast" class="toast"></div>
<script src="js/auth.js?v=2"></script>
<script>
"use strict";
const SUPABASE_URL="https://ycxshwgeebskdozmornh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljeHNod2dlZWJza2Rvem1vcm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDY0NjUsImV4cCI6MjEwMzg4MjQ2NX0.tMl7wILdVDhu0RWFaG_84ngJEryLt2c5cB8MEKW3kfU";
const chatWrap=document.getElementById("chatWrap"),chatHeader=document.getElementById("chatHeader"),msgInput=document.getElementById("msgInput"),sendBtn=document.getElementById("sendBtn"),escrowList=document.getElementById("escrowList"),escrowModal=document.getElementById("escrowModal"),toast=document.getElementById("toast");
let currentUser=null,currentChat=null,sellerId=null,businessId=null,accessToken=null;
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showToast(m){toast.textContent=m;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),3000)}
function getParams(){const p=new URLSearchParams(location.search);return {sellerId:p.get("user"),businessId:p.get("business"),escrow:p.get("escrow")}}
async function getUserAndToken(){
 try{if(typeof window.getCurrentUser==="function"){const r=await window.getCurrentUser();if(r?.user?.id){currentUser=r.user}} }catch{}
 try{if(typeof window.getSupabaseAccessToken==="function"){const t=await window.getSupabaseAccessToken();accessToken=t?.access_token||t}}catch{}
 if(!currentUser){try{const raw=localStorage.getItem("losoja_supabase_session");if(raw){const j=JSON.parse(raw);currentUser=j?.user||j?.data?.user;accessToken=j?.access_token||j?.session?.access_token||j?.data?.session?.access_token}}catch{}}
 return currentUser;
}
async function api(path,method="GET",body=null){
 const headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${accessToken||SUPABASE_KEY}`,"Content-Type":"application/json"};
 if(method==="GET")delete headers["Content-Type"];
 const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{method,headers,body:body?JSON.stringify(body):null});
 if(!res.ok){const t=await res.text();throw new Error(t)}
 const txt=await res.text();return txt?JSON.parse(txt):null;
}
async function init(){
 const {sellerId:sId,businessId:bId,escrow}=getParams();sellerId=sId;businessId=bId;
 if(!sellerId){chatWrap.innerHTML="No seller";return}
 await getUserAndToken();
 if(!currentUser||!accessToken){showToast("Login first");setTimeout(()=>location.href="index.html#login",800);return}
 chatHeader.textContent="Oja Chat...";
 try{
  let chats=await api(`chats?buyer_id=eq.${currentUser.id}&seller_id=eq.${sellerId}${businessId?`&business_id=eq.${businessId}`:""}&select=*`);
  if(!chats.length){
   await api(`chats`,"POST",{buyer_id:currentUser.id,seller_id:sellerId,business_id:businessId||null});
   chats=await api(`chats?buyer_id=eq.${currentUser.id}&seller_id=eq.${sellerId}&order=created_at.desc&limit=1&select=*`);
  }
  currentChat=chats[0];
  if(businessId){try{const biz=await api(`businesses?id=eq.${businessId}&select=name`);if(biz[0])chatHeader.textContent=biz[0].name}catch{}}
  loadMessages();loadEscrows();
  if(escrow==="1"){setTimeout(()=>openEscrowModal(),800)}
 }catch(e){chatWrap.innerHTML=`<div style="color:red;text-align:center">Error: ${esc(e.message)}</div>`}
}
async function loadMessages(){
 if(!currentChat)return;
 try{
  const msgs=await api(`messages?chat_id=eq.${currentChat.id}&order=created_at.asc&select=*`);
  chatWrap.innerHTML="";
  if(!msgs.length)chatWrap.innerHTML=`<div style="text-align:center;color:#888">No messages yet. Start chat!<br><br>🔐 Use Escrow button to lock money safe.</div>`;
  msgs.forEach(m=>{const div=document.createElement("div");div.className="msg "+(m.sender_id===currentUser.id?"me":"them");div.textContent=m.message;chatWrap.appendChild(div);});
  chatWrap.scrollTop=chatWrap.scrollHeight;
 }catch(e){console.error(e)}
}
async function sendMessage(){
 const text=msgInput.value.trim();if(!text||!currentChat)return;
 msgInput.value="";
 try{await api(`messages`,"POST",{chat_id:currentChat.id,sender_id:currentUser.id,message:text});loadMessages()}catch(e){showToast("Failed to send");msgInput.value=text}
}
async function loadEscrows(){
 if(!currentChat)return;
 try{
  const escrows=await api(`escrows?chat_id=eq.${currentChat.id}&order=created_at.desc&select=*`);
  escrowList.innerHTML="";
  escrows.forEach(es=>{
   const div=document.createElement("div");div.className="escrow-card";
   div.innerHTML=`<h4>🔐 Escrow ₦${Number(es.amount).toLocaleString()} - ${esc(es.status.toUpperCase())}</h4><p style="font-size:13px;margin:6px 0">${esc(es.description||"")}</p><small style="color:#888">${new Date(es.created_at).toLocaleString()}</small><div style="margin-top:8px"><button onclick="updateEscrow('${es.id}','completed')" style="padding:6px 10px;background:#087a3e;color:#fff;border:0;border-radius:6px;margin-right:6px">Confirm Delivery</button><button onclick="updateEscrow('${es.id}','disputed')" style="padding:6px 10px;background:#fff;border:1px solid #ccc;border-radius:6px">Dispute</button></div>`;
   escrowList.appendChild(div);
  });
 }catch(e){console.error(e)}
}
async function updateEscrow(id,status){
 try{await api(`escrows?id=eq.${id}`,"PATCH",{status});showToast("Escrow "+status);loadEscrows()}catch(e){showToast(e.message)}
}
function openEscrowModal(){escrowModal.classList.add("show")}
function closeEscrowModal(){escrowModal.classList.remove("show")}
async function createEscrow(){
 const amount=Number(document.getElementById("escrowAmount").value),desc=document.getElementById("escrowDesc").value.trim();
 if(!amount||amount<=0){showToast("Enter amount");return}
 if(!desc){showToast("Describe item");return}
 try{
  await api(`escrows`,"POST",{chat_id:currentChat.id,business_id:businessId||null,buyer_id:currentUser.id,seller_id:sellerId,amount,description:desc,status:"pending"});
  closeEscrowModal();document.getElementById("escrowAmount").value="";document.getElementById("escrowDesc").value="";
  showToast("Escrow locked! Money safe");loadEscrows();
  await api(`messages`,"POST",{chat_id:currentChat.id,sender_id:currentUser.id,message:`🔐 ESCROW: ₦${amount.toLocaleString()} for ${desc} - Pending`});
  loadMessages();
 }catch(e){showToast("Failed: "+e.message)}
}
sendBtn.onclick=sendMessage;
msgInput.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});
init();
</script>
</body>
</html>
