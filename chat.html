<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>LosOja Chat</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7f5;
        color: #111827;
    }

    .chat-header {
        background: #087a3e;
        color: white;
        padding: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .back-button {
        border: none;
        background: transparent;
        color: white;
        font-size: 24px;
        cursor: pointer;
    }

    .chat-title {
        font-size: 20px;
        font-weight: bold;
    }

    .chat-subtitle {
        font-size: 12px;
        opacity: 0.85;
        margin-top: 3px;
    }

    .chat-container {
        max-width: 700px;
        margin: 0 auto;
        min-height: calc(100vh - 65px);
        background: white;
        display: flex;
        flex-direction: column;
    }

    .listing-info {
        display: none;
        padding: 12px 16px;
        background: #fff8df;
        border-bottom: 1px solid #eee;
        font-size: 14px;
    }

    .messages {
        flex: 1;
        padding: 20px 14px 90px;
        overflow-y: auto;
    }

    .message-row {
        display: flex;
        margin-bottom: 12px;
    }

    .message-row.mine {
        justify-content: flex-end;
    }

    .message-bubble {
        max-width: 78%;
        padding: 11px 14px;
        border-radius: 16px;
        background: #eeeeee;
        word-wrap: break-word;
        white-space: pre-wrap;
    }

    .message-row.mine .message-bubble {
        background: #087a3e;
        color: white;
        border-bottom-right-radius: 4px;
    }

    .message-row:not(.mine) .message-bubble {
        border-bottom-left-radius: 4px;
    }

    .message-time {
        display: block;
        font-size: 10px;
        margin-top: 5px;
        opacity: 0.7;
    }

    .empty-message {
        text-align: center;
        color: #777;
        padding: 40px 20px;
    }

    .error-message {
        margin: 15px;
        padding: 12px;
        border-radius: 8px;
        background: #ffe5e5;
        color: #b00020;
        display: none;
    }

    .login-message {
        text-align: center;
        padding: 50px 20px;
    }

    .login-button {
        margin-top: 15px;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #087a3e;
        color: white;
        cursor: pointer;
        font-size: 16px;
    }

    .message-form {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-width: 700px;
        margin: auto;
        background: white;
        border-top: 1px solid #ddd;
        padding: 10px;
        display: flex;
        gap: 8px;
    }

    .message-input {
        flex: 1;
        min-width: 0;
        border: 1px solid #ccc;
        border-radius: 22px;
        padding: 12px 15px;
        font-size: 15px;
        outline: none;
    }

    .message-input:focus {
        border-color: #087a3e;
    }

    .send-button {
        width: 50px;
        height: 44px;
        border: none;
        border-radius: 50%;
        background: #087a3e;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }

    .send-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

</head>

<body>

<header class="chat-header">

<button
    class="back-button"
    type="button"
    onclick="history.back()"
>
    &lsaquo;
</button>

<div>
    <div class="chat-title">LosOja Chat</div>
    <div
        class="chat-subtitle"
        id="chatStatus"
    >
        Loading...
    </div>
</div>

</header>

<main class="chat-container">

<div
    id="listingInfo"
    class="listing-info"
></div>

<div
    id="errorMessage"
    class="error-message"
></div>

<div
    id="loginMessage"
    class="login-message"
    style="display: none;"
>
    <h2>Please log in</h2>

    <p style="margin-top: 8px;">
        You must be logged in to use LosOja Chat.
    </p>

    <button
        class="login-button"
        type="button"
        onclick="goToLogin()"
    >
        Login
    </button>
</div>

<div
    id="chatArea"
    style="display: none; flex: 1;"
>

    <div
        id="messages"
        class="messages"
    >
        <div class="empty-message">
            Loading messages...
        </div>
    </div>

    <form
        id="messageForm"
        class="message-form"
    >

        <input
            id="messageInput"
            class="message-input"
            type="text"
            maxlength="2000"
            placeholder="Type a message..."
            autocomplete="off"
            required
        >

        <button
            id="sendButton"
            class="send-button"
            type="submit"
            aria-label="Send message"
        >
            &gt;
        </button>

    </form>

</div>

</main>

<script src="js/auth.js?v=2"></script>

<script> "use strict"; const SUPABASE_URL = "https://ycxshwgeebskdozmornh.supabase.co"; const SUPABASE_KEY = "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe"; let currentUser = null; let otherUserId = null; let listingId = null; let conversationId = null; let refreshTimer = null; function escapeHTML(value) { return String(value || "") .replace(/&/g, "&amp;") .replace(/</g, "&lt;") .replace(/>/g, "&gt;") .replace(/"/g, "&quot;") .replace(/'/g, "&#039;"); } function getAccessToken() { if ( typeof window.getSupabaseAccessToken === "function" ) { return window.getSupabaseAccessToken(); } return null; } function getHeaders() { const token = getAccessToken(); return { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + (token || SUPABASE_KEY), "Content-Type": "application/json" }; } async function supabaseRequest( table, options = {} ) { const url = SUPABASE_URL + "/rest/v1/" + table; const response = await fetch( url, { method: options.method || "GET", headers: { ...getHeaders(), ...(options.headers || {}) }, body: options.body ? JSON.stringify(options.body) : undefined } ); const text = await response.text(); let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; } if (!response.ok) { throw new Error( data?.message || data?.error_description || data?.hint || "Supabase request failed." ); } return data; } function showError(message) { const box = document.getElementById( "errorMessage" ); box.textContent = message; box.style.display = "block"; } function clearError() { const box = document.getElementById( "errorMessage" ); box.textContent = ""; box.style.display = "none"; } function goToLogin() { window.location.href = "index.html"; } async function findOrCreateConversation() { const myId = currentUser.id; let url = SUPABASE_URL + "/rest/v1/conversations" + "?select=*" + "&user_one_id=eq." + encodeURIComponent(myId) + "&user_two_id=eq." + encodeURIComponent(otherUserId); let response = await fetch( url, { headers: getHeaders() } ); if (!response.ok) { throw new Error( "Could not check conversations." ); } let conversations = await response.json(); if (!conversations.length) { url = SUPABASE_URL + "/rest/v1/conversations" + "?select=*" + "&user_one_id=eq." + encodeURIComponent(otherUserId) + "&user_two_id=eq." + encodeURIComponent(myId); response = await fetch( url, { headers: getHeaders() } ); if (!response.ok) { throw new Error( "Could not check conversations." ); } conversations = await response.json(); } if (listingId && conversations.length) { const matching = conversations.find( conversation => conversation.barter_listing_id === listingId ); if (matching) { return matching.id; } } if (conversations.length) { return conversations[0].id; } const body = { user_one_id: myId, user_two_id: otherUserId }; if (listingId) { body.barter_listing_id = listingId; } const created = await supabaseRequest( "conversations", { method: "POST", headers: { "Prefer": "return=representation" }, body: body } ); if ( !created || !created.length ) { throw new Error( "Conversation could not be created." ); } return created[0].id; } async function loadMessages() { if (!conversationId) { return; } const url = SUPABASE_URL + "/rest/v1/messages" + "?select=*" + "&conversation_id=eq." + encodeURIComponent(conversationId) + "&order=created_at.asc"; const response = await fetch( url, { headers: getHeaders() } ); if (!response.ok) { throw new Error( "Could not load messages." ); } const messages = await response.json(); renderMessages(messages); } function renderMessages(messages) { const container = document.getElementById( "messages" ); if (!messages.length) { container.innerHTML = '<div class="empty-message">' + 'No messages yet.<br>' + 'Start the conversation.' + '</div>'; return; } container.innerHTML = messages .map(function(message) { const mine = message.sender_id === currentUser.id; const time = new Date( message.created_at ).toLocaleTimeString( [], { hour: "numeric", minute: "2-digit" } ); return ( '<div class="message-row ' + (mine ? "mine" : "") + '">' + '<div class="message-bubble">' + escapeHTML( message.message ) + '<span class="message-time">' + time + '</span>' + '</div>' + '</div>' ); }) .join(""); container.scrollTop = container.scrollHeight; } async function sendMessage(message) { const cleanMessage = message.trim(); if ( !cleanMessage || !conversationId ) { return; } const sendButton = document.getElementById( "sendButton" ); const input = document.getElementById( "messageInput" ); sendButton.disabled = true; try { await supabaseRequest( "messages", { method: "POST", headers: { "Prefer": "return=representation" }, body: { conversation_id: conversationId, sender_id: currentUser.id, message: cleanMessage } } ); input.value = ""; await loadMessages(); } catch (error) { console.error( "LosOja chat send error:", error ); showError( error.message || "Message could not be sent." ); } finally { sendButton.disabled = false; input.focus(); } } async function loadListingInfo() { if (!listingId) { return; } try { const url = SUPABASE_URL + "/rest/v1/barter_listings" + "?select=title" + "&id=eq." + encodeURIComponent(listingId); const response = await fetch( url, { headers: getHeaders() } ); if (!response.ok) { return; } const listings = await response.json(); if (!listings.length) { return; } const box = document.getElementById( "listingInfo" ); box.innerHTML = "Trade listing: <strong>" + escapeHTML( listings[0].title ) + "</strong>"; box.style.display = "block"; } catch (error) { console.warn( "LosOja listing info error:", error ); } } async function initializeChat() { clearError(); if ( typeof window.getCurrentUser !== "function" ) { showError( "LosOja authentication is not available." ); return; } currentUser = await window.getCurrentUser(); if (!currentUser) { document.getElementById( "loginMessage" ).style.display = "block"; document.getElementById( "chatStatus" ).textContent = "Login required"; return; } const params = new URLSearchParams( window.location.search ); otherUserId = params.get("user"); listingId = params.get("listing"); if (!otherUserId) { document.getElementById( "chatStatus" ).textContent = "No user selected"; showError( "No user was selected for this chat." ); return; } if ( otherUserId === currentUser.id ) { showError( "You cannot start a chat with yourself." ); return; } document.getElementById( "chatArea" ).style.display = "flex"; document.getElementById( "chatStatus" ).textContent = "Connected"; try { conversationId = await findOrCreateConversation(); await loadListingInfo(); await loadMessages(); refreshTimer = setInterval( async function() { try { await loadMessages(); } catch (error) { console.warn( "LosOja message refresh failed:", error ); } }, 5000 ); } catch (error) { console.error( "LosOja chat error:", error ); showError( error.message || "Chat could not be loaded." ); } } document .getElementById("messageForm") .addEventListener( "submit", async function(event) { event.preventDefault(); const input = document.getElementById( "messageInput" ); await sendMessage( input.value ); } ); document.addEventListener( "DOMContentLoaded", initializeChat ); window.addEventListener( "beforeunload", function() { if (refreshTimer) { clearInterval(refreshTimer); } } ); </script>

</body> </html>
