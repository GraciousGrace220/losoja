<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LosOja Chat</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background: #f4f7f5;
        color: #111827;
        min-height: 100vh;
    }

    header {
        background: #087a3e;
        color: white;
        padding: 14px 16px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        position: sticky;
        top: 0;
        z-index: 10;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .back-button {
        border: none;
        background: transparent;
        color: white;

        font-size: 30px;
        line-height: 1;

        cursor: pointer;
        padding: 0 5px;
    }

    .header-title {
        font-size: 20px;
        font-weight: 700;

        display: flex;
        align-items: center;
        gap: 8px;
    }

    .chat-unread-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;

        background: #39d98a;

        box-shadow:
            0 0 0 3px rgba(57,217,138,.18);

        display: none;
        flex-shrink: 0;
    }

    .chat-unread-dot.visible {
        display: inline-block;
    }

    .login-button {
        border: 1px solid rgba(255,255,255,.7);

        background: transparent;
        color: white;

        padding: 7px 12px;
        border-radius: 8px;

        cursor: pointer;
        font-weight: 600;
    }

    .page {
        width: 100%;
        max-width: 900px;

        margin: 0 auto;

        padding: 16px;
    }

    .status {
        background: white;

        border-radius: 12px;

        padding: 12px 14px;

        margin-bottom: 12px;

        border: 1px solid #e5e7eb;
    }

    .status strong {
        color: #087a3e;
    }

    .conversation-card {
        background: white;

        border: 1px solid #e5e7eb;

        border-radius: 12px;

        padding: 14px;

        margin-bottom: 10px;

        cursor: pointer;
    }

    .conversation-card:hover {
        border-color: #087a3e;
    }

    .conversation-title {
        font-weight: 700;
        margin-bottom: 5px;
    }

    .conversation-time {
        color: #6b7280;
        font-size: 13px;
    }

    .chat-header {
        background: white;

        border-radius: 12px;

        padding: 14px;

        margin-bottom: 12px;

        border: 1px solid #e5e7eb;
    }

    .chat-user {
        font-weight: 700;
        font-size: 17px;
    }

    .listing-info {
        color: #6b7280;
        font-size: 14px;

        margin-top: 4px;
    }

    /* =====================================================
       OJA ITEM DETAILS
    ===================================================== */

    .oja-details {
        background: white;

        border: 1px solid #e5e7eb;

        border-radius: 12px;

        padding: 14px;

        margin-bottom: 12px;
    }

    .oja-image-gallery {
        display: grid;

        grid-template-columns:
            repeat(auto-fit, minmax(110px, 1fr));

        gap: 8px;

        margin-bottom: 12px;
    }

    .oja-image-gallery img {
        width: 100%;

        aspect-ratio: 1 / 1;

        object-fit: cover;

        border-radius: 9px;

        border: 1px solid #e5e7eb;
    }

    .oja-title {
        font-size: 18px;
        font-weight: 700;

        margin-bottom: 6px;
    }

    .oja-price {
        color: #087a3e;

        font-size: 17px;
        font-weight: 700;

        margin-bottom: 5px;
    }

    .oja-location {
        color: #6b7280;

        font-size: 14px;

        margin-bottom: 8px;
    }

    .oja-description {
        color: #374151;

        font-size: 14px;

        line-height: 1.5;

        white-space: pre-wrap;
    }

    .buy-escrow-button {
        width: 100%;

        border: none;

        border-radius: 9px;

        background: #087a3e;

        color: white;

        padding: 12px;

        margin-top: 14px;

        font-weight: 700;

        cursor: pointer;
    }

    /* =====================================================
       ESCROW PURCHASE DETAILS
    ===================================================== */

    .escrow-details {
        display: none;

        background: white;

        border: 1px solid #dfe7e2;

        border-left: 4px solid #087a3e;

        border-radius: 12px;

        padding: 15px;

        margin-bottom: 12px;
    }

    .escrow-details-title {
        font-size: 16px;

        font-weight: 700;

        color: #087a3e;

        margin-bottom: 12px;
    }

    .escrow-detail-row {
        margin-bottom: 10px;
    }

    .escrow-detail-row:last-child {
        margin-bottom: 0;
    }

    .escrow-detail-label {
        display: block;

        color: #6b7280;

        font-size: 12px;

        font-weight: 600;

        margin-bottom: 3px;

        text-transform: uppercase;
    }

    .escrow-detail-value {
        color: #111827;

        font-size: 14px;

        line-height: 1.5;

        word-break: break-word;
    }

    .escrow-amount {
        font-weight: 700;

        color: #087a3e;

        font-size: 16px;
    }

    .escrow-status {
        display: inline-block;

        background: #eef8f2;

        color: #087a3e;

        padding: 4px 9px;

        border-radius: 20px;

        font-size: 12px;

        font-weight: 700;

        text-transform: capitalize;
    }

    .escrow-dispute {
        background: #fff7ed;

        color: #9a3412;

        border-radius: 8px;

        padding: 10px;

        margin-top: 10px;

        font-size: 13px;

        line-height: 1.5;
    }

    /* =====================================================
       MESSAGES
    ===================================================== */

    .messages {
        background: white;

        border: 1px solid #e5e7eb;

        border-radius: 12px;

        padding: 14px;

        min-height: 350px;

        max-height: 55vh;

        overflow-y: auto;

        margin-bottom: 12px;
    }

    .message-row {
        display: flex;

        margin-bottom: 10px;
    }

    .message-row.mine {
        justify-content: flex-end;
    }

    .message-bubble {
        max-width: 80%;

        background: #eef2f0;

        border-radius: 14px;

        padding: 10px 12px;

        word-break: break-word;
    }

    .message-row.mine .message-bubble {
        background: #087a3e;

        color: white;
    }

    .message-image {
        display: block;

        width: 100%;

        max-width: 300px;

        max-height: 300px;

        object-fit: cover;

        border-radius: 10px;

        cursor: pointer;

        margin-bottom: 6px;
    }

    .message-text {
        white-space: pre-wrap;

        line-height: 1.4;
    }

    .message-time {
        font-size: 11px;

        opacity: .7;

        margin-top: 4px;
    }

    .empty-message {
        text-align: center;

        color: #6b7280;

        padding: 60px 15px;
    }

    /* =====================================================
       CHAT FORM
    ===================================================== */

    .chat-form {
        display: flex;

        gap: 8px;

        background: white;

        padding: 10px;

        border-radius: 12px;

        border: 1px solid #e5e7eb;
    }

    .message-input {
        flex: 1;

        min-width: 0;

        border: 1px solid #d1d5db;

        border-radius: 9px;

        padding: 11px 12px;

        font-size: 15px;

        outline: none;
    }

    .message-input:focus {
        border-color: #087a3e;
    }

    .image-button {
        width: 48px;

        flex-shrink: 0;

        border: none;

        border-radius: 9px;

        background: #eef8f2;

        color: #087a3e;

        font-size: 20px;

        cursor: pointer;
    }

    .image-button:hover {
        background: #dff2e7;
    }

    .image-button:disabled {
        opacity: .6;

        cursor: not-allowed;
    }

    .send-button {
        width: 48px;

        flex-shrink: 0;

        border: none;

        border-radius: 9px;

        background: #087a3e;

        color: white;

        font-size: 20px;

        font-weight: 700;

        cursor: pointer;
    }

    .send-button:disabled {
        opacity: .6;

        cursor: not-allowed;
    }

    .selected-image {
        display: none;

        background: #eef8f2;

        color: #087a3e;

        border-radius: 8px;

        padding: 7px 10px;

        margin-bottom: 8px;

        font-size: 13px;
    }

    .error {
        display: none;

        background: #fee2e2;

        color: #991b1b;

        border-radius: 10px;

        padding: 12px;

        margin-bottom: 12px;
    }

    .loading {
        text-align: center;

        color: #6b7280;

        padding: 30px;
    }

    @media (max-width: 600px) {

        .page {
            padding: 10px;
        }

        .messages {
            max-height: 60vh;
        }

        .message-bubble {
            max-width: 88%;
        }

        .message-image {
            max-width: 240px;

            max-height: 240px;
        }

        .chat-form {
            gap: 6px;
        }

        .image-button,
        .send-button {
            width: 44px;
        }

    }

</style>

</head>

<div class="header-left">

<script src="js/auth.js?v=2"></script>

<script>

"use strict";


const SUPABASE_URL =
    "https://ycxshwgeebskdozmornh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe";


/* =========================================================
   CHAT IMAGE SETTINGS
========================================================= */

const CHAT_IMAGE_BUCKET =
    "chat-images";

const MAX_CHAT_IMAGE_SIZE =
    5 * 1024 * 1024;

const ALLOWED_CHAT_IMAGE_TYPES = [
    "image/jpeg",
    "image/png",
    "image/webp"
];


let currentUser = null;

let currentConversationId = null;

let currentOtherUserId = null;

/*
 * BUSINESS CHAT
 *
 * This is supplied by:
 * chat.html?user=OWNER_ID&business=BUSINESS_ID
 */
let currentBusinessId = null;

let currentListingId = null;

let currentPropertyId = null;

let currentPropertyTitle = null;

let currentEscrowId = null;

let currentEscrow = null;

let currentOjaListingId = null;

let currentOjaListing = null;

let currentOjaImages = [];

let messagePolling = null;


/* =========================================================
   HELPERS
========================================================= */

function showError(message) {

    const box =
        document.getElementById(
            "errorMessage"
        );

    if (!box) return;

    box.textContent =
        message;

    box.style.display =
        "block";
}


function clearError() {

    const box =
        document.getElementById(
            "errorMessage"
        );

    if (!box) return;

    box.textContent =
        "";

    box.style.display =
        "none";
}


function goToLogin() {

    localStorage.setItem(
        "losoja_return_to_chat",
        window.location.href
    );

    if (
        typeof window.openLogin ===
        "function"
    ) {

        window.openLogin();

        return;
    }

    window.location.href =
        "index.html";
}


function getAccessToken() {

    if (
        typeof window.getSupabaseAccessToken ===
        "function"
    ) {

        return window.getSupabaseAccessToken();
    }

    return null;
}


function getHeaders() {

    const token =
        getAccessToken();

    return {

        "apikey":
            SUPABASE_KEY,

        "Authorization":
            "Bearer " +
            (
                token ||
                SUPABASE_KEY
            ),

        "Content-Type":
            "application/json",

        "Prefer":
            "return=representation"

    };
}


async function supabaseRequest(
    path,
    options = {}
) {

    const response =
        await fetch(
            SUPABASE_URL + path,
            {
                ...options,

                headers: {
                    ...getHeaders(),
                    ...(options.headers || {})
                }
            }
        );


    const text =
        await response.text();


    let data = null;


    try {

        data =
            text
                ? JSON.parse(text)
                : null;

    } catch {

        data =
            text;
    }


    if (!response.ok) {

        console.error(
            "LosOja Supabase error:",
            response.status,
            data
        );

        throw new Error(
            data?.message ||
            data?.error_description ||
            data?.error ||
            "Supabase request failed."
        );
    }


    return data;
}


/* =========================================================
   UPLOAD CHAT IMAGE
========================================================= */

async function uploadChatImage(file) {

    if (!file) {
        return null;
    }


    if (
        !ALLOWED_CHAT_IMAGE_TYPES.includes(
            file.type
        )
    ) {

        throw new Error(
            "Only JPG, PNG and WEBP images are allowed."
        );
    }


    if (
        file.size >
        MAX_CHAT_IMAGE_SIZE
    ) {

        throw new Error(
            "Chat images must be 5 MB or smaller."
        );
    }


    if (!currentUser) {

        throw new Error(
            "You must be logged in to upload an image."
        );
    }


    const token =
        getAccessToken();


    if (!token) {

        throw new Error(
            "Your login session has expired. Please login again."
        );
    }


    let extension =
        "jpg";


    if (
        file.type ===
        "image/png"
    ) {

        extension =
            "png";
    }


    if (
        file.type ===
        "image/webp"
    ) {

        extension =
            "webp";
    }


    const uniqueName =
        (
            typeof crypto !==
            "undefined" &&

            typeof crypto.randomUUID ===
            "function"
        )

            ? crypto.randomUUID()

            : Date.now().toString();


    const filePath =
        currentUser.id +
        "/" +
        uniqueName +
        "." +
        extension;


    const uploadUrl =
        SUPABASE_URL +
        "/storage/v1/object/" +
        CHAT_IMAGE_BUCKET +
        "/" +
        filePath;


    const response =
        await fetch(
            uploadUrl,
            {
                method:
                    "POST",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        token,

                    "Content-Type":
                        file.type,

                    "x-upsert":
                        "false"

                },

                body:
                    file
            }
        );


    const responseText =
        await response.text();


    if (!response.ok) {

        let errorData =
            null;


        try {

            errorData =
                responseText
                    ? JSON.parse(
                        responseText
                    )
                    : null;

        } catch {

            errorData =
                null;
        }


        console.error(
            "LosOja chat image upload error:",
            response.status,
            errorData ||
            responseText
        );


        throw new Error(
            errorData?.message ||
            errorData?.error ||
            "Image upload failed."
        );
    }


    return (
        SUPABASE_URL +
        "/storage/v1/object/public/" +
        CHAT_IMAGE_BUCKET +
        "/" +
        filePath
    );
}


/* =========================================================
   LOAD ESCROW CHAT CONTEXT
========================================================= */

async function loadEscrowChatContext() {

    if (!currentEscrowId) {
        return false;
    }


    const escrow =
        await supabaseRequest(
            "/rest/v1/escrow_transactions" +

            "?select=id,buyer_id,seller_id,amount,currency,status,description,dispute_reason" +

            "&id=eq." +
            encodeURIComponent(
                currentEscrowId
            )
        );


    if (
        !Array.isArray(escrow) ||
        !escrow[0]
    ) {

        throw new Error(
            "Escrow transaction could not be found."
        );
    }


    currentEscrow =
        escrow[0];


    const buyerId =
        currentEscrow.buyer_id;

    const sellerId =
        currentEscrow.seller_id;


    if (
        currentUser.id !== buyerId &&
        currentUser.id !== sellerId
    ) {

        throw new Error(
            "You are not a participant in this escrow."
        );
    }


    currentOtherUserId =
        currentUser.id === buyerId
            ? sellerId
            : buyerId;


    return true;
}


/* =========================================================
   DISPLAY ESCROW DETAILS
========================================================= */

function renderEscrowDetails() {

    if (!currentEscrow) {
        return;
    }


    const details =
        document.getElementById(
            "escrowDetails"
        );


    if (!details) {
        return;
    }


    const description =
        currentEscrow.description ||
        "No purchase description was provided.";


    const amount =
        Number(
            currentEscrow.amount || 0
        ).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );


    const currency =
        currentEscrow.currency ||
        "NGN";


    const status =
        currentEscrow.status ||
        "active";


    document.getElementById(
        "escrowDescription"
    ).textContent =
        description;


    document.getElementById(
        "escrowAmount"
    ).textContent =
        currency +
        " " +
        amount;


    document.getElementById(
        "escrowStatus"
    ).innerHTML = `
        <span class="escrow-status">
            ${escapeHTML(status)}
        </span>
    `;


    const disputeBox =
        document.getElementById(
            "escrowDispute"
        );


    if (
        currentEscrow.dispute_reason &&
        disputeBox
    ) {

        disputeBox.textContent =
            "Dispute reason: " +
            currentEscrow.dispute_reason;

        disputeBox.style.display =
            "block";

    } else if (disputeBox) {

        disputeBox.style.display =
            "none";
    }


    details.style.display =
        "block";
}


/* =========================================================
   FIND OR CREATE CONVERSATION
========================================================= */

async function findOrCreateConversation() {

    if (!currentUser) {

        throw new Error(
            "You must be logged in."
        );
    }


    if (!currentOtherUserId) {

        throw new Error(
            "The other user could not be found."
        );
    }


    if (
        currentOtherUserId ===
        currentUser.id
    ) {

        throw new Error(
            "You cannot chat with yourself."
        );
    }


    let query;


    /* =====================================================
       OJA CHAT
    ===================================================== */

    if (currentOjaListingId) {

        query =
            "/rest/v1/conversations" +

            "?select=*" +

            "&oja_listing_id=eq." +
            encodeURIComponent(
                currentOjaListingId
            ) +

            "&or=(" +

            "and(user_one_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            ",user_two_id.eq." +
            encodeURIComponent(
                currentOtherUserId
            ) +
            ")," +

            "and(user_one_id.eq." +
            encodeURIComponent(
                currentOtherUserId
            ) +

            ",user_two_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            ")" +
            ")";


    /* =====================================================
       BARTER CHAT
    ===================================================== */

    } else if (currentListingId) {

        query =
            "/rest/v1/conversations" +

            "?select=*" +

            "&barter_listing_id=eq." +
            encodeURIComponent(
                currentListingId
            ) +

            "&or=(" +

            "and(user_one_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            ",user_two_id.eq." +
            encodeURIComponent(
                currentOtherUserId
            ) +
            ")," +

            "and(user_one_id.eq." +
            encodeURIComponent(
                currentOtherUserId
            ) +

            ",user_two_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            ")" +
            ")";


    /* =====================================================
       NORMAL / BUSINESS CHAT
    ===================================================== */

    } else {

        query =
            "/rest/v1/conversations" +

            "?select=*" +

            "&or=(" +

            "and(user_one_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            ",user_two_id.eq." +
            encodeURIComponent(
                currentOtherUserId
            ) +
            ")," +

            "and(user_one_id.eq." +
            encodeURIComponent(
                currentOtherUserId
            ) +

            ",user_two_id.eq." +
            encodeURIComponent(
                currentUser.id
            ) +

            ")" +
            ")";

    }


    const existing =
        await supabaseRequest(
            query
        );


    if (
        Array.isArray(existing) &&
        existing.length > 0
    ) {

        return existing[0];
    }


    const conversation = {

        user_one_id:
            currentUser.id,

        user_two_id:
            currentOtherUserId,

        barter_listing_id:
            currentListingId ||
            null,

        oja_listing_id:
            currentOjaListingId ||
            null

    };


    const created =
        await supabaseRequest(
            "/rest/v1/conversations",
            {
                method:
                    "POST",

                body:
                    JSON.stringify(
                        conversation
                    )
            }
        );


    if (
        !Array.isArray(created) ||
        !created[0]
    ) {

        throw new Error(
            "Conversation could not be created."
        );
    }


    return created[0];
}


/* =========================================================
   LOAD EXISTING CONVERSATION BY ID
========================================================= */

async function loadConversationById(
    conversationId
) {

    if (!conversationId) {
        return null;
    }


    const conversations =
        await supabaseRequest(
            "/rest/v1/conversations" +

            "?select=*" +

            "&id=eq." +
            encodeURIComponent(
                conversationId
            )
        );


    if (
        !Array.isArray(conversations) ||
        !conversations[0]
    ) {

        throw new Error(
            "This conversation could not be found."
        );
    }


    const conversation =
        conversations[0];


    const isParticipant =
        String(
            conversation.user_one_id
        ) ===
            String(
                currentUser.id
            ) ||

        String(
            conversation.user_two_id
        ) ===
            String(
                currentUser.id
            );


    if (!isParticipant) {

        throw new Error(
            "You are not a participant in this conversation."
        );
    }


    currentConversationId =
        conversation.id;


    currentOtherUserId =
        String(
            conversation.user_one_id
        ) ===
            String(
                currentUser.id
            )

            ? conversation.user_two_id

            : conversation.user_one_id;


    currentListingId =
        conversation.barter_listing_id ||
        null;


    currentOjaListingId =
        conversation.oja_listing_id ||
        null;


    return conversation;
}


/* =========================================================
   CHAT NOTIFICATION
========================================================= */

async function createChatNotification() {

    if (
        !currentUser ||
        !currentOtherUserId ||
        !currentConversationId
    ) {

        return;
    }


    if (
        String(currentOtherUserId) ===
        String(currentUser.id)
    ) {

        return;
    }


    try {

        const senderName =
            currentUser.user_metadata?.full_name ||
            currentUser.user_metadata?.name ||
            currentUser.email ||
            "Someone";


        const notification = {

            user_id:
                currentOtherUserId,

            title:
                "New LosOja Message",

            message:
                senderName +
                " sent you a new message.",

            type:
                "chat:" +
                currentUser.id +
                ":" +
                currentConversationId,

            is_read:
                false

        };


        await supabaseRequest(
            "/rest/v1/notifications",
            {
                method:
                    "POST",

                body:
                    JSON.stringify(
                        notification
                    )
            }
        );

    } catch (error) {

        console.warn(
            "LosOja chat notification could not be created:",
            error
        );
    }
}


/* =========================================================
   CHAT UNREAD INDICATOR
========================================================= */

async function updateChatUnreadIndicator() {

    const indicator =
        document.getElementById(
            "chatUnreadIndicator"
        );


    if (
        !indicator ||
        !currentUser
    ) {

        return;
    }


    try {

        const notifications =
            await supabaseRequest(

                "/rest/v1/notifications" +

                "?select=id,type,is_read" +

                "&user_id=eq." +

                encodeURIComponent(
                    currentUser.id
                ) +

                "&is_read=eq.false" +

                "&limit=100"
            );


        const hasUnreadChat =
            Array.isArray(
                notifications
            ) &&

            notifications.some(
                notification =>
                    String(
                        notification?.type ||
                        ""
                    )
                        .toLowerCase()
                        .startsWith(
                            "chat:"
                        )
            );


        indicator.classList.toggle(
            "visible",
            hasUnreadChat
        );


    } catch (error) {

        console.warn(
            "LosOja chat unread indicator error:",
            error
        );
    }
}


/* =========================================================
   MARK CHAT NOTIFICATIONS READ
========================================================= */

async function markCurrentChatNotificationsRead() {

    if (
        !currentUser ||
        !currentOtherUserId
    ) {

        return;
    }


    try {

        const notificationTypePattern =
            "chat:" +
            currentOtherUserId +
            ":*";


        await supabaseRequest(

            "/rest/v1/notifications" +

            "?user_id=eq." +

            encodeURIComponent(
                currentUser.id
            ) +

            "&type=like." +

            encodeURIComponent(
                notificationTypePattern
            ),

            {
                method:

                },

                            true
                    })
            }

/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

    if (!currentConversationId) {
        return;
    }


    const messages =
        await supabaseRequest(

            "/rest/v1/messages" +

            "?select=*" +

            "&conversation_id=eq." +

            encodeURIComponent(
                currentConversationId
            ) +

            "&order=created_at.asc"
        );


    renderMessages(
        Array.isArray(messages)
            ? messages
            : []
    );
}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(messages) {

    const container =
        document.getElementById(
            "messages"
        );


    if (!container) {
        return;
    }


    if (!messages.length) {

        container.innerHTML = `
            <div class="empty-message">
                No messages yet.<br>
                Start the conversation.
            </div>
        `;

        return;
    }


    container.innerHTML =
        messages
            .map(
                message => {

                    const mine =
                        String(
                            message.sender_id
                        ) ===
                        String(
                            currentUser.id
                        );


                    const time =
                        message.created_at

                            ? new Date(
                                message.created_at
                            ).toLocaleTimeString(
                                [],
                                {
                                    hour:
                                        "2-digit",

                                    minute:
                                        "2-digit"
                                }
                            )

                            : "";


                    const actualText =
                        message.message &&
                        message.message !==
                            "📷 Photo"

                            ? message.message

                            : "";


                    let imageHTML =
                        "";


                    if (
                        message.image_url
                    ) {

                        const safeImage =
                            escapeHTML(
                                message.image_url
                            );


                        imageHTML = `
                            <img
                                class="message-image"
                                src="${safeImage}"
                                alt="Chat picture"
                                loading="lazy"
                                onclick="window.open('${safeImage}','_blank')"
                            >
                        `;
                    }


                    let textHTML =
                        "";


                    if (actualText) {

                        textHTML = `
                            <div class="message-text">
                                ${escapeHTML(actualText)}
                            </div>
                        `;
                    }


                    return `
                        <div class="message-row ${
                            mine
                                ? "mine"
                                : ""
                        }">

                            <div class="message-bubble">

                                ${imageHTML}

                                ${textHTML}

                                <div class="message-time">
                                    ${time}
                                </div>

                            </div>

                        </div>
                    `;

                }
            )
            .join("");


    container.scrollTop =
        container.scrollHeight;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (
        !currentUser ||
        !currentConversationId
    ) {

        showError(
            "Chat is not ready yet."
        );

        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const imageInput =
        document.getElementById(
            "imageInput"
        );


    const button =
        document.getElementById(
            "sendButton"
        );


    const imageButton =
        document.getElementById(
            "imageButton"
        );


    if (!input) {
        return;
    }


    const cleanMessage =
        input.value.trim();


    const selectedFile =
        imageInput?.files?.[0] ||
        null;


    if (
        !cleanMessage &&
        !selectedFile
    ) {

        return;
    }


    if (
        cleanMessage.length >
        2000
    ) {

        showError(
            "Message is too long."
        );

        return;
    }


    clearError();


    if (button) {
        button.disabled =
            true;
    }


    if (imageButton) {
        imageButton.disabled =
            true;
    }


    try {

        let imageUrl =
            null;


        if (selectedFile) {

            imageUrl =
                await uploadChatImage(
                    selectedFile
                );
        }


        const message = {

            conversation_id:
                currentConversationId,

            sender_id:
                currentUser.id,

            message:
                cleanMessage ||
                "📷 Photo",

            image_url:
                imageUrl

        };


        await supabaseRequest(
            "/rest/v1/messages",
            {
                method:
                    "POST",

                body:
                    JSON.stringify(
                        message
                    )
            }
        );


        await createChatNotification();


        input.value =
            "";


        if (imageInput) {

            imageInput.value =
                "";
        }


        updateSelectedImage();


        await loadMessages();


    } catch (error) {

        console.error(
            "LosOja send message error:",
            error
        );


        showError(
            error.message ||
            "Message could not be sent."
        );


    } finally {

        if (button) {
            button.disabled =
                false;
        }


        if (imageButton) {
            imageButton.disabled =
                false;
        }


        input.focus();
    }
}


/* =========================================================
   IMAGE SELECTION
========================================================= */

function updateSelectedImage() {

    const imageInput =
        document.getElementById(
            "imageInput"
        );


    const selectedImage =
        document.getElementById(
            "selectedImage"
        );


    if (
        !imageInput ||
        !selectedImage
    ) {

        return;
    }


    const file =
        imageInput.files?.[0];


    if (!file) {

        selectedImage.textContent =
            "";

        selectedImage.style.display =
            "none";

        return;
    }


    selectedImage.textContent =
        "📷 " +
        file.name +
        " selected";


    selectedImage.style.display =
        "block";
}


/* =========================================================
   IMAGE BUTTON
========================================================= */

function initializeImageButton() {

    const imageButton =
        document.getElementById(
            "imageButton"
        );


    const imageInput =
        document.getElementById(
            "imageInput"
        );


    if (
        !imageButton ||
        !imageInput
    ) {

        return;
    }


    imageButton.addEventListener(
        "click",
        () => {

            imageInput.click();

        }
    );


    imageInput.addEventListener(
        "change",
        () => {

            const file =
                imageInput.files?.[0];


            if (!file) {

                updateSelectedImage();

                return;
            }


            if (
                !ALLOWED_CHAT_IMAGE_TYPES.includes(
                    file.type
                )
            ) {

                showError(
                    "Only JPG, PNG and WEBP images are allowed."
                );

                imageInput.value =
                    "";

                updateSelectedImage();

                return;
            }


            if (
                file.size >
                MAX_CHAT_IMAGE_SIZE
            ) {

                showError(
                    "Chat images must be 5 MB or smaller."
                );

                imageInput.value =
                    "";

                updateSelectedImage();

                return;
            }


            clearError();

            updateSelectedImage();

        }
    );
}

/* =========================================================
   LOAD OJA LISTING
========================================================= */

async function loadOjaListing(
    listingId
) {

    if (!listingId) {
        return null;
    }


    try {

        const listings =
            await supabaseRequest(

                "/rest/v1/oja_listings" +

                "?select=" +

                "id,user_id,title,description,category,price,currency,location,status,created_at" +

                "&id=eq." +

                encodeURIComponent(
                    listingId
                )
            );


        if (
            !Array.isArray(listings) ||
            !listings[0]
        ) {

            return null;
        }


        const listing =
            listings[0];


        const images =
            await supabaseRequest(

                "/rest/v1/oja_listing_images" +

                "?select=id,image_url,sort_order" +

                "&listing_id=eq." +

                encodeURIComponent(
                    listingId
                ) +

                "&order=sort_order.asc"
            );


        currentOjaListing =
            listing;


        currentOjaImages =
            Array.isArray(images)
                ? images
                : [];


        currentOjaListingId =
            listing.id;


        renderOjaDetails();


        return listing;


    } catch (error) {

        console.error(
            "LosOja Oja listing load failed:",
            error
        );

        return null;
    }
}


/* =========================================================
   LOAD CONVERSATIONS

async function loadConversations() {

    if (!currentUser) {
        return;
    }


    const conversations =
        await supabaseRequest(

            "/rest/v1/conversations" +

            "?select=*" +

            "&or=(" +

            "user_one_id.eq." +

/* =========================================================
   RENDER CONVERSATION LIST
========================================================= */

async function renderConversationList(
    conversations
) {

    const container =
        document.getElementById(
            "conversationList"
        );


    if (!container) {
        return;
    }


    if (!conversations.length) {

        container.innerHTML = `
            <div class="status">
                You do not have any chats yet.
            </div>
        `;

        return;
    }


    container.innerHTML =
        "";


    for (
        const conversation
        of conversations
    ) {

        const otherUserId =
            conversation.user_one_id ===
            currentUser.id

                ? conversation.user_two_id

                : conversation.user_one_id;


        let listingTitle =
            "General chat";


        /* BARter listing */

        if (
            conversation.barter_listing_id
        ) {

            try {

                const listing =
                    await supabaseRequest(

                        "/rest/v1/barter_listings" +

                        "?select=title" +

                        "&id=eq." +

                        encodeURIComponent(
                            conversation.barter_listing_id
                        )
                    );


                if (
                    Array.isArray(listing) &&
                    listing[0]
                ) {

                    listingTitle =
                        listing[0].title ||
                        "Trade listing";
                }

            } catch (error) {

                console.warn(
                    "Could not load listing:",
                    error
                );
            }
        }


        /* Oja listing */

        if (
            conversation.oja_listing_id
        ) {

            try {

                const listing =
                    await supabaseRequest(

                        "/rest/v1/oja_listings" +

                        "?select=title" +

                        "&id=eq." +

                        encodeURIComponent(
                            conversation.oja_listing_id
                        )
                    );


                if (
                    Array.isArray(listing) &&
                    listing[0]
                ) {

                    listingTitle =
                        listing[0].title ||
                        "Oja item";
                }

            } catch (error) {

                console.warn(
                    "Could not load Oja listing:",
                    error
                );
            }
        }


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "conversation-card";


        card.innerHTML = `
            <div class="conversation-title">
                ${escapeHTML(
                    listingTitle
                )}
            </div>

            <div class="conversation-time">
                Open chat
            </div>
        `;


        card.addEventListener(
            "click",
            () => {

                let url =
                    "chat.html" +

                    "?conversation=" +

                    encodeURIComponent(
                        conversation.id
                    ) +

                    "&user=" +

                    encodeURIComponent(
                        otherUserId
                    );


                if (
                    conversation.barter_listing_id
                ) {

                    url +=
                        "&listing=" +

                        encodeURIComponent(
                            conversation.barter_listing_id
                        );
                }


                if (
                    conversation.oja_listing_id
                ) {

                    url +=
                        "&oja_listing=" +

                        encodeURIComponent(
                            conversation.oja_listing_id
                        );
                }


                if (
                    conversation.escrow_id
                ) {

                    url +=
                        "&escrow=" +

                        encodeURIComponent(
                            conversation.escrow_id
                        );
                }


                window.location.href =
                    url;

            }
        );


        container.appendChild(
            card
        );
    }
}


/* =========================================================
   OPEN SPECIFIC CHAT
========================================================= */

async function openSpecificChat() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const requestedConversationId =
        params.get(
            "conversation"
        );


    /* =====================================================
       READ URL PARAMETERS
    ===================================================== */

    currentOtherUserId =
        params.get(
            "user"
        );


    currentBusinessId =
        params.get(
            "business"
        );


    currentListingId =
        params.get(
            "listing"
        );


    currentPropertyId =
        params.get(
            "property_id"
        );


    currentPropertyTitle =
        params.get(
            "property_title"
        );


    currentOjaListingId =
        params.get(
            "oja_listing"
        );


    currentEscrowId =
        params.get(
            "escrow"
        );


    /* =====================================================
       IMPORTANT:
       BUSINESS CHAT MUST NEVER LOAD ESCROW CONTEXT
    ===================================================== */

    if (currentBusinessId) {

        currentEscrowId =
            null;

        currentEscrow =
            null;

    }


    /* =====================================================
       EXISTING CONVERSATION
    ===================================================== */

    if (
        requestedConversationId
    ) {

        const conversation =
            await loadConversationById(
                requestedConversationId
            );


        if (!conversation) {

            throw new Error(
                "Conversation could not be opened."
            );
        }


        currentConversationId =
            conversation.id;
    }


    /* =====================================================
       PROPERTY CHAT
    ===================================================== */

    if (
        currentPropertyId &&
        !currentOtherUserId
    ) {

        currentOtherUserId =
            params.get(
                "seller_id"
            );
    }


    /* =====================================================
       OJA CHAT
    ===================================================== */

    if (
        currentOjaListingId &&
        !requestedConversationId
    ) {

        const ojaListing =
            await loadOjaListing(
                currentOjaListingId
            );


        if (!ojaListing) {

            throw new Error(
                "Oja listing could not be found."
            );
        }


        if (
            ojaListing.status !==
            "available"
        ) {

            throw new Error(
                "This Oja item is no longer available."
            );
        }


        currentOtherUserId =
            ojaListing.user_id;
    }


    /* =====================================================
       ESCROW CHAT
       
       ONLY escrow chats are allowed here.
       Business chats are excluded above.
    ===================================================== */

    if (
        currentEscrowId &&
        !currentBusinessId
    ) {

        await loadEscrowChatContext();
    }


    /* =====================================================
       NO SPECIFIC USER
    ===================================================== */

    if (!currentOtherUserId) {

        await loadConversations();

        return;
    }


    /* =====================================================
       PREVENT SELF CHAT
    ===================================================== */

    if (
        String(
            currentOtherUserId
        ) ===
        String(
            currentUser.id
        )
    ) {

        showError(
            "You cannot open a chat with yourself."
        );

        return;
    }


    const conversationList =
        document.getElementById(
            "conversationList"
        );


    const chatSection =
        document.getElementById(
            "chatSection"
        );


    if (conversationList) {

        conversationList.style.display =
            "none";
    }


    if (chatSection) {

        chatSection.style.display =
            "block";
    }


    /* =====================================================
       ESCROW TITLE
    ===================================================== */

    if (
        currentEscrowId &&
        currentEscrow
    ) {

        const isBuyer =
            currentUser.id ===
            currentEscrow.buyer_id;


        document.getElementById(
            "chatUser"
        ).textContent =
            isBuyer
                ? "Chat with Seller"
                : "Chat with Buyer";


        const amount =
            Number(
                currentEscrow.amount ||
                0
            ).toLocaleString(
                "en-NG",
                {
                    minimumFractionDigits:
                        2,

                    maximumFractionDigits:
                        2
                }
            );


        document.getElementById(
            "listingInfo"
        ).textContent =
            "Escrow • ₦" +
            amount +
            " • " +
            (
                currentEscrow.status ||
                "active"
            );


        renderEscrowDetails();


    } else {

        /* =================================================
           BUSINESS / OJA / PROPERTY / NORMAL
        ================================================= */

        document.getElementById(
            "chatUser"
        ).textContent =
            currentBusinessId

                ? "Chat with Business"

                : currentOjaListingId

                    ? "Chat with Seller"

                    : currentPropertyId

                        ? "Chat with Property Owner"

                        : "Chat with Owner";


        document.getElementById(
            "listingInfo"
        ).textContent =
            "";


        /* BUSINESS */

        if (currentBusinessId) {

            document.getElementById(
                "listingInfo"
            ).textContent =
                "Business chat";
        }


        /* BARTER */

        if (currentListingId) {

            document.getElementById(
                "listingInfo"
            ).textContent =
                "Trade listing";
        }


        /* PROPERTY */

        if (currentPropertyId) {

            document.getElementById(
                "listingInfo"
            ).textContent =
                currentPropertyTitle

                    ? "Property • " +
                      currentPropertyTitle

                    : "Property";
        }


        /* OJA */

        if (currentOjaListingId) {

            document.getElementById(
                "listingInfo"
            ).textContent =
                "Oja item";
        }
    }


    /* =====================================================
       FIND OR CREATE CONVERSATION
    ===================================================== */

    if (!currentConversationId) {

        const conversation =
            await findOrCreateConversation();


        currentConversationId =
            conversation.id;
    }


    /* =====================================================
       MARK NOTIFICATIONS READ
    ===================================================== */

    await markCurrentChatNotificationsRead();


    /* =====================================================
       LOAD MESSAGES
    ===================================================== */

    await loadMessages();


    /* =====================================================
       REFRESH MESSAGES
    ===================================================== */

    if (messagePolling) {

        clearInterval(
            messagePolling
        );
    }


    messagePolling =
        setInterval(
            async () => {

                try {

                    await loadMessages();

                    await updateChatUnreadIndicator();

                } catch (error) {

                    console.warn(
                        "Message refresh failed:",
                        error
                    );
                }

            },
            3000
        );
}
<script>

/* =========================================================
   LOSOJA CHAT INITIALIZATION
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        try {

            clearError();

            /* -----------------------------------------
               CHECK LOGIN
            ----------------------------------------- */

            let result = null;

            if (
                typeof window.getCurrentUser ===
                "function"
            ) {

                result =
                    await window.getCurrentUser();

            }


            currentUser =
                result?.user ||
                result?.data?.user ||
                result?.data ||
                result ||
                null;


            /* -----------------------------------------
               NOT LOGGED IN
            ----------------------------------------- */

            if (
                !currentUser ||
                !currentUser.id
            ) {

                const status =
                    document.getElementById(
                        "status"
                    );


                if (status) {

                    status.innerHTML =
                        `
                        <strong>
                            Please login to use LosOja Chat.
                        </strong>
                        `;

                }


                const conversationList =
                    document.getElementById(
                        "conversationList"
                    );


                if (conversationList) {

                    conversationList.innerHTML =
                        `
                        <div class="status">
                            Login is required to view your chats.
                        </div>
                        `;

                }


                const chatSection =
                    document.getElementById(
                        "chatSection"
                    );


                if (chatSection) {

                    chatSection.style.display =
                        "none";

                }


                return;
            }


            /* -----------------------------------------
               USER IS LOGGED IN
            ----------------------------------------- */

            console.log(
                "LosOja Chat: authenticated user",
                currentUser.id
            );


            /* -----------------------------------------
               UPDATE LOGIN BUTTON
            ----------------------------------------- */

            const loginButton =
                document.getElementById(
                    "loginButton"
                );


            if (loginButton) {

                loginButton.textContent =
                    "Account";

                loginButton.onclick =
                    function () {

                        window.location.href =
                            "account.html";

                    };

            }


            /* -----------------------------------------
               UPDATE STATUS
            ----------------------------------------- */

            const status =
                document.getElementById(
                    "status"
                );


            if (status) {

                status.innerHTML =
                    `
                    <strong>
                        LosOja Chat
                    </strong>
                    `;

            }


            /* -----------------------------------------
               INITIALIZE IMAGE BUTTON
            ----------------------------------------- */

            initializeImageButton();


            /* -----------------------------------------
               LOAD CHAT / CONVERSATIONS
            ----------------------------------------- */

            await openSpecificChat();


            /* -----------------------------------------
               UPDATE UNREAD INDICATOR
            ----------------------------------------- */

            await updateChatUnreadIndicator();


            console.log(
                "LosOja Chat initialized successfully."
            );


        } catch (error) {

            console.error(
                "LosOja Chat initialization error:",
                error
            );


            showError(
                error?.message ||
                "LosOja Chat could not be loaded."
            );


            const status =
                document.getElementById(
                    "status"
                );


            if (status) {

                status.innerHTML =
                    `
                    <strong>
                        Chat could not be loaded.
                    </strong>
                    `;

            }

        }

    }
);


/* =========================================================
   CHAT FORM
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const chatForm =
            document.getElementById(
                "chatForm"
            );


        if (!chatForm) {
            return;
        }


        chatForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                await sendMessage();

            }
        );

    }
);

</script>
