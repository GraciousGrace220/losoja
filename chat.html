<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oja Chat - LosOja</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;display:flex;flex-direction:column;height:100dvh}
.topbar{background:#087a3e;color:white;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{color:white;text-decoration:none;font-weight:800;white-space:nowrap}
#chatHeader{flex:1;text-align:center;font-weight:700;overflow-wrap:anywhere;font-size:14px}
.chat-wrap{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:800px;width:100%;margin:0 auto}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;line-height:1.5;font-size:14px;word-break:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:#087a3e;color:white;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:white;border:1px solid #e0e8e2;border-bottom-left-radius:4px}
.msg img{max-width:250px;width:100%;height:auto;border-radius:10px;display:block}
.escrow-card{background:white;border:2px solid #087a3e;border-radius:14px;padding:14px;margin:10px auto;max-width:768px}
.input-bar{position:sticky;bottom:0;background:white;border-top:1px solid #e0e8e2;padding:10px;display:flex;gap:8px;max-width:800px;width:100%;margin:0 auto;align-items:center}
.input-bar input[type=text]{flex:1;min-width:0;padding:12px;border:1px solid #d7e1da;border-radius:10px}
.input-bar button{padding:12px 14px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
.input-bar button:disabled{opacity:.5;cursor:not-allowed}
.btn-send{background:#087a3e;color:white}
.btn-escrow{background:white;border:1px solid #087a3e!important;color:#087a3e}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.modal.show{display:flex}
.modal-card{background:white;border-radius:16px;padding:20px;width:min(400px,100%)}
.modal-card input,.modal-card textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;margin:8px 0;font:inherit}
.modal-card textarea{min-height:90px;resize:vertical}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17201b;color:white;padding:10px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:10000;max-width:90%;overflow-wrap:anywhere}
.toast.show{opacity:1}
.small-note{font-size:12px;color:#777;text-align:center;padding:10px}
.buyer-list{max-width:800px;width:100%;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.buyer-item{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.buyer-item:hover{border-color:#087a3e}
@media(max-width:480px){
 .topbar{padding:8px;gap:5px}
 .brand{font-size:12px}
 .topbar>button{font-size:11px;padding:6px 8px}
 .msg{max-width:88%}
 .input-bar{gap:5px;padding:7px}
 .input-bar button{padding:12px 9px}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand">← LosOja</a>
  <div id="chatHeader">Opening chat...</div>
  <button id="notifyToggle" style="background:#055c2e;color:white;border:1px solid #ffffff55;padding:7px 10px;border-radius:20px;font-weight:700;cursor:pointer">🔔 ON</button>
  <button id="headerEscrowBtn" style="background:white;color:#087a3e;border:0;padding:7px 10px;border-radius:8px;font-weight:700;cursor:pointer">🔐 Escrow</button>
</header>

<div id="buyerList" class="buyer-list" style="display:none"></div>
<div id="chatWrap" class="chat-wrap"><div class="small-note">Connecting to chat...</div></div>
<div id="escrowList" style="max-width:800px;width:100%;margin:0 auto;padding:0 16px"></div>

<div class="input-bar">
  <label style="padding:11px;background:white;border:1px solid #d7e1da;border-radius:10px;cursor:pointer" title="Send image">📷<input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden></label>
  <input type="text" id="msgInput" placeholder="Type message..." autocomplete="off" disabled>
  <button class="btn-send" id="sendBtn" disabled>Send</button>
  <button class="btn-escrow" id="bottomEscrowBtn">🔐</button>
</div>

<div id="escrowModal" class="modal">
  <div class="modal-card">
    <h3 style="margin:0;color:#087a3e">🔐 Create Escrow</h3>
    <p style="font-size:13px;color:#666">Record only. No funds transferred yet.</p>
    <input id="escrowAmount" type="number" min="1" step="any" placeholder="Amount ₦ e.g. 50000">
    <textarea id="escrowDesc" placeholder="What are you buying? e.g. MTN WiFi"></textarea>
    <div style="display:flex;gap:10px;margin-top:12px">
      <button id="cancelEscrowBtn" style="flex:1;padding:12px;background:#eee;border:0;border-radius:9px;cursor:pointer">Cancel</button>
      <button id="createEscrowBtn" style="flex:1;padding:12px;background:#087a3e;color:white;border:0;border-radius:9px;font-weight:700;cursor:pointer">Create Record</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/auth.js"></script>
<script>
"use strict";
const SUPABASE_URL = "https://ycxshwgeebskdozmornh.supabase.co";
const SUPABASE_KEY = "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe";
const $ = id => document.getElementById(id);
const chatWrap = $("chatWrap");
const chatHeader = $("chatHeader");
const msgInput = $("msgInput");
const sendBtn = $("sendBtn");
const imageInput = $("imageInput");
const escrowList = $("escrowList");
const escrowModal = $("escrowModal");
const toast = $("toast");
const buyerListEl = $("buyerList");
const notifyToggle = $("notifyToggle");

let currentUser=null, currentChat=null, sellerId=null, businessId=null, listingId=null, directChatId=null, accessToken=null, sending=false, lastMsgCount=0, pollTimer=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showToast(m){toast.textContent=m; toast.classList.add("show"); clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>toast.classList.remove("show"),3200);}

function getParams(){
  const p=new URLSearchParams(location.search);
  return {sellerId:p.get("user"), businessId:p.get("business"), listingId:p.get("oja_listing"), chatId:p.get("chat_id"), escrow:p.get("escrow")};
}

/* NOTIFY */
let notifyEnabled=localStorage.getItem("losoja_notify_enabled")!=="0";
function updateNotifyUI(){notifyToggle.textContent=notifyEnabled?"🔔 ON":"🔕 OFF"; notifyToggle.style.opacity=notifyEnabled?"1":"0.6";}
updateNotifyUI();
notifyToggle.addEventListener("click", async()=>{
  notifyEnabled=!notifyEnabled; localStorage.setItem("losoja_notify_enabled",notifyEnabled?"1":"0"); updateNotifyUI();
  if(notifyEnabled){ if(Notification && Notification.permission==="default") await Notification.requestPermission(); showToast("Notifications ON 🔔"); playBeep();} else showToast("Muted 🔕");
});
function playBeep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.type="sine"; o.frequency.value=880; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0.0001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.3,ctx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.3); o.start(); o.stop(ctx.currentTime+0.35);}catch(e){}}
function notifyNewMessage(t,from){if(!notifyEnabled) return; if(document.hasFocus()) return; playBeep(); if(Notification && Notification.permission==="granted") new Notification("New from "+(from||"LosOja"),{body:t.slice(0,90)});}

/* AUTH */
async function getUserAndToken(){
  let session=null;
  if(typeof window.ensureValidSupabaseSession==="function"){try{session=await window.ensureValidSupabaseSession();}catch(e){}}
  if(!session?.access_token){try{session=JSON.parse(localStorage.getItem("losoja_supabase_session")||"null");}catch{session=null;}}
  if(!session?.access_token) throw new Error("No login session. Please log in again.");
  function tokenExpiry(token){try{const payload=token.split(".")[1]; const decoded=atob(payload.replace(/-/g,"+").replace(/_/g,"/")); return JSON.parse(decoded).exp||0;}catch{return 0;}}
  if(tokenExpiry(session.access_token)*1000 < Date.now()+60000){
    if(!session.refresh_token) throw new Error("Session expired. Log in again.");
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY},body:JSON.stringify({refresh_token:session.refresh_token})});
    const ref=await r.json().catch(()=>({})); if(!r.ok||!ref.access_token) throw new Error(ref.msg||"Session expired."); session={...session,...ref}; try{localStorage.setItem("losoja_supabase_session",JSON.stringify(session));}catch{}
  }
  accessToken=session.access_token; currentUser=session.user||null;
  if(!currentUser?.id && typeof window.getCurrentUser==="function"){try{currentUser=await window.getCurrentUser();}catch{}}
  if(!currentUser?.id) throw new Error("No user info. Log out and in again."); return currentUser;
}

async function api(path, method="GET", body=null, extraHeaders={}){
  async function request(){
    const headers={apikey:SUPABASE_KEY, Authorization:"Bearer "+accessToken, ...extraHeaders};
    if(body!==null) headers["Content-Type"]="application/json";
    if(method==="POST") headers["Prefer"]="return=representation";
    return fetch(SUPABASE_URL+"/rest/v1/"+path,{method,headers,body:body===null?undefined:JSON.stringify(body)});
  }
  let response=await request();
  if(response.status===401){const t=await response.clone().text(); if(/jwt expired|expired jwt|invalid jwt/i.test(t)){await getUserAndToken(); response=await request();}}
  const text=await response.text();
  if(!response.ok){let m=text||"Request failed ("+response.status+")"; try{const p=JSON.parse(text); m=p.message||p.details||p.hint||m;}catch{} throw new Error(m);}
  if(!text) return null; try{return JSON.parse(text);}catch{return text;}
}

function showLoginMessage(){chatHeader.textContent="Login required"; chatWrap.innerHTML=`<div style="text-align:center;padding:40px 10px"><b>Please log in to chat.</b><p>You need an account to contact the seller.</p><a href="login.html" style="display:inline-block;padding:11px 16px;background:#087a3e;color:white;border-radius:8px;text-decoration:none">Go to Login</a></div>`;}

async function resolveSellerFromListing(){
  const rows=await api("oja_listings?id=eq."+encodeURIComponent(listingId)+"&select=id,user_id,title,price&limit=1");
  if(!Array.isArray(rows)||!rows.length) throw new Error("Listing not found: "+listingId);
  const listing=rows[0]; if(!listing.user_id) throw new Error("Listing has no seller.");
  sellerId=listing.user_id; const title=listing.title||"Oja listing"; chatHeader.textContent=title.length>28?title.slice(0,25)+"...":title; return listing;
}

async function getOrCreateChat(){
  // DIRECT CHAT_ID MODE - UNBREAKABLE
  if(directChatId){
    const rows=await api("chats?id=eq."+encodeURIComponent(directChatId)+"&select=*&limit=1");
    if(!Array.isArray(rows)||!rows.length) throw new Error("Chat ID not found: "+directChatId);
    currentChat=rows[0]; sellerId=currentChat.seller_id; return currentChat;
  }
  if(!currentUser?.id) throw new Error("Buyer/Seller not identified.");
  const isOwner=sellerId && currentUser.id===sellerId;
  if(isOwner){
    let path="chats?seller_id=eq."+encodeURIComponent(currentUser.id)+"&select=*&order=created_at.desc&limit=20";
    const incoming=await api(path);
    if(!Array.isArray(incoming)||incoming.length===0){
      chatHeader.textContent="Your listing - No buyers yet";
      chatWrap.innerHTML=`<div style="text-align:center;padding:40px 10px"><b>This is your listing.</b><p>No buyers yet.</p><p style="font-size:12px;color:#666">Your chat ID with 2 escrows is:<br><code>${"3f31ba24-46d5-4ff4-a7ad-3448cc48c070"}</code><br>Open <a href="chat.html?chat_id=3f31ba24-46d5-4ff4-a7ad-3448cc48c070">that chat</a></p></div>`;
      return null;
    }
    buyerListEl.style.display="flex";
    buyerListEl.innerHTML=incoming.map(c=>`<div class="buyer-item" data-chat="${c.id}"><div><b>Buyer: ${esc(c.buyer_id.slice(0,8))}</b><br><small>${new Date(c.created_at).toLocaleString()} | ${esc(c.id.slice(0,8))}</small></div><div>💬</div></div>`).join("");
    buyerListEl.querySelectorAll(".buyer-item").forEach(el=>{
      el.addEventListener("click", async()=>{
        const chatId=el.getAttribute("data-chat"); currentChat=incoming.find(x=>String(x.id)===String(chatId));
        buyerListEl.style.display="none"; chatHeader.textContent="Chat with Buyer"; msgInput.disabled=false; sendBtn.disabled=false;
        await Promise.all([loadMessages(), loadEscrows()]); startPolling();
      });
    });
    chatHeader.textContent="Your listing - "+incoming.length+" buyer(s)"; chatWrap.innerHTML=`<div class="small-note">Select buyer above. Notify ${notifyEnabled?'🔔 ON':'🔕 OFF'}</div>`; return null;
  }
  if(!sellerId) throw new Error("Seller not identified.");
  let path="chats?buyer_id=eq."+encodeURIComponent(currentUser.id)+"&seller_id=eq."+encodeURIComponent(sellerId)+"&select=*&order=created_at.desc&limit=1";
  let chats=await api(path);
  if(Array.isArray(chats)&&chats.length){currentChat=chats[0]; return currentChat;}
  let reversePath="chats?buyer_id=eq."+encodeURIComponent(sellerId)+"&seller_id=eq."+encodeURIComponent(currentUser.id)+"&select=*&order=created_at.desc&limit=1";
  const reverseChats=await api(reversePath);
  if(Array.isArray(reverseChats)&&reverseChats.length){currentChat=reverseChats[0]; return currentChat;}
  const created=await api("chats","POST",{buyer_id:currentUser.id, seller_id:sellerId, business_id:businessId||null});
  if(Array.isArray(created)&&created.length){currentChat=created[0]; return currentChat;}
  chats=await api(path); if(Array.isArray(chats)&&chats.length){currentChat=chats[0]; return currentChat;}
  throw new Error("Chat could not be opened.");
}

async function init(){
  const params=getParams(); sellerId=params.sellerId; businessId=params.businessId; listingId=params.listingId; directChatId=params.chatId;
  try{
    await getUserAndToken();
    if(!currentUser?.id||!accessToken){showLoginMessage(); return;}
    if(directChatId){chatHeader.textContent="Direct chat: "+directChatId.slice(0,8); const chat=await getOrCreateChat(); msgInput.disabled=false; sendBtn.disabled=false; await Promise.all([loadMessages(), loadEscrows()]); startPolling(); return;}
    if(listingId) await resolveSellerFromListing();
    if(!sellerId && !listingId && !businessId){chatHeader.textContent="Choose seller"; chatWrap.innerHTML=`<div style="text-align:center;padding:40px 10px"><b>No seller supplied.</b><p>Use ?chat_id=... or ?oja_listing=...</p><a href="oja.html" style="color:#087a3e">Return to Oja</a><br><br><p>Your test chat:<br><a href="chat.html?chat_id=3f31ba24-46d5-4ff4-a7ad-3448cc48c070">Open chat with 2 escrows</a></p></div>`; return;}
    if(!businessId && !listingId) chatHeader.textContent="LosOja Chat";
    const chat=await getOrCreateChat(); if(!chat) return;
    msgInput.disabled=false; sendBtn.disabled=false; await Promise.all([loadMessages(), loadEscrows()]); startPolling();
    if(params.escrow==="1") setTimeout(openEscrowModal,500);
  }catch(error){console.error(error); chatHeader.textContent="Chat unavailable"; chatWrap.innerHTML=`<div style="text-align:center;padding:32px 12px"><b>Couldn't open chat.</b><p style="color:#a12626">${esc(error.message)}</p><button onclick="location.reload()" style="padding:10px 16px;background:#087a3e;color:white;border:0;border-radius:8px;cursor:pointer">Try again</button></div>`;}
}

function startPolling(){clearInterval(pollTimer); pollTimer=setInterval(async()=>{try{await loadMessages(true);}catch{}},4000);}

async function loadMessages(isPoll=false){
  if(!currentChat?.id) return;
  try{
    const messages=await api("messages?chat_id=eq."+encodeURIComponent(currentChat.id)+"&select=*&order=created_at.asc");
    if(!Array.isArray(messages)) return;
    const isNew=messages.length>lastMsgCount && lastMsgCount!==0; const last=messages[messages.length-1];
    if(isNew && last && last.sender_id!==currentUser.id) notifyNewMessage(last.message,"Buyer/Seller");
    lastMsgCount=messages.length;
    if(isPoll && chatWrap.querySelectorAll(".msg").length===messages.length){const atBottom=chatWrap.scrollTop+chatWrap.clientHeight>=chatWrap.scrollHeight-60; if(!atBottom) return;}
    chatWrap.innerHTML=""; if(messages.length===0){chatWrap.innerHTML='<div class="small-note">No messages yet. Start! Notify: '+(notifyEnabled?'🔔 ON':'🔕 OFF')+'</div>'; return;}
    for(const message of messages){
      const bubble=document.createElement("div"); bubble.className="msg "+(message.sender_id===currentUser.id?"me":"them");
      const value=String(message.message||""); const match=value.match(/https?:\/\/[^\s]+/);
      if(match && (value.includes("storage")||/\.(jpg|jpeg|png|webp|gif)(\?|$)/i.test(match[0])||value.includes("📷 Image:"))){
        const imageUrl=match[0].replace(/[),]+$/,""); const img=document.createElement("img"); img.src=imageUrl; img.alt="Shared image"; img.loading="lazy"; img.addEventListener("click",()=>window.open(imageUrl,"_blank","noopener")); bubble.appendChild(img);
        const caption=document.createElement("div"); caption.textContent="📷 Image"; caption.style.marginTop="5px"; bubble.appendChild(caption);
      }else bubble.textContent=value; chatWrap.appendChild(bubble);
    }
    chatWrap.scrollTop=chatWrap.scrollHeight;
  }catch(error){console.error(error); if(!isPoll) showToast("Load messages failed: "+error.message);}
}

async function sendMessage(){
  const message=msgInput.value.trim(); if(!message||!currentChat?.id||!currentUser?.id||sending) return;
  sending=true; sendBtn.disabled=true; msgInput.value="";
  try{await api("messages","POST",{chat_id:currentChat.id, sender_id:currentUser.id, message}); await loadMessages();}
  catch(error){console.error(error); msgInput.value=message; showToast("Message failed: "+error.message);}
  finally{sending=false; sendBtn.disabled=false; msgInput.focus();}
}

async function loadEscrows(){
  if(!currentChat?.id) return;
  try{
    const records=await api("escrows?chat_id=eq."+encodeURIComponent(currentChat.id)+"&select=*&order=created_at.desc");
    console.log("ESCROWS:", records);
    escrowList.innerHTML="";
    if(!Array.isArray(records) || records.length===0){
      escrowList.innerHTML='<div style="text-align:center;color:#888;font-size:12px;padding:10px">No escrow yet for this chat ('+currentChat.id.slice(0,8)+')</div>';
      return;
    }
    records.forEach(record=>{
      const card=document.createElement("div"); card.className="escrow-card";
      const heading=document.createElement("b"); heading.textContent="🔐 ₦"+Number(record.amount||0).toLocaleString()+" - "+String(record.status||"pending").toUpperCase();
      const desc=document.createElement("p"); desc.textContent=record.description||""; desc.style.fontSize="13px"; desc.style.margin="6px 0";
      const date=document.createElement("small"); date.textContent=(record.created_at? new Date(record.created_at).toLocaleString():"")+" | "+record.id.slice(0,8);
      card.append(heading, desc, date); escrowList.appendChild(card);
    });
  }catch(e){console.warn("Escrow load error:", e); escrowList.innerHTML='<small style="color:red">Escrow load failed: '+esc(e.message)+'</small>';}
}

function openEscrowModal(){if(!currentChat?.id||!currentUser?.id){showToast("Open a chat first."); return;} escrowModal.classList.add("show");}
function closeEscrowModal(){escrowModal.classList.remove("show");}

async function createEscrow(){
  if(!currentChat?.id||!currentUser?.id){showToast("No active chat."); return;}
  const amount=Number($("escrowAmount").value); const description=$("escrowDesc").value.trim();
  if(!Number.isFinite(amount)||amount<=0||!description){showToast("Enter amount and description."); return;}
  const button=$("createEscrowBtn"); button.disabled=true; button.textContent="Saving...";
  try{
    const payload={chat_id:currentChat.id, business_id:businessId||null, buyer_id:currentChat.buyer_id, seller_id:currentChat.seller_id, amount, description, status:"pending"};
    let result=await api("escrows","POST",payload);
    console.log("Escrow POST result:", result);
    // UNBREAKABLE: if RLS returns null / empty, fetch again
    if(!result || (Array.isArray(result) && result.length===0)){
      await new Promise(r=>setTimeout(r,400));
      result=await api("escrows?chat_id=eq."+encodeURIComponent(currentChat.id)+"&order=created_at.desc&limit=1");
      if(Array.isArray(result) && result.length===0) throw new Error("Saved but RLS blocked read. Run open policy SQL.");
    }
    closeEscrowModal(); $("escrowAmount").value=""; $("escrowDesc").value="";
    showToast("Escrow recorded! ₦"+amount.toLocaleString()); await loadEscrows();
    try{await api("messages","POST",{chat_id:currentChat.id, sender_id:currentUser.id, message:"🔐 ESCROW REQUEST: ₦"+amount.toLocaleString()+" for "+description}); await loadMessages();}catch{}
  }catch(error){console.error(error); showToast("Escrow failed: "+error.message);}
  finally{button.disabled=false; button.textContent="Create Record";}
}

$("headerEscrowBtn").addEventListener("click", openEscrowModal);
$("bottomEscrowBtn").addEventListener("click", openEscrowModal);
$("cancelEscrowBtn").addEventListener("click", closeEscrowModal);
$("createEscrowBtn").addEventListener("click", createEscrow);
sendBtn.addEventListener("click", sendMessage);
msgInput.addEventListener("keydown", e=>{if(e.key==="Enter"){e.preventDefault(); sendMessage();}});
escrowModal.addEventListener("click", e=>{if(e.target===escrowModal) closeEscrowModal();});

imageInput.addEventListener("change", async e=>{
  const file=e.target.files?.[0]; if(!file) return;
  if(!currentChat?.id||!currentUser?.id||!accessToken){showToast("Open chat and log in."); imageInput.value=""; return;}
  if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type)){showToast("JPG, PNG, WEBP, GIF only."); imageInput.value=""; return;}
  if(file.size>5*1024*1024){showToast("5MB max."); imageInput.value=""; return;}
  const label=imageInput.parentElement; label.style.opacity=".5"; imageInput.disabled=true; showToast("Uploading...");
  try{
    const cleanName=file.name.replace(/\s+/g,"_").replace(/[^a-zA-Z0-9._-]/g,"");
    const fileName=encodeURIComponent(currentChat.id)+"/"+Date.now()+"_"+cleanName;
    const response=await fetch(SUPABASE_URL+"/storage/v1/object/chat-images/"+fileName,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+accessToken,"Content-Type":file.type,"x-upsert":"false"},body:file});
    if(!response.ok){const details=await response.text(); throw new Error("Upload failed: "+details);}
    const publicUrl=SUPABASE_URL+"/storage/v1/object/public/chat-images/"+fileName;
    await api("messages","POST",{chat_id:currentChat.id,sender_id:currentUser.id,message:"📷 Image: "+publicUrl});
    await loadMessages(); showToast("Image sent!");
  }catch(error){console.error(error); showToast(error.message);}finally{label.style.opacity="1"; imageInput.disabled=false; imageInput.value="";}
});

init();
</script>
</body>
