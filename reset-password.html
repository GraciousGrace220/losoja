
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reset Password - LosOja</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #222;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 14px;
      box-shadow: 0 5px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      color: #087a3e;
      text-align: center;
      font-size: 27px;
    }

    .intro {
      text-align: center;
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #087a3e;
      border-color: #087a3e;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 7px;
      background: #087a3e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.error {
      display: block;
      color: #9b1c1c;
      background: #fff0f0;
    }

    #message.success {
      display: block;
      color: #075d30;
      background: #eaf7ee;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #087a3e;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <h1>Reset Your Password</h1>

    <p class="intro">
      Enter your new password below to regain access to your LosOja account.
    </p>

    <form id="resetPasswordForm">
      <label for="newPassword">New Password</label>
      <input
        id="newPassword"
        name="newPassword"
        type="password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm New Password</label>
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button id="savePasswordBtn" type="submit">
        Save Password
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <a class="back-link" href="https://losoja.com.ng/">
      Return to LosOja
    </a>
  </main>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://ycxshwgeebskdozmornh.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe";

      const form = document.getElementById("resetPasswordForm");
      const passwordInput = document.getElementById("newPassword");
      const confirmInput = document.getElementById("confirmPassword");
      const saveButton = document.getElementById("savePasswordBtn");
      const message = document.getElementById("message");

      let recoveryToken = null;
      let tokenError = null;
      let saving = false;

      function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
      }

      function readRecoveryToken() {
        const hashParams = new URLSearchParams(
          window.location.hash.replace(/^#/, "")
        );

        const queryParams = new URLSearchParams(
          window.location.search
        );

        const hashError =
          hashParams.get("error_description") ||
          hashParams.get("error");

        if (hashError) {
          tokenError = hashError.replace(/\+/g, " ");
          return;
        }

        // Supabase may return the recovery token in the URL hash.
        recoveryToken = hashParams.get("access_token");

        if (recoveryToken) {
          const recoveryType = hashParams.get("type");

          if (recoveryType && recoveryType !== "recovery") {
            recoveryToken = null;
            tokenError =
              "This link is not a password recovery link. Request a new reset email.";
          }
          return;
        }

        // Also accept an access token supplied in the query string.
        recoveryToken = queryParams.get("access_token");

        if (recoveryToken) {
          return;
        }

        // Some Supabase projects use PKCE and return ?code=...
        const code = queryParams.get("code");

        if (code) {
          return;
        }

        tokenError =
          "The recovery link is missing its access token or has expired. Request a new password reset email.";
      }

      async function exchangeRecoveryCode() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (!code) {
          return false;
        }

        // Supabase PKCE stores a code verifier in browser storage.
        const projectRef = "ycxshwgeebskdozmornh";
        const verifierKey =
          "sb-" + projectRef + "-auth-token-code-verifier";

        let storedVerifier = null;

        try {
          storedVerifier = localStorage.getItem(verifierKey);

          // Accommodate verifier values stored with a redirect suffix.
          if (storedVerifier && storedVerifier.startsWith('"')) {
            storedVerifier = JSON.parse(storedVerifier);
          }

          if (storedVerifier) {
            storedVerifier = storedVerifier.split("/")[0];
          }
        } catch (error) {
          console.error("Could not read recovery verifier:", error);
        }

        if (!storedVerifier) {
          throw new Error(
            "This recovery link needs its original browser session. Open the reset link in the same browser where you requested it, or request a new email."
          );
        }

        const response = await fetch(
          SUPABASE_URL + "/auth/v1/token?grant_type=pkce",
          {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              auth_code: code,
              code_verifier: storedVerifier
            })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.access_token) {
          throw new Error(
            data.msg ||
            data.message ||
            data.error_description ||
            "The recovery link could not be verified. Request a new reset email."
          );
        }

        recoveryToken = data.access_token;
        return true;
      }

      async function initialiseRecovery() {
        readRecoveryToken();

        if (!recoveryToken && !tokenError) {
          try {
            await exchangeRecoveryCode();
          } catch (error) {
            tokenError = error.message;
          }
        }

        if (recoveryToken) {
          showMessage(
            "Recovery link detected. Enter your new password.",
            "success"
          );
          return;
        }

        showMessage(
          tokenError ||
          "Could not verify your recovery link. Request a new email.",
          "error"
        );
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (saving) return;

        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;

        if (password.length < 6) {
          showMessage(
            "Your password must contain at least 6 characters.",
            "error"
          );
          passwordInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showMessage(
            "The passwords do not match. Please try again.",
            "error"
          );
          confirmInput.focus();
          return;
        }

        if (!recoveryToken) {
          showMessage(
            tokenError ||
            "Your recovery link could not be verified. Request a new reset email.",
            "error"
          );
          return;
        }

        saving = true;
        saveButton.disabled = true;
        saveButton.textContent = "Saving...";
        showMessage("Updating your password...", "success");

        try {
          const response = await fetch(
            SUPABASE_URL + "/auth/v1/user",
            {
              method: "PUT",
              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + recoveryToken,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                password: password
              })
            }
          );

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              data.msg ||
              data.message ||
              data.error_description ||
              data.error ||
              "Password update failed. Request a new reset email and try again."
            );
          }

          form.reset();
          recoveryToken = null;

          showMessage(
            "Your password has been changed successfully. You can now return to LosOja and sign in with your new password.",
            "success"
          );

          saveButton.textContent = "Password Updated";
          saveButton.disabled = true;

        } catch (error) {
          console.error("LosOja password reset failed:", error);

          showMessage(
            error.message ||
            "Unable to update your password. Please try again.",
            "error"
          );

          saveButton.disabled = false;
          saveButton.textContent = "Save Password";
          saving = false;
        }
      });

      initialiseRecovery();
    })();
  </script>
</body>
</html>
