
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reset Password - LosOja</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #222;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 5px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      color: #087a3e;
      text-align: center;
      font-size: 27px;
    }

    .intro {
      margin-bottom: 25px;
      color: #666;
      text-align: center;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: bold;
    }

    .password-wrapper {
      position: relative;
      width: 100%;
    }

    .password-wrapper input {
      display: block;
      width: 100%;
      padding: 13px 52px 13px 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #087a3e;
      border-color: #087a3e;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 9px;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: #087a3e;
      font-size: 20px;
      cursor: pointer;
    }

    .toggle-password:hover {
      background: #eef8f2;
    }

    .save-button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #087a3e;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-button:hover {
      background: #055c2e;
    }

    .save-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.error {
      display: block;
      color: #9b1c1c;
      background: #fff0f0;
    }

    #message.success {
      display: block;
      color: #075d30;
      background: #eaf7ee;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #087a3e;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="reset-card">
    <h1>Reset Your Password</h1>

    <p class="intro">
      Enter your new password below to regain access to your LosOja account.
    </p>

    <form id="resetPasswordForm">
      <label for="newPassword">New Password</label>

      <div class="password-wrapper">
        <input
          id="newPassword"
          name="newPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          class="toggle-password"
          type="button"
          data-target="newPassword"
          aria-label="Show new password"
          aria-pressed="false"
        >👁</button>
      </div>

      <label for="confirmPassword">Confirm New Password</label>

      <div class="password-wrapper">
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          class="toggle-password"
          type="button"
          data-target="confirmPassword"
          aria-label="Show confirm password"
          aria-pressed="false"
        >👁</button>
      </div>

      <button
        id="savePasswordBtn"
        class="save-button"
        type="submit"
      >
        Save Password
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <a class="back-link" href="https://losoja.com.ng/">
      Return to LosOja
    </a>
  </main>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://ycxshwgeebskdozmornh.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe";

      const form = document.getElementById("resetPasswordForm");
      const passwordInput = document.getElementById("newPassword");
      const confirmInput = document.getElementById("confirmPassword");
      const saveButton = document.getElementById("savePasswordBtn");
      const message = document.getElementById("message");

      let recoveryToken = null;
      let tokenError = null;
      let saving = false;

      function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
      }

      // SHOW OR HIDE EACH PASSWORD
      document.querySelectorAll(".toggle-password").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById(button.dataset.target);

          if (!input) return;

          const showing = input.type === "password";

          input.type = showing ? "text" : "password";
          button.textContent = showing ? "🙈" : "👁";

          button.setAttribute("aria-pressed", String(showing));
          button.setAttribute(
            "aria-label",
            (showing ? "Hide " : "Show ") +
            (input.id === "newPassword"
              ? "new password"
              : "confirm password")
          );
        });
      });

      function readRecoveryToken() {
        const hashParams = new URLSearchParams(
          window.location.hash.replace(/^#/, "")
        );

        const queryParams = new URLSearchParams(
          window.location.search
        );

        const hashError =
          hashParams.get("error_description") ||
          hashParams.get("error");

        if (hashError) {
          tokenError = hashError.replace(/\+/g, " ");
          return;
        }

        recoveryToken = hashParams.get("access_token");

        if (recoveryToken) {
          const recoveryType = hashParams.get("type");

          if (recoveryType && recoveryType !== "recovery") {
            recoveryToken = null;
            tokenError =
              "This is not a password recovery link. Request a new reset email.";
          }

          return;
        }

        recoveryToken = queryParams.get("access_token");

        if (recoveryToken) return;

        const code = queryParams.get("code");

        if (code) return;

        tokenError =
          "Your recovery link is missing its access token or has expired. Request a new password reset email.";
      }

      async function exchangeRecoveryCode() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (!code) return false;

        const verifierKey =
          "sb-ycxshwgeebskdozmornh-auth-token-code-verifier";

        let storedVerifier = null;

        try {
          storedVerifier = localStorage.getItem(verifierKey);

          if (storedVerifier && storedVerifier.startsWith('"')) {
            storedVerifier = JSON.parse(storedVerifier);
          }

          if (storedVerifier) {
            storedVerifier = storedVerifier.split("/")[0];
          }
        } catch (error) {
          console.error("Could not read recovery verifier:", error);
        }

        if (!storedVerifier) {
          throw new Error(
            "This link needs the browser session used to request the reset. Request a new email and open it in the same browser."
          );
        }

        const response = await fetch(
          SUPABASE_URL + "/auth/v1/token?grant_type=pkce",
          {
            method: "POST",
            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              auth_code: code,
              code_verifier: storedVerifier
            })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.access_token) {
          throw new Error(
            data.msg ||
            data.message ||
            data.error_description ||
            "We could not verify this recovery link. Request a new reset email."
          );
        }

        recoveryToken = data.access_token;
        return true;
      }

      async function initialiseRecovery() {
        readRecoveryToken();

        if (!recoveryToken && !tokenError) {
          try {
            await exchangeRecoveryCode();
          } catch (error) {
            tokenError = error.message;
          }
        }

        if (recoveryToken) {
          showMessage(
            "Recovery link detected. Enter your new password.",
            "success"
          );
        } else {
          showMessage(
            tokenError ||
            "Could not verify your recovery link. Request a new email.",
            "error"
          );
        }
      }

      // SAVE THE NEW PASSWORD
      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (saving) return;

        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;

        if (password.length < 6) {
          showMessage(
            "Your password must contain at least 6 characters.",
            "error"
          );
          passwordInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showMessage(
            "The passwords do not match. Please try again.",
            "error"
          );
          confirmInput.focus();
          return;
        }

        if (!recoveryToken) {
          showMessage(
            tokenError ||
            "Your recovery link could not be verified. Request a new reset email.",
            "error"
          );
          return;
        }

        saving = true;
        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        showMessage("Updating your password...", "success");

        try {
          const response = await fetch(
            SUPABASE_URL + "/auth/v1/user",
            {
              method: "PUT",
              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + recoveryToken,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                password: password
              })
            }
          );

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              data.msg ||
              data.message ||
              data.error_description ||
              data.error ||
              "Password update failed. Request a new reset email and try again."
            );
          }

          form.reset();
          recoveryToken = null;

          // Reset eye buttons to their hidden state.
          document.querySelectorAll(".toggle-password").forEach((button) => {
            button.textContent = "👁";
            button.setAttribute("aria-pressed", "false");

            const fieldName =
              button.dataset.target === "newPassword"
                ? "new password"
                : "confirm password";

            button.setAttribute("aria-label", "Show " + fieldName);
          });

          showMessage(
            "Your password has been changed successfully. Return to LosOja and sign in with your new password.",
            "success"
          );

          saveButton.textContent = "Password Updated";
          saveButton.disabled = true;

        } catch (error) {
          console.error("LosOja password reset failed:", error);

          showMessage(
            error.message ||
            "Unable to update your password. Please try again.",
            "error"
          );

          saveButton.disabled = false;
          saveButton.textContent = "Save Password";
          saving = false;
        }
      });

      initialiseRecovery();
    })();
  </script>
</body>
</html>
