
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - LosOja</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef8f2;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { color: #087a3e; margin-top: 0; }
    p { color: #555; line-height: 1.5; }
    label { display: block; margin: 16px 0 7px; font-weight: 700; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #087a3e;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { white-space: pre-wrap; }
    a { color: #087a3e; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Reset your password</h1>
    <p>Enter a new password for your LosOja account.</p>

    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="confirmPassword">Confirm new password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button id="resetButton" type="submit">Save new password</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="index.html">Return to LosOja sign in</a></p>
  </main>

  <script>
    const SUPABASE_URL =
      "https://ycxshwgeebskdozmornh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe";

    const form = document.getElementById("resetForm");
    const button = document.getElementById("resetButton");
    const message = document.getElementById("message");

    // Supabase recovery links may return tokens in the URL fragment.
    async function establishRecoverySession() {
      const hash = new URLSearchParams(
        window.location.hash.replace(/^#/, "")
      );

      const accessToken = hash.get("access_token");
      const refreshToken = hash.get("refresh_token");
      const tokenType = hash.get("type");

      if (accessToken && tokenType === "recovery") {
        localStorage.setItem(
          "losoja_supabase_session",
          JSON.stringify({
            access_token: accessToken,
            refresh_token: refreshToken || "",
            token_type: "bearer"
          })
        );

        return accessToken;
      }

      // Also support a recovery link that uses a PKCE code.
      const query = new URLSearchParams(window.location.search);
      const code = query.get("code");

      if (code) {
        const response = await fetch(
          `${SUPABASE_URL}/auth/v1/token?grant_type=pkce`,
          {
            method: "POST",
            headers: {
              apikey: SUPABASE_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ auth_code: code })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.access_token) {
          throw new Error(
            data.message || "This reset link is invalid or has expired."
          );
        }

        localStorage.setItem(
          "losoja_supabase_session",
          JSON.stringify(data)
        );

        return data.access_token;
      }

      throw new Error(
        "No valid recovery session was found. Please request a new reset email."
      );
    }

    let recoveryToken = null;

    establishRecoverySession()
      .then(token => {
        recoveryToken = token;
        message.textContent = "Recovery link verified. You can choose a new password.";
      })
      .catch(error => {
        form.hidden = true;
        message.textContent = error.message;
      });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;

      if (password.length < 6) {
        message.textContent = "Your password must be at least 6 characters.";
        return;
      }

      if (password !== confirmation) {
        message.textContent = "The passwords do not match.";
        return;
      }

      if (!recoveryToken) {
        message.textContent = "The recovery link is not ready or has expired. Request a new reset email.";
        return;
      }

      button.disabled = true;
      button.textContent = "Saving...";

      try {
        const response = await fetch(
          `${SUPABASE_URL}/auth/v1/user`,
          {
            method: "PUT",
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${recoveryToken}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ password })
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.msg ||
            data.error_description ||
            "Could not update the password. Request a new reset email and try again."
          );
        }

        localStorage.removeItem("losoja_supabase_session");
        form.hidden = true;
        message.textContent = "Your password has been changed successfully. Return to LosOja and sign in with your new password.";
      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Save new password";
      }
    });
  </script>
</body>
</html>
