<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product - LosOja</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7f5}
.topbar{position:sticky;top:0;background:#087a3e;color:#fff;padding:12px 18px}
.topbar-inner{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.brand{color:#fff;text-decoration:none;font-weight:800;font-size:20px;display:flex;gap:10px;align-items:center}
.brand-mark{width:38px;height:38px;background:#fff;color:#087a3e;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900}
.back-btn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:700}
.page{width:min(600px,calc(100% - 24px));margin:28px auto}
.card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 8px 32px rgba(0,0,0,.08);border:1px solid #e5ebe7}
h1{margin:0 0 6px;color:#123d25;font-size:24px}p.sub{margin:0 0 20px;color:#6b7d72;font-size:14px}
label{display:block;margin:14px 0 6px;font-weight:700;font-size:13px;color:#123d25}
input,textarea{width:100%;padding:12px 13px;border:1px solid #d7e1da;border-radius:11px;font-size:15px;outline:none}
input:focus,textarea:focus{border-color:#087a3e;box-shadow:0 0 0 3px rgba(8,122,62,.12)}
textarea{min-height:90px;resize:vertical}
.preview{width:100%;height:200px;border:2px dashed #d7e1da;border-radius:12px;margin-top:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafcfb}
.preview img{width:100%;height:100%;object-fit:cover}
.upload-btn{flex:1;background:#eef8f2;color:#087a3e;border:1px solid #cce8d7;border-radius:10px;padding:11px;font-weight:700;cursor:pointer;text-align:center;display:block;margin-top:8px}
.btn{width:100%;margin-top:18px;background:#087a3e;color:#fff;border:0;border-radius:11px;padding:13px;font-weight:800;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.6}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#17201b;color:#fff;padding:12px 17px;border-radius:10px;z-index:999;opacity:0;transition:.2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a href="index.html" class="brand"><div class="brand-mark">L</div>LosOja</a><button class="back-btn" onclick="history.back()">← Back</button></div></header>
<main class="page">
<div class="card">
<h1>+ Add Product</h1>
<p class="sub" id="bizName">Add product to your business</p>
<form id="form">
<label>Product Name *</label><input id="name" required placeholder="e.g. Nike Air Max">
<label>Price (₦) *</label><input id="price" type="number" required placeholder="25000">
<label>Product Image</label>
<div class="preview" id="preview"><span style="color:#9aa7a0">No image</span></div>
<label class="upload-btn" for="fileInput">📸 Choose Product Image</label>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<input id="image" type="url" placeholder="Image URL auto-fills after upload" style="margin-top:8px">
<label>Description</label><textarea id="desc" placeholder="Tell buyers about this product"></textarea>
<button type="submit" class="btn" id="submitBtn">Add Product</button>
</form>
</div>
</main>
<div id="toast" class="toast"></div>
<script src="js/auth.js?v=2"></script>
<script>
const SUPABASE_URL="https://ycxshwgeebskdozmornh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljeHNod2dlZWJza2Rvem1vcm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDY0NjUsImV4cCI6MjEwMzg4MjQ2NX0.tMl7wILdVDhu0RWFaG_84ngJEryLt2c5cB8MEKW3kfU";
const toast=document.getElementById("toast"),preview=document.getElementById("preview"),fileInput=document.getElementById("fileInput"),imageInput=document.getElementById("image");
function showToast(m){toast.textContent=m;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),3000)}
function getParam(){return new URLSearchParams(location.search).get("business")}
function updatePreview(url){if(!url){preview.innerHTML='<span style="color:#9aa7a0">No image</span>';return}preview.innerHTML=`<img src="${url}">`}
imageInput.addEventListener("input",()=>updatePreview(imageInput.value.trim()))
fileInput.addEventListener("change",async()=>{
 const file=fileInput.files[0];if(!file)return;if(file.size>5*1024*1024){showToast("Max 5MB");return}
 showToast("Uploading...");
 try{
  let token=null;try{token=JSON.parse(localStorage.getItem("losoja_supabase_session"))?.access_token}catch{}
  const fileName=`product-${Date.now()}-${file.name}`.replace(/[^a-zA-Z0-9.-]/g,"-");
  const res=await fetch(`${SUPABASE_URL}/storage/v1/object/product-images/${fileName}`,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${token||SUPABASE_KEY}`,"x-upsert":"true"},body:file});
  if(!res.ok){const t=await res.text();throw new Error(t)}
  const publicUrl=`${SUPABASE_URL}/storage/v1/object/public/product-images/${fileName}`;
  imageInput.value=publicUrl;updatePreview(publicUrl);showToast("Image uploaded!");
 }catch(e){showToast("Upload failed: "+e.message)}
});
async function getUser(){try{if(window.getCurrentUser){const r=await window.getCurrentUser();if(r?.user?.id)return r.user;if(r?.id)return r}}catch{}try{const raw=localStorage.getItem("losoja_supabase_session");if(raw){const j=JSON.parse(raw);return j.user}}catch{}return null}
async function init(){
 const bid=getParam();if(!bid){showToast("No business id");return}
 const user=await getUser();if(!user){location.href="index.html#login";return}
 try{
  const res=await fetch(`${SUPABASE_URL}/rest/v1/businesses?id=eq.${bid}&select=id,name,user_id`,{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
  const data=await res.json();if(!data.length)throw new Error("Business not found");
  if(String(data[0].user_id)!==String(user.id)){showToast("You no own this business");return}
  document.getElementById("bizName").textContent=`Add product to: ${data[0].name}`;
 }catch(e){showToast(e.message)}
}
document.getElementById("form").onsubmit=async(e)=>{
 e.preventDefault();const bid=getParam();const btn=document.getElementById("submitBtn");
 const payload={business_id:bid,name:document.getElementById("name").value.trim(),price:parseFloat(document.getElementById("price").value),image_url:imageInput.value.trim()||null,description:document.getElementById("desc").value.trim()||null};
 if(!payload.name||!payload.price){showToast("Fill name & price");return}
 btn.disabled=true;btn.textContent="Adding...";
 try{
  let token=null;try{token=JSON.parse(localStorage.getItem("losoja_supabase_session"))?.access_token}catch{}
  const res=await fetch(`${SUPABASE_URL}/rest/v1/products`,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${token||SUPABASE_KEY}`,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify(payload)});
  if(!res.ok){const t=await res.text();throw new Error(t)}
  showToast("Product added!");setTimeout(()=>location.href=`shop.html?id=${bid}`,1000);
 }catch(err){showToast(err.message);btn.disabled=false;btn.textContent="Add Product"}
};
init();
</script>
</body>
</html>
