<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product | LosOja</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f5;color:#17201b}
.topbar{position:sticky;top:0;background:#087a3e;color:#fff;padding:12px 18px}
.topbar-inner{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.brand{color:#fff;text-decoration:none;font-weight:800;font-size:20px}
.back-btn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.page{width:min(600px,calc(100% - 28px));margin:24px auto}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 20px rgba(0,0,0,.08);border:1px solid #e5ebe7}
input,textarea,select{width:100%;padding:12px;border:1px solid #d7e1da;border-radius:10px;margin-top:6px;font-size:15px}
label{font-weight:700;margin-top:14px;display:block;color:#123d25;font-size:14px}
.btn{margin-top:20px;width:100%;padding:13px;background:#087a3e;color:#fff;border:0;border-radius:10px;font-weight:800;cursor:pointer;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#17201b;color:#fff;padding:12px 17px;border-radius:10px;opacity:0;transition:.2s;z-index:999}.toast.show{opacity:1}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">LosOja</a><button class="back-btn" onclick="history.back()">← Back</button></div></header>
<main class="page"><div class="card">
<h2 style="margin-top:0">Add Product</h2>
<label>Product Name</label><input id="name" placeholder="e.g. Jollof Rice">
<label>Description</label><textarea id="description" rows="3" placeholder="Describe product..."></textarea>
<div class="row">
<div><label>Price (₦)</label><input id="price" type="number" placeholder="5000"></div>
<div><label>Stock</label><input id="stock" type="number" value="1" min="0" placeholder="10"></div>
</div>
<label>Category</label>
<select id="product_category">
<option value="General">General</option><option value="Food">Food</option><option value="Fashion">Fashion</option><option value="Electronics">Electronics</option><option value="Beauty">Beauty</option><option value="Services">Services</option>
</select>
<label>Image URL</label><input id="image_url" placeholder="https://...">
<button class="btn" id="saveBtn">Save Product</button>
</div></main>
<div id="toast" class="toast"></div>
<script src="js/auth.js?v=2"></script>
<script>
const SUPABASE_URL="https://ycxshwgeebskdozmornh.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljeHNod2dlZWJza2Rvem1vcm5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDY0NjUsImV4cCI6MjEwMzg4MjQ2NX0.tMl7wILdVDhu0RWFaG_84ngJEryLt2c5cB8MEKW3kfU";
function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}
const businessId=new URLSearchParams(location.search).get("business");
document.getElementById("saveBtn").onclick=async()=>{
 const raw=localStorage.getItem("losoja_supabase_session");let token=null;try{token=JSON.parse(raw||"{}").access_token}catch{}
 if(!token){showToast("Please login first");return}
 const body={
  business_id:businessId,
  name:document.getElementById("name").value.trim(),
  description:document.getElementById("description").value.trim(),
  price:Number(document.getElementById("price").value)||0,
  stock:Number(document.getElementById("stock").value)||0,
  product_category:document.getElementById("product_category").value,
  image_url:document.getElementById("image_url").value.trim()
 };
 if(!body.name){showToast("Name required");return}
 const res=await fetch(`${SUPABASE_URL}/rest/v1/products`,{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+token,"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(body)});
 if(!res.ok){const txt=await res.text();showToast("Failed: "+txt);return}
 showToast("Product added!");setTimeout(()=>{location.href=`shop.html?id=${businessId}`},800);
}
</script>
</body>
</html>
