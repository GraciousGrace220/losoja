<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Account - LosOja</title>

    <meta
        name="theme-color"
        content="#087a3e"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7f6;
            color: #111827;
            min-height: 100vh;
        }

        .header {
            background: #087a3e;
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-button {
            border: none;
            background: rgba(255,255,255,0.15);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        .header h1 {
            font-size: 21px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .profile-card {
            background: white;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow:
                0 4px 18px rgba(0,0,0,0.06);
        }

        .profile-icon {
            width: 62px;
            height: 62px;
            background: #e8f5ee;
            color: #087a3e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 14px;
        }

        .profile-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .profile-email {
            color: #6b7280;
            font-size: 14px;
            word-break: break-word;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 22px 4px 10px;
        }

        .account-card {
            background: white;
            border-radius: 16px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow:
                0 3px 14px rgba(0,0,0,0.05);
        }

        .account-link {
            width: 100%;
            border: none;
            background: white;
            padding: 17px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
            cursor: pointer;
            color: #111827;
        }

        .account-link:hover {
            background: #f8faf9;
        }

        .account-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #e8f5ee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .account-text {
            flex: 1;
            min-width: 0;
        }

        .account-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 3px;
        }

        .account-description {
            color: #6b7280;
            font-size: 13px;
        }

        .balance-preview {
            color: #087a3e;
            font-size: 16px;
            font-weight: 700;
            margin-top: 5px;
        }

        .balance-loading {
            color: #6b7280;
            font-size: 14px;
            font-weight: 600;
            margin-top: 5px;
        }

        .balance-error {
            color: #dc2626;
            font-size: 13px;
            font-weight: 600;
            margin-top: 5px;
        }

        .arrow {
            color: #9ca3af;
            font-size: 20px;
            flex-shrink: 0;
        }

        .logout-button {
            width: 100%;
            border: none;
            background: #fff;
            color: #dc2626;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow:
                0 3px 14px rgba(0,0,0,0.05);
        }

        .status {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 15px;
            display: none;
        }

        @media (min-width: 700px) {

            .container {
                padding-top: 30px;
            }

        }

    </style>

</head>


<body>


    <header class="header">

        <button
            class="back-button"
            type="button"
            onclick="history.back()"
            aria-label="Go back"
        >
            ←
        </button>

        <h1>My Account</h1>

    </header>


    <main class="container">

        <div
            id="status"
            class="status"
        >
            Loading your account...
        </div>


        <div
            id="accountContent"
            style="display:none;"
        >

            <section class="profile-card">

                <div class="profile-icon">
                    👤
                </div>

                <div
                    id="profileName"
                    class="profile-name"
                >
                    LosOja User
                </div>

                <div
                    id="profileEmail"
                    class="profile-email"
                >
                    —
                </div>

            </section>


            <div
                id="errorMessage"
                class="error"
            ></div>


            <div class="section-title">
                My LosOja
            </div>


            <!-- =========================================
                 BALANCE
            ========================================== -->

            <div class="account-card">

                <button
                    class="account-link"
                    type="button"
                    onclick="window.location.href='balance.html'"
                >

                    <div class="account-icon">
                        💰
                    </div>

                    <div class="account-text">

                        <div class="account-title">
                            LosOja Balance
                        </div>

                        <div
                            id="accountBalance"
                            class="balance-loading"
                        >
                            Loading balance...
                        </div>

                        <div class="account-description">
                            View your wallet, transactions and escrow
                        </div>

                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </button>

            </div>


            <!-- =========================================
                 BARTER
            ========================================== -->

            <div class="account-card">

                <button
                    class="account-link"
                    type="button"
                    onclick="window.location.href='barter.html'"
                >

                    <div class="account-icon">
                        🔄
                    </div>

                    <div class="account-text">

                        <div class="account-title">
                            My Barter Listings
                        </div>

                        <div class="account-description">
                            Manage your Trade by Barter listings
                        </div>

                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </button>

            </div>


            <!-- =========================================
                 CHATS
            ========================================== -->

            <div class="account-card">

                <button
                    class="account-link"
                    type="button"
                    onclick="window.location.href='chat.html'"
                >

                    <div class="account-icon">
                        💬
                    </div>

                    <div class="account-text">

                        <div class="account-title">
                            My Chats
                        </div>

                        <div class="account-description">
                            Open your LosOja conversations
                        </div>

                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </button>

            </div>


            <!-- =========================================
                 BUSINESSES
            ========================================== -->

            <div class="account-card">

                <button
                    class="account-link"
                    type="button"
                    onclick="window.location.href='index.html#businesses'"
                >

                    <div class="account-icon">
                        🏪
                    </div>

                    <div class="account-text">

                        <div class="account-title">
                            My Businesses
                        </div>

                        <div class="account-description">
                            Manage businesses connected to LosOja
                        </div>

                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </button>

            </div>


            <div class="section-title">
                Account
            </div>


            <!-- =========================================
                 LOGOUT
            ========================================== -->

            <button
                id="logoutButton"
                class="logout-button"
                type="button"
            >
                🚪 Logout
            </button>

        </div>

    </main>


    <!-- ================================================
         LOSOJA AUTH
    ================================================= -->

    <script src="js/auth.js?v=2"></script>


    <script>

        /*
        =================================================
        LOSOJA ACCOUNT
        =================================================
        */

        const LOSOJA_SUPABASE_URL =
            "https://ycxshwgeebskdozmornh.supabase.co";

        const LOSOJA_SUPABASE_KEY =
            "sb_publishable_jFSLacwNupO6T8EnSqb2bw_bZmy7rVe";


        /*
        =================================================
        DOM ELEMENTS
        =================================================
        */

        const status =
            document.getElementById(
                "status"
            );

        const accountContent =
            document.getElementById(
                "accountContent"
            );

        const profileName =
            document.getElementById(
                "profileName"
            );

        const profileEmail =
            document.getElementById(
                "profileEmail"
            );

        const accountBalance =
            document.getElementById(
                "accountBalance"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );


        /*
        =================================================
        SHOW ERROR
        =================================================
        */

        function showError(message) {

            if (!errorMessage) {
                return;
            }

            errorMessage.textContent =
                message;

            errorMessage.style.display =
                "block";

        }


        /*
        =================================================
        GET AUTH ACCESS TOKEN
        =================================================
        */

        async function getAccountAccessToken() {

            try {

                if (
                    typeof window.getSupabaseAccessToken ===
                    "function"
                ) {

                    const token =
                        await window.getSupabaseAccessToken();

                    if (token) {
                        return token;
                    }

                }

            } catch (error) {

                console.warn(
                    "LosOja account token error:",
                    error
                );

            }

            return null;

        }


        /*
        =================================================
        LOAD WALLET BALANCE
        =================================================
        */

        async function loadAccountBalance(
            userId
        ) {

            if (!accountBalance) {
                return;
            }

            accountBalance.textContent =
                "Loading balance...";

            accountBalance.className =
                "balance-loading";


            try {

                const token =
                    await getAccountAccessToken();


                if (!token) {

                    accountBalance.textContent =
                        "Session expired";

                    accountBalance.className =
                        "balance-error";

                    return;

                }


                const response =
                    await fetch(
                        `${LOSOJA_SUPABASE_URL}/rest/v1/wallets?select=balance,currency&user_id=eq.${encodeURIComponent(userId)}&limit=1`,
                        {
                            method: "GET",

                            headers: {

                                "apikey":
                                    LOSOJA_SUPABASE_KEY,

                                "Authorization":
                                    `Bearer ${token}`,

                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"

                            }

                        }
                    );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    console.error(
                        "LosOja account wallet error:",
                        errorText
                    );

                    throw new Error(
                        "Unable to load wallet."
                    );

                }


                const wallets =
                    await response.json();


                /*
                   No wallet yet.
                */

                if (
                    !Array.isArray(wallets) ||
                    wallets.length === 0
                ) {

                    accountBalance.textContent =
                        "₦0.00";

                    accountBalance.className =
                        "balance-preview";

                    return;

                }


                const wallet =
                    wallets[0];


                const balance =
                    Number(
                        wallet.balance || 0
                    );


                accountBalance.textContent =
                    `₦${balance.toLocaleString(
                        "en-NG",
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    )}`;


                accountBalance.className =
                    "balance-preview";


            } catch (error) {

                console.error(
                    "LosOja account balance error:",
                    error
                );

                accountBalance.textContent =
                    "Unable to load balance";

                accountBalance.className =
                    "balance-error";

            }

        }


        /*
        =================================================
        INITIALIZE ACCOUNT
        =================================================
        */

        async function initializeAccount() {

            try {

                /*
                   Make sure authentication exists.
                */

                if (
                    typeof window.getCurrentUser !==
                    "function"
                ) {

                    throw new Error(
                        "Authentication system is not ready."
                    );

                }


                /*
                   Give auth.js a moment to restore
                   the existing session when necessary.
                */

                let user =
                    await window.getCurrentUser();


                if (
                    !user &&
                    typeof window.ensureValidSupabaseSession ===
                    "function"
                ) {

                    try {

                        await window.ensureValidSupabaseSession();

                    } catch (sessionError) {

                        console.warn(
                            "LosOja session refresh:",
                            sessionError
                        );

                    }

                    user =
                        await window.getCurrentUser();

                }


                /*
                   User is not logged in.
                */

                if (!user) {

                    window.location.href =
                        "index.html?openLogin=1";

                    return;

                }


                /*
                   Profile information.
                */

                const metadata =
                    user.user_metadata || {};


                const name =
                    metadata.full_name ||
                    metadata.name ||
                    user.email?.split("@")[0] ||
                    "LosOja User";


                profileName.textContent =
                    name;

                profileEmail.textContent =
                    user.email || "—";


                /*
                   Show account immediately.
                */

                status.style.display =
                    "none";

                accountContent.style.display =
                    "block";


                /*
                   Load live wallet balance.
                */

                await loadAccountBalance(
                    user.id
                );

            } catch (error) {

                console.error(
                    "LosOja account error:",
                    error
                );

                status.style.display =
                    "none";

                accountContent.style.display =
                    "block";

                showError(
                    "Unable to load your account right now."
                );

            }

        }


        /*
        =================================================
        LOGOUT
        =================================================
        */

        if (logoutButton) {

            logoutButton.addEventListener(
                "click",
                async function () {

                    logoutButton.disabled =
                        true;

                    logoutButton.textContent =
                        "Logging out...";


                    try {

                        if (
                            typeof window.logout ===
                            "function"
                        ) {

                            await window.logout();

                            window.location.href =
                                "index.html";

                            return;

                        }


                        throw new Error(
                            "Logout function is not available."
                        );

                    } catch (error) {

                        console.error(
                            "LosOja logout error:",
                            error
                        );

                        logoutButton.disabled =
                            false;

                        logoutButton.textContent =
                            "🚪 Logout";

                        showError(
                            "Unable to log out right now."
                        );

                    }

                }
            );

        }


        /*
        =================================================
        START
        =================================================
        */

        if (
            document.readyState ===
            "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                initializeAccount,
                {
                    once: true
                }
            );

        } else {

            initializeAccount();

        }

    </script>


</body>

</html>
